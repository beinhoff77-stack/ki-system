<!DOCTYPE html>
<html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Entwurf FX – Spezialeffekte</title>
<style>
:root{--bg:#F4F1EA;--karte:#fff;--text:#14213D;--leise:#5B6B82;--linie:#DCD6C8;--blau:#2563EB;--gelb:#FFD23F}
.nacht{--bg:#0F1424;--karte:#1A2136;--text:#E8EDF7;--leise:#9AA7BD;--linie:#2C3652;--blau:#7AA2FF}
*{box-sizing:border-box}body{margin:0;font:15px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--text)}
.steuer{padding:10px 12px;border-bottom:1px solid var(--linie);background:var(--karte);display:flex;flex-wrap:wrap;gap:6px 8px;align-items:center;font-size:13px}
.steuer b{font-size:12px;color:var(--leise);letter-spacing:.05em}
.steuer button,.steuer label{font:inherit;padding:5px 9px;border-radius:8px;border:1px solid var(--linie);background:var(--bg);color:var(--text);cursor:pointer}
.steuer .an{background:var(--blau);color:#fff;border-color:var(--blau)}
.haupt{display:grid;gap:14px;padding:12px;grid-template-columns:1fr}
@media(min-width:760px){.haupt{grid-template-columns:420px minmax(0,1fr);align-items:start}}
.app{position:relative;overflow:hidden;border-radius:18px;background:var(--karte);box-shadow:0 2px 14px #0002;min-height:560px;isolation:isolate}
.szene{position:relative;padding:18px 18px 70px;color:#fff;min-height:250px}
.s-direkt{background:linear-gradient(160deg,#2A1260,#1B0C3A)}.s-sauber{background:linear-gradient(180deg,#3B82F6,#1E40AF)}.s-sturm{background:linear-gradient(180deg,#221C44,#0E0B22)}
.s-flug{background:linear-gradient(170deg,#1E1B4B,#312E81 60%,#1E1B4B);text-align:center}
.oben{font-size:11px;font-weight:800;letter-spacing:.08em;opacity:.85}.titel{font-size:30px;font-weight:900;margin:6px 0 4px;line-height:1.05}
.riesig{font-size:54px;font-weight:900;line-height:1;font-variant-numeric:tabular-nums}.riesig small{display:block;font-size:12px;letter-spacing:.1em;opacity:.8}
.unter{margin:8px 0 0;opacity:.92}
.blatt{padding:16px 18px}.kann{border-left:4px solid var(--blau);padding:3px 10px;margin-bottom:8px}.kann b{display:block;font-size:11px;color:var(--leise)}
.knopf{display:block;width:100%;padding:13px;border-radius:12px;border:0;background:var(--gelb);color:#1B1B1B;font-weight:800;font-size:16px;margin-top:12px}
.leise{color:var(--leise);font-size:13px}
.bk{margin:14px;border:1px solid var(--linie);border-radius:14px;background:var(--karte);position:relative;overflow:hidden}
.bk-kopf{padding:10px 14px;border-bottom:1px solid var(--linie);font:700 12px ui-monospace,monospace;letter-spacing:.12em;color:var(--leise)}
.bk-inhalt{padding:14px}.aufg{font-size:22px;font-weight:700;margin:2px 0 6px}
.rueck{border-radius:12px;padding:12px 14px;margin-top:10px;position:relative}
.ok{background:#DCFCE7;color:#14532D}.nacht .ok{background:#123A26;color:#BBF7D0}
.falsch{background:#FEF3C7;color:#78350F}.nacht .falsch{background:#3A2A0C;color:#FDE68A}
.nb{margin:14px;border:1.5px solid #F2B48A;border-radius:16px;background:#FFF1E6;color:#4A2A14;padding:14px}.nacht .nb{background:#2E1D14;border-color:#8A4A26;color:#F6E3D6}
.nb .ueber{font:800 12px ui-monospace,monospace;letter-spacing:.12em;color:#C2410C}.nb h3{margin:4px 0 2px;font-size:19px}
.nb .k{display:block;width:100%;margin-top:10px;padding:12px;border:0;border-radius:12px;background:#C8622A;color:#fff;font-weight:800;font-size:16px}
.tafel{margin:14px;border-radius:16px;background:#111827;color:#E5E7EB;padding:14px;font:700 15px ui-monospace,monospace}
.tafel .stadt{font-size:26px;letter-spacing:.3em;color:var(--gelb)}
/* Sticker */
.sticker{position:absolute;z-index:30;border:0;transform:rotate(-7deg);padding:8px 14px 9px;border-radius:12px;font:900 24px/1.05 system-ui;box-shadow:0 4px 0 #0003,0 6px 18px #0005;outline:3px solid #fff;outline-offset:-1px;animation:pop .42s cubic-bezier(.2,1.6,.4,1) both}
.st3{background:var(--gelb);color:#1B0C3A}.st2{background:#7EF0C2;color:#052E16;font-size:20px}.st1{background:#E0E7FF;color:#1E1B4B;font-size:17px}
@keyframes pop{0%{transform:scale(.3) rotate(-25deg);opacity:0}100%{transform:rotate(-7deg);opacity:1}}
/* Effekt-Schicht */
.fx{position:absolute;inset:0;z-index:20;pointer-events:auto}
.fx-schwarz{background:#000;animation:ein .15s both}
@keyframes ein{from{opacity:0}to{opacity:1}}@keyframes aus{to{opacity:0}}
.term{position:absolute;left:18px;right:18px;top:26%;font:700 15px/1.7 ui-monospace,Menlo,monospace;color:#22FF88;text-shadow:0 0 8px #22FF8899}
.term .cursor{display:inline-block;width:9px;height:16px;background:#22FF88;vertical-align:-2px;animation:blink .5s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
.scan{position:absolute;inset:0;background:repeating-linear-gradient(0deg,#ffffff08 0 2px,transparent 2px 4px);pointer-events:none}
.blitz{position:absolute;inset:0;background:#fff;opacity:0}
.b404{position:absolute;inset:0;background:#0B1020;color:#E5E7EB;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;font-family:ui-monospace,monospace}
.b404 .zahl{font-size:96px;font-weight:900;position:relative;letter-spacing:.05em}
.b404 .zahl::before,.b404 .zahl::after{content:"404";position:absolute;left:0;top:0;mix-blend-mode:screen}
.b404 .zahl::before{color:#FF2D55;transform:translate(-3px,1px);animation:zit .25s steps(2) infinite}.b404 .zahl::after{color:#00E5FF;transform:translate(3px,-1px);animation:zit .3s steps(2) infinite reverse}
@keyframes zit{50%{transform:translate(2px,-2px)}}
.b404 .t{font-size:16px;letter-spacing:.2em}
.bricht{animation:bricht .35s ease-in forwards}@keyframes bricht{to{clip-path:inset(48% 0 48% 0);opacity:0}}
.glitch{font-size:40px!important;animation:gl .12s steps(2) infinite;text-shadow:-3px 0 #FF2D55,3px 0 #00E5FF}@keyframes gl{50%{transform:translate(-2px,1px) skewX(-6deg)}}
.zeile{font-size:15px;margin-top:10px;opacity:0;animation:ein .3s forwards}
.blase{position:absolute;z-index:25;left:16px;right:16px;background:#fff;color:#111;border-radius:14px;padding:10px 12px;font-weight:700;box-shadow:0 6px 20px #0004;animation:pop2 .3s both}
.blase::before{content:"👨‍✈️ ";}.blase.ohne::before{content:""}
@keyframes pop2{from{transform:translateY(8px);opacity:0}}
.klecks{position:absolute;z-index:22;left:50%;top:34%;width:130px;height:120px;margin-left:-65px;animation:platsch .35s cubic-bezier(.3,1.5,.5,1) both;touch-action:none;cursor:grab}
@keyframes platsch{0%{transform:translateY(-320px) scale(.3)}100%{transform:none}}
.wackel{animation:wackel .8s ease-in-out}
@keyframes wackel{10%,50%,90%{transform:translate(-5px,2px) rotate(-.6deg)}30%,70%{transform:translate(6px,-3px) rotate(.6deg)}}
.maske{position:absolute;top:-130px;z-index:22;width:2px;height:120px;background:#94A3B8;animation:fall .5s cubic-bezier(.3,1.4,.5,1) forwards}
.maske::after{content:"";position:absolute;left:-17px;bottom:-24px;width:36px;height:28px;border-radius:6px 6px 18px 18px;background:#FDE047;box-shadow:inset 0 -6px #EAB308}
@keyframes fall{to{transform:translateY(200px)}}
.maske.pendel{animation:pendel 1s ease-in-out infinite alternate!important;transform-origin:top}@keyframes pendel{from{rotate:-7deg}to{rotate:7deg}}
.hoch{transition:transform .4s ease-in;transform:translateY(-140px)!important}
.vhs{position:absolute;inset:0;z-index:21;background:repeating-linear-gradient(0deg,#fff2 0 3px,transparent 3px 22px);animation:vhs .18s linear infinite;mix-blend-mode:overlay}
@keyframes vhs{to{background-position:0 44px}}
.verzieh{animation:verzieh .9s steps(6)}@keyframes verzieh{20%{transform:skewX(4deg) translateX(-6px);filter:saturate(2) hue-rotate(15deg)}60%{transform:skewX(-3deg) translateX(5px)}}
.rew{position:absolute;left:14px;top:12px;z-index:23;font:900 20px ui-monospace,monospace;color:#fff;text-shadow:0 0 6px #000,2px 0 #FF2D55,-2px 0 #00E5FF}
.fleck{position:absolute;z-index:22;right:-10px;top:-10px;width:150px;height:120px;transform-origin:85% 10%;animation:fleck .7s ease-out both}
@keyframes fleck{from{transform:scale(.1)}}
.becher{position:absolute;z-index:23;right:16px;top:-6px;font-size:34px;animation:kipp .4s ease-in both}@keyframes kipp{from{transform:rotate(0) translateY(-40px)}to{transform:rotate(-115deg)}}
.trocknet{transition:opacity .6s;opacity:0}
.band{position:absolute;left:0;right:0;top:58%;height:14px;z-index:21;background:repeating-linear-gradient(90deg,#334155 0 18px,#475569 18px 22px);animation:band .4s linear infinite}
@keyframes band{to{background-position:22px 0}}
.koffer{position:absolute;z-index:22;top:calc(58% - 70px);left:-120px;width:96px;height:70px}
.ziffer{position:absolute;z-index:23;font:900 26px system-ui;color:var(--gelb);text-shadow:0 2px 0 #0006}
.regen{position:absolute;inset:0;z-index:21;background:repeating-linear-gradient(105deg,#ffffff00 0 14px,#ffffff55 14px 15px,#ffffff00 15px 30px);background-size:120px 120px;animation:regen .35s linear infinite;opacity:.8}
@keyframes regen{to{background-position:-30px 120px}}
.dunkel{position:absolute;inset:0;z-index:20;background:#05070Fcc;animation:ein .3s both}
.ruhig{position:absolute;inset:auto 16px 40% 16px;z-index:25;background:#111827;color:#fff;border-radius:14px;padding:14px;font-weight:700;text-align:center}
.stempel{position:absolute;z-index:24;left:50%;top:30%;width:190px;height:190px;margin-left:-95px;border-radius:50%;border:8px double #B45309;background:radial-gradient(circle,#FFE58A,#F5B915 70%);color:#7C2D12;display:flex;flex-direction:column;align-items:center;justify-content:center;font:900 26px/1 system-ui;letter-spacing:.06em;transform:rotate(-12deg);box-shadow:0 0 0 6px #FDE68A55,0 10px 40px #0008;animation:knall .32s cubic-bezier(.5,0,.8,.4) both}
.stempel small{font-size:12px;letter-spacing:.2em;margin-top:6px}
@keyframes knall{0%{transform:scale(3.2) rotate(-30deg);opacity:0}80%{opacity:1}100%{transform:scale(1) rotate(-12deg)}}
.welle{position:absolute;z-index:23;left:50%;top:calc(30% + 95px);width:20px;height:20px;margin:-10px 0 0 -10px;border-radius:50%;border:4px solid #FDE68A;animation:welle .6s ease-out forwards}
@keyframes welle{to{transform:scale(22);opacity:0}}
.funke{position:absolute;z-index:23;width:7px;height:7px;border-radius:50%;background:#FFD23F;box-shadow:0 0 8px #FFD23F;transition:all .9s cubic-bezier(.1,.8,.3,1)}
.tresor-text{position:absolute;z-index:24;left:16px;right:16px;top:calc(30% + 210px);text-align:center;color:#fff;animation:pop2 .4s both}
.tresor-text b{display:block;font-size:22px}.tresor-text span{opacity:.85}
.fxk .immer{display:inline-block;margin-left:4px;font-size:10px;font-weight:800;color:#B45309;letter-spacing:.06em}
/* Panel */
.panel{background:var(--karte);border-radius:16px;padding:14px 16px;box-shadow:0 2px 12px #0001}
.panel h2{font-size:15px;margin:0 0 8px}
.fxliste{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:8px}
.fxk{border:1px solid var(--linie);border-radius:12px;padding:10px;background:var(--bg);cursor:pointer;text-align:left;color:var(--text);font:inherit}
.fxk b{display:block}.fxk span{font-size:12px;color:var(--leise)}.fxk.neg{border-style:dashed}
.fxk.an{outline:2px solid var(--blau)}
table{border-collapse:collapse;width:100%;font-size:13px;margin-top:8px}td,th{border-bottom:1px solid var(--linie);padding:5px 4px;text-align:left;vertical-align:top}
.hinweis{font-size:12px;color:var(--leise);margin-top:8px}
</style></head><body>
<div class="steuer" id="steuer"></div>
<div class="haupt"><div><div class="app" id="app"></div><p class="hinweis" id="info"></p></div><div class="panel" id="panel"></div></div>
