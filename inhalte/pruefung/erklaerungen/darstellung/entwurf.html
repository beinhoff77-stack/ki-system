<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Entwurf: Erklärungen klarer darstellen</title>
<!-- Prüfrunde Erklär-Darstellung. Kein App-Code. Eine Datei ohne fremde Abhängigkeiten.
     Texte sind die echten Lernkarten aus inhalte/themen (eingesetzt von bauen.py); nur wo „gekürzt (Vorschlag)“ steht, ist der Text ein Kürzungsvorschlag.
     Optik bewusst wie die App (Look „Ozean“), damit nur Aufbau und Verständlichkeit verglichen werden. -->
<style>
:root { --bg: #E8F7F9; --flaeche: #fff; --text: #0B3B52; --leise: #3F6B7D; --akzent: #D9482A; --akzent-tief: #A93A1D; --gut: #0E7C86; --linie: #BFDDE3;
  --marker: #FFE58A; --falle: #FDECE6; --falle-text: #8A2E14; --blau: #2F7FC1; --kalt: #D6ECFA;
  font-family: ui-rounded, "SF Pro Rounded", "Nunito", system-ui, -apple-system, "Segoe UI", sans-serif; }
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { margin: 0; }
body { background: var(--bg); color: var(--text); font-size: 18px; line-height: 1.45; font-variant-numeric: tabular-nums; }
button { font: inherit; color: inherit; cursor: pointer; }
:focus-visible { outline: 3px solid var(--akzent); outline-offset: 2px; }
.steuer { background: #12303f; color: #fff; font-size: 16px; padding: 6px 12px; display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.steuer b { font-weight: 600; opacity: .85; }
#steuer { display: flex; gap: 6px; flex-wrap: nowrap; overflow-x: auto; }
.steuer button { min-height: 36px; padding: 0 12px; border-radius: 99px; border: 1px solid #ffffff55; background: none; color: #fff; }
.steuer button.an { background: #fff; color: #12303f; }
.app { max-width: 1100px; margin: 0 auto; padding: 0 0 40px; }
.kopf { display: flex; align-items: center; gap: 10px; padding: 12px 16px 4px; }
.kopf .zurueck { width: 44px; height: 44px; border-radius: 14px; border: 0; background: var(--flaeche); font-size: 22px; font-weight: 800; }
.kopf h1 { margin: 0; font-size: 22px; line-height: 1.15; }
.kopf small { display: block; font-size: 16px; color: var(--leise); font-weight: 600; }
.reiter { display: grid; grid-template-columns: repeat(3, 1fr); gap: 4px; background: var(--flaeche); border-radius: 99px; padding: 4px; margin: 10px 16px; border: 1px solid var(--linie); }
.reiter button { min-height: 44px; border: 0; border-radius: 99px; background: none; font-weight: 700; }
.reiter button.an { background: var(--akzent); color: #fff; }
/* Kartenwahl statt aller Karten untereinander */
.kartenwahl { display: flex; align-items: center; gap: 8px; margin: 4px 16px 10px; }
.kartenwahl .pfeil { width: 48px; height: 48px; flex: none; border-radius: 50%; border: 2px solid var(--linie); background: var(--flaeche); font-size: 22px; font-weight: 800; }
.kartenwahl .pfeil[disabled] { opacity: .35; cursor: default; }
.kartenwahl .mitte { flex: 1; min-height: 48px; border: 0; background: none; text-align: center; font-weight: 700; font-size: 16px; color: var(--leise); }
.kartenwahl .mitte span { display: block; color: var(--text); font-size: 17px; }
.liste { margin: 0 16px 12px; background: var(--flaeche); border-radius: 18px; padding: 8px; border: 1px solid var(--linie); }
.liste h3 { font-size: 16px; letter-spacing: .06em; color: var(--leise); margin: 10px 8px 4px; text-transform: uppercase; }
.liste button { display: flex; width: 100%; align-items: center; gap: 12px; min-height: 52px; border: 0; background: none; text-align: left; border-radius: 12px; padding: 4px 8px; }
.liste button.an { background: var(--bg); font-weight: 700; }
.liste .nr { width: 32px; height: 32px; flex: none; border-radius: 50%; border: 2px solid var(--linie); display: grid; place-items: center; font-size: 16px; font-weight: 700; }
/* Die eine Lernkarte */
.karte { background: var(--flaeche); border-radius: 22px; margin: 0 16px; padding: 18px 18px 20px; box-shadow: 0 4px 0 var(--linie); }
.karte h2 { margin: 0 0 4px; font-size: 24px; line-height: 1.2; }
.karte .status { font-size: 16px; color: var(--leise); margin: 0 0 12px; }
.raster { display: block; }
.bildfeld { display: grid; place-items: center; background: #F4FAFB; border-radius: 16px; padding: 10px 6px; margin: 4px 0 12px; min-height: 120px; }
.bildfeld svg { width: 100%; max-width: 420px; height: auto; display: block; overflow: visible; }
.situation { font-size: 19px; margin: 0 0 12px; }
.ueber { font-size: 16px; font-weight: 800; letter-spacing: .06em; color: var(--gut); text-transform: uppercase; margin: 0 0 6px; }
.schritte-weg { list-style: none; margin: 0 0 8px; padding: 0; }
.schritte-weg li { display: flex; gap: 10px; font-size: 16px; color: var(--leise); padding: 4px 0; }
.schritte-weg li::before { content: "✓"; color: var(--gut); font-weight: 800; }
.schritt { border: 2px solid var(--text); border-radius: 16px; padding: 12px 14px; font-size: 20px; line-height: 1.4; margin: 0 0 12px; animation: rein .25s ease-out; }
.schritt .n { display: block; font-size: 16px; font-weight: 800; color: var(--gut); margin-bottom: 2px; }
@keyframes rein { from { transform: translateY(8px); opacity: 0; } }
.punkte { display: flex; gap: 6px; justify-content: center; margin: 0 0 12px; }
.punkte i { width: 28px; height: 6px; border-radius: 3px; background: var(--linie); } .punkte i.an { background: var(--text); }
.knoepfe { display: flex; gap: 10px; }
.haupt { flex: 1; min-height: 60px; border: 0; border-radius: 16px; background: var(--akzent); color: #fff; font-size: 20px; font-weight: 800; box-shadow: 0 4px 0 var(--akzent-tief); }
.zweit { min-height: 60px; min-width: 60px; padding: 0 16px; border-radius: 16px; border: 2px solid var(--linie); background: var(--flaeche); font-size: 18px; font-weight: 700; }
.merke { border-left: 6px solid var(--akzent); background: #FFF7F3; border-radius: 4px 14px 14px 4px; padding: 12px 14px; margin: 0 0 14px; }
.merke p { margin: 0; font-size: 20px; font-weight: 700; line-height: 1.4; }
.links { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 14px; }
.links button { min-height: 44px; padding: 0 14px; border-radius: 99px; border: 2px solid var(--linie); background: var(--flaeche); font-size: 16px; font-weight: 700; }
.falle { background: var(--falle); border-radius: 14px; padding: 12px 14px; margin-top: 10px; font-size: 18px; }
.falle b { color: var(--falle-text); }
.woerterliste { margin-top: 10px; border-top: 1px solid var(--linie); }
.woerterliste div { padding: 8px 0; border-bottom: 1px solid var(--linie); font-size: 17px; } .woerterliste dt, .woerterliste b { font-weight: 800; }
mark { background: var(--marker); color: inherit; border-radius: 4px; padding: 0 3px; font-weight: 700; }
.wort { border: 0; background: none; padding: 0; font: inherit; color: inherit; text-decoration: underline dotted 2px; text-underline-offset: 4px; cursor: help; min-height: 0; }
.wort.offen { background: #E3F2F5; border-radius: 4px; }
.erklwort { display: block; margin: 6px 0 10px; padding: 10px 12px; border-radius: 12px; background: #E3F2F5; font-size: 17px; animation: rein .2s ease-out; }
.erklwort b { display: block; }
.bruch { display: inline-flex; flex-direction: column; vertical-align: middle; text-align: center; line-height: 1.05; font-size: 1em; margin: 0 2px; font-weight: inherit; }
.bruch span:first-child { border-bottom: 2px solid currentColor; padding: 0 2px; }
.gekuerzt { display: inline-block; font-size: 16px; color: #7A4B00; background: #FFF1C2; border-radius: 6px; padding: 0 6px; margin-left: 6px; }
/* Üben: Spickzettel oben, Aufgabe sofort sichtbar */
.spick { background: var(--flaeche); border-radius: 16px; margin: 0 16px 10px; padding: 10px 14px; border: 2px dashed var(--linie); display: flex; gap: 12px; align-items: center; }
.spick p { margin: 0; font-size: 17px; flex: 1; } .spick button { min-height: 44px; border: 0; background: none; text-decoration: underline; font-weight: 700; font-size: 16px; }
.aufgabe { background: var(--flaeche); border-radius: 22px; margin: 0 16px; padding: 18px; box-shadow: 0 4px 0 var(--linie); }
.aufgabe .frage { font-size: 22px; font-weight: 700; margin: 0 0 14px; line-height: 1.3; }
.aufgabe input { width: 100%; font: inherit; font-size: 28px; font-weight: 800; text-align: center; min-height: 64px; border-radius: 14px; border: 3px solid var(--linie); }
.aufgabe .wahl { display: grid; gap: 8px; } .aufgabe .wahl button { min-height: 52px; border-radius: 12px; border: 2px solid var(--linie); background: var(--flaeche); text-align: left; padding: 8px 12px; }
.aufgabe .wahl button.an { border-color: var(--text); background: var(--bg); }
.rm { border-radius: 14px; padding: 12px 14px; margin-top: 12px; font-size: 18px; } .rm.ok { background: #E0F4EE; color: #0B6B4E; font-weight: 700; } .rm.nein { background: var(--falle); }
/* Zeichnungen: Schrift mindestens 16 px */
.z-linie { stroke: var(--text); stroke-width: 3; stroke-linecap: round; fill: none; }
.z-duenn { stroke: #9BC3CD; stroke-width: 1.5; }
.z-text { font: 700 20px ui-rounded, system-ui, sans-serif; fill: var(--text); }
.z-text.klein { font-size: 19px; font-weight: 600; }
.z-text.gross { font-size: 26px; font-weight: 800; }
.z-akzent { stroke: var(--akzent); fill: none; stroke-width: 4; stroke-linecap: round; }
.z-akzent-f { fill: var(--akzent); }
.z-blau { fill: var(--blau); } .z-kalt { fill: var(--kalt); }
.z-gut { stroke: var(--gut); fill: none; stroke-width: 4; stroke-linecap: round; }
.z-marker { fill: var(--marker); }
.neu-im-bild { animation: blitz .5s ease-out; } @keyframes blitz { from { opacity: 0; } }
@media (max-width: 819px) {
  .karte .knoepfe, .aufgabe .knoepfe { position: fixed; left: 0; right: 0; bottom: 0; background: var(--flaeche); padding: 10px 16px calc(10px + env(safe-area-inset-bottom)); z-index: 5; box-shadow: 0 -6px 18px #0b3b5222; margin: 0 !important; }
  .app { padding-bottom: 100px; }
  .raster { display: flex; flex-direction: column; } .raster .bildfeld { order: 2; margin-top: 4px; }
  .schritte-weg { display: none; }
  .karte .status { display: none; }
  .kartenwahl { margin-bottom: 6px; } .kartenwahl .pfeil { width: 44px; height: 44px; }
  .steuer { flex-wrap: nowrap; overflow-x: auto; } .steuer button { white-space: nowrap; }
  .steuer { font-size: 16px; padding: 4px 8px; } .steuer b { display: none; }
  .kopf { padding-top: 8px; } .reiter { margin: 6px 16px; } .karte { padding: 14px 16px 6px; } .karte h2 { font-size: 22px; } .karte .status { margin-bottom: 8px; }
}
@media (min-width: 820px) {
  .karte { padding: 24px 28px; }
  .raster { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 24px; align-items: start; }
  .raster .bildfeld { position: sticky; top: 16px; margin: 0; min-height: 320px; }
  .kartenwahl, .reiter, .karte, .liste, .spick, .aufgabe { margin-left: 24px; margin-right: 24px; }
}
@media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
</style>
</head>
<body>
<div class="steuer" role="region" aria-label="Entwurfssteuerung"><b>Entwurf – Ansicht:</b><span id="steuer"></span></div>
<div class="app" id="app"></div>
<script>
'use strict';
const DATEN = {"themen": {"zahlen.ganz": {"titel": "Ganze Zahlen", "ort": "Rom", "klasse": 5, "abschnitte": [{"titel": "Negative Zahlen verstehen", "lernziele": ["deuten", "zahlengerade", "ordnen", "betrag"]}, {"titel": "Addieren und Subtrahieren", "lernziele": ["addieren", "subtrahieren"]}, {"titel": "Alles zusammen", "lernziele": ["ketten", "sach"]}], "etappen": [{"lernziel": "deuten", "titel": "Was bedeutet eine negative Zahl?", "regel": "Für alles ⟦unter null⟧ schreibst du ein ⟦Minus⟧ vor die Zahl: 3 Grad unter null sind −3 °C, 20 € Schulden sind −20 €. Ohne Minus liegt die Zahl über null.", "schritte": ["Das Thermometer zeigt 3 Grad unter null. Das wollen wir als Zahl schreiben.", "„Unter null“ bedeutet: Es ist eine negative Zahl. Darum kommt ein Minus vor die 3.", "Man schreibt ⟦−3 °C⟧ und sagt „minus drei Grad“.", "Bei Geld geht es genauso: 5 € Schulden schreibt man als ⟦−5 €⟧."], "fehler": "Das Minus weglassen: 3 °C und −3 °C sind sehr verschieden. Bei 3 °C taut der Schnee, bei −3 °C friert die Pfütze zu. Das Minus sagt ⟦unter null⟧ – ohne Minus stimmt die Zahl nicht mehr.", "einstieg": "Im Winter zeigt das Thermometer morgens manchmal weniger als null Grad – dann friert die Pfütze zu. Oder du leihst dir 5 € von deiner Schwester und hast selbst kein Geld: Dann hast du 5 € Schulden. Für solche Werte „unter null“ gibt es Zahlen mit einem Minus davor. Sie heißen ⟦negative Zahlen⟧.", "woerter": [["negative Zahl", "eine Zahl unter null, mit Minus davor, zum Beispiel −3"], ["positive Zahl", "eine Zahl über null, zum Beispiel 3 (das Plus schreibt man meist nicht hin)"], ["−3 °C", "gelesen „minus drei Grad“: 3 Grad unter null"], ["Schulden", "Geld, das du jemandem zurückgeben musst"], ["ganze Zahlen", "alle Zahlen ohne Komma: … −2, −1, 0, 1, 2 …"]], "zeichnung": "thermometer", "einstieg_kurz": "Im Winter wird es manchmal kälter als 0 Grad. Für solche Werte ⟦unter null⟧ schreibt man ein Minus vor die Zahl. Diese Zahlen heißen ⟦negative Zahlen⟧.", "aufgabe": {"f": {"text": "Das Parkhaus hat Stockwerke unter der Erde. Ein Auto steht 5 Stockwerke unter dem Erdgeschoss (Stockwerk 0). Welche Stockwerk-Zahl ist das?"}, "y": "zahl", "o": {"wert": -5}, "w": "„Unter null“, „Schulden“ und „unter“ bedeuten negativ. Also steht ein Minus davor: −5."}}, {"lernziel": "zahlengerade", "titel": "Zahlen auf der Zahlengeraden", "regel": "So findest du eine Zahl auf der Zahlengeraden: Zuerst ausrechnen, ⟦wie viel ein Abschnitt wert ist⟧ (ganze Länge geteilt durch die Zahl der Abschnitte). Dann vom Anfang aus in diesen Schritten zählen. Links von 0 stehen die ⟦negativen⟧ Zahlen, rechts die positiven.", "schritte": ["Die Zahlengerade im Bild geht von −10 bis 10 und hat 10 gleich lange Abschnitte. Gesucht ist der Strich für −4.", "Zuerst klärst du, wie viel ein Abschnitt wert ist. Von −10 bis 0 sind es 10, von 0 bis 10 noch einmal 10, zusammen 20.", "Diese 20 verteilen sich auf 10 Abschnitte: 20 : 10 = 2. Also ist ⟦ein Abschnitt 2 wert⟧.", "Vom linken Ende −10 aus zählst du in Zweierschritten: −8 ist der 1. Strich, −6 der 2., ⟦−4 der 3. Strich⟧."], "fehler": "Jeden Strich als 1 zählen: Dann wäre der 3. Strich nach −10 die −7. Das ist, als würdest du am Thermometer jeden Strich als 1 Grad lesen, obwohl er 2 Grad bedeutet. Rechne immer zuerst aus, ⟦wie viel ein Abschnitt wert ist⟧.", "einstieg": "Ein Thermometer hat eine Skala: in der Mitte die 0, darüber die Grade über null, darunter die Grade unter null. Legst du so eine Skala quer hin, hast du eine ⟦Zahlengerade⟧: in der Mitte die 0, rechts die positiven, links die negativen Zahlen.", "woerter": [["Zahlengerade", "eine Linie, auf der alle Zahlen der Reihe nach stehen – wie ein liegendes Thermometer"], ["Strich", "eine Markierung auf der Zahlengeraden"], ["Abschnitt", "das Stück zwischen zwei Strichen; alle Abschnitte sind gleich lang"]], "bild": {"typ": "zahlenstrahl", "start": -10, "ende": 10, "abschnitte": 10, "beschriftet": "anfang_ende", "pfeil": 3}, "aufgabe": {"f": {"text": "Du startest auf der Zahlengeraden bei 8 und gehst 10 Schritte nach links. Wo landest du?"}, "y": "zahl", "o": {"wert": -2}, "w": "Nach links heißt minus: 8 − 10 = −2."}}, {"lernziel": "ordnen", "titel": "Welche Zahl ist kleiner?", "regel": "So vergleichst du zwei Zahlen: Die Zahl, die auf der Zahlengeraden ⟦weiter links⟧ steht, ist kleiner. Jede negative Zahl ist kleiner als 0 und kleiner als jede positive Zahl.", "schritte": ["Vergleiche −8 und −3. Denke an die Zahlengerade: Je weiter links eine Zahl steht, desto kleiner ist sie.", "−8 liegt 8 Schritte links von der 0, −3 nur 3 Schritte. Also liegt −8 weiter links.", "Darum ist −8 die kleinere Zahl: ⟦−8 < −3⟧."], "fehler": "„−8 > −3, weil 8 größer ist als 3“ ist falsch. Am Thermometer merkst du es sofort: −8 °C ist kälter als −3 °C. Bei negativen Zahlen gilt: ⟦mehr Minus heißt kleiner⟧.", "probe": "Bei −8 °C ist es kälter als bei −3 °C ✓", "einstieg": "Morgens sind es −8 °C, abends −3 °C. Wann ist es kälter? Am Morgen – da steht das Thermometer tiefer. Auf der liegenden Zahlengeraden heißt „tiefer“: weiter links. Und weiter links bedeutet ⟦kleiner⟧.", "woerter": [["<", "„ist kleiner als“: −8 < −3 heißt „−8 ist kleiner als −3“. Die Spitze zeigt zur kleineren Zahl."], [">", "„ist größer als“: Die offene Seite zeigt zur größeren Zahl."], ["ordnen", "Zahlen der Größe nach hinschreiben, meist die kleinste zuerst"]], "aufgabe": {"f": {"text": "Welche Zahl ist am kleinsten?"}, "y": "auswahl", "a": ["6", "−13", "12"], "o": {"index": 1}, "w": "Auf der Zahlengeraden von links nach rechts: −13 < 6 < 12. Am weitesten links steht −13."}}, {"lernziel": "betrag", "titel": "Betrag und Gegenzahl", "regel": "Den ⟦Betrag⟧ findest du, indem du das ⟦Minus weglässt⟧: |−7| = 7 und |7| = 7. Die ⟦Gegenzahl⟧ bekommst du, indem du das ⟦Vorzeichen umdrehst⟧: Aus −7 wird 7, aus 7 wird −7.", "schritte": ["Der Taucher ist bei −7 m. Wie weit ist er von der Wasseroberfläche, also von der 0, entfernt?", "Auf der Zahlengeraden zählst du von −7 bis 0. Das sind 7 Schritte.", "Also ist der Betrag ⟦|−7| = 7⟧. Auch |7| = 7, denn der Vogel ist genauso weit weg.", "Der Vogel ist gleich weit weg, aber auf der anderen Seite der 0. Darum ist 7 die ⟦Gegenzahl⟧ von −7."], "fehler": "|−7| = −7 ist falsch. Der Betrag fragt nur: Wie weit weg? Der Taucher ist 7 m von der Oberfläche entfernt, nicht „minus 7 m“. Ein Abstand ist ⟦nie negativ⟧.", "einstieg": "Ein Taucher ist 7 m unter dem Wasser, ein Vogel fliegt 7 m über dem Wasser. Der Taucher ist bei −7 m, der Vogel bei 7 m. Trotzdem sind beide gleich weit von der Wasseroberfläche entfernt: 7 m. Diese Entfernung von der 0 heißt ⟦Betrag⟧.", "woerter": [["Betrag", "wie weit eine Zahl von der 0 entfernt ist – immer ohne Minus"], ["|−7|", "gelesen „Betrag von minus sieben“; die senkrechten Striche bedeuten Betrag"], ["Abstand", "wie weit zwei Stellen auseinanderliegen; nie negativ"], ["Vorzeichen", "das Plus oder Minus vor einer Zahl"], ["Gegenzahl", "die Zahl, die gleich weit von der 0 entfernt ist, aber auf der anderen Seite: zu −7 gehört 7"]], "bild": {"typ": "zahlenstrahl", "start": -10, "ende": 10, "abschnitte": 20, "beschriftet": "anfang_ende", "pfeil": 3}, "zeichnung": "betrag", "aufgabe": {"f": {"text": "Wie heißt die Gegenzahl von 56?"}, "y": "zahl", "o": {"wert": -56}, "w": "Die Gegenzahl liegt gleich weit von der 0 entfernt auf der anderen Seite: −56."}}, {"lernziel": "addieren", "titel": "Ganze Zahlen addieren", "regel": "So addierst du: ⟦Plus eine positive Zahl⟧ heißt auf der Zahlengeraden nach rechts, ⟦plus eine negative Zahl⟧ heißt nach links. Abkürzung: Bei ⟦gleichen Vorzeichen⟧ die Beträge addieren, das Vorzeichen bleibt: (−3) + (−5) = −8. Bei ⟦verschiedenen Vorzeichen⟧ den kleineren Betrag vom größeren abziehen; das Ergebnis bekommt das Vorzeichen der Zahl mit dem größeren Betrag.", "schritte": ["Rechne (−7) + 4. Starte auf der Zahlengeraden bei −7 – das sind die 7 € Schulden.", "„+ 4“ heißt: 4 Schritte nach rechts, denn du bekommst Geld dazu. Du zählst −6, −5, −4, −3.", "Du landest bei ⟦−3⟧. Es bleiben 3 € Schulden.", "Die Abkürzung ohne Zählen: Die Vorzeichen sind verschieden, also rechnest du 7 − 4 = 3. Die −7 ist weiter von der 0 entfernt, darum bekommt das Ergebnis ihr Minus: ⟦−3⟧."], "fehler": "(−7) + 4 = −11 ist falsch. Wer 4 € dazubekommt, hat danach ⟦weniger⟧ Schulden, nicht mehr. Bei verschiedenen Vorzeichen werden die Beträge ⟦abgezogen⟧: 7 − 4 = 3, also −3.", "probe": "Kontostand: Von 7 € Schulden zahlst du 4 € zurück, es bleiben 3 € Schulden ✓", "einstieg": "Du hast 7 € Schulden bei deiner Schwester. Zum Geburtstag bekommst du 4 € und gibst sie ihr gleich. Danach hast du nur noch 3 € Schulden. Mit Zahlen: Von −7 € kommst du durch 4 € dazu auf −3 €. Etwas dazuzählen heißt ⟦addieren⟧ – das geht auch mit negativen Zahlen.", "woerter": [["addieren", "plus rechnen, etwas dazuzählen"], ["(−7) + 4", "die Klammer trennt das Minus der Zahl vom Rechenzeichen davor; gelesen „minus sieben plus vier“"], ["Abkürzung mit Beträgen", "statt Schritte zu zählen, rechnest du mit den Zahlen ohne Vorzeichen und setzt danach das richtige Vorzeichen"]], "bild": {"typ": "zahlenstrahl", "start": -10, "ende": 10, "abschnitte": 20, "beschriftet": "anfang_ende", "pfeil": 7}, "aufgabe": {"f": {"text": "Berechne (−2) + 10."}, "y": "zahl", "o": {"wert": 8}, "w": "Verschiedene Vorzeichen: Beträge subtrahieren, 10 − 2 = 8. Der größere Betrag (10) gehört zur positiven Zahl, also 8."}}, {"lernziel": "subtrahieren", "titel": "Ganze Zahlen subtrahieren", "regel": "So subtrahierst du: Mach daraus eine Addition mit der ⟦Gegenzahl⟧. 3 − 8 = 3 + (−8) und ⟦5 − (−3) = 5 + 3⟧. Merkhilfe: Wer dir Schulden wegnimmt, macht dich reicher.", "schritte": ["3 − 8: Du hast 3 € und gibst 8 € aus. Auf der Zahlengeraden gehst du von 3 aus 8 Schritte nach links.", "Nach 3 Schritten bist du bei 0, nach 5 weiteren Schritten bei ⟦−5⟧. Das ist dasselbe wie 3 + (−8).", "5 − (−3): Du hast 5 €, und dir werden 3 € Schulden erlassen. Danach hast du 3 € mehr.", "Aus „minus minus 3“ wird also „plus 3“: 5 + 3 = ⟦8⟧."], "fehler": "5 − (−3) = 2 ist falsch. Hier werden nicht 3 € weggenommen, sondern ⟦3 € Schulden⟧. Weniger Schulden heißt mehr Geld: 5 − (−3) = 5 + 3 = 8. Vorsicht auch bei (−3) − 5: Das ist (−3) + (−5) = −8, nicht +8 – hier wird keine negative Zahl abgezogen, sondern du gibst noch 5 € mehr aus.", "probe": "Umkehraufgabe: (−5) + 8 = 3 ✓ und 8 + (−3) = 5 ✓", "einstieg": "Du hast 3 € und kaufst etwas für 8 €. Dann fehlen dir 5 €, du stehst bei −5 €. Neu ist: Man kann auch Schulden wegnehmen. Wenn deine Schwester dir 3 € Schulden erlässt, nimmt sie dir etwas Negatives weg – und du stehst danach besser da. Abziehen heißt in Mathe ⟦subtrahieren⟧.", "woerter": [["subtrahieren", "minus rechnen, etwas abziehen"], ["5 − (−3)", "gelesen „fünf minus minus drei“: von 5 wird die Zahl −3 abgezogen"], ["erlassen", "Schulden streichen: Man muss sie nicht mehr zurückzahlen"], ["Umkehraufgabe", "die Probe mit Plus: Ergebnis plus die abgezogene Zahl ergibt wieder die Startzahl"]], "aufgabe": {"f": {"text": "Berechne 9 − (−5)."}, "y": "zahl", "o": {"wert": 14}, "w": "Gegenzahl addieren: 9 − (−5) = 9 + 5. Gleiche Vorzeichen: Beträge addieren, 9 + 5 = 14. Das Vorzeichen bleibt: 14."}}, {"lernziel": "ketten", "titel": "Mehrere Zahlen hintereinander", "regel": "So rechnest du eine Rechenkette: ⟦Erst jede Klammer auflösen⟧ („+ (−4)“ wird „− 4“, „− (−4)“ wird „+ 4“). Dann alle Plus-Zahlen zusammenzählen, alle Minus-Zahlen zusammenzählen und ⟦beides voneinander abziehen⟧.", "schritte": ["Rechne 12 − (−5) + (−9) − 4. Löse zuerst jede Klammer auf: „− (−5)“ wird „+ 5“, und „+ (−9)“ wird „− 9“.", "Ohne Klammern steht jetzt da: 12 + 5 − 9 − 4.", "Zähle alle Plus-Zahlen zusammen: 12 + 5 = 17. Zähle alle Minus-Zahlen zusammen: 9 + 4 = 13.", "Ziehe die Minus-Summe von der Plus-Summe ab: 17 − 13 = ⟦4⟧."], "fehler": "Nur die erste Klammer auflösen und die zweite vergessen: 12 + 5 + 9 − 4 = 22 ist falsch, denn „+ (−9)“ bedeutet 9 € ausgeben. Löse ⟦jede⟧ Klammer auf, bevor du rechnest – wie beim Taschengeld, wo du keine Ausgabe übersehen darfst.", "einstieg": "In einer Woche passiert viel mit deinem Taschengeld: 12 € bekommen, 5 € Schulden erlassen, 9 € ausgegeben, noch einmal 4 € ausgegeben. Am Ende willst du wissen, wie viel übrig ist. Dazu rechnest du viele Plus- und Minus-Schritte hintereinander – eine ⟦Rechenkette⟧.", "woerter": [["Rechenkette", "mehrere Plus- und Minusrechnungen hintereinander"], ["Klammer auflösen", "„+ (−9)“ als „− 9“ schreiben und „− (−5)“ als „+ 5“ – dann stehen keine Klammern mehr da"]], "aufgabe": {"f": {"text": "Berechne 7 − 10 + 11."}, "y": "zahl", "o": {"wert": 8}, "w": "Plus-Zahlen: 7 + 11 = 18. Minus-Zahl: 10. 18 − 10 = 8."}}, {"lernziel": "sach", "titel": "Negative Zahlen im Alltag rechnen", "regel": "So übersetzt du eine Geschichte in eine Rechnung: ⟦Startwert⟧ hinschreiben, dann jede Änderung dazu. ⟦Wärmer, einzahlen, steigen⟧ ist Plus. ⟦Kälter, abheben, sinken⟧ ist Minus.", "schritte": ["Morgens sind es −4 °C. Das ist der Startwert.", "Bis mittags wird es 7 Grad wärmer. „Wärmer“ heißt Plus, also + 7.", "Die Rechnung lautet −4 + 7. Auf der Zahlengeraden gehst du von −4 aus 7 Schritte nach rechts.", "Du landest bei ⟦3⟧. Mittags sind es 3 °C."], "fehler": "Den Startwert ohne Minus nehmen: 4 + 7 = 11 hieße, es wäre morgens schon 4 Grad warm gewesen. Es waren aber ⟦−4 °C⟧, also 4 Grad unter null.", "probe": "Von −4 bis 0 sind es 4 Grad, dann noch 3 weiter ✓", "einstieg": "Die Wetter-App sagt: morgens −4 °C, bis mittags wird es 7 Grad wärmer. Wie warm ist es dann? Solche Fragen aus dem Alltag löst du, indem du die Geschichte in eine Rechnung übersetzt. Solche Aufgaben heißen ⟦Sachaufgaben⟧.", "woerter": [["Sachaufgabe", "eine Rechenaufgabe, die als kleine Geschichte erzählt wird"], ["Startwert", "die Zahl, mit der die Geschichte beginnt"], ["Änderung", "was dazukommt (Plus) oder weggeht (Minus)"], ["Meeresspiegel", "die Höhe 0 m; wer tiefer ist, hat eine negative Höhe"]], "aufgabe": {"f": {"text": "Ein Taucher ist auf −12 m. Er sinkt 11 m. Auf welcher Höhe ist er jetzt?"}, "y": "zahl", "o": {"wert": -23, "einheit": "m"}, "w": "Start −12, Änderung − 11: −12 − 11 = −23."}}]}, "bruch.brueche": {"titel": "Brüche und Anteile", "ort": "Pisa", "klasse": 6, "abschnitte": [{"titel": "Anteile verstehen", "lernziele": ["bruchteil_von", "anteil_bestimmen", "ganzes_bestimmen"]}, {"titel": "Erweitern und kürzen", "lernziele": ["erweitern", "kuerzen"]}, {"titel": "Vergleichen und darstellen", "lernziele": ["vergleichen", "zahlenstrahl", "verstehen"]}], "etappen": [{"lernziel": "bruchteil_von", "titel": "Bruchteil einer Größe berechnen", "regel": "Ein Bruch wie 3/4 besteht aus ⟦Zähler⟧ (oben, 3) und ⟦Nenner⟧ (unten, 4). So berechnest du 3/4 von einer Größe: ⟦durch den Nenner teilen⟧, dann ⟦mit dem Zähler malnehmen⟧.", "schritte": ["3/4 von 20 €: Teile die 20 € in 4 gleiche Teile. Ein Viertel: 20 € : 4 = 5 €.", "Du nimmst 3 solche Teile: 5 € · 3 = ⟦15 €⟧. Das sind drei Viertel."], "fehler": "3/4 von 20 € als 20 : 3 · 4 zu rechnen ist falsch: Du teilst durch den ⟦Nenner⟧ (unten) und nimmst mit dem ⟦Zähler⟧ (oben) mal.", "probe": "15 € ist weniger als 20 € – passt, denn 3/4 ist weniger als ein Ganzes ✓", "bild": {"typ": "figur"}, "zeichnung": "bruchteil", "aufgabe": {"f": {"text": "Berechne 1/2 von 24 m."}, "y": "zahl", "o": {"wert": 12, "einheit": "m"}, "w": "24 m : 2 = 12 m. Das ist 1/2 von 24 m."}}, {"lernziel": "anteil_bestimmen", "titel": "Welcher Anteil ist das?", "regel": "Der ⟦Anteil⟧ ist ⟦Teil durch Ganzes⟧: Der Teil kommt in den Zähler, das Ganze in den Nenner. Danach ⟦kürzt⟧ man so weit wie möglich.", "schritte": ["Von 30 Kindern spielen 12 ein Instrument. Anteil = Teil durch Ganzes: 12/30.", "Ordne die 30 Kinder in 5 Spalten zu je 6. Die 12 Musiker füllen genau 2 Spalten.", "Zähler und Nenner durch 6 teilen: 12/30 = ⟦2/5⟧."], "fehler": "Den Anteil als 30/12 aufzuschreiben ist falsch: Der Teil steht ⟦oben⟧ im Zähler, das Ganze ⟦unten⟧ im Nenner.", "probe": "2/5 von 30 = 30 : 5 · 2 = 12 ✓", "bild": {"typ": "figur"}}, {"lernziel": "ganzes_bestimmen", "titel": "Das Ganze aus einem Teil finden", "regel": "Kennst du einen Bruchteil, findest du das ⟦Ganze⟧ rückwärts: ⟦durch den Zähler teilen⟧ – das ist ein Stück –, dann ⟦mit dem Nenner malnehmen⟧.", "schritte": ["2/5 der Klasse sind 12 Kinder. Ein Fünftel: 12 : 2 = 6 Kinder.", "Das Ganze sind fünf Fünftel: 6 · 5 = ⟦30 Kinder⟧."], "fehler": "Das Ganze als 2/5 von 12 auszurechnen ist falsch: Dann bekommst du einen ⟦Teil vom Teil⟧. Rückwärts heißt: ⟦durch den Zähler, mal den Nenner⟧.", "probe": "2/5 von 30 = 30 : 5 · 2 = 12 ✓", "bild": {"typ": "figur"}, "aufgabe": {"f": {"text": "15 Kinder sind 1/3 aller Kinder auf dem Schulhof. Wie viele Kinder sind auf dem Schulhof?"}, "y": "zahl", "o": {"wert": 45}, "w": "15 Kinder sind 1/3, also alle: 15 · 3 = 45 Kinder."}}, {"lernziel": "erweitern", "titel": "Brüche erweitern", "regel": "⟦Erweitern⟧ heißt: Zähler und Nenner mit ⟦derselben Zahl⟧ malnehmen. Der Wert bleibt gleich – wie bei einer Schokolade, deren Stücke du noch einmal teilst: Du hast danach mehr, aber kleinere Stücke, und gleich viel Schokolade.", "schritte": ["Erweitere 3/4 auf den Nenner 20. Es gilt 4 · 5 = 20.", "Jedes Viertel wird in 5 Stücke geteilt. Aus 3 Vierteln werden 3 · 5 = 15 Stücke von 20.", "Also 3/4 = ⟦15/20⟧."], "fehler": "3/4 = 3/20 ist falsch: Wer nur den Nenner ändert, verändert den Wert. ⟦Zähler und Nenner⟧ werden mit derselben Zahl malgenommen.", "probe": "15/20 durch 5 gekürzt ergibt wieder 3/4 ✓", "bild": {"typ": "figur"}, "aufgabe": {"f": {"text": "Mit welcher Zahl wurde 4/5 erweitert, wenn 16/20 herauskommt?"}, "y": "zahl", "o": {"wert": 4}, "w": "20 : 5 = 4 (und 16 : 4 = 4)."}}, {"lernziel": "kuerzen", "titel": "Brüche vollständig kürzen", "regel": "⟦Kürzen⟧ heißt: Zähler und Nenner durch ⟦dieselbe Zahl⟧ teilen. ⟦Vollständig gekürzt⟧ ist ein Bruch, wenn Zähler und Nenner keinen gemeinsamen Teiler außer 1 mehr haben.", "schritte": ["Kürze 18/24. Der größte gemeinsame Teiler von 18 und 24 ist 6.", "18 : 6 = 3 und 24 : 6 = 4, also 18/24 = ⟦3/4⟧."], "fehler": "18/24 = 9/12 ist richtig gekürzt, aber ⟦nicht vollständig⟧: 9 und 12 haben noch den Teiler 3. Ganz gekürzt: 3/4.", "probe": "3/4 mit 6 erweitert ergibt 18/24 ✓", "aufgabe": {"f": {"text": "Welcher Bruch entsteht, wenn man 18/90 vollständig kürzt?"}, "y": "auswahl", "a": ["2/6", "1/90", "1/5", "9/90"], "o": {"index": 2}, "w": "18 : 18 = 1, 90 : 18 = 5: 1/5."}}, {"lernziel": "vergleichen", "titel": "Brüche vergleichen", "regel": "Gleicher Nenner: Der Bruch mit dem ⟦größeren Zähler⟧ ist größer. Verschiedene Nenner: Erst beide Brüche auf den ⟦Hauptnenner⟧ erweitern (das kleinste gemeinsame Vielfache der Nenner), dann die Zähler vergleichen.", "schritte": ["Vergleiche 3/4 und 5/6. Hauptnenner von 4 und 6 ist 12.", "3/4 = 9/12 und 5/6 = 10/12. Weil 10 > 9, ist ⟦5/6 größer⟧."], "fehler": "„3/8 ist größer als 3/5, weil 8 > 5“ ist falsch: Ein größerer Nenner heißt ⟦kleinere Stücke⟧. Bei gleichem Zähler ist der Bruch mit dem ⟦kleineren Nenner⟧ größer.", "probe": "Ohne Hauptnenner: 3/4 fehlt 1/4 bis zum Ganzen, 5/6 fehlt nur 1/6. Ein Sechstel ist kleiner als ein Viertel, also ist 5/6 näher an 1 und damit größer ✓", "aufgabe": {"f": {"text": "Welcher Bruch ist größer: 2/6 oder 2/11?"}, "y": "auswahl", "a": ["2/11", "Beide sind gleich groß", "2/6"], "o": {"index": 2}, "w": "Gleicher Zähler: Kleinerer Nenner heißt größere Stücke. 2/6 ist größer."}}, {"lernziel": "zahlenstrahl", "titel": "Brüche am Zahlenstrahl", "regel": "Am ⟦Zahlenstrahl⟧ teilst du die Strecke von 0 bis 1 in so viele gleiche Teile, wie der ⟦Nenner⟧ angibt. Der ⟦Zähler⟧ sagt, wie viele Teile du von 0 aus nach rechts gehst.", "schritte": ["3/5: Teile die Strecke von 0 bis 1 in 5 gleiche Teile.", "Gehe von 0 aus 3 Teile nach rechts: Dort liegt ⟦3/5⟧."], "fehler": "3/5 beim 5. Strich einzutragen ist falsch: Der 5. Strich nach der 0 ist schon die ⟦1⟧ (5/5). 3/5 liegt beim ⟦3. Strich⟧.", "bild": {"typ": "zahlenstrahl", "start": 0, "ende": 1, "abschnitte": 5, "beschriftet": "anfang_ende", "pfeil": 3}}, {"lernziel": "verstehen", "titel": "Aussagen prüfen, Fehler finden", "regel": "Bevor du eine Aussage über Brüche glaubst, ⟦prüfe sie mit einem Beispiel⟧: Erweitere, kürze oder rechne den Anteil aus. Ein einziges Gegenbeispiel zeigt, dass eine allgemeine Aussage ⟦falsch⟧ ist.", "schritte": ["Aussage: „Ein Bruch mit größerem Nenner ist immer größer.“ Teste 1/2 und 1/4.", "1/2 = 2/4 ist größer als 1/4. Das ist ein Gegenbeispiel, die Aussage ist also ⟦falsch⟧."], "fehler": "Eine Aussage nur mit einem passenden Beispiel „beweisen“ reicht nicht: 1/4 < 3/5 bestätigt die Nenner-Regel zufällig. Ein ⟦Gegenbeispiel⟧ wie 1/2 > 1/4 widerlegt sie.", "aufgabe": {"f": {"text": "Stimmt die Aussage? „1/9 und 4/12 sind gleich groß.“"}, "y": "auswahl", "a": ["Das kann man nicht entscheiden.", "Ja, die Aussage stimmt.", "Nein. 4/12 entsteht aus 1/9, wenn man zu Zähler und Nenner 3 addiert – das ist kein Erweitern. 1/9 = 4/36, 4/12 = 12/36."], "o": {"index": 2}, "w": "Nein. 4/12 entsteht aus 1/9, wenn man zu Zähler und Nenner 3 addiert – das ist kein Erweitern. 1/9 = 4/36, 4/12 = 12/36."}}]}, "funktionen.linear": {"titel": "Lineare Funktionen", "ort": "Neumayer-Station III", "klasse": 8, "abschnitte": [{"titel": "Steigung und Achsenabschnitt", "lernziele": ["ablesen", "zwei_punkte", "proportional"]}, {"titel": "Geraden bestimmen", "lernziele": ["aufstellen", "schnittpunkte", "lage"]}, {"titel": "Anwenden", "lernziele": ["deuten"]}], "etappen": [{"lernziel": "ablesen", "titel": "Steigung m und Achsenabschnitt t", "regel": "So liest du ab: die Gleichung in die Form ⟦y = m · x + t⟧ bringen. ⟦m⟧ ist die Zahl vor dem x (mit Vorzeichen), ⟦t⟧ die Zahl ohne x.", "schritte": ["Gegeben ist y = 5 − 2x. Zuerst umsortieren, damit das x vorne steht: y = −2x + 5.", "Die Zahl ohne x ist ⟦t = 5⟧. Die Gerade schneidet die y-Achse also bei (0 | 5).", "Die Zahl vor dem x ist ⟦m = −2⟧: Von jedem Punkt aus geht es 1 nach rechts und 2 nach unten. Die Gerade fällt.", "Genau das zeigt das gestrichelte Steigungsdreieck im Bild."], "fehler": "Bei y = 5 − 2x ist m nicht 5. Die Steigung ist die Zahl ⟦vor dem x⟧, mit Vorzeichen: m = −2. Beim Taxi wäre das, als würde man den Grundpreis für den Kilometerpreis halten.", "einstieg": "Eine Taxifahrt kostet 3 € Grundpreis und 2 € pro Kilometer. Trägt man Strecke und Preis in ein Koordinatensystem ein, liegen alle Punkte auf einer geraden Linie. Die 3 € liest man dort ab, wo die Linie die senkrechte Achse trifft; die 2 € pro km zeigen, wie steil sie ist. So eine Zuordnung heißt ⟦lineare Funktion⟧.", "woerter": [["lineare Funktion", "eine Funktion, deren Graph eine Gerade ist: y = m · x + t"], ["m (Steigung)", "so viel geht es nach oben, wenn man 1 nach rechts geht"], ["t (y-Achsenabschnitt)", "dort schneidet die Gerade die y-Achse – der Startwert"], ["Steigungsdreieck", "das kleine Dreieck „1 nach rechts, m nach oben“ im Bild"], ["(0 | 5)", "der Punkt mit x = 0 und y = 5"]], "bild": {"typ": "koordinaten"}, "zeichnung": "gerade", "aufgabe": {"f": {"text": "Gib den y-Achsenabschnitt t der Geraden y = 5x − 6 an."}, "y": "zahl", "o": {"wert": -6}, "w": "In der Form y = m · x + t: y = 5x − 6. y-Achsenabschnitt t = −6."}}, {"lernziel": "zwei_punkte", "titel": "Steigung aus zwei Punkten", "regel": "Durch zwei Punkte P(x₁ | y₁) und Q(x₂ | y₂) geht genau eine Gerade. Ihre Steigung ist ⟦m = (y₂ − y₁) : (x₂ − x₁)⟧ („Höhenunterschied durch Längenunterschied“).", "schritte": ["Gegeben sind P(1 | 3) und Q(4 | 9).", "Von P nach Q geht es nach rechts: 4 − 1 = 3.", "Dabei geht es nach oben: 9 − 3 = 6.", "Steigung = nach oben : nach rechts = 6 : 3, also ⟦m = 2⟧."], "fehler": "m = (4 − 1) : (9 − 3) = 0,5 ist falsch: Die ⟦y-Differenz⟧ gehört nach oben (in den Zähler), die x-Differenz nach unten.", "einstieg": "Ein Wanderweg steigt gleichmäßig an: Nach 3 km Weg bist du 6 m höher als am Start. Pro Kilometer sind das 6 : 3 = 2 m. Genauso berechnest du die Steigung einer Geraden aus zwei Punkten: Höhenunterschied geteilt durch den Unterschied nach rechts. Das Ergebnis ist die ⟦Steigung m⟧.", "woerter": [["P(1 | 3)", "Punkt P mit x = 1 und y = 3"], ["x₁, y₁ und x₂, y₂", "die Koordinaten des ersten und des zweiten Punkts (die kleine Zahl ist nur eine Nummer)"], ["Differenz", "Unterschied, das Ergebnis einer Minus-Rechnung"], ["m = (y₂ − y₁) : (x₂ − x₁)", "Steigung = Unterschied nach oben : Unterschied nach rechts"]], "bild": {"typ": "koordinaten"}, "aufgabe": {"f": {"text": "Berechne die Steigung der Geraden durch P(7 | −4) und Q(−4 | 7)."}, "y": "zahl", "o": {"wert": -1}, "w": "m = (7 − (−4)) : (−4 − 7) = 11 : (−11) = −1."}}, {"lernziel": "proportional", "titel": "Proportionalität: Ursprungsgerade", "regel": "So erkennst du ⟦direkte Proportionalität⟧: Die Gleichung hat die Form y = k · x, der Graph geht durch den ⟦Ursprung⟧. k berechnest du als y : x.", "schritte": ["3 kg Äpfel kosten 7,50 €.", "Preis für 1 kg: 7,50 € : 3 = 2,50 €. Das ist k.", "Die Funktion heißt also ⟦y = 2,5 · x⟧.", "Damit kosten 8 kg: 2,5 · 8 = 20 €."], "fehler": "y = 2x + 1 ist ⟦keine⟧ Proportionalität: Für x = 0 ist y = 1, die Gerade geht nicht durch den Ursprung. Verdoppelt man x, verdoppelt sich y nicht.", "einstieg": "Am Obststand kostet 1 kg Äpfel 2,50 €. Kaufst du doppelt so viel, zahlst du doppelt so viel; kaufst du nichts, zahlst du nichts. So eine Zuordnung heißt ⟦direkt proportional⟧. Ihr Graph ist eine Gerade durch den Nullpunkt.", "woerter": [["direkt proportional", "doppelt so viel → doppelt so teuer; 0 kg → 0 €"], ["k (Proportionalitätsfaktor)", "der Preis für 1 kg – allgemein: y für x = 1"], ["Ursprung O", "der Nullpunkt (0 | 0)"], ["y = 2,5 · x", "Preis y in € für x kg"]], "bild": {"typ": "koordinaten"}, "aufgabe": {"f": {"text": "6 l Saft kosten 9 €. Wie viel kosten 8 l?"}, "y": "zahl", "o": {"wert": 12, "einheit": "€"}, "w": "k = 9 : 6 = 1,50 € pro l. y = 1,5 · 8 = 12 €."}}, {"lernziel": "aufstellen", "titel": "Geradengleichung aufstellen", "regel": "Kennst du m und einen Punkt P(a | b), setzt du P in y = m · x + t ein und berechnest ⟦t = b − m · a⟧. Bei zwei Punkten berechnest du ⟦zuerst m⟧.", "schritte": ["Gegeben: m = 3 und der Punkt P(2 | 1). Gesucht ist t.", "Setze x = 2 und y = 1 in y = 3x + t ein: 1 = 3 · 2 + t, also 1 = 6 + t.", "Auf beiden Seiten 6 abziehen: t = −5.", "Die Geradengleichung lautet ⟦y = 3x − 5⟧."], "fehler": "Bei P(2 | 1) setzt man x = 2 und y = 1 ein – nicht umgekehrt. 2 = 3 · 1 + t führt zu ⟦t = −1⟧ und einer falschen Geraden.", "probe": "3 · 2 − 5 = 1 ✓", "einstieg": "Ein Wanderer kennt die Steigung seines Weges und weiß, an welcher Stelle er gerade steht. Daraus kann er berechnen, auf welcher Höhe der Weg angefangen hat. Bei Geraden ist es genauso: Aus der Steigung m und einem Punkt berechnest du den Startwert t – du ⟦stellst die Geradengleichung auf⟧.", "woerter": [["Geradengleichung", "die Gleichung y = m · x + t mit bestimmten Zahlen für m und t"], ["P(2 | 1)", "Punkt mit x = 2 und y = 1"], ["t = b − m · a", "Formel für t, wenn der Punkt P(a | b) bekannt ist"]]}, {"lernziel": "schnittpunkte", "titel": "Schnittpunkte berechnen", "regel": "Schnitt mit der ⟦x-Achse⟧: y = 0 setzen (Nullstelle). Schnitt mit der ⟦y-Achse⟧: x = 0, also (0 | t). Schnitt zweier Geraden: Im Schnittpunkt haben beide ⟦dasselbe x und dasselbe y⟧. Deshalb setzt du die Terme ⟦gleich⟧.", "schritte": ["g: y = 2x − 1 und h: y = −x + 5. Im Schnittpunkt haben beide dasselbe y.", "Deshalb die Terme gleichsetzen: 2x − 1 = −x + 5.", "Auf beiden Seiten x und 1 dazuzählen: 3x = 6, also x = 2.", "x = 2 in g einsetzen: y = 2 · 2 − 1 = 3. Der Schnittpunkt ist ⟦S(2 | 3)⟧."], "fehler": "Der Schnittpunkt mit der x-Achse von y = 2x − 1 ist nicht (0 | −1). Das ist der Schnitt mit der ⟦y-Achse⟧. Für die x-Achse gilt y = 0: x = 0,5.", "einstieg": "Zwei Freunde laufen dieselbe Strecke; einer startet früher, der andere läuft schneller. Wann holt der Schnellere den anderen ein? In diesem Moment sind beide zur selben Zeit am selben Ort. Im Koordinatensystem ist das der Punkt, an dem sich ihre Geraden treffen: der ⟦Schnittpunkt⟧.", "woerter": [["Schnittpunkt S", "der Punkt, der auf beiden Geraden liegt"], ["x-Achse / y-Achse", "die waagrechte / die senkrechte Achse im Koordinatensystem"], ["gleichsetzen", "die beiden Terme für y gleich setzen, weil y im Schnittpunkt gleich ist"]], "bild": {"typ": "koordinaten"}, "aufgabe": {"f": {"text": "Berechne die Nullstelle von y = −2x − 5 (Schnitt mit der x-Achse)."}, "y": "zahl", "o": {"wert": -2.5}, "w": "−2x − 5 = 0 → −2x = 5 → x = −2,5."}}, {"lernziel": "lage", "titel": "Parallel oder senkrecht?", "regel": "Gleiche Steigung (m₁ = m₂): Die Geraden sind ⟦parallel⟧. Ist ⟦m₁ · m₂ = −1⟧, stehen sie ⟦senkrecht⟧ aufeinander. Warum? Drehst du das Steigungsdreieck „1 nach rechts, 2 nach oben“ um 90°, wird daraus „2 nach rechts, 1 nach unten“. Die neue Steigung ist −1/2, und 2 · (−1/2) = −1.", "schritte": ["g: y = 2x + 1 hat die Steigung m₁ = 2. h: y = −0,5x + 3 hat die Steigung m₂ = −0,5.", "Die Steigungen sind verschieden, also sind g und h nicht parallel.", "Produkt der Steigungen: 2 · (−0,5) = −1.", "Das Produkt ist −1, also sind ⟦g und h senkrecht zueinander⟧."], "fehler": "y = 2x + 1 und y = −2x + 1 stehen nicht senkrecht: 2 · (−2) = −4 ≠ −1. Für senkrecht braucht man den ⟦negativen Kehrwert⟧: −1/2.", "einstieg": "Bahngleise laufen nebeneinander her und treffen sich nie – sie sind parallel. Eine Straße, die eine andere im rechten Winkel kreuzt, steht senkrecht auf ihr. Ob zwei Geraden parallel oder ⟦senkrecht⟧ sind, kannst du an ihren Steigungen ablesen, ohne zu zeichnen.", "woerter": [["parallel", "gleiche Richtung, kein gemeinsamer Punkt"], ["senkrecht", "die Geraden kreuzen sich im rechten Winkel (90°)"], ["m₁, m₂", "die Steigungen der ersten und der zweiten Geraden"], ["negativer Kehrwert", "Bruch umdrehen und Vorzeichen wechseln: von 2 ist es −1/2"]], "bild": {"typ": "koordinaten"}, "aufgabe": {"f": {"text": "Wie liegen die Geraden g: y = −4x + 3 und h: y = 4x − 4 zueinander?"}, "y": "auswahl", "a": ["senkrecht zueinander", "schneiden sich, aber nicht senkrecht", "parallel", "identisch (dieselbe Gerade)"], "o": {"index": 1}, "w": "Verschiedene Steigungen, und −4 · 4 = −16 ≠ −1."}}, {"lernziel": "deuten", "titel": "Lineare Funktionen im Sachzusammenhang", "regel": "In Anwendungen ist ⟦t der Startwert⟧ (bei x = 0) und ⟦m die Änderung pro Einheit⟧ von x. Ein negatives m heißt: Die Größe nimmt ab.", "schritte": ["Kerze: h(x) = −1,5x + 20, h in cm, x in Stunden.", "t = 20 ist der Wert bei x = 0: Anfangs ist die Kerze 20 cm hoch.", "m = −1,5 ist die Änderung pro Stunde: Die Kerze wird jede Stunde 1,5 cm kürzer.", "Abgebrannt ist sie bei h = 0: 1,5x = 20, also ⟦x ≈ 13,3 h⟧."], "fehler": "m = −1,5 heißt nicht, dass die Kerze 1,5 cm hoch ist. m ist eine ⟦Änderung⟧ pro Stunde, keine Höhe.", "einstieg": "Eine Kerze ist anfangs 20 cm hoch und wird pro Stunde 1,5 cm kürzer. In der Funktion h(x) = −1,5x + 20 steckt diese ganze Geschichte. Jede Zahl hat eine Bedeutung: Die 20 ist der Anfang, die −1,5 die Änderung pro Stunde. Diese Bedeutung herauszulesen heißt ⟦deuten⟧.", "woerter": [["h(x)", "Höhe der Kerze in cm nach x Stunden"], ["Startwert", "der Wert am Anfang, also bei x = 0 – hier t = 20"], ["Änderung pro Einheit", "um so viel ändert sich der Wert, wenn x um 1 wächst – hier m = −1,5"], ["≈", "„ungefähr gleich“ (gerundet)"]], "aufgabe": {"f": {"text": "Ein Auto fährt, der Tankinhalt sinkt: V(x) = −3x + 45 (x in Stunden Fahrt, V in Litern). Was bedeutet die Steigung −3?"}, "y": "auswahl", "a": ["Am Anfang sind 45 Liter im Tank.", "Nach 3 Stunden ist der Vorgang vorbei.", "Die Steigung hat hier keine Bedeutung.", "Pro Stunde Fahrt werden 3 Liter verbraucht."], "o": {"index": 3}, "w": "m = −3 ist die Änderung von y, wenn x um 1 wächst. Pro Stunde Fahrt werden 3 Liter verbraucht."}}]}}};
const S = { thema: 'zahlen.ganz', karte: 0, phase: 0, teil: 'erklaeren', liste: false, wort: null, falle: false, woerter: false, eingabe: '', wahl: null, ergebnis: null, wozu: false };
const $ = (s) => document.querySelector(s);
const esc = (t) => String(t ?? '').replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const thema = () => DATEN.themen[S.thema]; const karte = () => thema().etappen[S.karte];
const klasse = () => thema().klasse; const gross = () => klasse() >= 7;
// Text aufbereiten: ⟦…⟧ = Markierung (überall dieselbe Farbe), a/b = gestapelter Bruch, neue Wörter antippbar (nur erstes Vorkommen)
function text(t, { woerter = true, gesehen = new Set() } = {}) {
  let h = esc(t);
  h = h.replace(/(^|[^\d/])(\d{1,3})\/(\d{1,3})(?![\d/])/g, (m, a, z, n) => `${a}<span class="bruch" aria-label="${z} von ${n}"><span>${z}</span><span>${n}</span></span>`);
  if (woerter) for (const [w] of karte().woerter || []) {
    if (gesehen.has(w)) continue; const e = esc(w).replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
    const re = new RegExp(`(^|[^\\wäöüß])(${e}[a-zäöüß]{0,3})(?![\\wäöüß])`, 'i'); if (re.test(h) && !/[<>]/.test(w)) { h = h.replace(re, (m, a, b) => `${a}<button class="wort${S.wort === w ? ' offen' : ''}" data-wort="${esc(w)}">${b}</button>`); gesehen.add(w); }
  }
  return h.replace(/⟦/g, '<mark>').replace(/⟧/g, '</mark>');
}
const steuer = () => { $('#steuer').innerHTML = Object.entries(DATEN.themen).map(([k, t]) => `<button data-thema="${k}" class="${k === S.thema ? 'an' : ''}">Klasse ${t.klasse}: ${esc(t.titel)}</button>`).join(''); };

  o += `<rect x="${X - 12}" y="${y(10) - 10}" width="24" height="${y(-10) - y(10) + 20}" rx="12" fill="#fff" stroke="#0B3B52" stroke-width="3"/><circle cx="${X}" cy="${y(-10) + 26}" r="20" fill="#2F7FC1" stroke="#0B3B52" stroke-width="3"/>`;

function strahlRoh(von, bis, breite = 360) { const L = 20, R = breite - 20; return { x: (v) => L + (R - L) * (v - von) / (bis - von), L, R }; }

};
BILD.gerade = (p) => { // funktionen.linear/ablesen: y = −2x + 5
  const W = 360, H = 330, x0 = -1, x1 = 4, y0 = -2, y1 = 6; const X = (v) => 30 + (W - 50) * (v - x0) / (x1 - x0), Y = (v) => 14 + (H - 44) * (y1 - v) / (y1 - y0);
  let o = `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Gerade y = −2x + 5">`;
  for (let v = x0; v <= x1; v++) o += `<line x1="${X(v)}" y1="${Y(y0)}" x2="${X(v)}" y2="${Y(y1)}" class="z-duenn"/>`;
  for (let v = y0; v <= y1; v++) o += `<line x1="${X(x0)}" y1="${Y(v)}" x2="${X(x1)}" y2="${Y(v)}" class="z-duenn"/>`;
  o += `<line x1="${X(x0)}" y1="${Y(0)}" x2="${X(x1)}" y2="${Y(0)}" class="z-linie"/><line x1="${X(0)}" y1="${Y(y0)}" x2="${X(0)}" y2="${Y(y1)}" class="z-linie"/>`;
  for (const v of [1, 2, 3, 4]) o += `<text x="${X(v)}" y="${Y(0) + 24}" text-anchor="middle" class="z-text klein">${v}</text>`;
  for (const v of [-2, 2, 4, 6]) o += `<text x="${X(0) - 10}" y="${Y(v) + 6}" text-anchor="end" class="z-text klein">${v < 0 ? '−' + -v : v}</text>`;
  o += `<text x="${X(x1) - 4}" y="${Y(0) - 10}" text-anchor="end" class="z-text">x</text><text x="${X(0) + 10}" y="${Y(y1) + 14}" class="z-text">y</text>`;
  o += `<line x1="${X(-0.5)}" y1="${Y(6)}" x2="${X(3.5)}" y2="${Y(-2)}" class="z-akzent" style="stroke:#0B3B52;stroke-width:4"/>`;
  if (p >= 2) o += `<g class="neu-im-bild"><circle cx="${X(0)}" cy="${Y(5)}" r="10" class="z-akzent-f"/><rect x="${X(0) + 16}" y="${Y(5) - 18}" width="122" height="32" rx="8" class="z-marker"/><text x="${X(0) + 24}" y="${Y(5) + 5}" class="z-text">t = 5: (0 | 5)</text></g>`;
  if (p >= 3) o += `<g class="neu-im-bild"><line x1="${X(1)}" y1="${Y(3)}" x2="${X(2)}" y2="${Y(3)}" class="z-gut"/><line x1="${X(2)}" y1="${Y(3)}" x2="${X(2)}" y2="${Y(1)}" class="z-gut"/>
    <rect x="${X(2) + 8}" y="${Y(3) - 24}" width="132" height="32" rx="8" class="z-marker"/><text x="${X(2) + 16}" y="${Y(3) - 1}" class="z-text">1 nach rechts</text><rect x="${X(2) + 8}" y="${Y(1.6) - 18}" width="132" height="32" rx="8" class="z-marker"/><text x="${X(2) + 16}" y="${Y(1.6) + 5}" class="z-text">2 nach unten</text></g>`;
  return o + '</svg>';
};
BILD.bruchteil = (p) => { // bruch.brueche/bruchteil_von: 3/4 von 20 €
  let o = `<svg viewBox="0 0 360 170" role="img" aria-label="Streifen für 20 Euro in 4 Teilen">`; const L = 30, B = 300, Y = 50, H = 56;
  if (p >= 2) for (let i = 0; i < 3; i++) o += `<rect x="${L + i * B / 4}" y="${Y}" width="${B / 4}" height="${H}" class="z-marker neu-im-bild"/>`;
  o += `<rect x="${L}" y="${Y}" width="${B}" height="${H}" class="z-linie" rx="4"/>`;
  if (p >= 1) for (let i = 1; i < 4; i++) o += `<line x1="${L + i * B / 4}" y1="${Y}" x2="${L + i * B / 4}" y2="${Y + H}" class="z-linie neu-im-bild"/>`;
  if (p >= 1) for (let i = 0; i < 4; i++) o += `<text x="${L + (i + .5) * B / 4}" y="${Y + 36}" text-anchor="middle" class="z-text neu-im-bild">5 €</text>`;
  o += `<text x="${L + B / 2}" y="${Y - 16}" text-anchor="middle" class="z-text">ganzer Streifen: 20 €</text>`;
  if (p >= 2) o += `<path d="M${L} ${Y + H + 12} v10 h${B * 3 / 4} v-10" class="z-gut neu-im-bild"/><text x="${L + B * 3 / 8}" y="${Y + H + 48}" text-anchor="middle" class="z-text">3 Teile = 15 €</text>`;
  return o + '</svg>';
};
// Allgemeiner Zahlenstrahl aus dem vorhandenen Bild-Format (für Karten ohne eigene Schritt-Zeichnung)
BILD.strahl = (b) => { const { x } = strahlRoh(b.start, b.ende); const Y = 60, n = b.abschnitte || 10; let o = `<svg viewBox="0 0 360 110" role="img" aria-label="Zahlenstrahl">`;
  o += `<line x1="10" y1="${Y}" x2="350" y2="${Y}" class="z-linie"/>`;
  for (let i = 0; i <= n; i++) { const v = b.start + i * (b.ende - b.start) / n; o += `<line x1="${x(v)}" y1="${Y - 8}" x2="${x(v)}" y2="${Y + 8}" class="z-linie" style="stroke-width:2"/>`; if (i === 0 || i === n || (b.beschriftet === 'alle')) o += `<text x="${x(v)}" y="${Y + 32}" text-anchor="middle" class="z-text">${v < 0 ? '−' + -v : v}</text>`; }
  if (b.pfeil != null) { const v = b.start + b.pfeil * (b.ende - b.start) / n; o += `<path d="M${x(v)} ${Y - 14} l-8 -14 h16 z" class="z-akzent-f"/>`; }
  return o + '</svg>'; };
function bildFuer(k, phase) {
  const n = k.schritte.length; const p = Math.min(phase, n + 1);
  if (k.zeichnung) return BILD[k.zeichnung](p);
  if (k.bild?.typ === 'zahlenstrahl') return BILD.strahl(k.bild);
  return k.bild ? `<p style="font-size:16px;color:var(--leise);text-align:center;padding:20px">(Zeichnung „${esc(k.bild.typ)}“ wie in der App – im Entwurf nicht nachgebaut)</p>` : '';
}

// ---------- Ansicht ----------
function kopf() { const t = thema(); return `<header class="kopf"><button class="zurueck" aria-label="Zurück">‹</button><div><small>${esc(t.ort)} · Klasse ${t.klasse}</small><h1>${esc(t.titel)}</h1></div></header>
  <nav class="reiter" role="tablist">${[['erklaeren', 'Erklären'], ['ueben', 'Üben'], ['fehler', 'Fehler']].map(([k, n]) => `<button role="tab" aria-selected="${S.teil === k}" class="${S.teil === k ? 'an' : ''}" data-teil="${k}">${n}</button>`).join('')}</nav>`; }
function kartenwahl() {
  const t = thema(), k = karte(), n = t.etappen.length;
  let o = `<div class="kartenwahl"><button class="pfeil" data-karte="${S.karte - 1}" ${S.karte ? '' : 'disabled'} aria-label="Vorige Lernkarte">‹</button>
    <button class="mitte" data-liste aria-expanded="${S.liste}">Karte ${S.karte + 1} von ${n} · alle ▾</button>
    <button class="pfeil" data-karte="${S.karte + 1}" ${S.karte < n - 1 ? '' : 'disabled'} aria-label="Nächste Lernkarte">›</button></div>`;
  if (S.liste) o += `<div class="liste">${(t.abschnitte || [{ titel: '', lernziele: t.etappen.map((e) => e.lernziel) }]).map((a) => `${a.titel ? `<h3>${esc(a.titel)}</h3>` : ''}${a.lernziele.map((lz) => { const i = t.etappen.findIndex((e) => e.lernziel === lz); if (i < 0) return ''; return `<button data-karte="${i}" class="${i === S.karte ? 'an' : ''}"><span class="nr">${i + 1}</span>${esc(t.etappen[i].titel)}</button>`; }).join('')}`).join('')}</div>`;
  return o;
}
function erklaeren() {
  const k = karte(), n = k.schritte.length; const g = new Set(); const T = (s) => text(s, { gesehen: g });
  const bild = bildFuer(k, S.phase); const wortErkl = S.wort ? (k.woerter || []).find(([w]) => w === S.wort) : null;
  const wortBox = wortErkl ? `<span class="erklwort" role="note"><b>${esc(wortErkl[0])}</b>${text(wortErkl[1], { woerter: false })}</span>` : '';
  let rechts = '';
  const einstieg = k.einstieg_kurz || k.einstieg;
  if (S.phase === 0) {
    rechts = gross()
      ? `<p class="ueber">Kurz gesagt</p><div class="merke"><p>${T(k.regel)}</p></div>${wortBox}<div class="knoepfe"><button class="haupt" data-phase="1">Beispiel Schritt für Schritt ›</button></div>
         <div class="links"><button data-wozu aria-expanded="${S.wozu}">Wozu brauche ich das? ▸</button></div>${S.wozu && einstieg ? `<p class="situation" style="margin-top:10px">${T(einstieg)}</p>` : ''}`
      : `${einstieg ? `<p class="ueber">Worum geht’s?</p><p class="situation">${T(einstieg)}${k.einstieg_kurz ? '<span class="gekuerzt">gekürzt (Vorschlag)</span>' : ''}</p>` : `<div class="merke"><p>${T(k.regel)}</p></div>`}${wortBox}
         <div class="knoepfe"><button class="haupt" data-phase="1">Zeig mir ein Beispiel ›</button></div>`;
  } else if (S.phase <= n) {
    const i = S.phase - 1;
    rechts = `<p class="ueber">Beispiel</p>${i ? `<ol class="schritte-weg">${k.schritte.slice(0, i).map((s) => `<li><span>${text(s, { woerter: false })}</span></li>`).join('')}</ol>` : ''}
      <div class="schritt" aria-live="polite"><span class="n">Schritt ${i + 1} von ${n}</span>${T(k.schritte[i])}</div>${wortBox}
      <div class="punkte" aria-hidden="true">${k.schritte.map((_, j) => `<i class="${j <= i ? 'an' : ''}"></i>`).join('')}</div>
      <div class="knoepfe"><button class="zweit" data-phase="${S.phase - 1}" aria-label="Zurück">‹</button><button class="haupt" data-phase="${S.phase + 1}">${i === n - 1 ? 'Und was merke ich mir? ›' : 'Weiter ›'}</button></div>`;
  } else {
    rechts = `<p class="ueber">Das merkst du dir</p><div class="merke"><p>${T(k.regel)}</p></div>${k.probe ? `<p style="font-size:17px;margin:-4px 0 12px">Probe: ${text(k.probe, { woerter: false })}</p>` : ''}${wortBox}
      <div class="knoepfe"><button class="haupt" data-teil="ueben">Jetzt du: erste Aufgabe ›</button></div>
      <div class="links"><button data-phase="1">Beispiel nochmal</button><button data-falle aria-expanded="${S.falle}">Vorsicht, Falle ▸</button>${(k.woerter || []).length ? `<button data-woerter aria-expanded="${S.woerter}">Wörter (${k.woerter.length}) ▸</button>` : ''}</div>
      ${S.falle ? `<div class="falle"><b>Vorsicht:</b> ${text(k.fehler, { woerter: false })}</div>` : ''}
      ${S.woerter ? `<dl class="woerterliste">${k.woerter.map(([w, d]) => `<div><b>${esc(w)}</b> – ${text(d, { woerter: false })}</div>`).join('')}</dl>` : ''}`;
  }
  return `${kartenwahl()}<article class="karte" aria-label="Lernkarte ${S.karte + 1}"><h2>${text(k.titel, { woerter: false })}</h2><p class="status">noch nicht geübt · 2 richtig hintereinander, dann sitzt sie</p>
    <div class="raster${S.phase === 0 ? ' text-zuerst' : ''}">${bild ? `<div class="bildfeld">${bild}</div>` : ''}<div>${rechts}</div></div></article>`;
}
function ueben() {
  const k = karte(), a = k.aufgabe;
  const loes = a ? (a.y === 'auswahl' ? a.a?.[a.o.index] : a.o?.wert != null ? String(a.o.wert).replace('.', ',').replace('-', '−') : '') : '';
  return `${kartenwahl()}<div class="spick"><p><b>Merke:</b> ${text(k.regel, { woerter: false })}</p><button data-teil="erklaeren">Erklärung</button></div>
    ${a ? `<section class="aufgabe"><p class="frage">${text(a.f.text, { woerter: false })}</p>
      ${a.y === 'auswahl' ? `<div class="wahl">${a.a.map((x, i) => `<button data-wahl="${i}" class="${S.wahl === i ? 'an' : ''}">${text(x, { woerter: false })}</button>`).join('')}</div>` : `<input id="ein" inputmode="text" aria-label="Antwort" value="${esc(S.eingabe)}" placeholder="Antwort">`}
      <div class="knoepfe" style="margin-top:12px"><button class="haupt" data-pruefen>Prüfen</button></div>
      ${S.ergebnis === 'ok' ? '<div class="rm ok">Richtig!</div>' : S.ergebnis === 'nein' ? `<div class="rm nein"><b>Noch nicht.</b> Richtig ist ${text(loes, { woerter: false })}.${a.w ? `<br>${text(a.w, { woerter: false })}` : ''}</div>` : ''}</section>`
    : '<p class="karte">Für diese Karte ist im Entwurf keine Aufgabe hinterlegt.</p>'}`;
}
function fehler() {
  return `<div style="margin:0 16px">${thema().etappen.map((e, i) => `<article class="karte" style="margin:0 0 12px"><h2 style="font-size:20px">${i + 1} · ${esc(e.titel)}</h2><div class="falle"><b>Vorsicht:</b> ${text(e.fehler, { woerter: false })}</div>
    <div class="links"><button data-karte="${i}" data-teil="erklaeren">Erklärung ansehen</button></div></article>`).join('')}</div>`;
}
function zeichne() { steuer(); $('#app').innerHTML = kopf() + ({ erklaeren, ueben, fehler }[S.teil])(); }
document.addEventListener('click', (e) => {
  const t = e.target.closest('button'); if (!t) return; const d = t.dataset;
  if (d.thema) { Object.assign(S, { thema: d.thema, karte: DATEN.themen[d.thema].start || 0, phase: 0, teil: 'erklaeren', liste: false, wort: null, falle: false, woerter: false, wozu: false, eingabe: '', wahl: null, ergebnis: null }); }
  if (d.karte != null) { const n = Number(d.karte); if (n >= 0 && n < thema().etappen.length) Object.assign(S, { karte: n, phase: 0, liste: false, wort: null, falle: false, woerter: false, eingabe: '', wahl: null, ergebnis: null }); }
  if (d.teil) { S.teil = d.teil; if (d.teil === 'erklaeren' && d.karte == null && S.phase === 0) S.phase = 0; }
  if (d.phase != null) { S.phase = Math.max(0, Number(d.phase)); S.wort = null; }
  if (d.liste != null) S.liste = !S.liste;
  if (d.wort) S.wort = S.wort === d.wort ? null : d.wort;
  if (d.falle != null) S.falle = !S.falle;
  if (d.woerter != null) S.woerter = !S.woerter;
  if (d.wozu != null) S.wozu = !S.wozu;
  if (d.wahl != null) { S.wahl = Number(d.wahl); S.ergebnis = null; }
  if (d.pruefen != null) { const a = karte().aufgabe; S.eingabe = $('#ein')?.value ?? S.eingabe;
    if (a.y === 'auswahl') S.ergebnis = S.wahl === a.o.index ? 'ok' : 'nein';
    else { const v = Number(S.eingabe.replace('−', '-').replace(',', '.').replace(/\s/g, '')); S.ergebnis = S.eingabe.trim() && v === Number(a.o.wert) ? 'ok' : 'nein'; } }
  zeichne(); if (d.karte != null || d.thema || d.teil) scrollTo(0, 0);
});
document.addEventListener('keydown', (e) => { if (S.teil !== 'erklaeren' || e.target.matches('input')) return; const n = karte().schritte.length;
  if (e.key === 'ArrowRight' || e.key === ' ') { e.preventDefault(); S.phase = Math.min(n + 1, S.phase + 1); zeichne(); }
  if (e.key === 'ArrowLeft') { S.phase = Math.max(0, S.phase - 1); zeichne(); } });
window.ENTWURF = { S, zeichne, setze(o) { Object.assign(S, o); zeichne(); scrollTo(0, 0); } };
zeichne();
</script>
