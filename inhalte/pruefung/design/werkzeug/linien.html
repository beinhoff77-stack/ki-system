<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Entwurf „Liniennetz“ – Mathe-Lernreise</title>
<!-- Gestaltungsentwurf (Prüfrunde Gestaltung), kein App-Code. Eine Datei, keine fremden Abhängigkeiten.
     Schrift: Lexend (SIL OFL 1.1), eingebettet. Karte: Natural Earth (gemeinfrei). -->
<style>
@font-face { font-family: "Lexend"; src: url(/*SCHRIFT:lexend*/) format("woff2"); font-weight: 100 900; }
:root {
  --bg: #FFFFFF; --flaeche: #F3F4F1; --flaeche2: #E8EAE5; --text: #101418; --leise: #4D5560; --rand: #D5D9DE;
  --knopf: #101418; --auf-knopf: #FFFFFF; --hier: #FFC400; --gut: #1B7A3E; --gut-bg: #E2F3E8; --stoer: #FFD400; --stoer-text: #101418; --kurs: #A3360B; --kurs-bg: #FDECE2;
  --L-zahlen: #C2410C; --L-algebra: #2E7D32; --L-geld: #1565C0; --L-funktionen: #7B3FA0; --L-geometrie: #AD1457; --L-daten: #00796B;
  --font: "Lexend", system-ui, sans-serif; color-scheme: light;
}
html.dunkel {
  --bg: #0E1114; --flaeche: #171B20; --flaeche2: #20262D; --text: #F1F3F5; --leise: #AEB6C0; --rand: #333B45;
  --knopf: #F1F3F5; --auf-knopf: #0E1114; --hier: #FFC400; --gut: #6BD78F; --gut-bg: #12301E; --kurs: #FF9F78; --kurs-bg: #34201A;
  --L-zahlen: #FF8A4C; --L-algebra: #6BD46F; --L-geld: #6AB0FF; --L-funktionen: #C792EA; --L-geometrie: #FF7EB0; --L-daten: #4DD0C2; color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { margin: 0; }
body { background: var(--bg); color: var(--text); font: 400 18px/1.45 var(--font); -webkit-font-smoothing: antialiased; font-variant-numeric: tabular-nums; }
button { font: inherit; color: inherit; cursor: pointer; }
:focus-visible { outline: 3px solid var(--hier); outline-offset: 2px; }
#app { max-width: 1180px; margin: 0 auto; min-height: 100dvh; display: flex; flex-direction: column; }
/* Kopf: wer, Netz, Pass */
.kopf { display: flex; align-items: center; gap: 8px; padding: 12px 14px; }
.kopf .wer { display: inline-flex; align-items: center; gap: 10px; min-height: 48px; border: 0; background: none; font-weight: 600; padding: 0 4px; }
.kopf .wer i { width: 36px; height: 36px; border-radius: 50%; border: 5px solid var(--L-zahlen); background: var(--bg); display: block; }
.kopf .rechts { margin-left: auto; display: flex; gap: 6px; }
.kopf .rechts button { min-height: 48px; min-width: 48px; padding: 0 14px; border-radius: 99px; border: 2px solid var(--rand); background: var(--bg); font-weight: 600; font-size: 16px; }
.kopf .rechts button.an { background: var(--text); color: var(--bg); border-color: var(--text); }
.menue { position: absolute; top: 64px; left: 12px; z-index: 30; background: var(--bg); border: 2px solid var(--text); border-radius: 12px; padding: 6px; min-width: 250px; }
.menue button { display: block; width: 100%; text-align: left; border: 0; background: none; min-height: 48px; padding: 0 12px; border-radius: 8px; }
.menue button:hover { background: var(--flaeche); }
/* Haltestellenschild */
.schild { margin: 4px 14px 0; border-radius: 14px; overflow: hidden; background: #101418; color: #FFFFFF; }
html.dunkel .schild { border: 2px solid var(--rand); }
.schild .band { height: 10px; background: var(--L, var(--L-zahlen)); }
.schild .inhalt { display: flex; align-items: center; gap: 14px; padding: 14px 16px 16px; }
.pille { display: inline-grid; place-items: center; min-width: 52px; height: 36px; padding: 0 10px; border-radius: 8px; background: var(--L, var(--L-zahlen)); color: #fff; font-weight: 700; font-size: 18px; flex: none; }
html.dunkel .pille { color: #0E1114; }
.schild h1 { margin: 0; font-size: 34px; line-height: 1.05; font-weight: 700; letter-spacing: -.02em; }
.schild p { margin: 2px 0 0; font-size: 17px; opacity: .9; }
html[data-alter="gross"] .schild h1 { font-size: 28px; }
/* Linienband: Lernkarten als Haltestellen */
.linie { position: relative; margin: 22px 14px 6px; padding: 0 6px; max-width: 440px; }
.linie svg { width: 100%; height: auto; display: block; overflow: visible; }
.lb-strecke { stroke: var(--L, var(--L-zahlen)); stroke-width: 10; stroke-linecap: round; }
.lb-strecke.offen { stroke: var(--rand); }
.lb-halt { fill: var(--bg); stroke: var(--text); stroke-width: 5; }
.lb-halt.ok { fill: var(--L, var(--L-zahlen)); stroke: var(--L, var(--L-zahlen)); }
.lb-hier { fill: none; stroke: var(--hier); stroke-width: 6; }
.lb-name { font: 600 17px var(--font); fill: var(--text); text-anchor: middle; }
.lb-name.leise { fill: var(--leise); font-weight: 400; }
.lb-ende { fill: var(--bg); stroke: var(--text); stroke-width: 4; }
.lb-ziel { font: 700 16px var(--font); fill: var(--text); }
.haltknoepfe { max-width: 440px; display: grid; grid-template-columns: repeat(var(--n), 1fr); margin: -84px 14px 0; position: relative; }
.haltknoepfe button { min-height: 84px !important; }
.haltknoepfe button { min-height: 64px; border: 0; background: transparent; border-radius: 12px; }
.haltknoepfe button:focus-visible { outline-offset: -3px; }
/* Hauptknopf */
.haupt { display: flex; align-items: center; justify-content: space-between; gap: 10px; min-height: 64px; border: 0; border-radius: 14px; background: var(--knopf); color: var(--auf-knopf); font: 600 21px var(--font); padding: 0 20px; margin: 14px; }
.haupt .pille { height: 32px; min-width: 44px; font-size: 16px; }
.haupt:active { transform: scale(.99); }
.textknopf { border: 0; background: none; min-height: 44px; padding: 0 10px; font: 500 17px var(--font); color: var(--text); text-decoration: underline; text-underline-offset: 4px; }
.hinweistext { margin: 0 18px; color: var(--leise); font-size: 16px; }
/* Netzplan */
.netz { margin: 10px 14px; border-radius: 14px; background: var(--flaeche); padding: 8px; overflow-x: auto; overscroll-behavior-x: contain; position: relative; }
.netz svg { width: 600px; max-width: none; height: auto; display: block; }
.n-strecke { fill: none; stroke-width: 9; stroke-linecap: round; stroke-linejoin: round; }
.n-strecke.blass { opacity: .28; }
.n-halt { fill: var(--bg); stroke: var(--text); stroke-width: 4; }
.n-halt.geschafft { fill: var(--text); }
.n-name { font: 600 16px var(--font); fill: var(--text); }
.n-name.leise { fill: var(--leise); font-weight: 400; }
.n-hier { fill: none; stroke: var(--hier); stroke-width: 6; }
.n-pille { font: 700 16px var(--font); fill: #fff; }
html.dunkel .n-pille { fill: #0E1114; }
.netz-legende { display: flex; flex-wrap: wrap; gap: 8px; margin: 10px 14px; }
.netz-legende span { display: inline-flex; align-items: center; gap: 8px; font-size: 16px; padding: 6px 12px 6px 6px; border-radius: 99px; background: var(--flaeche); }
.netz-legende b { display: inline-grid; place-items: center; min-width: 38px; height: 28px; border-radius: 6px; color: #fff; font-size: 16px; }
html.dunkel .netz-legende b { color: #0E1114; }
.weiterlinie { display: flex; align-items: center; gap: 12px; width: calc(100% - 28px); margin: 18px 14px; min-height: 64px; padding: 10px 14px; border-radius: 14px; border: 2px solid var(--rand); background: var(--bg); text-align: left; font-weight: 600; }
.weiterlinie small { display: block; font-weight: 400; color: var(--leise); font-size: 16px; } .weiterlinie span:last-child { margin-left: auto; }
.haltinfo { margin: 0 14px 14px; padding: 14px 16px; border-radius: 14px; border: 2px solid var(--text); }
.haltinfo h2 { margin: 0 0 4px; font-size: 22px; }
/* Thema: Mini-Linie Verstehen → Üben → Fallen */
.mini { display: grid; grid-template-columns: 1fr 1fr 1fr; margin: 14px 14px 0; position: relative; }
.mini::before { content: ""; position: absolute; left: 16.6%; right: 16.6%; top: 21px; height: 8px; border-radius: 4px; background: var(--L, var(--L-zahlen)); }
.mini button { position: relative; display: flex; flex-direction: column; align-items: center; gap: 4px; border: 0; background: none; min-height: 72px; font-size: 16px; font-weight: 600; color: var(--leise); padding: 0; }
.mini button i { width: 30px; height: 30px; border-radius: 50%; border: 5px solid var(--text); background: var(--bg); display: block; margin-top: 10px; }
.mini button.an { color: var(--text); } .mini button.an i { box-shadow: 0 0 0 6px var(--hier); }
.flaeche { padding: 6px 14px 14px; flex: 1; display: flex; flex-direction: column; }
.zwei { display: block; }
/* Verstehen: Halt für Halt nach unten */
.halte { position: relative; margin: 8px 0 0 6px; padding-left: 34px; }
.halte::before { content: ""; position: absolute; left: 11px; top: 14px; bottom: 30px; width: 6px; border-radius: 3px; background: var(--L, var(--L-zahlen)); }
.halt { position: relative; padding: 4px 0 14px; }
.halt::before { content: ""; position: absolute; left: -32px; top: 6px; width: 20px; height: 20px; border-radius: 50%; background: var(--bg); border: 4px solid var(--text); }
.halt.vorbei { color: var(--leise); font-size: 17px; padding-bottom: 8px; }
.halt.vorbei::before { background: var(--L, var(--L-zahlen)); border-color: var(--L, var(--L-zahlen)); }
.halt.jetzt::before { box-shadow: 0 0 0 5px var(--hier); }
.halt.jetzt p { font-size: 22px; font-weight: 600; margin: 0 0 10px; }
.halt .bild { display: grid; place-items: center; background: var(--flaeche); border-radius: 14px; padding: 14px 8px; margin-bottom: 12px; }
.halt.kommt { color: var(--leise); }
.halt.kommt::before { border-color: var(--rand); }
.regel { margin: 4px 0 12px; padding: 12px 14px; border-radius: 12px; background: var(--flaeche); font-weight: 600; }
/* Zeichnungen */
.k-tafel { border-collapse: collapse; font: 700 30px var(--font); }
.k-tafel th { font-size: 16px; font-weight: 600; color: var(--leise); padding: 4px; }
.k-tafel td { width: 50px; height: 56px; text-align: center; border: 3px solid var(--text); background: var(--bg); }
.k-tafel .an { background: var(--hier); color: #101418; } .k-tafel th.an { background: none; color: var(--text); }
.k-tafel-notiz, .k-tafel-wert { font: 700 26px var(--font); text-align: center; margin: 8px 0 0; }
.k-strahl { width: 100%; max-width: 460px; overflow: visible; display: block; margin: 0 auto; }
.k-achse, .k-strich { stroke: var(--text); stroke-width: 3.5; stroke-linecap: round; } .k-spitze { fill: var(--text); }
.k-wert, .k-zaehl { font: 600 17px var(--font); fill: var(--text); text-anchor: middle; } .k-zaehl { fill: var(--L-zahlen); }
.k-marker { fill: var(--hier); stroke: var(--text); stroke-width: 3; } .k-loesung { fill: none; stroke: var(--gut); stroke-width: 4; }
.k-griff-ring { fill: var(--hier); stroke: var(--text); stroke-width: 3; } .k-griff-kern { fill: #101418; } .k-griff-start { opacity: .45; }
.ziehbar { touch-action: none; cursor: grab; }
.k-koord { width: 100%; max-width: 280px; } .k-gitter { stroke: var(--rand); stroke-width: 1.2; } .k-gerade { stroke: var(--L-funktionen); stroke-width: 5; }
.k-dreieck { stroke: var(--hier); stroke-width: 5; stroke-linecap: round; }
/* Üben: Stellen-Schloss – Spalte antippen, Ziffer wählen */
.aufgabe { font-size: 24px; line-height: 1.3; font-weight: 600; margin: 4px 0 12px; letter-spacing: -.01em; }
.schloss { display: flex; justify-content: center; gap: 6px; margin: 4px 0 6px; }
.schloss button { width: 52px; border: 0; background: none; padding: 0; display: flex; flex-direction: column; align-items: center; gap: 4px; }
.schloss small { font-size: 16px; font-weight: 600; color: var(--leise); }
.schloss span { width: 52px; height: 66px; border-radius: 12px; border: 3px solid var(--rand); display: grid; place-items: center; font: 700 34px var(--font); background: var(--bg); }
.schloss .an span { border-color: var(--text); box-shadow: 0 0 0 4px var(--hier); }
.schloss .an small { color: var(--text); }
.schloss .null span { color: var(--leise); }
.schloss .alt span { color: var(--leise); border-style: dashed; }
.schloss .soll span { border-color: var(--gut); color: var(--gut); }
.anzeige { font: 700 44px var(--font); text-align: center; min-height: 66px; margin: 4px 0; letter-spacing: .02em; }
.anzeige.leer { color: var(--leise); }
.hilfe-zeile { text-align: center; font-size: 16px; color: var(--leise); margin: 0 0 6px; min-height: 24px; }
.ziffern { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 6px; margin-top: auto; }
.ziffern.zwoelf { grid-template-columns: repeat(3, minmax(0, 1fr)); }
.ziffern button { min-height: 56px; border-radius: 12px; border: 2px solid var(--rand); background: var(--bg); font: 600 26px var(--font); }
.ziffern button:active { background: var(--flaeche2); }
.aktionen { display: grid; grid-template-columns: 1fr 2fr; gap: 6px; margin-top: 6px; }
.aktionen button { min-height: 60px; border-radius: 12px; border: 2px solid var(--rand); background: var(--bg); font: 600 20px var(--font); }
.aktionen .pruef { background: var(--knopf); color: var(--auf-knopf); border-color: var(--knopf); }
.serie { display: flex; align-items: center; justify-content: center; gap: 8px; font-size: 16px; color: var(--leise); margin: 2px 0 8px; }
.serie svg { width: 92px; height: 24px; }
.tippzeile { padding: 10px 14px; border-radius: 12px; background: var(--flaeche); margin: 0 0 10px; }
/* Rückmeldung */
.rm { border-radius: 14px; padding: 14px 16px; margin: 8px 0; }
.rm.gut { background: var(--gut-bg); color: var(--gut); font-weight: 600; font-size: 20px; display: flex; align-items: center; gap: 12px; }
.rm.gut .tick { width: 44px; height: 44px; border-radius: 50%; background: var(--gut); color: var(--bg); display: grid; place-items: center; font-size: 24px; flex: none; animation: pop .4s cubic-bezier(.3,1.7,.5,1); }
.rm.kurs { background: var(--kurs-bg); }
.rm.kurs h3 { margin: 0 0 6px; font-size: 20px; color: var(--kurs); }
.rm.kurs p { margin: 6px 0 0; }
.umstieg { display: flex; align-items: center; justify-content: center; gap: 8px; margin: 10px 0 2px; font-weight: 600; }
.umstieg span { padding: 6px 12px; border-radius: 8px; border: 3px solid; } .umstieg .von { border-color: var(--leise); color: var(--leise); text-decoration: line-through; } .umstieg .nach { border-color: var(--gut); color: var(--gut); }
@keyframes pop { from { transform: scale(.3); } }
.zeichne { stroke-dasharray: 400; animation: zeichnen .8s ease-out both; } @keyframes zeichnen { from { stroke-dashoffset: 400; } to { stroke-dashoffset: 0; } }
/* Haltestelle erreicht */
.erreicht { flex: 1; display: flex; flex-direction: column; justify-content: center; text-align: center; gap: 4px; }
.erreicht .schild { margin: 10px 0 14px; text-align: left; }
.erreicht h2 { font-size: 26px; margin: 0; }
/* Störung = typische Fallen */
.stoerung { border-radius: 14px; overflow: hidden; border: 3px solid var(--text); }
.stoerung .kopfband { background: repeating-linear-gradient(-45deg, var(--stoer) 0 18px, #101418 18px 36px); height: 18px; }
.stoerung .inhalt { padding: 14px 16px; }
.stoerung h2 { margin: 0 0 10px; font-size: 22px; }
.vgl { display: grid; gap: 8px; }
.vgl div { padding: 12px 14px; border-radius: 10px; } .vgl .nein { background: var(--kurs-bg); } .vgl .ja { background: var(--gut-bg); }
.vgl b { display: block; font-size: 16px; } .vgl .nein b { color: var(--kurs); } .vgl .ja b { color: var(--gut); }
/* Pass / Netzkarte */
.netzkarte { margin: 10px 14px; border-radius: 16px; border: 3px solid var(--text); overflow: hidden; }
.netzkarte .oben { background: var(--text); color: var(--bg); padding: 12px 16px; display: flex; justify-content: space-between; font-weight: 600; }
.lochreihe { display: flex; flex-wrap: wrap; gap: 10px; padding: 14px 16px; }
.loch { display: flex; align-items: center; gap: 8px; padding: 6px 12px 6px 6px; border-radius: 99px; background: var(--flaeche); font-size: 16px; }
.loch i { width: 26px; height: 26px; border-radius: 50%; border: 3px dashed var(--rand); display: block; } .loch.ok i { background: var(--bg); border: 6px solid var(--text); }
.abzeichen { display: flex; flex-wrap: wrap; gap: 10px; padding: 0 16px 16px; }
.abzeichen span { display: inline-flex; align-items: center; gap: 8px; padding: 8px 14px 8px 8px; border-radius: 12px; border: 2px solid var(--text); font-weight: 600; }
.abzeichen b { display: inline-grid; place-items: center; width: 34px; height: 34px; border-radius: 50%; color: #fff; }
html.dunkel .abzeichen b { color: #0E1114; }
.einloesen { margin: 0 14px; }
.einloesen div { display: flex; align-items: center; gap: 12px; padding: 12px 0; border-bottom: 2px solid var(--rand); }
.einloesen small { display: block; color: var(--leise); font-size: 16px; }
.einloesen button { margin-left: auto; min-height: 48px; padding: 0 16px; border-radius: 12px; border: 0; background: var(--knopf); color: var(--auf-knopf); font-weight: 600; }
.einloesen button[disabled] { background: var(--flaeche); color: var(--leise); }
/* Leitstelle (Erwachsene) */
.leit { padding: 6px 14px 30px; }
.leit h1 { font-size: 28px; margin: 6px 0 10px; letter-spacing: -.02em; }
.wartet { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; padding: 12px 16px; border-radius: 12px; background: var(--flaeche); border-left: 8px solid var(--hier); margin-bottom: 14px; }
.wartet .kn { margin-left: auto; display: flex; gap: 8px; }
.wartet button { min-height: 48px; padding: 0 16px; border-radius: 10px; border: 2px solid var(--text); background: var(--bg); font-weight: 600; }
.wartet button.ja { background: var(--knopf); color: var(--auf-knopf); }
.leit-kinder { display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: 14px; }
.leit-kind { border: 2px solid var(--rand); border-radius: 14px; padding: 14px 16px; }
.leit-kind h2 { margin: 0; font-size: 22px; }
.leit-kind .unter { color: var(--leise); font-size: 16px; margin: 0 0 6px; }
.lk-linie svg { width: 100%; height: auto; display: block; }
.lk-namen { display: grid; gap: 2px; font-size: 17px; margin-top: 4px; }
.lk-namen span { display: flex; justify-content: space-between; gap: 10px; padding: 6px 0; border-bottom: 1px solid var(--rand); font-weight: 600; }
.lk-namen small { font-size: 16px; font-weight: 400; color: var(--leise); text-align: right; }
.lk-namen .wackelt small { color: var(--kurs); font-weight: 600; }
.lk-z { display: flex; gap: 22px; margin: 6px 0; font-size: 16px; color: var(--leise); } .lk-z b { display: block; font-size: 26px; color: var(--text); }
.st-sitzt { fill: var(--text); } .st-ueben { fill: var(--bg); } .st-offen { fill: var(--bg); } .st-wackelt { fill: var(--kurs); }
.lk-wackelt { padding: 10px 12px; border-radius: 10px; background: var(--kurs-bg); font-size: 17px; margin-top: 6px; }
.lk-wackelt b { color: var(--kurs); }
.lk-tage { display: grid; grid-template-columns: repeat(28, 1fr); gap: 2px; margin-top: 10px; } .lk-tage i { height: 18px; border-radius: 2px; background: var(--flaeche2); } .lk-tage i.an { background: var(--text); }
.legende { display: flex; flex-wrap: wrap; gap: 14px; font-size: 16px; color: var(--leise); margin-top: 12px; }
.tasten-hinweis { display: none; text-align: center; font-size: 16px; color: var(--leise); margin: 8px 0 0; }
@media (min-width: 820px) {
  .zwei .ziffern { margin-top: 12px; }
  .zwei { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 24px; }
  .flaeche { padding: 10px 24px 24px; }
  .mini { margin: 14px 24px 0; }
  .schild, .linie, .netz { margin-left: 24px; margin-right: 24px; }
  .haupt { margin: 14px 24px; max-width: 520px; }
  .tasten-hinweis { display: block; }
  .heute-raster { display: grid; grid-template-columns: minmax(0, 1.05fr) minmax(0, 1fr); gap: 0; align-items: start; }
}
@media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
</style>
</head>
<body>
<div id="app"></div>
<script>
/*KERN*/
// ---------- Richtung „Liniennetz“ ----------
const $ = (s) => document.querySelector(s);
const breit = () => innerWidth >= 820;
const LKURZ = { zahlen: 'Z', algebra: 'A', geld: 'G', funktionen: 'F', geometrie: 'Ge', daten: 'D' };
const linienFarbe = (g) => `var(--L-${g})`;
// Schematischer Netzplan (Raster 0–100 × 0–64, nur 0°/45°/90°): Orte als Haltestellen, Gebiete als Linien
const NETZ = {
  pos: { lissabon: [8, 14], rom: [26, 14], athen: [42, 14], pisa: [56, 14], newyork: [74, 14], samarkand: [90, 30], kairo: [74, 46], kapstadt: [56, 46], lima: [40, 46], sydney: [42, 28] },
  oben: ['athen'],
  linien: [
    { g: 'zahlen', weg: ['lissabon', 'rom', 'athen', 'pisa'] }, { g: 'geld', weg: ['pisa', 'newyork'] }, { g: 'algebra', weg: ['newyork', 'samarkand'] },

  const band = (l) => { const n = l.karten.length, W = 360, x = (i) => 20 + (W - 40) * i / (n - 1);
    return `<svg viewBox="0 0 ${W} 44" role="img" aria-label="${l.karten.map((c) => c.titel + ': ' + c.zustand).join(', ')}"><line x1="20" y1="22" x2="${W - 20}" y2="22" stroke="var(--rand)" stroke-width="8" stroke-linecap="round"/>
      ${l.karten.map((c, i) => `<circle cx="${x(i)}" cy="22" r="12" class="st-${c.zustand}" stroke="${c.zustand === 'wackelt' ? 'var(--kurs)' : 'var(--text)'}" stroke-width="4"/>${c.zustand === 'ueben' ? `<path d="M${x(i)} 10 a12 12 0 0 1 0 24 z" fill="var(--text)"/>` : ''}${c.zustand === 'wackelt' ? `<text x="${x(i)}" y="28" text-anchor="middle" style="font:700 16px var(--font);fill:var(--bg)">!</text>` : ''}
        `).join('')}</svg><div class="lk-namen" style="--n:${n}">${l.karten.map((c) => `<span class="${c.zustand}">${{ sitzt: '●', wackelt: '!', ueben: '◐', offen: '○' }[c.zustand]} ${esc(c.titel)}<small>${c.ort} · ${{ sitzt: 'sitzt', wackelt: 'wackelt', ueben: 'übt', offen: 'offen' }[c.zustand]}</small></span>`).join('')}</div>`; };
  return `${kopf()}<main class="leit"><h1>Leitstelle · Lernstand</h1>
    ${w ? `<div class="wartet"><span><b>Wartet auf dich:</b> Ida möchte „${w.titel}“ (${w.kosten})</span><span class="kn">${S.offen === 'ok' ? '<b>Bestätigt ✓</b>' : '<button class="ja" data-akt="zeigen" data-arg="ok">Bestätigen</button><button>Ablehnen</button>'}</span></div>` : ''}
    <div class="leit-kinder">${Object.values(DATEN.kinder).map((c) => { const l = DATEN.lernstand[c.id]; const o = ortVon(c.ort); const wa = l.karten.find((x) => x.zustand === 'wackelt');
      return `<article class="leit-kind"><h2>${esc(c.name)}</h2><p class="unter">Klasse ${c.klasse} · jetzt ${o.stadt}, ${esc(o.thema)}</p>
        <div class="lk-z"><span><b>${l.woche.aufgaben}</b>Aufgaben (7 Tage)</span><span><b>${Math.round(100 * l.woche.richtig / l.woche.aufgaben)} %</b>richtig</span><span><b>${l.woche.tipp}</b>mit Tipp</span></div>
        <div class="lk-linie">${band(l)}</div>${wa ? `<div class="lk-wackelt"><b>Wackelt: ${esc(wa.titel)}</b> (${wa.ort}) – ${wa.falsch} falsch, ${wa.richtig} richtig. Typisch: ${esc(wa.beispiel)}</div>` : ''}
        <div class="lk-tage" aria-label="${l.tage.filter(Boolean).length} Lerntage in 4 Wochen">${l.tage.map((t) => `<i class="${t ? 'an' : ''}"></i>`).join('')}</div><p class="unter" style="margin:4px 0 0">Lerntage, 4 Wochen – ohne Wertung</p></article>`; }).join('')}</div>
    <div class="legende"><span>● sitzt</span><span>◐ übt</span><span>○ offen</span><span style="color:var(--kurs)">! wackelt (≥ 3 falsch, mehr falsch als richtig)</span></div></main>`;
}
function zeichne() { $('#app').innerHTML = ({ heute, thema, welt, pass, eltern }[S.ansicht] || heute)();
  const nz = document.querySelector('.netz'); if (nz && nz.scrollWidth > nz.clientWidth) { const id = S.ansicht === 'welt' && S.offen && NETZ.pos[S.offen] ? S.offen : kind().ort; nz.scrollLeft = Math.max(0, NETZ.pos[id][0] * 6 - nz.clientWidth / 2); } }
TASTEN.ArrowLeft = () => { const a = S.ansicht === 'thema' && S.teil === 'ueben' && aufgabeJetzt(); if (a && schlossModus(a) && !S.ergebnis) { S.saeule = Math.max(0, (S.saeule ?? S.ziffern.length) - 1); neu(); } };
TASTEN.ArrowRight = () => { const a = S.ansicht === 'thema' && S.teil === 'ueben' && aufgabeJetzt(); if (a && schlossModus(a) && !S.ergebnis) { S.saeule = Math.min(S.ziffern.length - 1, (S.saeule ?? -1) + 1); neu(); } };
TASTEN[' '] = (e) => { if (S.ansicht === 'thema' && S.teil === 'erklaeren') { e.preventDefault(); S.schritt < karteJetzt().schritte.length - 1 ? A.schritt(1) : A.teil('ueben'); } };
TASTEN.Escape = () => A.geh('heute'); TASTEN.n = () => A.geh('welt');
TASTEN.Enter = () => { if (S.ansicht === 'heute') A.halt(Math.max(0, karten().findIndex((_, i) => !sitztKarte(i)))); };
// Ziffern im Schloss-Modus über die Spalten-Logik statt Anhängen
document.addEventListener('keydown', (e) => { const a = S.ansicht === 'thema' && S.teil === 'ueben' && aufgabeJetzt(); if (a && schlossModus(a) && !S.ergebnis) { if (/^[0-9]$/.test(e.key)) { e.stopImmediatePropagation(); A.ziffer(e.key); } else if (e.key === 'Backspace') { e.stopImmediatePropagation(); A.loeschen(); } } }, true);
WISCH.links = () => { if (S.ansicht === 'thema' && !S.ergebnis) { const i = TEILE.indexOf(S.teil); if (i < 2) A.teil(TEILE[i + 1]); } };
WISCH.rechts = () => { if (S.ansicht === 'thema' && !S.ergebnis) { const i = TEILE.indexOf(S.teil); if (i > 0) A.teil(TEILE[i - 1]); } };
addEventListener('resize', () => neu());
</script>
