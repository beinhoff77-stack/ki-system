* { box-sizing: border-box; margin: 0; }
:root { --grotesk: "Space Grotesk", system-ui, sans-serif; --mono: "JetBrains Mono", ui-monospace, monospace; --akzent: #FFD23F; }
body[data-g="nacht"] { color-scheme: dark; --bg: #0B0F14; --flaeche: #151B24; --flaeche2: #1D2530; --text: #F2F4F7; --leise: #A9B3C1; --linie: #2E3947; --taste: #232C39;
  --ok-bg: #12261B; --ok-rand: #4FBF7B; --ok-text: #A6E9C0; --nah-bg: #2A2414; --nah-rand: #E0B63A; --nah-text: #FFE08A; --aktiv: #7CB7FF;
  --z-papier: #10161E; --z-karo: #243140; --z-tinte: #F2F4F7; --z-leise: #9AA6B5; --z-gelb: #FFD23F; --z-gelb-fl: #6B5714; --z-blau: #7CB7FF; --z-blau-fl: #1B3A5F; --z-rot: #FF8A8A; --marke: #FFD23F; }
body[data-g="hell"] { color-scheme: light; --bg: #F3F1EA; --flaeche: #FFFFFF; --flaeche2: #F6F4EE; --text: #11161D; --leise: #4A5563; --linie: #C9C4B6; --taste: #E7E3D8;
  --ok-bg: #E4F3E9; --ok-rand: #1E7A46; --ok-text: #14522F; --nah-bg: #FFF3CF; --nah-rand: #9A7400; --nah-text: #5A4300; --aktiv: #1F5FBF;
  --z-papier: #FFFEFA; --z-karo: #C7D8E8; --z-tinte: #11161D; --z-leise: #5B6675; --z-gelb: #FFD23F; --z-gelb-fl: #FFE88A; --z-blau: #1F5FBF; --z-blau-fl: #D9E8FB; --z-rot: #B3261E; --marke: #FFD23F; }
html, body { height: 100%; } body { background: var(--bg); color: var(--text); font-family: var(--grotesk); font-size: 17px; line-height: 1.4; overflow: hidden; }
button { font: inherit; color: inherit; border: 0; background: none; cursor: pointer; -webkit-tap-highlight-color: transparent; }
#app { height: 100dvh; max-width: 480px; margin: 0 auto; display: flex; flex-direction: column; position: relative; overflow: hidden; }
/* Kopf: eine Zeile, 48 px */
.kopf { height: 48px; flex: none; display: flex; align-items: center; gap: 4px; padding: 0 4px; }
.kopf .rund { width: 48px; height: 48px; display: grid; place-items: center; font-size: 22px; color: var(--leise); flex: none; } .kopf .rund span { width: 34px; height: 34px; border-radius: 50%; display: grid; place-items: center; border: 1.5px solid var(--linie); font-size: 17px; font-weight: 700; }
.leiste { flex: 1; display: flex; gap: 5px; } .leiste i { flex: 1; height: 8px; border-radius: 4px; background: var(--linie); } .leiste i.fertig { background: var(--akzent); } .leiste i.jetzt { background: var(--akzent); box-shadow: 0 0 0 2px var(--bg), 0 0 0 3.5px var(--text); }
.kontext { flex: none; font-size: 14px; color: var(--leise); padding: 0 16px 6px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.mitte { flex: 1; min-height: 0; overflow-y: auto; padding: 4px 16px 10px; display: flex; flex-direction: column; gap: 10px; }
.aufgabe { background: var(--flaeche); border: 1.5px solid var(--linie); border-radius: 16px; padding: 12px 14px; font-size: 19px; font-weight: 600; line-height: 1.36; max-height: 5.6em; overflow-y: auto; flex: none; }
.aufgabe .rechnung { font-family: var(--mono); font-size: 24px; font-weight: 700; display: block; margin-top: 2px; }
/* Antwortfelder */
.felder { display: grid; gap: 8px; flex: none; } .felder.n1 { grid-template-columns: 1fr; } .felder.n2 { grid-template-columns: 1fr 1fr; } .felder.n3, .felder.n5, .felder.n6 { grid-template-columns: repeat(3, 1fr); } .felder.n4 { grid-template-columns: 1fr 1fr; }
.feld { height: 56px; border-radius: 14px; border: 2px solid var(--linie); background: var(--flaeche); display: flex; align-items: center; justify-content: center; position: relative; font-family: var(--mono); font-size: 26px; font-weight: 700; min-width: 0; padding: 0 8px; }
.feld .nr { position: absolute; left: 8px; top: 3px; font-size: 13px; font-weight: 600; color: var(--leise); font-family: var(--grotesk); }
.feld.aktiv { border-color: var(--aktiv); border-width: 3px; box-shadow: 0 0 0 3px color-mix(in srgb, var(--aktiv) 22%, transparent); }
.feld.aktiv .wert::after { content: ""; display: inline-block; width: 2px; height: 28px; background: var(--aktiv); vertical-align: -5px; margin-left: 2px; animation: blink 1.1s steps(2) infinite; }
.feld.lang { font-size: 19px; } .feld.fest { background: var(--flaeche2); }
@keyframes blink { 50% { opacity: 0; } } @media (prefers-reduced-motion: reduce) { .feld.aktiv .wert::after { animation: none; } .blatt { transition: none !important; } }
.platz { color: var(--leise); font-weight: 500; font-size: 17px; font-family: var(--grotesk); }
/* Hinweis nach einem Fehlversuch: bleibt über der Tastatur */
.hinweis { flex: none; border-radius: 14px; border: 2px solid var(--nah-rand); background: var(--nah-bg); color: var(--nah-text); padding: 9px 12px; display: grid; grid-template-columns: 28px 1fr; gap: 2px 8px; align-items: center; }
.hinweis b { font-size: 17px; } .hinweis p { grid-column: 2; font-size: 17px; } .hinweis small { grid-column: 2; font-size: 14px; opacity: .9; }
.sym { width: 28px; height: 28px; flex: none; }
/* Tastatur: vier Reihen, vier Spalten. Die Ziffern stehen immer an derselben Stelle. */
.tast { flex: none; background: var(--flaeche2); border-top: 1px solid var(--linie); padding: 10px 12px 12px; display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; transition: transform .22s ease; }
.tast button { height: 52px; border-radius: 12px; background: var(--taste); font-family: var(--mono); font-size: 23px; font-weight: 700; display: grid; place-items: center; }
.tast button:active { filter: brightness(.9); } .tast .leer { visibility: hidden; } .tast .zwei { grid-column: span 2; }
.tast .haupt { background: var(--akzent); color: #11161D; font-family: var(--grotesk); font-size: 18px; } .tast .haupt[disabled] { opacity: .45; }
.tast .neben { background: none; border: 1.5px solid var(--linie); color: var(--text); }
/* Blatt von unten */
.schleier { position: absolute; inset: 0; background: rgba(0, 0, 0, .45); z-index: 5; }
.blatt { position: absolute; left: 0; right: 0; bottom: 0; z-index: 6; background: var(--flaeche); border-radius: 22px 22px 0 0; border-top: 3px solid var(--linie); padding: 16px 16px 14px; display: flex; flex-direction: column; gap: 10px; max-height: 92%; overflow-y: auto; box-shadow: 0 -10px 30px rgba(0, 0, 0, .25); }
.blatt.ok { background: var(--ok-bg); border-top-color: var(--ok-rand); } .blatt.nah { background: var(--nah-bg); border-top-color: var(--nah-rand); }
.urteil { display: flex; align-items: center; gap: 10px; font-size: 22px; font-weight: 700; } .ok .urteil { color: var(--ok-text); } .nah .urteil { color: var(--nah-text); } .urteil .sym { width: 32px; height: 32px; }
.blatt p { font-size: 17px; } .blatt .gross { font-size: 19px; font-weight: 600; } .blatt .gross b { font-family: var(--mono); font-size: 21px; }
.kurz { background: var(--flaeche); color: var(--text); border-radius: 12px; padding: 9px 12px; border: 1.5px solid var(--linie); } .kurz i { display: block; font-style: normal; font-size: 13px; letter-spacing: .08em; text-transform: uppercase; color: var(--leise); font-weight: 700; font-family: var(--mono); }
.bed { list-style: none; padding: 0; display: grid; gap: 4px; font-size: 17px; } .bed li { display: flex; gap: 8px; align-items: baseline; } .bed li::before { content: "•"; width: 18px; text-align: center; flex: none; } .bed li.gut::before { content: "✓"; font-weight: 700; } .bed li.offen { font-weight: 700; } .bed li.offen::before { content: "→"; }
.haupt-knopf { height: 54px; border-radius: 14px; background: var(--akzent); color: #11161D; font-size: 19px; font-weight: 700; width: 100%; flex: none; }
.neben-knopf { height: 48px; border-radius: 14px; border: 1.5px solid var(--linie); font-size: 17px; font-weight: 600; width: 100%; background: var(--flaeche); color: var(--text); flex: none; }
/* Feld „Regel dahinter“ */
.regel-feld { display: grid; grid-template-columns: 1fr 22px; gap: 0 8px; align-items: center; text-align: left; width: 100%; background: var(--flaeche); color: var(--text); border: 1.5px solid var(--linie); border-left: 6px solid var(--akzent); border-radius: 12px; padding: 9px 10px 10px 12px; min-height: 56px; }
.regel-feld i { font-style: normal; font-size: 13px; letter-spacing: .08em; text-transform: uppercase; color: var(--leise); font-weight: 700; font-family: var(--mono); grid-column: 1; } .regel-feld b { font-size: 17px; line-height: 1.3; grid-column: 1; } .regel-feld span { grid-row: 1 / 3; grid-column: 2; font-size: 24px; color: var(--leise); }
.blatt.regel { background: var(--bg); height: 92%; padding-top: 8px; } .griff { width: 44px; height: 5px; border-radius: 3px; background: var(--linie); margin: 0 auto 4px; flex: none; }
.regel .ueber { padding-right: 40px; font-family: var(--mono); font-size: 13px; letter-spacing: .1em; text-transform: uppercase; color: var(--leise); font-weight: 600; } .regel h2 { font-size: 23px; line-height: 1.2; } .regel .genau { font-size: 16px; color: var(--leise); } .regel .genau b { color: var(--text); }
.zu { position: absolute; right: 6px; top: 6px; width: 48px; height: 48px; font-size: 24px; color: var(--leise); }
/* Zeichnung (aus dem Regel-Universum) */
.zeichnung { margin: 0; } .z-reihe { display: flex; flex-direction: column; gap: 8px; } .z-teil { background: var(--z-papier); border: 1.5px solid var(--linie); border-radius: 16px; padding: 8px 8px 10px; } .z-feld { display: block; width: 100%; height: auto; } .z-satz { font-size: 16px; color: var(--leise); text-align: center; padding: 4px 4px 0; } .z-gl { font-family: var(--mono); text-align: center; font-weight: 600; } .z-pfeil { display: none; } .z-kopf, .z-schritt { font-size: 14px; font-weight: 700; padding: 0 4px 2px; }
b.w { background: var(--marke); color: #11161D; border-radius: 5px; padding: 1px 5px; box-shadow: inset 0 0 0 1.5px #11161D; }
/* Start und Erklärung */
.seite { flex: 1; min-height: 0; overflow-y: auto; padding: 8px 16px 16px; display: flex; flex-direction: column; gap: 14px; } .seite h1 { font-size: 26px; line-height: 1.15; } .seite p { font-size: 17px; }
.wahl { display: grid; gap: 10px; } .wahl button { text-align: left; border: 2px solid var(--linie); background: var(--flaeche); border-radius: 16px; padding: 12px 14px; display: grid; grid-template-columns: 30px 1fr; gap: 2px 10px; align-items: center; min-height: 72px; }
.wahl button b { font-size: 19px; } .wahl button small { grid-column: 2; font-size: 16px; color: var(--leise); } .wahl button .punkt { width: 24px; height: 24px; border-radius: 50%; border: 2px solid var(--leise); grid-row: 1 / 3; }
.wahl button[aria-checked="true"] { border-color: var(--aktiv); border-width: 3px; } .wahl button[aria-checked="true"] .punkt { border: 7px solid var(--aktiv); }
.woche { font-size: 16px; color: var(--leise); display: flex; gap: 8px; align-items: center; } .woche i { width: 14px; height: 14px; border-radius: 50%; border: 2px solid var(--leise); } .woche i.an { background: var(--text); border-color: var(--text); }
.unten { margin-top: auto; display: grid; gap: 8px; } .erfunden { font-size: 13px; color: var(--leise); border: 1px dashed var(--linie); border-radius: 8px; padding: 4px 8px; }

</style></head>
<body data-g="nacht"><div id="app"></div>
<script>
const REGEL = {"id": "R2", "nr": 2, "name": "Plus und Minus mit negativen Zahlen", "satz": "Minus heißt umdrehen – zweimal umdrehen ist wieder geradeaus.", "genau": "Beim Addieren zeigt das Vorzeichen der zweiten Zahl die Richtung. Beim Subtrahieren gehst du genau andersherum."};
// Zeichnungen des Gesetzbuchs. Stil „Heft und Tafel“, zweite Fassung nach den Zeichen-Vorgaben des Mathe-Profis (Auftrag 11).
// Was zu sehen ist, Maße und Beschriftung stammen aus seinen Vorgaben; hier steht nur, WIE es gezeichnet wird.
// Regeln: maßstäblich · die hervorgehobene Stelle ist gelb UND trägt ein Zeichen ohne Farbe (Rahmen oder Strichart) ·
// dieselbe Markierung in der Rechenzeile · Höhen immer mit dem Zeichen für den rechten Winkel · „·“ ist nur Malzeichen.
const ZF = { tinte: 'var(--z-tinte)', leise: 'var(--z-leise)', gelb: 'var(--z-gelb)', gelbFl: 'var(--z-gelb-fl)', blau: 'var(--z-blau)', blauFl: 'var(--z-blau-fl)', papier: 'var(--z-papier)', karo: 'var(--z-karo)', rot: 'var(--z-rot)' };
let zNr = 0;
const zT = (x, y, s, o = {}) => `<text${o.grotesk ? ' class="anm"' : ''} x="${x}" y="${y}" text-anchor="${o.a || 'middle'}" font-family="${o.grotesk ? 'var(--grotesk)' : 'var(--mono)'}" font-size="${o.g || 15}" font-weight="${o.w || 600}" fill="${o.f || ZF.tinte}"${o.dreh ? ` transform="rotate(${o.dreh} ${x} ${y})"` : ''}>${s}</text>`;
const zL = (x1, y1, x2, y2, o = {}) => `<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="${o.f || ZF.tinte}" stroke-width="${o.b || 2.5}" stroke-linecap="round"${o.strich ? ` stroke-dasharray="${o.strich}"` : ''}/>`;
const zP = (pkt, o = {}) => `<polygon points="${pkt.map((p) => p.join(',')).join(' ')}" fill="${o.fl || 'none'}" stroke="${o.f || ZF.tinte}" stroke-width="${o.b || 2.5}" stroke-linejoin="round"${o.strich ? ` stroke-dasharray="${o.strich}"` : ''}${o.deck ? ` fill-opacity="${o.deck}"` : ''}/>`;
const zPfad = (d, o = {}) => `<path d="${d}" fill="${o.fl || 'none'}" stroke="${o.f || ZF.tinte}" stroke-width="${o.b || 2.5}" stroke-linecap="round" stroke-linejoin="round"${o.strich ? ` stroke-dasharray="${o.strich}"` : ''}/>`;
function zPfeil(x1, y1, x2, y2, o = {}) { // gerader Pfeil mit gefüllter Spitze
  const f = o.f || ZF.tinte, b = o.b || 3, w = Math.atan2(y2 - y1, x2 - x1), k = o.kopf || 10, bx = x2 - Math.cos(w) * k, by = y2 - Math.sin(w) * k, nx = Math.sin(w) * k * 0.55, ny = -Math.cos(w) * k * 0.55;
  return `<line x1="${x1}" y1="${y1}" x2="${bx}" y2="${by}" stroke="${f}" stroke-width="${b}" stroke-linecap="round"${o.strich ? ` stroke-dasharray="${o.strich}"` : ''}/><polygon points="${x2},${y2} ${bx + nx},${by + ny} ${bx - nx},${by - ny}" fill="${f}" stroke="${f}" stroke-width="1.5" stroke-linejoin="round"/>`;
}
function zBogenPfeil(x1, y1, x2, y2, hoch, o = {}) { // gebogener Pfeil über einen Scheitel
  const f = o.f || ZF.tinte, mx = (x1 + x2) / 2, my = (y1 + y2) / 2 - hoch, w = Math.atan2(y2 - my, x2 - mx), k = 9, bx = x2 - Math.cos(w) * k, by = y2 - Math.sin(w) * k, nx = Math.sin(w) * k * 0.55, ny = -Math.cos(w) * k * 0.55;
  return `<path d="M${x1} ${y1}Q${mx} ${my} ${bx} ${by}" fill="none" stroke="${f}" stroke-width="${o.b || 2.5}" stroke-linecap="round"${o.strich ? ` stroke-dasharray="${o.strich}"` : ''}/><polygon points="${x2},${y2} ${bx + nx},${by + ny} ${bx - nx},${by - ny}" fill="${f}" stroke="${f}" stroke-width="1.5" stroke-linejoin="round"/>`;
}
const zMarke = (x, y, s, o = {}) => { const b = o.breit || Math.max(30, String(s).length * 10 + 14); return `<rect x="${x - b / 2}" y="${y - 15}" width="${b}" height="30" rx="8" fill="${ZF.gelb}" stroke="${ZF.tinte}" stroke-width="1.5"/>${zT(x, y + 5.5, s, { f: '#11161D', w: 700, g: o.g || 16 })}`; };
const zSchild = (x, y, s, o = {}) => { const b = o.breit || String(s).replace(/<[^>]+>/g, '').length * (o.g || 14) * 0.62 + 12; return `<rect x="${o.a === 'start' ? x - 6 : o.a === 'end' ? x - b + 6 : x - b / 2}" y="${y - (o.g || 14)}" width="${b}" height="${(o.g || 14) + 8}" rx="5" fill="${ZF.papier}"/>${zT(x, y, s, o)}`; };
function zBlatt(w, h, innen, titel, karo) {
  const id = 'zk' + (++zNr);
  return `<svg class="z-feld" viewBox="0 0 ${w} ${h}" role="img" aria-label="${titel}">${karo ? `<defs><pattern id="${id}" width="${karo}" height="${karo}" patternUnits="userSpaceOnUse" x="${(karo.x || 0)}"><path d="M${karo} 0H0V${karo}" fill="none" stroke="${ZF.karo}" stroke-width="1"/></pattern><pattern id="${id}s" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="7" stroke="${ZF.leise}" stroke-width="2"/></pattern></defs><rect width="${w}" height="${h}" fill="url(#${id})"/>` : `<defs><pattern id="${id}s" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="7" stroke="${ZF.leise}" stroke-width="2"/></pattern></defs>`}${innen.replace(/SCHRAFFUR/g, `url(#${id}s)`)}</svg>`;
}
const zKlammer = (x1, x2, y, s, unten, gr) => { const d = unten ? 1 : -1; return zPfad(`M${x1} ${y}v${d * 7}H${x2}v${-d * 7}`, { f: ZF.leise, b: 1.75 }) + zSchild((x1 + x2) / 2, y + d * 7 + 5, s, { g: gr || 15 }); };
// Rechter Winkel: kleines Quadrat mit Punkt am Fußpunkt (x, y); sx, sy = Richtung der beiden Schenkel (je ±1).
const zRW = (x, y, sx, sy, s = 9) => zPfad(`M${x + sx * s} ${y}v${sy * s}h${-sx * s}`, { b: 1.5 }) + `<circle cx="${x + sx * s * 0.48}" cy="${y + sy * s * 0.48}" r="1.3" fill="${ZF.tinte}"/>`;
// Höhe: Leuchtstift gelb, darauf gestrichelte Linie in Tinte, rechter Winkel am Fuß. Das ist in jeder Figur dasselbe Zeichen.
const zHoehe = (x, yU, yO, sx = 1) => zL(x, yU, x, yO, { f: ZF.gelb, b: 8 }) + zL(x, yU, x, yO, { b: 2, strich: '5 4' }) + zRW(x, yU, sx, -1);
// Rechenzeile im Bild; Teile in [eckigen Klammern] sind hervorgehoben: gelb mit Rahmen.
function zGl(x, y, teile, g = 17) {
  const bw = g * 0.6, rand = 5, breite = teile.reduce((s, t) => s + (Array.isArray(t) ? t[0].length * bw + 2 * rand : t.length * bw), 0); let cx = x - breite / 2, aus = '';
  for (const t of teile) { const s = Array.isArray(t) ? t[0] : t, w = s.length * bw;
    if (Array.isArray(t)) { cx += rand; aus += `<rect x="${cx - 4}" y="${y - g + 1}" width="${w + 8}" height="${g + 7}" rx="5" fill="${ZF.gelb}" stroke="${ZF.tinte}" stroke-width="1.5"/>`; }
    aus += zT(cx + w / 2, y, s, { g, w: 700, f: Array.isArray(t) ? '#11161D' : ZF.tinte }); cx += w + (Array.isArray(t) ? rand : 0); }
  return aus;
}
const bruch = (z, n) => `<span class="br"><i>${z}</i><i>${n}</i></span>`;
const W = (s) => `<b class="w">${s}</b>`;

// ---------- Rechenregel 6 · Ausmultiplizieren: eine Zeichnung, vier Beschriftungen ----------
function zAusmultiplizieren() {
  const feld = (o) => { const u = o.u, br = (o.a + o.b) * u, x0 = o.x0 || 62 + (236 - br) / 2, xt = x0 + o.a * u, x1 = x0 + br, ym = 86, y0 = ym - o.h * u / 2, y1 = ym + o.h * u / 2; let s = '';
    s += `<rect x="${x0}" y="${y0}" width="${xt - x0}" height="${y1 - y0}" fill="${ZF.blauFl}"/><rect x="${xt}" y="${y0}" width="${x1 - xt}" height="${y1 - y0}" fill="${o.weg ? 'SCHRAFFUR' : ZF.blauFl}"${o.weg ? ' fill-opacity=".6"' : ''}/>`;
    if (o.karo) { for (let i = 1; i < o.a + o.b; i++) s += zL(x0 + i * u, y0, x0 + i * u, y1, { b: 0.75, f: ZF.karo }); for (let j = 1; j < o.h; j++) s += zL(x0, y0 + j * u, x1, y0 + j * u, { b: 0.75, f: ZF.karo }); }
    s += zL(x0, y0, xt, y0) + zL(x0, y1, xt, y1) + zL(x0, y0, x0, y1) + zL(xt, y0, xt, y1, o.weg ? { b: 2, strich: '6 5' } : { b: 2 }) + zL(xt, y0, x1, y0, o.weg ? { strich: '6 5' } : {}) + zL(xt, y1, x1, y1, o.weg ? { strich: '6 5' } : {}) + zL(x1, y0, x1, y1, o.weg ? { strich: '6 5' } : {});
    s += `<rect x="${x0 - 11}" y="${y0}" width="7" height="${y1 - y0}" rx="3" fill="${ZF.gelb}" stroke="${ZF.tinte}" stroke-width="1.25"/>` + zMarke(x0 - 34, ym, o.f, { breit: o.f.length > 2 ? 40 : 34, g: o.fG || 16 });
    s += zT((x0 + xt) / 2, y0 - 12, o.ta, { g: 16 }) + zT((xt + x1) / 2, y0 - 12, o.tb, { g: o.tbG || 16 });
    s += zSchild((x0 + xt) / 2, ym + 5, o.ia, { g: 15 }) + (o.ibAussen ? zT(x1 + 7, ym + (o.ibG ? 7 : 5), o.ib, { g: o.ibG || 14, a: 'start' }) : zSchild((xt + x1) / 2, ym + 5, o.ib, { g: o.ibG || 14, breit: Math.min(x1 - xt - 2, 50) }));
    if (o.ganz) s += zKlammer(x0, x1, y1 + 7, o.ganz, true, 15);
    return zBlatt(320, 150, s, o.titel); };
  return { name: 'Ausmultiplizieren und Ausklammern', felder: [
    { svg: feld({ u: 10, h: 6, a: 20, b: 2, karo: 1, f: '6', ta: '20', tb: '2', ia: '120', ib: '12', ibG: 14, titel: 'Rechteck, 6 Kästchen hoch und 22 Kästchen breit, geteilt bei 20: links 120 Kästchen, rechts 12' }), kopf: 'Zahlen', gl: `6 · (20 + 2) = ${W('6 ·')} 20 + ${W('6 ·')} 2`, satz: 'Maßstäblich: 6 Kästchen hoch, 20 + 2 Kästchen breit. Der Faktor 6 gehört zu beiden Feldern.' },
    { svg: feld({ u: 20, h: 3, a: 8, b: 2, f: '3', ta: 'x', tb: '2', ia: '3x', ib: '6', ibG: 15, titel: 'Rechteck der Höhe 3, geteilt in die Breiten x und 2; x ist deutlich länger als 2' }), kopf: 'mit x', gl: `3 · (x + 2) = ${W('3 ·')} x + ${W('3 ·')} 2`, satz: 'Dieselbe Zeichnung, neue Beschriftung. Rückwärts gelesen ist es das Ausklammern: 3x + 6 = 3 · (x + 2).' },
    { svg: feld({ u: 40, h: 1.5, a: 4, b: 0.5, f: '3/2', fG: 15, ta: '4', tb: '½', tbG: 22, ia: '6', ib: '¾', ibG: 20, ibAussen: 1, x0: 76, titel: 'Rechteck der Höhe drei Halbe, geteilt in die Breiten 4 und ein halb: links 6, rechts drei Viertel' }), kopf: 'mit Brüchen', gl: `${bruch(3, 2)} · (4 + ${bruch(1, 2)}) = ${W(bruch(3, 2) + ' ·')} 4 + ${W(bruch(3, 2) + ' ·')} ${bruch(1, 2)}`, satz: 'Maßstäblich: anderthalb hoch, 4 und ein halb breit. Die Felder sind 6 und ¾ groß.' },
    { svg: feld({ u: 10, h: 6, a: 18, b: 2, karo: 1, weg: 1, x0: 64, f: '6', ta: '20 − 2', tb: '2', ia: '108', ib: '12', ibAussen: 1, ganz: '20', titel: 'Rechteck, 6 Kästchen hoch und 20 breit; rechts ist ein Stück der Breite 2 gestrichelt abgetrennt: es bleiben 108 Kästchen, 12 kommen weg' }), kopf: 'auch bei Minus', gl: `6 · (20 − 2) = ${W('6 ·')} 20 − ${W('6 ·')} 2`, satz: 'Dasselbe Rechteck, 20 breit. Das gestrichelte Stück mit 12 Kästchen kommt weg, 108 bleiben.' },
  ] };
}

// ---------- Rechenregel 13 · Gleichung als Waage: dreimal dieselbe Waage, der Balken immer waagerecht ----------
function zWaage() {
  const sack = (x, y, geist) => zPfad(`M${x - 9} ${y - 24}q9 5 18 0l-3 6q9 8 5 18h-22q-4 -10 5 -18z`, { fl: geist ? 'none' : ZF.blauFl, f: geist ? ZF.leise : ZF.tinte, b: 2, strich: geist ? '4 4' : null }) + (geist ? '' : zT(x, y - 4, 'x', { g: 14, w: 700 }));
  const kugel = (x, y, geist, dunkel) => `<circle cx="${x}" cy="${y}" r="5.5" fill="${geist ? 'none' : dunkel ? '#11161D' : ZF.tinte}" stroke="${geist ? ZF.leise : dunkel ? '#11161D' : ZF.tinte}" stroke-width="1.75"${geist ? ' stroke-dasharray="3 3"' : ''}/>`;
  const rahmen = (p) => p.length ? `<rect x="${Math.min(...p.map((e) => e[0])) - 9}" y="${Math.min(...p.map((e) => e[1])) - 9}" width="${Math.max(...p.map((e) => e[0])) - Math.min(...p.map((e) => e[0])) + 18}" height="${Math.max(...p.map((e) => e[1])) - Math.min(...p.map((e) => e[1])) + 18}" rx="9" fill="${ZF.gelb}" stroke="${ZF.tinte}" stroke-width="1.75" stroke-dasharray="5 3"/>` : '';
  const feld = (links, rechts, titel) => { const y = 126, sch = (cx) => zL(cx, 60, cx - 44, y, { b: 1.75, f: ZF.leise }) + zL(cx, 60, cx + 44, y, { b: 1.75, f: ZF.leise }) + zPfad(`M${cx - 50} ${y}H${cx + 50}M${cx - 46} ${y}q46 22 92 0`, { b: 2.5 });
    let l = '', r = '', mL = [], mR = []; let x = 70 - (links.reduce((s, e) => s + (e[0] === 's' ? 24 : 13), 0)) / 2;
    links.forEach((e) => { if (e[0] === 's') { l += sack(x + 12, y - 2, e[1] === 'g'); x += 24; } else { if (e[1] === 'y') mL.push([x + 6.5, y - 7]); l += kugel(x + 6.5, y - 7, e[1] === 'g', e[1] === 'y'); x += 13; } });
    rechts.forEach((e, i) => { if (!e) return; const p = [250 - 32.5 + (i % 6) * 13, y - 7 - Math.floor(i / 6) * 13]; if (e[1] === 'y') mR.push(p); r += kugel(...p, e[1] === 'g', e[1] === 'y'); });
    return zBlatt(320, 196, `${zL(160, 60, 160, 176, { b: 3 })}${zL(124, 176, 196, 176, { b: 3 })}${zL(70, 60, 250, 60, { b: 3 })}${zP([[160, 48], [152, 62], [168, 62]], { fl: ZF.tinte })}
      ${sch(70)}${sch(250)}${rahmen(mL)}${rahmen(mR)}${l}${r}${zSchild(160, 118, '=', { g: 20, w: 800 })}`, titel); };
  const K = ['k'], Y = ['k', 'y'], G = ['k', 'g'], S = ['s'];
  return { name: 'Gleichung als Waage', felder: [
    { svg: feld([S, S, Y, Y], [K, K, K, K, K, Y, K, K, K, K, K, Y], 'Waage im Gleichgewicht: links zwei Säckchen x und zwei Kugeln, rechts zwölf Kugeln; auf jeder Seite sind zwei Kugeln umrahmt'), gl: '2x + 2 = 12', satz: 'Links und rechts liegt gleich viel. Umrahmt: was gleich auf beiden Seiten weggenommen wird.' },
    { svg: feld([S, S, G, G], [K, K, K, K, K, G, K, K, K, K, K, G], 'Waage im Gleichgewicht: links zwei Säckchen, rechts zehn Kugeln'), gl: '2x = 10', satz: 'Auf beiden Seiten 2 Kugeln weg. Die Waage bleibt im Gleichgewicht.', pfeil: `${W('− 2')} auf beiden Seiten` },
    { svg: feld([S, ['s', 'g']], [K, K, K, K, K, null, G, G, G, G, G], 'Waage im Gleichgewicht: links ein Säckchen, rechts fünf Kugeln'), gl: 'x = 5', satz: 'Beide Seiten halbiert: Ein Säckchen wiegt so viel wie 5 Kugeln.', pfeil: `${W(': 2')} auf beiden Seiten` },
  ] };
}

// ---------- Rechenregel 2 · Plus und Minus: zwei Zahlengeraden untereinander, beide Starts genau übereinander bei 3 ----------
function zZahlenstrahl() {
  const X = (v) => 40 + (v + 1) * 34;
  const gerade = (ya, ziel, teile) => { let s = zL(22, ya, 290, ya, { b: 2 }) + zP([[300, ya], [289, ya - 5], [289, ya + 5]], { fl: ZF.tinte, b: 1 });
    for (let v = -1; v <= 6; v++) s += zL(X(v), ya - 6, X(v), ya + 6, { b: v === 0 ? 3 : 1.75 }) + zT(X(v), ya + 24, v < 0 ? '−' + (-v) : v, { g: 15, w: v === 0 || v === 3 || v === ziel ? 800 : 600, f: v === 0 || v === 3 || v === ziel ? ZF.tinte : ZF.leise });
    s += zBogenPfeil(X(3), ya - 9, X(ziel), ya - 9, 58, { f: ZF.gelb, b: 9 }) + zBogenPfeil(X(3), ya - 9, X(ziel), ya - 9, 58, { b: 2.5 });
    s += `<circle cx="${X(3)}" cy="${ya}" r="6" fill="${ZF.tinte}"/><circle cx="${X(ziel)}" cy="${ya}" r="7" fill="${ZF.papier}" stroke="${ZF.tinte}" stroke-width="2.5"/>`;
    return s + zGl(160, ya - 58, teile); };
  const oben = gerade(96, 1, ['3 ', ['+'], ' (', ['−'], '2) = 1']), unten = gerade(222, 5, ['3 ', ['−'], ' (', ['−'], '2) = 5']);
  const lot = zL(X(3), 104, X(3), 180, { f: ZF.leise, b: 1.5, strich: '3 4' });
  return { name: 'Plus und Minus mit negativen Zahlen', felder: [
    { svg: zBlatt(320, 256, oben + lot + unten, 'Zwei Zahlengeraden von minus 1 bis 6 untereinander. Oben: Start bei 3, Pfeil zwei Einheiten nach links, Ziel 1. Unten: Start bei 3, Pfeil zwei Einheiten nach rechts, Ziel 5'),
      mini: zBlatt(320, 130, oben, 'Zahlengerade: Start bei 3, Pfeil zwei Einheiten nach links, Ziel 1'), gl: '', satz: 'Beide Starts liegen bei 3 (voller Punkt), beide Pfeile sind genau zwei Einheiten lang. Nur die Richtung ist verschieden. Der Ring ist das Ziel.' },
  ] };
}

// ---------- Fläche und Raum · Idee 1 · Auslegen und zählen: Rechteck 6 cm mal 4 cm, Quader 5 mal 4 mal 3 ----------
function zAuslegen() {
  const k = 34, x0 = 96, y0 = 34; let s = `<rect x="${x0}" y="${y0 + 3 * k}" width="${6 * k}" height="${k}" fill="${ZF.gelb}"/><rect x="${x0}" y="${y0}" width="${k}" height="${k}" fill="${ZF.blauFl}"/>`;
  for (let i = 1; i < 6; i++) s += zL(x0 + i * k, y0, x0 + i * k, y0 + 4 * k, { b: 1.25, f: ZF.leise });
  for (let j = 1; j < 4; j++) s += zL(x0, y0 + j * k, x0 + 6 * k, y0 + j * k, { b: 1.25, f: ZF.leise });

  q += zP([P(0, 0, 0), P(5, 0, 0), P(5, 4, 0), P(5, 4, 1), P(5, 0, 1), P(0, 0, 1)], { fl: ZF.gelb, b: 0.01, f: 'none' });

  for (let j = 1; j < 3; j++) q += zL(...P(0, 0, j), ...P(5, 0, j), { b: 1.25, f: ZF.leise }) + zL(...P(5, 0, j), ...P(5, 4, j), { b: 1.25, f: ZF.leise });

// ---------- Fläche und Raum · Idee 3 · Aus dem Quader: Stammbaum der Körper, alle gleich hoch ----------
function zKoerper() {
  const ox = 30, oy = -18;
  const quaderKanten = (x, y, w, h, o = {}) => { const f = o.f || ZF.tinte, st = o.strich, v = (a, b, c, d, hinten) => zL(a, b, c, d, { f: hinten ? (o.fHinten || ZF.leise) : f, b: hinten ? 1.75 : (o.b || 2.5), strich: hinten ? '4 4' : st });
    return v(x, y, x + ox, y + oy, true) + v(x + ox, y + oy, x + w + ox, y + oy, true) + v(x + ox, y + oy, x + ox, y - h + oy, true)
      + v(x, y, x + w, y) + v(x + w, y, x + w + ox, y + oy) + v(x, y, x, y - h) + v(x + w, y, x + w, y - h) + v(x + w + ox, y + oy, x + w + ox, y - h + oy)
      + v(x, y - h, x + w, y - h) + v(x + w, y - h, x + w + ox, y - h + oy) + v(x, y - h, x + ox, y - h + oy) + v(x + ox, y - h + oy, x + w + ox, y - h + oy); };
  const boden = (x, y, w) => zP([[x, y], [x + w, y], [x + w + ox, y + oy], [x + ox, y + oy]], { fl: ZF.gelb, b: 1.25 });
  const hoehe = (x, y, h, sx = -1, s = 'h') => zL(x, y, x, y - h, { f: ZF.blau, b: 2.5, strich: '6 4' }) + zL(x - sx * 14, y, x + sx * 2, y, { f: ZF.blau, b: 1.5 }) + zPfad(`M${x - sx * 9} ${y}v-9h${sx * 9}`, { f: ZF.blau, b: 1.5 }) + zT(x + sx * 8, y - h / 2 + 5, s, { g: 16, a: sx < 0 ? 'end' : 'start', f: ZF.blau, w: 800 });
  const G = (x, y) => zT(x, y, 'G', { g: 15, f: '#11161D', w: 800 });
  const scheibe = (cx, cy, rx, ry, voll) => `<ellipse cx="${cx}" cy="${cy}" rx="${rx}" ry="${ry}" fill="${ZF.gelb}" stroke="${ZF.tinte}" stroke-width="1.25"/>` + zPfad(`M${cx - rx} ${cy}A${rx} ${ry} 0 0 0 ${cx + rx} ${cy}`);
  let q = boden(64, 176, 130);
  for (const i of [1, 2]) q += zP([[64, 176 - i * 34], [194, 176 - i * 34], [194 + ox, 176 - i * 34 + oy], [64 + ox, 176 - i * 34 + oy]], { f: ZF.leise, b: 1.5, strich: '2 4' });
  q += quaderKanten(64, 176, 130, 102) + G(144, 172) + hoehe(46, 176, 102) + zT(236, 132, 'Schicht', { g: 14.5, grotesk: true, f: ZF.leise, a: 'start', w: 500 }) + zT(236, 149, 'auf Schicht', { g: 14.5, grotesk: true, f: ZF.leise, a: 'start', w: 500 });
  const pA = [24, 178], pB = [112, 178], pC = [86, 150], ph = 102, hoch = (p) => [p[0], p[1] - ph];
  let p = zP([pA, pB, pC], { fl: ZF.gelb, b: 1.25 }) + zL(...pA, ...pC, { f: ZF.leise, b: 1.75, strich: '4 4' }) + zL(...pB, ...pC, { f: ZF.leise, b: 1.75, strich: '4 4' }) + zL(...pC, ...hoch(pC), { f: ZF.leise, b: 1.75, strich: '4 4' });
  for (const i of [1, 2]) p += zP([pA, pB, pC].map((e) => [e[0], e[1] - i * ph / 3]), { f: ZF.leise, b: 1.5, strich: '2 4' });
  p += zL(...pA, ...pB) + zL(...pA, ...hoch(pA)) + zL(...pB, ...hoch(pB)) + zP([hoch(pA), hoch(pB), hoch(pC)]) + G(74, 172);
  const cx = 232, rx = 50, ry = 15, cyU = 172, cyO = 70;
  p += scheibe(cx, cyU, rx, ry);
  for (const i of [1, 2]) p += `<ellipse cx="${cx}" cy="${cyU - i * 34}" rx="${rx}" ry="${ry}" fill="none" stroke="${ZF.leise}" stroke-width="1.5" stroke-dasharray="2 4"/>`;
  p += zL(cx - rx, cyU, cx - rx, cyO) + zL(cx + rx, cyU, cx + rx, cyO) + `<ellipse cx="${cx}" cy="${cyO}" rx="${rx}" ry="${ry}" fill="none" stroke="${ZF.tinte}" stroke-width="2.5"/>` + G(cx, cyU + 5) + hoehe(158, 178, 102);
  const bx = 26, by = 180, bw = 92, bh = 102, sp = [bx + bw / 2 + ox / 2, by - bh + oy / 2], fuss = [bx + bw / 2 + ox / 2, by + oy / 2];
  let d = boden(bx, by, bw) + quaderKanten(bx, by, bw, bh, { f: ZF.leise, b: 1.5, strich: '2 4', fHinten: ZF.leise });
  d += zL(bx + ox, by + oy, ...sp, { f: ZF.leise, b: 1.75, strich: '4 4' }) + zL(bx, by, bx + bw, by) + zL(bx + bw, by, bx + bw + ox, by + oy) + zL(bx, by, ...sp) + zL(bx + bw, by, ...sp) + zL(bx + bw + ox, by + oy, ...sp) + G(bx + 22, by - 5) + hoehe(fuss[0], fuss[1], bh, 1);
  const kx = 240, kr = 46, kry = 14, kU = 172, kO = 70;
  d += scheibe(kx, kU, kr, kry) + zL(kx - kr, kU, kx - kr, kO, { f: ZF.leise, b: 1.5, strich: '2 4' }) + zL(kx + kr, kU, kx + kr, kO, { f: ZF.leise, b: 1.5, strich: '2 4' }) + `<ellipse cx="${kx}" cy="${kO}" rx="${kr}" ry="${kry}" fill="none" stroke="${ZF.leise}" stroke-width="1.5" stroke-dasharray="2 4"/>`;
  d += zL(kx - kr, kU, kx, kO) + zL(kx + kr, kU, kx, kO) + G(kx - 26, kU + 6) + hoehe(kx, kU, kU - kO, 1);
  const ux = 150, ur = 51, uU = 176, uO = 74, um = (uU + uO) / 2;

  u += `<circle cx="${ux}" cy="${um}" r="${ur}" fill="${ZF.blauFl}" fill-opacity=".8" stroke="${ZF.tinte}" stroke-width="2.5"/>` + zPfad(`M${ux - ur} ${um}A${ur} 15 0 0 0 ${ux + ur} ${um}`, { b: 1.75 }) + zPfad(`M${ux - ur} ${um}A${ur} 15 0 0 1 ${ux + ur} ${um}`, { b: 1.5, f: ZF.leise, strich: '4 4' }) + G(ux + 30, uU + 9) + hoehe(ux - ur - 22, uU, uU - uO, -1, 'h') + zT(ux, uO - 26, 'h = 2 · r', { g: 15, f: ZF.blau, w: 800 });
  return { name: 'Aus dem Quader', felder: [
    { svg: zBlatt(320, 206, q, 'Quader im Schrägbild: Grundfläche G gelb, Höhe h gestrichelt mit rechtem Winkel, Schichten angedeutet'), kopf: 'Quader', gl: `V = ${W('G')} · <b class="bl">h</b>`, satz: 'Auf der Grundfläche liegt eine Schicht. Davon stapelt man so viele, wie der Körper hoch ist.' },
    { svg: zBlatt(320, 206, p, 'Dreiecksprisma und Zylinder im Schrägbild, gleich hoch wie der Quader, Grundfläche G gelb, Höhe h senkrecht'), kopf: 'Prisma und Zylinder', gl: `V = ${W('G')} · <b class="bl">h</b>`, satz: 'Andere Grundfläche, gleiches Stapeln.', pfeil: 'andere Grundfläche' },
    { svg: zBlatt(320, 206, d, 'Pyramide in ihrem Quader und Kegel in seinem Zylinder: gleiche Grundfläche G, gleiche Höhe h; die Höhe steht senkrecht auf der Grundfläche'), kopf: 'Pyramide und Kegel', gl: `V = ${bruch(1, 3)} · ${W('G')} · <b class="bl">h</b>`, satz: 'Pyramide und Kegel füllen je ein Drittel des Körpers darum. Die Höhe läuft senkrecht, nie an der schrägen Kante entlang.', pfeil: 'ein Drittel' },
    { svg: zBlatt(320, 206, u, 'Kugel in dem Zylinder, in den sie genau passt'), kopf: 'Kugel', gl: `Kugel = ${bruch(2, 3)} des Zylinders`, satz: 'Die Kugel im genau passenden Zylinder füllt zwei Drittel davon.', pfeil: 'zwei Drittel' },
  ] };
}

// ---------- Fläche und Raum · Idee 4 · Haut des Körpers: Quader 5 cm mal 4 cm mal 3 cm und sein Netz ----------
function zNetz() {
  const F = { a: ZF.gelb, b: ZF.blauFl, c: 'SCHRAFFUR' };

  'm6-leer': { a: 'm6' }, 'm6-tippen': { a: 'm6', w: ['−5', '−3', '2', '1'], aktiv: 3 }, 'm6-hinweis': { a: 'm6', w: ['−5', '−3', '2', '1', '4', '5'], aktiv: 5, phase: 'hinweis', versuch: 1 }, 'm6-ende': { a: 'm6', w: ['−5', '−3', '2', '1', '4', '5'], phase: 'ende', versuch: 2 },
  'k2-leer': { a: 'k2', w: ['0,75', '3/'], aktiv: 1 } };
let Z; const setze = (name) => { const v = VOR[name] || VOR['e1-leer']; Z = { seite: v.seite || 'ueben', a: v.a || 'e1', w: [...(v.w || [])], aktiv: v.aktiv || 0, phase: v.phase || 'eingabe', versuch: v.versuch || 0, blatt: v.blatt || null, modus: 'handy', name }; };
const zahl = (s) => Number(String(s).replace('−', '-').replace(',', '.'));

function verletzt() { const A = AUFGABEN[Z.a], w = werte().map(zahl); if (!A.bed) return werte()[0] === A.loesung[0] ? null : ['', null, () => '']; return A.bed.find((b) => !b[1](w)) || null; }

function taste(t) {
  const A = AUFGABEN[Z.a], w = werte(); if (Z.phase !== 'eingabe' && Z.phase !== 'hinweis') return;

const regelFeld = () => `<button class="regel-feld" data-tu="regel"><i>Regel dahinter</i><b>${R2.satz}</b><span aria-hidden="true">›</span></button>`;
function blattRegel() { return `<div class="schleier" data-tu="zu"></div><section class="blatt regel" role="dialog" aria-label="Regel dahinter"><div class="griff"></div><button class="zu" data-tu="zu" aria-label="Schließen">×</button>

function zeige() {

    ${regelFeld()}<p>Beispiel: 3 − (−2). Zwei Minus, also zweimal umdrehen. Du schaust wieder nach rechts und gehst 2 Schritte: 5.</p><p class="erfunden">Erklärtext für den Entwurf erfunden. Den echten Text schreibt die Erklär-Rolle.</p>

  const k = (z, kl = '') => `<button data-t="${z}" class="${kl}">${z}</button>`, sonder = (z) => (t.includes(z) ? `<button data-t="${z}" aria-label="${{ '−': 'Minus', ',': 'Komma', '/': 'Bruchstrich' }[z]}">${z}</button>` : '<button class="leer" tabindex="-1" aria-hidden="true"></button>');
  const tast = `<div class="tast">${k(1)}${k(2)}${k(3)}<button data-t="weg" aria-label="Löschen">⌫</button>${k(4)}${k(5)}${k(6)}${sonder('−')}${k(7)}${k(8)}${k(9)}${sonder(',')}${t.includes('/') ? k(0) + sonder('/') : k(0, 'zwei')}<button data-t="los" class="haupt zwei">${alle ? 'Prüfen' : n > 1 && w[Z.aktiv] ? 'Nächstes Feld' : 'Prüfen'}</button></div>`;
  let blatt = '';
  if (Z.phase === 'richtig') blatt = `<section class="blatt ok" role="status"><p class="urteil">${SYM.ok}Richtig</p>${A.bed ? `<ul class="bed">${A.bed.map((b) => `<li class="gut">${b[0]}</li>`).join('')}</ul>` : ''}<button class="haupt-knopf" data-tu="weiter">Weiter</button></section>`;
  if (Z.phase === 'ende') blatt = `<section class="blatt nah" role="status"><p class="urteil">${SYM.nah}Nicht ganz</p>${A.bed ? `<p>Deine Zahlen: <b style="font-family:var(--mono)">${w.join(', ')}</b></p><p class="gross">${v ? v[0] + ': ' + v[2](w.map(zahl)) : ''}</p><p class="gross">Zum Beispiel: <b>${A.beispiel}</b></p><div class="kurz"><i>Alle Bedingungen</i><ul class="bed">${A.bed.map((b) => `<li class="${v && b[0] === v[0] ? 'offen' : ''}">${b[0]}</li>`).join('')}</ul></div>` : `<p class="gross">Richtig wäre: <b>${A.loesung[0]}</b></p><div class="kurz"><i>Kurzregel</i>${A.kurz}</div>`}${regelFeld()}<button class="haupt-knopf" data-tu="weiter">Weiter</button></section>`;

    <p class="kontext">Rom · Negative Zahlen · Etappe 1 von 3</p><main class="mitte"><div class="aufgabe">${A.text}${A.rechnung ? `<span class="rechnung">${A.rechnung}</span>` : ''}</div><div class="felder n${n}">${felder}</div>${hinweis}</main>
    ${blatt ? '' : tast}${blatt}${Z.blatt === 'regel' ? blattRegel() : ''}`;
  if (hinweis) { const m = app.querySelector('.mitte'); m.scrollTop = m.scrollHeight; } // Felder und Hinweis bleiben über der Tastatur; notfalls rollt die Aufgabe nach oben

app.addEventListener('click', (e) => { const b = e.target.closest('[data-t],[data-feld],[data-tu],[data-modus]'); if (!b) return;
  if (b.dataset.t) return taste(b.dataset.t); if (b.dataset.feld && (Z.phase === 'eingabe' || Z.phase === 'hinweis')) { Z.aktiv = +b.dataset.feld; return zeige(); }

setze(P.get('s') || 'start'); zeige();

wahl.firstChild.addEventListener('change', (e) => { if (e.target.value === '_g') { P.set('g', document.body.dataset.g === 'hell' ? 'nacht' : 'hell'); location.search = P.toString(); } else { setze(e.target.value); zeige(); } }); document.body.append(wahl);
