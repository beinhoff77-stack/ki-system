<nav class="area-nav" id="areas" aria-label="App-Bereiche" hidden>
  <a class="system-brand" href="#/start" aria-label="KI-System Startseite"><span aria-hidden="true">✳</span> KI-System</a>
  <div class="area-switch"><a href="#/auftraege" data-area="council">Council</a><a href="#/suche" data-area="unterkunft">Unterkunft</a></div>

</nav>

<header class="top">
  <button class="iconbtn" id="btn-back" hidden aria-label="Zurück">‹</button>
  <h1 id="title">KI-System</h1>
  <a id="notifications-link" class="notification-bell" href="#/meldungen" aria-label="Mitteilungen" hidden><svg aria-hidden="true" viewBox="0 0 24 24"><path d="M18 8a6 6 0 0 0-12 0c0 7-3 7-3 9h18c0-2-3-2-3-9ZM10 21h4"/></svg><span id="notification-count" class="badge" hidden></span></a>

</header>

<main id="main" class="view"></main>

<div id="toast" class="toast" hidden></div>

<!-- Vorlagen -->
<template id="t-login">
  <section class="card narrow">
    <h2>Anmelden</h2>
    <p class="muted" id="login-status">Prüfe Verbindung …</p>
    <form id="login-form">
      <label>Passwort
        <input type="password" id="login-pw" autocomplete="current-password" required>
      </label>
      <label>Gerätename (optional)
        <input type="text" id="login-geraet" placeholder="z. B. iPhone Sebastian" maxlength="60">
      </label>
      <button type="submit" class="primary">Anmelden</button>
    </form>
    <p class="muted small">Die Anmeldung gilt auf diesem Gerät 30 Tage und verlängert sich bei jeder Nutzung. Das Passwort wird nur an die Schnittstelle des KI-Systems (Supabase) gesendet, nie an GitHub.</p>
    <details>
      <summary>Noch kein Passwort?</summary>
      <p class="small">Das erste Passwort legst du mit einem Einrichtungscode von Claude auf der <a id="einrichten-link" href="#" target="_blank" rel="noopener">Einrichtungsseite</a> fest.</p>
    </details>
  </section>
</template>
