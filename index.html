<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>KI-System</title>
<meta name="description" content="Cockpit für Sebastians KI-System – Council-Aufträge, Ergebnisse, Einstellungen, Werkstatt.">
<meta name="theme-color" content="#1b2a41">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="KI-System">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="stylesheet" href="style.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/15.0.7/marked.min.js" defer></script>
<script src="app.js" defer></script>
</head>
<body>

<header class="top">
  <button class="iconbtn" id="btn-back" hidden aria-label="Zurück">‹</button>
  <h1 id="title">KI-System</h1>
  <span class="ver" id="ver"></span>
</header>

<main id="main" class="view"></main>

<nav class="tabs" id="tabs" hidden>
  <button data-view="auftraege">Aufträge<span class="badge" id="badge-neu" hidden></span></button>
  <button data-view="neu">Neu</button>
  <button data-view="einstellungen">Einstellungen</button>
  <button data-view="werkstatt">Werkstatt</button>
</nav>

<div id="toast" class="toast" hidden></div>

<!-- Vorlagen -->
<template id="t-login">
  <section class="card narrow">
    <h2>Anmelden</h2>
    <p class="muted" id="login-status">Prüfe Verbindung …</p>
    <form id="login-form">
      <label>Passwort
        <input type="password" id="login-pw" autocomplete="current-password" required>
      </label>
      <label>Gerätename (optional)
        <input type="text" id="login-geraet" placeholder="z. B. iPhone Sebastian" maxlength="60">
      </label>
      <button type="submit" class="primary">Anmelden</button>
    </form>
    <p class="muted small">Die Anmeldung gilt auf diesem Gerät 30 Tage und verlängert sich bei jeder Nutzung. Das Passwort wird nur an die Schnittstelle des KI-Systems (Supabase) gesendet, nie an GitHub.</p>
    <details>
      <summary>Noch kein Passwort?</summary>
      <p class="small">Das erste Passwort legst du mit einem Einrichtungscode von Claude auf der <a id="einrichten-link" href="#" target="_blank" rel="noopener">Einrichtungsseite</a> fest.</p>
    </details>
  </section>
</template>

</body>
</html>
