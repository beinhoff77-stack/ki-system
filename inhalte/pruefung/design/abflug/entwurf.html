:root { /* Tag */
  --bg: #F3F1EA; --flaeche: #FFFFFF; --flaeche2: #E7E4DA; --linie: #C9C4B6; --text: #11161D; --leise: #4A5563;
  --gelb: #FFD23F; --auf-gelb: #11161D; --tafel: #11161D; --tafel-text: #FFD23F; --tafel-kachel: #1E2630;
  --gut: #0B7A4B; --gut-bg: #DDF3E8; --kurs: #A8410F; --kurs-bg: #FFE9DC; --info: #0B5F8A;
  --ui: "Grotesk", system-ui, sans-serif; --mono: "Mono", ui-monospace, monospace; color-scheme: light;
}
html.dunkel { /* Nacht */
  --bg: #0B0F14; --flaeche: #151B24; --flaeche2: #1D2530; --linie: #2E3947; --text: #F2F4F7; --leise: #A9B3C1;
  --gelb: #FFD23F; --auf-gelb: #11161D; --tafel: #05080C; --tafel-text: #FFD23F; --tafel-kachel: #161D27;
  --gut: #45E0A0; --gut-bg: #0F2E22; --kurs: #FFAD7A; --kurs-bg: #33201A; --info: #7CCBFF; color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { margin: 0; }
body { background: var(--bg); color: var(--text); font: 500 18px/1.4 var(--ui); -webkit-font-smoothing: antialiased; font-variant-numeric: tabular-nums; }
button { font: inherit; color: inherit; cursor: pointer; }
:focus-visible { outline: 3px solid var(--gelb); outline-offset: 3px; }
#app { min-height: 100dvh; }
.mono { font-family: var(--mono); }
.ueber { font: 700 16px var(--mono); letter-spacing: .08em; text-transform: uppercase; color: var(--leise); margin: 0; }
/* Abflugtafel */
.tafel-seite { padding: 18px 14px 120px; max-width: 1100px; margin: 0 auto; }
.tafel-kopf { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; margin: 4px 4px 14px; }
.tafel-kopf h1 { margin: 0; font: 700 30px var(--ui); letter-spacing: -.02em; }
.tafel { background: var(--tafel); border-radius: 16px; padding: 10px; color: var(--tafel-text); font-family: var(--mono); }
.tzeile { display: grid; grid-template-columns: 1.3fr 1fr; gap: 6px 12px; align-items: center; padding: 12px 8px; border-bottom: 1px solid #ffffff1a; width: 100%; text-align: left; background: none; border-left: 0; border-right: 0; border-top: 0; color: inherit; font-family: var(--mono); min-height: 64px; }
.tzeile:last-child { border-bottom: 0; }
.tzeile .ziel { font-size: 20px; font-weight: 800; letter-spacing: .04em; text-transform: uppercase; }
.tzeile .thema { grid-column: 1; font-size: 16px; color: #E9EDF2; font-weight: 500; letter-spacing: 0; }
.tzeile .status { grid-row: 1 / span 2; grid-column: 2; justify-self: end; text-align: right; font-size: 16px; font-weight: 800; letter-spacing: .06em; }
.tzeile .status small { display: block; color: #C3CCD8; font-weight: 500; letter-spacing: 0; font-size: 16px; }
.tzeile .status.st-jetzt small { color: #11161D; }
.st-jetzt { color: #11161D; background: var(--gelb); padding: 6px 10px; border-radius: 6px; }
.st-geschafft { color: #45E0A0; } .st-offen { color: #E9EDF2; } .st-spaeter { color: #9AA6B5; }
.tzeile.erste { padding: 16px 8px 18px; }
.klappen { display: flex; gap: 3px; margin: 2px 0 6px; flex-wrap: wrap; }
.klappen span { display: grid; place-items: center; width: 30px; height: 42px; background: var(--tafel-kachel); border-radius: 4px; font: 800 26px var(--mono); position: relative; color: var(--tafel-text); }
.klappen span::after { content: ""; position: absolute; left: 0; right: 0; top: 50%; height: 1px; background: #00000099; }
.klappen.anim span { animation: klappe .5s steps(3) both; } .klappen.anim span:nth-child(n) { animation-delay: calc(var(--i) * 40ms); }
@keyframes klappe { 0% { transform: scaleY(.1); } 100% { transform: none; } }
.tafel-unter { display: flex; flex-wrap: wrap; gap: 10px; margin: 14px 4px; }
.routevorschau { display: block; width: 100%; max-width: 640px; padding: 0; border: 0; background: none; border-radius: 18px; overflow: hidden; margin-top: 4px; }
.chip { display: inline-flex; align-items: center; gap: 8px; min-height: 44px; padding: 0 14px; border-radius: 99px; background: var(--flaeche); border: 1px solid var(--linie); font: 700 16px var(--mono); color: var(--text); }
/* Großer gelber Knopf im Daumenbereich */
.einsteigen { position: fixed; left: 14px; right: 84px; bottom: calc(14px + env(safe-area-inset-bottom)); min-height: 64px; border: 0; border-radius: 16px; background: var(--gelb); color: var(--auf-gelb); font: 700 22px var(--ui); display: flex; align-items: center; justify-content: space-between; padding: 0 22px; z-index: 20; box-shadow: 0 10px 30px #0006; }
.einsteigen .mono { font-size: 18px; }
.menueknopf { position: fixed; right: 14px; bottom: calc(14px + env(safe-area-inset-bottom)); width: 60px; height: 64px; border-radius: 16px; border: 1px solid var(--linie); background: var(--flaeche); z-index: 20; display: grid; place-items: center; font: 700 16px var(--ui); }
.menueknopf svg { width: 26px; height: 26px; }
.blatt { position: fixed; inset: auto 0 0 0; background: var(--flaeche); border-radius: 22px 22px 0 0; padding: 10px 14px calc(18px + env(safe-area-inset-bottom)); z-index: 40; box-shadow: 0 -10px 40px #0007; animation: hoch .25s ease-out; max-width: 560px; margin: 0 auto; }
.blatt::before { content: ""; display: block; width: 44px; height: 5px; border-radius: 3px; background: var(--linie); margin: 0 auto 12px; }
.blatt button { display: flex; align-items: center; justify-content: space-between; width: 100%; min-height: 56px; padding: 0 12px; border: 0; border-bottom: 1px solid var(--linie); background: none; font: 600 19px var(--ui); text-align: left; }
.blatt button:last-child { border-bottom: 0; } .blatt kbd { font: 600 16px var(--mono); color: var(--leise); }
.schleier { position: fixed; inset: 0; background: #0008; z-index: 39; border: 0; }
@keyframes hoch { from { transform: translateY(40px); opacity: 0; } }
/* Thema: Stapel aus Sicherheitskarte, Bordkarten, Turbulenzen */
.flug { min-height: 100dvh; display: flex; flex-direction: column; max-width: 1180px; margin: 0 auto; }
.flugkopf { display: flex; align-items: center; gap: 10px; padding: 10px 12px 8px; }
.zu { width: 48px; height: 48px; border-radius: 14px; border: 1px solid var(--linie); background: var(--flaeche); font: 700 22px var(--ui); display: grid; place-items: center; flex: none; }
.flugkopf .wo { min-width: 0; flex: 1; }
.flugkopf .wo b { display: block; font: 700 19px/1.2 var(--ui); }
.stapel { display: flex; gap: 4px; padding: 0 12px 8px; }
.stapel button { flex: 1; min-height: 44px; border: 0; background: none; padding: 0; display: flex; flex-direction: column; gap: 4px; align-items: stretch; font: 700 16px var(--mono); color: var(--leise); text-transform: uppercase; letter-spacing: .04em; }
.stapel button i { height: 5px; border-radius: 3px; background: var(--linie); display: block; }
.stapel button.an { color: var(--text); } .stapel button.an i { background: var(--gelb); }
.flugflaeche { flex: 1; display: flex; flex-direction: column; padding: 0 12px 12px; }
.einfahren { animation: einfahren .3s ease-out; }
@keyframes einfahren { from { transform: translateY(30px); opacity: 0; } }
/* Sicherheitskarte: nummerierte Bildfelder, eins nach dem anderen */
.sicherheit { background: var(--flaeche); border-radius: 20px; padding: 14px; flex: 1; display: flex; flex-direction: column; }
.sk-raster { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; flex: 1; }
.sk-feld { position: relative; border-radius: 14px; border: 2px solid var(--linie); background: var(--flaeche2); padding: 34px 8px 10px; display: flex; flex-direction: column; align-items: center; justify-content: space-between; text-align: center; min-height: 160px; overflow: hidden; }
.sk-feld .n { position: absolute; top: 6px; left: 8px; width: 28px; height: 28px; border-radius: 50%; background: var(--gelb); color: #11161D; font: 800 16px var(--mono); display: grid; place-items: center; }
.sk-feld p { margin: 6px 0 0; font: 600 16px/1.3 var(--ui); }
.sk-feld.zu-noch { border-style: dashed; background: transparent; justify-content: center; color: var(--leise); }
.sk-feld.zu-noch .n { background: var(--linie); color: var(--text); }
.sk-feld.an { border-color: var(--gelb); }
.sk-feld .bild { width: 100%; display: grid; place-items: center; }
.sk-feld .k-tafel { font-size: 24px; border-spacing: 2px; } .sk-feld .k-tafel td { width: 32px; height: 44px; } .sk-feld .k-tafel-wert, .sk-feld .k-tafel-notiz { font-size: 20px; }
.sk-feld .k-koord { max-width: 150px; }
.sk-regel { margin: 12px 2px 0; font: 600 18px/1.35 var(--ui); padding-left: 12px; border-left: 4px solid var(--gelb); }
/* Bordkarte */
.bordkarte { position: relative; background: var(--flaeche); border-radius: 20px; display: flex; flex-direction: column; flex: 1; overflow: hidden; }
.bk-oben { padding: 16px 18px 12px; }
.bk-oben .zeile { display: flex; justify-content: space-between; gap: 8px; }
.bk-frage { font: 700 24px/1.25 var(--ui); margin: 10px 0 0; letter-spacing: -.01em; }
html[data-alter="klein"] .bk-frage { font-size: 26px; }
.perfo { height: 0; border-top: 3px dashed var(--linie); margin: 0 14px; position: relative; }
.perfo::before, .perfo::after { content: ""; position: absolute; top: -14px; width: 26px; height: 26px; border-radius: 50%; background: var(--bg); }
.perfo::before { left: -27px; } .perfo::after { right: -27px; }
.bk-anzeige { display: flex; justify-content: center; gap: 4px; padding: 14px 10px 6px; min-height: 92px; align-items: flex-end; }
.bk-anzeige .k { width: 40px; text-align: center; }
.bk-anzeige .k small { display: block; font: 700 16px var(--mono); color: var(--leise); margin-bottom: 4px; }

.bk-anzeige.lang { font: 800 40px var(--mono); }
.bk-stubs { display: flex; align-items: center; justify-content: center; gap: 8px; font: 600 16px var(--ui); color: var(--leise); padding: 4px 0 10px; }
.bk-stubs i { width: 30px; height: 20px; border-radius: 4px; border: 2px dashed var(--gut); display: inline-block; } .bk-stubs i.voll { background: var(--gut); border-style: solid; }

.tasten { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 6px; padding: 8px 10px 10px; background: var(--flaeche2); margin-top: auto; }

.k-koord { width: 100%; max-width: 280px; } .k-gitter { stroke: var(--linie); stroke-width: 1.2; } .k-gerade { stroke: var(--gelb); stroke-width: 4; }

.ergebnis.kurs p { margin: 6px 0 0; font-size: 18px; color: var(--text); }

A.los = () => { S.ansicht = 'thema'; S.teil = sitztKarte(S.karte) ? 'ueben' : 'erklaeren'; S.schritt = 0; neu(true); };

function anzeige(a) {

function bordkarte() {

function turbulenzen() {

function thema() {

function routeKarte() {
