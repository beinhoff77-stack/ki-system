u sehen":"Ein Koordinatensystem mit zwei Graphen, die im selben Punkt beginnen: eine Gerade und eine Kurve. An beiden sind die Punkte für x = 0 bis 4 markiert; zwischen den Punkten kleine Treppenstufen.","Maße":"Gerade: (0 | 1), (1 | 3), (2 | 5), (3 | 7), (4 | 9). Kurve: (0 | 1), (1 | 2), (2 | 4), (3 | 8), (4 | 16). x-Achse 0 bis 4, y-Achse 0 bis 16.","Beschriftung":"An den Stufen der Geraden jeweils „+ 2“, an den Stufen der Kurve jeweils „· 2“. Graphen beschriftet mit „immer plus 2“ und „immer mal 2“.","Hervorgehoben":"Die Stufenbeschriftungen „+ 2“ und „· 2“.","Darf nicht falsch aussehen":"Beide Graphen beginnen in (0 | 1). Bis x = 2 liegt die Gerade höher, ab x = 3 die Kurve. Die Punkte liegen genau.","Gleiche Zeichnung, andere Beschriftung":"Dieselben Zahlen als zwei Zahlenfolgen (1, 3, 5, 7, 9 und 1, 2, 4, 8, 16). Zinsen ohne und mit Zinseszins."}},{"nr":3,"satz":"Die Gleichung verrät die Form: x gibt eine Gerade, x² eine Parabel.","genau":"Die Gleichung verrät die Form des Graphen – und jede Änderung der Gleichung verschiebt oder streckt ihn.","kurz":"Gleichung und Form","gesetze":["U5","U11","U12","U13","U16","U17","U18"],"warum":"An der Gleichung erkennt man, wie der Graph aussieht, bevor man einen einzigen Punkt berechnet: x allein gibt eine Gerade, x² eine Parabel, x im Nenner eine Hyperbel. Ändert man die Gleichung an einer Stelle, bewegt sich der Graph auf eine vorhersagbare Weise.","zeichen":{"Zu sehen":"Vier kleine Koordinatensysteme in einer Reihe, jedes mit einem Graphen und seiner Gleichung: Gerade, Parabel, Hyperbel, Knick.","Maße":"Alle vier mit Achsen von −3 bis 3. Parabel durch (−2 | 4), (−1 | 1), (0 | 0), (1 | 1), (2 | 4) – dafür y-Achse bis 4. Hyperbel durch (1 | 1), (2 | 0,5), (0,5 | 2) und gespiegelt im dritten Viertel.","Beschriftung":"„y = x“, „y = x²“, „y = 1 : x“, „y = |x|“.","Hervorgehoben":"In jeder Gleichung die Stelle, die die Form bestimmt: x, x², das x unter dem Bruchstrich, die Betragsstriche.","Darf nicht falsch aussehen":"Die Parabel ist symmetrisch zur y-Achse. Die Hyperbel berührt keine Achse. Der Knick liegt genau im Ursprung.","Gleiche Zeichnung, andere Beschriftung":"**Zweite Reihe, drei Felder (Verschieben):** y = x², y = x² + 2 (2 nach oben), y = (x − 3)² (3 nach rechts – nicht nach links). Ganzrationale Funktion y = x · (x − 2) · (x + 2) mit den Nullstellen −2, 0, 2."}}]},{"name":"Daten und Zufall","zahl":20,"ideen":[{"nr":1,"satz":"Eine Zahl für viele – und immer geht etwas verloren.","genau":"Eine Kennzahl fasst viele Daten in einer Zahl zusammen – und verschweigt dabei immer etwas.","kurz":"Kennzahl","gesetze":["D1","D2","D3","D4","D5","D6","D9","D10"],"warum":"Mittelwert, Median und Spannweite fassen viele Werte in einer Zahl zusammen. Das macht Daten vergleichbar – aber zwei ganz verschiedene Datenreihen können denselben Mittelwert haben. Deshalb braucht man meist zwei Kennzahlen: eine für die Mitte und eine für die Streuung.","zeichen":{"Zu sehen":"Zwei Punktreihen untereinander über derselben Zahlengeraden von 0 bis 10. Jede Reihe hat vier Punkte. In beiden steht an derselben Stelle ein Dreieck als Zeichen für den Mittelwert.","Maße":"Reihe A: Punkte bei 4, 5, 5, 6 (die zwei Fünfen übereinander). Reihe B: Punkte bei 1, 2, 8, 9. Mittelwert in beiden: 5.","Beschriftung":"„A: 4, 5, 5, 6 – Mittelwert 5“. „B: 1, 2, 8, 9 – Mittelwert 5“.","Hervorgehoben":"Die beiden Dreiecke bei 5, genau untereinander.","Darf nicht falsch aussehen":"Die Punkte stehen genau an ihren Werten. Beide Dreiecke stehen genau bei 5.","Gleiche Zeichnung, andere Beschriftung":"Eine dritte Reihe mit Ausreißer: 2, 3, 3, 4, 18 – Mittelwert 6 (Dreieck), Median 3 (Strich). Dieselbe Gerade mit einem Boxplot."}},{"nr":2,"satz":"Wenige sagen nur etwas über alle, wenn der Zufall sie auswählt.","genau":"Von wenigen auf alle schließen geht nur, wenn zufällig und oft genug gezogen wurde.","kurz":"Vom Teil aufs Ganze","gesetze":["D7","D8","D15","D20"],"warum":"Man kann selten alle fragen oder alles messen. Eine Stichprobe verrät nur dann etwas über das Ganze, wenn der Zufall sie ausgewählt hat und wenn sie groß genug ist. Das gilt für Umfragen genauso wie für das Schätzen von Wahrscheinlichkeiten durch viele Versuche.","zeichen":{"Zu sehen":"Ein Feld mit 100 Punkten (10 mal 10), ein Teil davon gefärbt; die gefärbten häufen sich in der linken unteren Ecke. Zwei Rahmen greifen je 10 Punkte heraus: Rahmen 1 verstreut über das ganze Feld (durch dünne Linien zu einer Gruppe verbunden), Rahmen 2 ein Block in der linken unteren Ecke.","Maße":"Genau 30 der 100 Punkte gefärbt. Rahmen 1 enthält 3 gefärbte von 10, Rahmen 2 enthält 8 gefärbte von 10.","Beschriftung":"Am Feld: „30 von 100 = 30 %“. Rahmen 1: „zufällig gezogen: 3 von 10 = 30 %“. Rahmen 2: „aus einer Ecke: 8 von 10 = 80 %“.","Hervorgehoben":"Die beiden Rahmen und ihre Ergebnisse.","Darf nicht falsch aussehen":"Die Zahlen müssen abzählbar stimmen (30, 3, 8). Rahmen 2 muss erkennbar dort liegen, wo sich die gefärbten Punkte häufen.","Gleiche Zeichnung, andere Beschriftung":"Ein Verlauf für das Gesetz der großen Zahlen: Anteil „Kopf“ nach 10, 100 und 1 000 Würfen, der sich 0,5 nähert – die Werte dafür müssen aus einer echten oder simulierten Wurfreihe stammen, nicht erfunden sein."}},{"nr":3,"satz":"Wahrscheinlichkeit: günstige durch mögliche.","genau":"Sind alle Ergebnisse gleich wahrscheinlich, ist die Wahrscheinlichkeit ein Anteil: günstige durch mögliche.","kurz":"Anteil","gesetze":["D11","D12","D13","D14","D16"],"warum":"Kann ein Versuch auf mehrere Arten ausgehen und ist keine davon bevorzugt, dann ist die Wahrscheinlichkeit eines Ereignisses sein Anteil an allen Möglichkeiten. Dafür muss man nur richtig zählen.","zeichen":{"Zu sehen":"Sechs Würfelflächen in einer Reihe, mit 1 bis 6 Augen. Die Flächen mit 2, 4 und 6 Augen sind hervorgehoben.","Maße":"Alle sechs Flächen gleich groß und in gleichen Abständen.","Beschriftung":"Darunter: „gerade Zahl: 3 von 6 = ½“.","Hervorgehoben":"Die drei Flächen 2, 4 und 6.","Darf nicht falsch aussehen":"Alle sechs Flächen sind gleich groß (gleich wahrscheinlich). Genau drei sind hervorgehoben. Die Augenzahlen stimmen.","Gleiche Zeichnung, andere Beschriftung":"Dieselbe Reihe mit den übrigen drei Flächen markiert: Gegenereignis, ½ + ½ = 1. Gegenbeispiel als eigenes Feld: ein Glücksrad mit drei Feldern, die die Hälfte, ein Viertel und ein Viertel einnehmen – „3 Felder, aber nicht jedes hat ⅓“. Zählprinzip: 3 Hosen und 2 Hemden als Gitter mit 6 Kombinationen."}},{"nr":4,"satz":"Am Pfad entlang mal, Pfade zusammen plus.","genau":"Bei mehreren Stufen: entlang eines Pfades malnehmen, verschiedene Pfade addieren.","kurz":"Stufen","gesetze":["D17","D18","D19"],"warum":"Besteht ein Versuch aus mehreren Schritten, zeichnet man einen Baum. Ein Pfad ist ein Ausgang des ganzen Versuchs; seine Wahrscheinlichkeit ist das Produkt entlang des Pfades. Gehören mehrere Pfade zum Ereignis, addiert man sie.","zeichen":{"Zu sehen":"Ein Baumdiagramm für zwei Münzwürfe: von der Wurzel zwei Äste (Kopf, Zahl), von jedem wieder zwei. Vier Enden.","Maße":"An jedem Ast „½“. An den Enden: KK, KZ, ZK, ZZ, jeweils mit „¼“.","Beschriftung":"Unter dem Baum zwei Zeilen: „Pfad Kopf–Zahl: ½ · ½ = ¼“ und „genau einmal Kopf: ¼ + ¼ = ½“.","Hervorgehoben":"Zwei verschiedene Markierungen: ein Pfad entlang (mal) – und die zwei Enden KZ und ZK zusammen (plus).","Darf nicht falsch aussehen":"Die Wahrscheinlichkeiten an den Ästen eines Knotens ergeben zusammen 1. Vier Enden, zusammen 1.","Gleiche Zeichnung, andere Beschriftung":"Derselbe Baum für eine Urne mit 3 roten und 2 blauen Kugeln ohne Zurücklegen: erster Zug 3/5 und 2/5; nach Rot: 2/4 und 2/4; nach Blau: 3/4 und 1/4; „rot, rot: 3/5 · 2/4 = 3/10“. Dieselben Zahlen als Vierfeldertafel."}}]},{"name":"Entdecker-Inseln","zahl":5,"ideen":[]}],"gesetze":[{"id":"Z1","name":"Stellenwertsystem","satz":"Jede Stelle ist zehnmal so viel wert wie die Stelle rechts daneben – auch hinter dem Komma.","idee":2,"gym":"5–6","rs":"5–6","ib":"1","sonne":"1","planet":"Zahlen"},{"id":"Z2","name":"Runden","satz":"Die Ziffer rechts von der Rundungsstelle entscheidet: 0 bis 4 abrunden, 5 bis 9 aufrunden.","idee":2,"gym":"5–6","rs":"5–6","ib":"1","sonne":"1","planet":"Zahlen"},{"id":"Z3","name":"Andere Zahlschriften","satz":"Römische Zahlen reihen Zeichen aneinander; das Zweiersystem bündelt in Zweiern statt in Zehnern.","idee":2,"gym":"5","rs":"5","ib":"1","sonne":"–","planet":"Zahlen"},{"id":"Z4","name":"Ordnung auf der Zahlengeraden","satz":"Was weiter links liegt, ist kleiner – auch bei negativen Zahlen und Brüchen.","idee":1,"gym":"5–6","rs":"5–6","ib":"1–2","sonne":"2","planet":"Zahlen"},{"id":"Z5","name":"Betrag und Gegenzahl","satz":"Der Betrag ist der Abstand zur Null. Die Gegenzahl liegt gleich weit auf der anderen Seite.","idee":1,"gym":"5","rs":"5","ib":"2–5","sonne":"2","planet":"Zahlen"},{"id":"Z6","name":"Teiler und Vielfache","satz":"a ist Teiler von b, wenn b geteilt durch a ohne Rest aufgeht.","idee":3,"gym":"5","rs":"5","ib":"1","sonne":"–","planet":"Zahlen"},{"id":"Z7","name":"Teilbarkeitsregeln","satz":"Durch 2, 5 und 10: letzte Ziffer ansehen. Durch 3 und 9: Quersumme ansehen.","idee":3,"gym":"5","rs":"5","ib":"1","sonne":"1","planet":"Zahlen"},{"id":"Z8","name":"Primzahlen und Primfaktoren","satz":"Jede natürliche Zahl größer als 1 lässt sich in Primzahlen zerlegen – bis auf die Reihenfolge auf genau eine Weise.","idee":3,"gym":"5","rs":"5","ib":"1","sonne":"–","planet":"Zahlen"},{"id":"Z9","name":"ggT und kgV","satz":"Der größte gemeinsame Teiler kürzt vollständig, das kleinste gemeinsame Vielfache ist der Hauptnenner.","idee":3,"gym":"6","rs":"6","ib":"1","sonne":"9","planet":"Zahlen"},{"id":"Z10","name":"Bruch als Anteil","satz":"Der Nenner teilt, der Zähler zählt. Anteil = Teil durch Ganzes.","idee":4,"gym":"6","rs":"6","ib":"1","sonne":"–","planet":"Zahlen"},{"id":"Z11","name":"Brüche vergleichen","satz":"Bei gleichem Nenner ist der Bruch mit dem größeren Zähler größer; sonst erst gleichnamig machen.","idee":1,"gym":"6","rs":"6","ib":"1","sonne":"9","planet":"Zahlen"},{"id":"Z12","name":"Drei Schreibweisen einer Zahl","satz":"Bruch, Dezimalzahl und Prozent sagen dasselbe: ½ = 0,5 = 50 %.","idee":4,"gym":"6","rs":"6","ib":"1","sonne":"1","planet":"Zahlen"},{"id":"Z13","name":"Periodische Dezimalzahlen","satz":"Jeder Bruch wird als Dezimalzahl endlich oder periodisch – nie etwas anderes.","idee":4,"gym":"6","rs":"6","ib":"1","sonne":"–","planet":"Zahlen"},{"id":"Z14","name":"Rechnen mit Komma","satz":"Mal: Nachkommastellen zusammenzählen. Geteilt: das Komma in beiden Zahlen gleich weit verschieben.","idee":2,"gym":"6","rs":"6","ib":"2","sonne":"1","planet":"Zahlen"},{"id":"Z15","name":"Quadratzahlen","satz":"Hoch 2 heißt Zahl mal sich selbst; die Quadratzahlen bis 20² weiß man auswendig.","idee":5,"gym":"5","rs":"5","ib":"1","sonne":"8","planet":"Zahlen"},{"id":"Z16","name":"Potenz mit negativer Basis","satz":"Gerade Hochzahl: Ergebnis positiv. Ungerade Hochzahl: Ergebnis negativ.","idee":5,"gym":"5","rs":"5","ib":"1","sonne":"3, 8","planet":"Zahlen"},{"id":"Z17","name":"Hoch null und negative Hochzahl","satz":"Für a ≠ 0 gilt: a⁰ = 1, und eine negative Hochzahl heißt Kehrwert: a⁻ⁿ = 1 : aⁿ.","idee":5,"gym":"6–8","rs":"7","ib":"3–4","sonne":"8","planet":"Zahlen"},{"id":"Z18","name":"Zehnerpotenzen","satz":"10ⁿ ist eine 1 mit n Nullen, 10⁻ⁿ hat n Stellen hinter dem Komma. Kilo, Mega, Milli, Mikro sind Zehnerpotenzen.","idee":2,"gym":"5–6","rs":"5–7","ib":"1–4","sonne":"1, 8","planet":"Zahlen"},{"id":"Z19","name":"Potenzgesetze","satz":"Mal bei gleicher Basis: Hochzahlen addieren. Mal bei gleicher Hochzahl: Basen malnehmen. Potenz einer Potenz: Hochzahlen malnehmen.","idee":5,"gym":"7–9","rs":"7–10","ib":"3–5","sonne":"8","planet":"Zahlen"},{"id":"Z20","name":"Quadratwurzel","satz":"Die Wurzel aus a ist die Zahl ab null, deren Quadrat a ist. Aus negativen Zahlen gibt es keine.","idee":5,"gym":"9","rs":"9","ib":"1","sonne":"12","planet":"Zahlen"},{"id":"Z21","name":"Wurzelgesetze","satz":"Für a ≥ 0 und b ≥ 0 ist Wurzel mal Wurzel die Wurzel aus dem Produkt; für b > 0 gilt dasselbe beim Teilen. Bei Plus und Minus gilt es nicht.","idee":5,"gym":"9","rs":"9","ib":"4","sonne":"8","planet":"Zahlen"},{"id":"Z22","name":"Irrationale und reelle Zahlen","satz":"Manche Zahlen sind kein Bruch, zum Beispiel √2. Brüche und diese Zahlen zusammen heißen reelle Zahlen.","idee":1,"gym":"9","rs":"9","ib":"4","sonne":"–","planet":"Zahlen"},{"id":"Z23","name":"n-te Wurzel und Bruch als Hochzahl","satz":"a hoch 1/n ist die n-te Wurzel aus a.","idee":5,"gym":"9","rs":"10","ib":"5","sonne":"8, 12","planet":"Zahlen"},{"id":"Z24","name":"Logarithmus","satz":"Für b > 0, b ≠ 1 und x > 0 ist der Logarithmus von x zur Basis b die Hochzahl, mit der aus b die Zahl x wird. Aus Mal wird Plus, aus Hoch wird Mal.","idee":5,"gym":"10","rs":"10","ib":"5","sonne":"8, 12","planet":"Zahlen"},{"id":"A1","name":"Term und Variable","satz":"Ein Buchstabe steht für eine Zahl. Die zuletzt ausgeführte Rechnung gibt dem Term seinen Namen.","idee":1,"gym":"7","rs":"6","ib":"1","sonne":"4","planet":"Algebra"},{"id":"A2","name":"Gleichwertige Terme","satz":"Zwei Terme sind gleichwertig, wenn sie für jede Zahl ihrer gemeinsamen Definitionsmenge denselben Wert haben.","idee":1,"gym":"7","rs":"7","ib":"3","sonne":"–","planet":"Algebra"},{"id":"A3","name":"Summe mal Summe","satz":"Jedes Glied der ersten Klammer mal jedes Glied der zweiten.","idee":1,"gym":"7","rs":"7","ib":"3","sonne":"6","planet":"Algebra"},{"id":"A4","name":"Binomische Formeln","satz":"(a + b)² = a² + 2ab + b² · (a − b)² = a² − 2ab + b² · (a + b)(a − b) = a² − b²","idee":1,"gym":"7","rs":"7–8","ib":"3","sonne":"6","planet":"Algebra"},{"id":"A5","name":"Definitionsmenge","satz":"Ein Nenner darf nie null sein. Diese Zahlen werden vorher ausgeschlossen.","idee":2,"gym":"8","rs":"8","ib":"4","sonne":"14","planet":"Algebra"},{"id":"A6","name":"Bruchterme","satz":"Mit Bruchtermen rechnet man wie mit Brüchen: erst faktorisieren, dann kürzen.","idee":2,"gym":"8","rs":"8","ib":"4","sonne":"9, 10","planet":"Algebra"},{"id":"A7","name":"Kleinster und größter Wert","satz":"(x − d)² + e hat den kleinsten Wert e; er wird bei x = d erreicht.","idee":1,"gym":"–","rs":"8","ib":"–","sonne":"6","planet":"Algebra"},{"id":"A8","name":"Äquivalenzumformung","satz":"Dieselbe umkehrbare Rechnung auf beiden Seiten ändert die Lösungsmenge nicht. Haupteintrag: Rechenregel 13 „Gleichung als Waage“.","idee":3,"gym":"5–7","rs":"6–7","ib":"1–2","sonne":"13","planet":"Algebra"},{"id":"A9","name":"Wie viele Lösungen?","satz":"Eine lineare Gleichung hat genau eine Lösung, keine oder jede Zahl als Lösung.","idee":3,"gym":"5–7","rs":"6–7","ib":"1–2","sonne":"–","planet":"Algebra"},{"id":"A10","name":"Ungleichungen","satz":"Mal oder geteilt durch eine negative Zahl dreht das Ungleichheitszeichen um.","idee":3,"gym":"8","rs":"7","ib":"4","sonne":"3, 13","planet":"Algebra"},{"id":"A11","name":"Intervalle","satz":"Eckige Klammer: Die Grenze gehört dazu. Nach außen gedrehte oder runde Klammer: Sie gehört nicht dazu.","idee":3,"gym":"8","rs":"7","ib":"4","sonne":"–","planet":"Algebra"},{"id":"A12","name":"Bruchgleichungen","satz":"Mit dem Hauptnenner malnehmen; die Lösung muss in der Definitionsmenge liegen. Bruch gleich Bruch: über Kreuz.","idee":2,"gym":"8","rs":"8","ib":"4","sonne":"10, 13","planet":"Algebra"},{"id":"A13","name":"Formeln umstellen","satz":"Eine Formel ist eine Gleichung mit mehreren Buchstaben: nach dem gesuchten auflösen.","idee":3,"gym":"8","rs":"–","ib":"4","sonne":"12, 13","planet":"Algebra"},{"id":"A14","name":"Gleichungssystem mit zwei Unbekannten","satz":"Gesucht ist das Zahlenpaar, das beide Gleichungen erfüllt: einsetzen, gleichsetzen oder addieren. Zwei Geraden schneiden sich, sind parallel oder gleich.","idee":3,"gym":"8","rs":"9","ib":"4","sonne":"13","planet":"Algebra"},{"id":"A15","name":"Gleichungssystem mit drei Unbekannten","satz":"Erst eine Unbekannte entfernen, dann von unten nach oben einsetzen.","idee":3,"gym":"9","rs":"–","ib":"–","sonne":"13","planet":"Algebra"},{"id":"A16","name":"x² = a","satz":"Zwei Lösungen, wenn a positiv ist (Wurzel und Gegenzahl), eine bei a = 0, keine bei negativem a.","idee":4,"gym":"9","rs":"9","ib":"4","sonne":"12","planet":"Algebra"},{"id":"A17","name":"Faktorisieren","satz":"Alles auf eine Seite, ausklammern, dann jeden Faktor gleich null setzen.","idee":4,"gym":"9–10","rs":"9","ib":"4","sonne":"6, 14","planet":"Algebra"},{"id":"A18","name":"Quadratische Ergänzung","satz":"Zum Binom ergänzen, was fehlt – und es gleich wieder abziehen.","idee":4,"gym":"9","rs":"8–9","ib":"4","sonne":"6","planet":"Algebra"},{"id":"A19","name":"Lösungsformel","satz":"a·x² + b·x + c = 0 mit a ≠ 0 hat die Lösungen x = (−b ± √(b² − 4ac)) : (2a). Der Ausdruck unter der Wurzel entscheidet: positiv zwei Lösungen, null eine, negativ keine.","idee":4,"gym":"9","rs":"9","ib":"4","sonne":"12","planet":"Algebra"},{"id":"A20","name":"Wurzelgleichungen","satz":"Quadrieren kann falsche Lösungen erzeugen. Die Probe ist Pflicht.","idee":2,"gym":"–","rs":"9","ib":"–","sonne":"12","planet":"Algebra"},{"id":"A21","name":"Potenzgleichungen","satz":"xⁿ = c: bei ungerader Hochzahl genau eine Lösung. Bei gerader Hochzahl zwei Lösungen für c > 0, eine für c = 0, keine für c < 0.","idee":4,"gym":"9","rs":"10","ib":"4","sonne":"3, 12","planet":"Algebra"},{"id":"A22","name":"Exponentialgleichungen","satz":"Gleiche Basis: Hochzahlen gleichsetzen. Sonst hilft der Logarithmus.","idee":4,"gym":"10","rs":"10","ib":"5","sonne":"12","planet":"Algebra"},{"id":"A23","name":"Polynomgleichungen","satz":"Ausklammern oder x² ersetzen. Eine doppelte Lösung berührt die Achse nur.","idee":4,"gym":"10","rs":"–","ib":"–","sonne":"6, 14","planet":"Algebra"},{"id":"V1","name":"Größe und Einheit","satz":"Eine Größe ist Zahl mal Einheit. Umrechnungszahlen: Längen 10 (m zu km: 1 000), Massen 1 000, Zeit 60 (Tag zu Stunde: 24).","idee":1,"gym":"5","rs":"5","ib":"2","sonne":"1","planet":"Geld und Verhältnisse"},{"id":"V2","name":"Maßstab","satz":"1 : n heißt: 1 cm im Plan sind n cm in Wirklichkeit.","idee":1,"gym":"5","rs":"5","ib":"2","sonne":"11","planet":"Geld und Verhältnisse"},{"id":"V3","name":"Direkte Proportionalität","satz":"Doppelt so viel von dem einen, doppelt so viel von dem anderen. Der Quotient bleibt gleich.","idee":2,"gym":"5–8","rs":"6–8","ib":"2–3","sonne":"11","planet":"Geld und Verhältnisse"},{"id":"V4","name":"Dreisatz","satz":"Erst auf eins, dann auf viele. Haupteintrag: Rechenregel 11 „Verhältnis (Dreisatz)“.","idee":2,"gym":"5","rs":"6","ib":"2","sonne":"11","planet":"Geld und Verhältnisse"},{"id":"V5","name":"Verhältnisse","satz":"a : b lässt sich kürzen wie ein Bruch. Aufteilen im Verhältnis: erst die Teile zusammenzählen.","idee":2,"gym":"6","rs":"6","ib":"1","sonne":"9","planet":"Geld und Verhältnisse"},{"id":"V6","name":"Indirekte Proportionalität","satz":"Doppelt so viel von dem einen, halb so viel von dem anderen. Das Produkt bleibt gleich.","idee":2,"gym":"8","rs":"7","ib":"4","sonne":"11","planet":"Geld und Verhältnisse"},{"id":"V7","name":"Änderungsrate","satz":"Änderung je Einheit: Unterschied der Werte durch Unterschied der Schritte.","idee":2,"gym":"5","rs":"6","ib":"2","sonne":"11","planet":"Geld und Verhältnisse"},{"id":"V8","name":"Grundgleichung der Prozentrechnung","satz":"Prozentwert = Prozentsatz mal Grundwert. Zwei der drei Größen bestimmen die dritte.","idee":3,"gym":"6","rs":"6","ib":"1","sonne":"1, 12","planet":"Geld und Verhältnisse"},{"id":"V9","name":"Wachstumsfaktor","satz":"Plus p % heißt mal (1 + p/100), minus p % heißt mal (1 − p/100). Erst plus 10 %, dann minus 10 % ist nicht wieder der Anfang.","idee":3,"gym":"7","rs":"7","ib":"3","sonne":"1","planet":"Geld und Verhältnisse"},{"id":"V10","name":"Zinsen","satz":"Jahreszinsen = Kapital mal Zinssatz. Für Monate nimmt man den Anteil am Jahr.","idee":3,"gym":"6","rs":"7","ib":"4","sonne":"1","planet":"Geld und Verhältnisse"},{"id":"V11","name":"Zinseszins","satz":"Kapital nach n Jahren = Anfangskapital mal Wachstumsfaktor hoch n.","idee":3,"gym":"7","rs":"7","ib":"3","sonne":"8","planet":"Geld und Verhältnisse"},{"id":"G1","name":"Koordinatensystem","satz":"Punkt (x &#124; y): erst nach rechts oder links, dann nach oben oder unten.","idee":2,"gym":"5","rs":"5","ib":"1","sonne":"–","planet":"Geometrie","wirkstelle":"","genau":"","warum":"Zwei Zahlengeraden, die sich bei null senkrecht kreuzen, geben jedem Punkt der Ebene eine Adresse aus zwei Zahlen.","voraus":"Zuerst die x-Koordinate (waagerecht), dann die y-Koordinate (senkrecht).","fehler":"x und y vertauschen.","verwandt":"Zahlengerade (Planet Zahlen). Graph einer Funktion (Planet Funktionen).","weg":"–","klassen":[{"klasse":5,"art":"Einführung","text":"P(3 &#124; 2): von 0 aus 3 nach rechts, 2 nach oben","thema":null},{"klasse":5,"art":"Einführung","text":"Q(−2 &#124; 1): 2 nach links, 1 nach oben","thema":null}],"zeichen":null,"schulart":"Gymnasium: 5 · Realschule Gruppe I: 5 · Realschule Gruppe II/III: 5 · IB (Planung der App): Jahr 1"},{"id":"G2","name":"Parallel, senkrecht, Abstand","satz":"Der Abstand eines Punktes von einer Geraden ist die Länge des Lots – das ist die kürzeste Verbindung.","idee":2,"gym":"5","rs":"5","ib":"1","sonne":"–","planet":"Geometrie","wirkstelle":"","genau":"","warum":"Von allen Verbindungen eines Punktes zu einer Geraden ist das Lot die kürzeste; jede andere ist die längste Seite eines rechtwinkligen Dreiecks.","voraus":"Der Abstand wird immer senkrecht gemessen.","fehler":"Schräg messen.","verwandt":"Höhe in Dreieck und Parallelogramm (Planet Fläche und Raum). Ortslinien.","weg":"–","klassen":[{"klasse":5,"art":"Einführung","text":"P(2 &#124; 5) hat von der x-Achse den Abstand 5","thema":null},{"klasse":9,"art":"Anwendung","text":"Der Punkt (3 &#124; 4) hat vom Ursprung den Abstand 5","thema":null}],"zeichen":null,"schulart":"Gymnasium: 5 · Realschule Gruppe I: 5 · Realschule Gruppe II/III: 5 · IB (Planung der App): Jahr 1"},{"id":"G3","name":"Winkelarten","satz":"Voller Winkel 360°, gestreckter 180°, rechter 90°.","idee":1,"gym":"5","rs":"5","ib":"1","sonne":"–","planet":"Geometrie","wirkstelle":"","genau":"","warum":"Ein Winkel misst eine Drehung. Die volle Drehung ist in 360 gleiche Teile geteilt.","voraus":"Gemessen wird am Scheitel, von einem Schenkel zum anderen.","fehler":"Am Geodreieck die falsche Skala ablesen.","verwandt":"Winkelsumme. Kreisausschnitt (Planet Fläche und Raum).","weg":"–","klassen":[{"klasse":5,"art":"Einführung","text":"Viertel-Drehung 90°, halbe Drehung 180°, volle Drehung 360°","thema":null},{"klasse":5,"art":"Einführung","text":"Spitz: unter 90°. Stumpf: zwischen 90° und 180°. Überstumpf: über 180°","thema":null}],"zeichen":null,"schulart":"Gymnasium: 5 · Realschule Gruppe I: 5 · Realschule Gruppe II/III: 5 · IB (Planung der App): Jahr 1"},{"id":"G4","name":"Scheitel- und Nebenwinkel","satz":"Scheitelwinkel sind gleich groß. Nebenwinkel ergeben zusammen 180°.","idee":1,"gym":"5–7","rs":"5–7","ib":"1–2","sonne":"–","planet":"Geometrie","wirkstelle":"","genau":"","warum":"Nebenwinkel liegen nebeneinander auf einer Geraden, zusammen also 180°. Zwei Scheitelwinkel haben denselben Nebenwinkel, sind also gleich groß.","voraus":"Zwei Geraden, die sich schneiden.","fehler":"Scheitelwinkel und Nebenwinkel verwechseln.","verwandt":"Stufen- und Wechselwinkel.","weg":"G3 Winkelarten","klassen":[{"klasse":7,"art":"Einführung","text":"Ein Winkel hat 65°: Scheitelwinkel 65°, Nebenwinkel 115°","thema":null}],"zeichen":null,"schulart":"Gymnasium: 7 · Realschule Gruppe I: 5 · Realschule Gruppe II/III: 5 · IB (Planung der App): Jahr 1–2"},{"id":"G5","name":"Stufen- und Wechselwinkel","satz":"An parallelen Geraden sind Stufenwinkel und Wechselwinkel gleich groß – und umgekehrt.","idee":1,"gym":"7","rs":"7","ib":"2","sonne":"–","planet":"Geometrie","wirkstelle":"","genau":"","warum":"Verschiebt man eine Kreuzung längs der schneidenden Geraden auf die andere Parallele, kommen die Winkel zur Deckung.","voraus":"Gleich groß sind sie nur, wenn die beiden Geraden parallel sind. Umgekehrt: Sind sie gleich groß, sind die Geraden parallel.","fehler":"Die Winkel für gleich halten, obwohl die Geraden nicht parallel sind.","verwandt":"Winkelsumme. Strahlensätze.","weg":"G4 Scheitel- und Nebenwinkel","klassen":[{"klasse":7,"art":"Einführung","text":"Parallelen, oben 70°: Stufenwinkel unten 70°, Wechselwinkel 70°","thema":null},{"klasse":7,"art":"Einführung","text":"Stufenwinkel 70° und 72°: Die Geraden sind nicht parallel","thema":null}],"zeichen":null,"schulart":"Gymnasium: 7 · Realschule Gruppe I: 7 · Realschule Gruppe II/III: 7 · IB (Planung der App): Jahr 2"},{"id":"G6","name":"Winkelsumme","satz":"Im Dreieck 180°, im Viereck 360°, im n-Eck (n − 2) mal 180°. Ein Außenwinkel ist so groß wie die beiden anderen Innenwinkel zusammen.","idee":1,"gym":"7","rs":"7","ib":"2","sonne":"–","planet":"Geometrie","wirkstelle":"","genau":"","warum":"Die Parallele durch eine Ecke legt alle drei Winkel nebeneinander auf eine Gerade. Ein n-Eck lässt sich von einer Ecke aus in n − 2 Dreiecke teilen.","voraus":"Gilt für jedes Dreieck in der Ebene; die Vielecksformel für die Innenwinkel.","fehler":"Beim n-Eck n · 180° rechnen.","verwandt":"Außenwinkelsatz. Gleichschenkliges Dreieck.","weg":"G5 Stufen- und Wechselwinkel","klassen":[{"klasse":5,"art":"Vorwissen","text":"Rechteck: 4 · 90° = 360°","thema":null},{"klasse":7,"art":"Einführung","text":"Dreieck mit 50° und 60°: dritter Winkel 70°","thema":null},{"klasse":7,"art":"Einführung","text":"Fünfeck: (5 − 2) · 180° = 540°","thema":null},{"klasse":7,"art":"Einführung","text":"Außenwinkel zu den Innenwinkeln 50° und 60°: 110°","thema":null}],"zeichen":null,"schulart":"Gymnasium: 7 · Realschule Gruppe I: 7 · Realschule Gruppe II/III: 7 · IB (Planung der App): Jahr 2"},{"id":"G7","name":"Besondere Vierecke","satz":"Quadrat, Rechteck, Raute, Parallelogramm, Trapez, Drachenviereck: Jedes hat seine festen Eigenschaften.","idee":3,"gym":"5–7","rs":"5–7","ib":"1–3","sonne":"–","planet":"Geometrie","wirkstelle":"","genau":"","warum":"Jede Sorte ist durch Eigenschaften festgelegt; wer mehr Eigenschaften hat, gehört auch zu den allgemeineren Sorten.","voraus":"Die Eigenschaften gelten für die ganze Sorte, nicht nur für das gezeichnete Beispiel.","fehler":"Meinen, ein Quadrat sei kein Rechteck.","verwandt":"Symmetrie ordnet die Vierecke. Flächenformeln (Planet Fläche und Raum).","weg":"–","klassen":[{"klasse":5,"art":"Einführung","text":"Jedes Quadrat ist ein Rechteck und eine Raute – aber nicht jedes Rechteck ein Quadrat","thema":null},{"klasse":7,"art":"Anwendung","text":"Parallelogramm mit einem Winkel von 70°: Nachbarwinkel 110°, Gegenwinkel 70°","thema":null}],"zeichen":null,"schulart":"Gymnasium: 5 (erkennen), 7 (ordnen) · Realschule Gruppe I: 5, 8 · Realschule Gruppe II/III: 5, 8 · IB (Planung der App): Jahr 1–3"},{"id":"G8","name":"Ortslinien","satz":"Kreis: gleich weit von einem Punkt. Mittelsenkrechte: gleich weit von zwei Punkten. Winkelhalbierende: gleich weit von zwei Schenkeln.","idee":2,"gym":"5–7","rs":"6–7","ib":"3","sonne":"–","planet":"Geometrie","wirkstelle":"","genau":"","warum":"Spiegelt man an der Mittelsenkrechten, tauschen A und B die Plätze; jeder Punkt auf der Achse bleibt liegen und ist deshalb von beiden gleich weit entfernt.","voraus":"Alle Punkte der Linie haben die Eigenschaft – und kein anderer Punkt hat sie.","fehler":"Nur einen Punkt einzeichnen statt der ganzen Linie.","verwandt":"Umkreis und Inkreis. Symmetrie.","weg":"G2 Parallel, senkrecht, Abstand","klassen":[{"klasse":5,"art":"Einführung","text":"Alle Punkte, die 3 cm von M entfernt sind: Kreis um M mit r = 3 cm","thema":null},{"klasse":7,"art":"Einführung","text":"A(0 &#124; 0), B(4 &#124; 0): Der Punkt (2 &#124; 3) ist von beiden gleich weit entfernt","thema":null}],"zeichen":null,"schulart":"Gymnasium: 5 (Abstandsbedingungen), 7 (Mittelsenkrechte, Winkelhalbierende) · Realschule Gruppe I: 6 (Konstruktion), 7 (Ortslinien) · Realschule Gruppe II/III: 6, 7 (nur Überschrift) · IB (Planung der App): Jahr 3"},{"id":"G9","name":"Gleichschenkliges Dreieck","satz":"Gleiche Schenkel, gleiche Basiswinkel – und umgekehrt. Gleichseitig: dreimal 60°.","idee":3,"gym":"7","rs":"7","ib":"3","sonne":"–","planet":"Geometrie","wirkstelle":"","genau":"","warum":"Das Dreieck ist achsensymmetrisch; die Spiegelung an der Achse durch die Spitze legt die Basiswinkel aufeinander.","voraus":"Zwei Seiten sind gleich lang. Umkehrung: Sind zwei Winkel gleich, sind es auch die gegenüberliegenden Seiten.","fehler":"Den Winkel an der Spitze für einen Basiswinkel halten.","verwandt":"Symmetrie. Satz des Thales.","weg":"G6 Winkelsumme, G16 Symmetrie","klassen":[{"klasse":7,"art":"Einführung","text":"Winkel an der Spitze 40°: Basiswinkel je (180° − 40°) : 2 = 70°","thema":null},{"klasse":7,"art":"Einführung","text":"Gleichseitiges Dreieck: 3 · 60° = 180°","thema":null}],"zeichen":null,"schulart":"Gymnasium: 7 · Realschule Gruppe I: 6 · Realschule Gruppe II/III: 6 · IB (Planung der App): Jahr 3"},{"id":"G10","name":"Kongruenzsätze","satz":"Drei passende Angaben legen ein Dreieck fest: SSS, SWS, WSW, SsW (der Winkel liegt der längeren Seite gegenüber). Zwei Seiten sind zusammen immer länger als die dritte.","idee":3,"gym":"7","rs":"7","ib":"3","sonne":"–","planet":"Geometrie","wirkstelle":"","genau":"","warum":"Konstruiert man mit drei passenden Angaben, bleibt beim Zeichnen keine Wahl: Es entsteht immer dasselbe Dreieck.","voraus":"Bei SsW muss der Winkel der längeren der beiden Seiten gegenüberliegen. Drei Winkel reichen nicht.","fehler":"WWW oder „zwei Seiten und irgendein Winkel“ für einen Kongruenzsatz halten.","verwandt":"Spiegeln, Verschieben, Drehen. Ähnlichkeit: gleiche Winkel genügen dort.","weg":"–","klassen":[{"klasse":7,"art":"Einführung","text":"3 cm, 4 cm, 5 cm: genau ein Dreieck (SSS)","thema":null},{"klasse":7,"art":"Einführung","text":"2 cm, 3 cm, 6 cm: kein Dreieck, denn 2 + 3 < 6","thema":null},{"klasse":7,"art":"Einführung","text":"Winkel 50°, 60°, 70°: beliebig viele verschieden große Dreiecke","thema":null}],"zeichen":null,"schulart":"Gymnasium: 7 · Realschule Gruppe I: 7 · Realschule Gruppe II/III: nicht eindeutig · IB (Planung der App): Jahr 3"},{"id":"G11","name":"Satz und Kehrsatz","satz":"Die Umkehrung eines Satzes ist ein neuer Satz und muss eigens begründet werden.","idee":3,"gym":"7","rs":"7","ib":"3–4","sonne":"–","planet":"Geometrie","wirkstelle":"","genau":"","warum":"„Wenn A, dann B“ sagt nichts darüber, ob aus B auch A folgt.","voraus":"Jede Umkehrung braucht eine eigene Begründung; ein Gegenbeispiel widerlegt sie.","fehler":"Aus einem Satz stillschweigend seine Umkehrung machen.","verwandt":"Arbeitsweise Begründen. Aussagenlogik (Entdecker-Inseln).","weg":"–","klassen":[{"klasse":7,"art":"Einführung","text":"Satz: Jedes Quadrat hat vier rechte Winkel. Die Umkehrung ist falsch – Gegenbeispiel: Rechteck 3 cm mal 5 cm","thema":null}],"zeichen":null,"schulart":"Gymnasium: 7 · Realschule Gruppe I: – (nicht genannt) · Realschule Gruppe II/III: – (nicht genannt) · IB (Planung der App): Jahr 3–4"},{"id":"G12","name":"Satz des Thales","satz":"Liegt die Ecke auf dem Halbkreis über einer Seite, hat das Dreieck dort einen rechten Winkel – und umgekehrt.","idee":2,"gym":"7","rs":"7","ib":"4","sonne":"–","planet":"Geometrie","wirkstelle":"","genau":"","warum":"Die Radien zu den drei Ecken sind gleich lang und teilen das Dreieck in zwei gleichschenklige. Deren Basiswinkel ergeben bei C zusammen die Hälfte von 180°.","voraus":"Die Seite AB ist ein Durchmesser, C liegt auf dem Kreis und ist weder A noch B.","fehler":"Den Satz bei einer Sehne anwenden, die kein Durchmesser ist.","verwandt":"Umkehrung: Der Umkreismittelpunkt eines rechtwinkligen Dreiecks ist die Mitte der Hypotenuse.","weg":"G9 Gleichschenkliges Dreieck, G6 Winkelsumme","klassen":[{"klasse":7,"art":"Einführung","text":"A(−5 &#124; 0), B(5 &#124; 0), C(3 &#124; 4) auf dem Kreis um den Ursprung: Der Winkel bei C ist 90°","thema":null}],"zeichen":null,"schulart":"Gymnasium: 7 · Realschule Gruppe I: – (in der Lehrplan-Kopie nicht genannt) · Realschule Gruppe II/III: – (nicht genannt) · IB (Planung der App): Jahr 4"},{"id":"G13","name":"Tangente","satz":"Die Tangente steht senkrecht auf dem Radius zum Berührpunkt.","idee":2,"gym":"7","rs":"7","ib":"4","sonne":"–","planet":"Geometrie","wirkstelle":"","genau":"","warum":"Der Berührpunkt ist der Punkt der Tangente, der dem Mittelpunkt am nächsten liegt – und die kürzeste Verbindung steht senkrecht.","voraus":"Die Gerade berührt den Kreis in genau einem Punkt.","fehler":"Die Tangente „nach Augenmaß“ anlegen statt senkrecht zum Radius.","verwandt":"Tangente von einem äußeren Punkt: mit dem Thaleskreis. Abstand.","weg":"G2 Parallel, senkrecht, Abstand","klassen":[{"klasse":7,"art":"Einführung","text":"Kreis um den Ursprung mit r = 5, Berührpunkt (3 &#124; 4): Der Radius hat die Steigung 4/3, die Tangente −¾ – sie stehen senkrecht","thema":null},{"klasse":9,"art":"Anwendung","text":"Äußerer Punkt 13 cm von M, r = 5 cm: Das Tangentenstück ist 12 cm lang","thema":null}],"zeichen":null,"schulart":"Gymnasium: 7 · Realschule Gruppe I: 7 · Realschule Gruppe II/III: 7 (nur Überschrift) · IB (Planung der App): Jahr 4"},{"id":"G14","name":"Umkreis und Inkreis","satz":"Umkreis-Mittelpunkt: Schnitt der Mittelsenkrechten. Inkreis-Mittelpunkt: Schnitt der Winkelhalbierenden.","idee":2,"gym":"7","rs":"7","ib":"4","sonne":"–","planet":"Geometrie","wirkstelle":"","genau":"","warum":"Ein Punkt auf zwei Mittelsenkrechten ist von allen drei Ecken gleich weit entfernt. Ein Punkt auf zwei Winkelhalbierenden ist von allen drei Seiten gleich weit entfernt.","voraus":"Gilt für jedes Dreieck. Der Umkreismittelpunkt kann außerhalb liegen (stumpfwinkliges Dreieck).","fehler":"Mittelsenkrechte und Winkelhalbierende vertauschen.","verwandt":"Ortslinien. Schwerpunkt: Schnitt der Seitenhalbierenden.","weg":"G8 Ortslinien","klassen":[{"klasse":7,"art":"Einführung","text":"A(0 &#124; 0), B(6 &#124; 0), C(0 &#124; 8): Umkreismittelpunkt (3 &#124; 4), von jeder Ecke 5 entfernt","thema":null}],"zeichen":null,"schulart":"Gymnasium: 7 · Realschule Gruppe I: 7 · Realschule Gruppe II/III: 7 (nur Überschrift) · IB (Planung der App): Jahr 4"},{"id":"G15","name":"Spiegeln, Verschieben, Drehen","satz":"Diese Abbildungen ändern weder Längen noch Winkel: Bild und Original sind deckungsgleich.","idee":3,"gym":"7","rs":"6","ib":"3","sonne":"–","planet":"Geometrie","wirkstelle":"","genau":"","warum":"Die Figur wird als Ganzes bewegt, nicht verformt.","voraus":"Nur diese Bewegungen und ihre Verkettungen. Vergrößern gehört nicht dazu.","fehler":"Beim Spiegeln den Abstand zur Achse nicht senkrecht abtragen.","verwandt":"Die Achsenspiegelung kehrt den Umlaufsinn um, Verschiebung und Drehung nicht. Zentrische Streckung: Ähnlichkeit.","weg":"–","klassen":[{"klasse":7,"art":"Einführung","text":"Spiegelung an der y-Achse: A(2 &#124; 1) → A'(−2 &#124; 1), B(5 &#124; 1) → B'(−5 &#124; 1). Die Strecke ist vorher und nachher 3 lang","thema":null}],"zeichen":null,"schulart":"Gymnasium: 7 (Achsen- und Punktspiegelung) · Realschule Gruppe I: 6 (Achsenspiegelung), 7 (Verschiebung), 8 (Drehung) · Realschule Gruppe II/III: 6, 7; Drehung nicht genannt · IB (Planung der App): Jahr 3"},{"id":"G16","name":"Symmetrie","satz":"Achsensymmetrisch: Spiegeln an der Achse ändert nichts. Punktsymmetrisch: halbe Drehung ändert nichts.","idee":3,"gym":"7","rs":"6","ib":"3","sonne":"–","planet":"Geometrie","wirkstelle":"","genau":"","warum":"Eine Figur ist symmetrisch, wenn eine Bewegung sie auf sich selbst abbildet.","voraus":"Achsensymmetrie: Spiegelung. Punktsymmetrie: Drehung um 180°.","fehler":"Die Diagonale eines Rechtecks für eine Symmetrieachse halten.","verwandt":"Besondere Vierecke. Symmetrie von Graphen (Planet Funktionen).","weg":"G15 Spiegeln, Verschieben, Drehen","klassen":[{"klasse":5,"art":"Vorwissen","text":"Rechteck: 2 Symmetrieachsen. Quadrat: 4","thema":null},{"klasse":7,"art":"Einführung","text":"Ein Parallelogramm ist punktsymmetrisch, im Allgemeinen aber nicht achsensymmetrisch","thema":null}],"zeichen":null,"schulart":"Gymnasium: 7 · Realschule Gruppe I: 6 · Realschule Gruppe II/III: 6 · IB (Planung der App): Jahr 3"},{"id":"G17","name":"Vektoren","satz":"Ein Vektor ist eine Verschiebung: Spitze minus Fuß. Der Gegenvektor führt zurück.","idee":3,"gym":"7","rs":"6","ib":"3","sonne":"2","planet":"Geometrie","wirkstelle":"","genau":"","warum":"Eine Verschiebung ist durch „wie weit nach rechts, wie weit nach oben“ vollständig beschrieben – gleich, wo sie ansetzt.","voraus":"Koordinaten: Spitze minus Fuß.","fehler":"Fuß minus Spitze rechnen.","verwandt":"Plus und Minus mit negativen Zahlen (Rechenregel 2). Betrag eines Vektors: Satz des Pythagoras.","weg":"G15 Spiegeln, Verschieben, Drehen, Rechenregel 2 Plus und Minus mit negativen Zahlen","klassen":[],"zeichen":null,"schulart":"Gymnasium: – · Realschule Gruppe I: 7 · Realschule Gruppe II/III: 7 · IB (Planung der App): Jahr 3"},{"id":"G18","name":"Fläche mit Determinante","satz":"Zwei Vektoren spannen ein Parallelogramm auf; seine Fläche ist der Betrag von a·d − b·c.","idee":3,"gym":"–","rs":"7","ib":"–","sonne":"–","planet":"Geometrie","wirkstelle":"","genau":"","warum":"Das Parallelogramm lässt sich in ein Rechteck einpassen; zieht man die überstehenden Dreiecke ab, bleibt a · d − b · c.","voraus":"Die beiden Vektoren (a; b) und (c; d) setzen an derselben Ecke an. Für das Dreieck: die Hälfte.","fehler":"Das Vorzeichen stehen lassen – eine Fläche ist nie negativ.","verwandt":"Parallelogramm und Dreieck (Planet Fläche und Raum).","weg":"G17 Vektoren","klassen":[],"zeichen":null,"schulart":"Gymnasium: – · Realschule Gruppe I: 7 · Realschule Gruppe II/III: 7 · IB (Planung der App): –"},{"id":"G19","name":"Matrizen und Skalarprodukt","satz":"Eine Matrix beschreibt eine Abbildung. Skalarprodukt null heißt senkrecht.","idee":3,"gym":"–","rs":"10","ib":"5","sonne":"–","planet":"Geometrie","wirkstelle":"","genau":"","warum":"Das Skalarprodukt misst, wie sehr zwei Vektoren in dieselbe Richtung zeigen; stehen sie senkrecht, ist es null.","voraus":"Skalarprodukt von (a; b) und (c; d): a · c + b · d. Beide Vektoren sind nicht der Nullvektor.","fehler":"Skalarprodukt und Determinante verwechseln.","verwandt":"Senkrechte Geraden (Planet Funktionen). Kosinussatz.","weg":"G17 Vektoren","klassen":[],"zeichen":null,"schulart":"Gymnasium: – · Realschule Gruppe I: 10 (nur Gruppe I) · Realschule Gruppe II/III: – · IB (Planung der App): Jahr 5"},{"id":"G20","name":"Ähnlichkeit","satz":"Ähnliche Figuren haben gleiche Winkel und alle Seiten im selben Verhältnis.","idee":4,"gym":"9","rs":"9","ib":"3","sonne":"11","planet":"Geometrie","wirkstelle":"","genau":"","warum":"Eine zentrische Streckung nimmt jede Länge mit demselben Faktor mal und lässt jeden Winkel, wie er ist.","voraus":"Für Dreiecke genügt: zwei Winkel stimmen überein. Für andere Vielecke braucht man Winkel und Seitenverhältnisse.","fehler":"Gleiche Form mit gleicher Größe verwechseln; bei Vierecken nur die Winkel prüfen (Rechteck und Quadrat).","verwandt":"Verhältnis (Rechenregel 11). Maßstab (Planet Geld und Verhältnisse).","weg":"Rechenregel 11 Verhältnis (Dreisatz)","klassen":[{"klasse":9,"art":"Einführung","text":"Dreiecke mit 3 cm, 4 cm, 5 cm und 6 cm, 8 cm, 10 cm: alle Seitenverhältnisse 1 : 2, also ähnlich","thema":null}],"zeichen":null,"schulart":"Gymnasium: 9 · Realschule Gruppe I: 9 · Realschule Gruppe II/III: 9 (nur Überschrift „Streckung“) · IB (Planung der App): Jahr 3"},{"id":"G21","name":"Strahlensätze","satz":"Schneiden Parallelen zwei Strahlen, stehen die Abschnitte im selben Verhältnis.","idee":4,"gym":"9","rs":"9","ib":"3","sonne":"11","planet":"Geometrie","wirkstelle":"","genau":"","warum":"Die Parallelen schneiden aus den Strahlen ähnliche Dreiecke heraus.","voraus":"Die schneidenden Geraden sind parallel. Wer die Parallelenstücke einbezieht, misst alle Strahlabschnitte vom Scheitel aus.","fehler":"Beim Satz mit den Parallelenstücken Teilabschnitte statt der Abschnitte vom Scheitel nehmen.","verwandt":"Ähnlichkeit. Bruchgleichungen (Planet Algebra).","weg":"G20 Ähnlichkeit, Rechenregel 11 Verhältnis (Dreisatz)","klassen":[{"klasse":9,"art":"Einführung","text":"Abschnitte vom Scheitel: 2 cm und 3 cm auf dem einen Strahl, 4 cm und x auf dem anderen: 2 : 3 = 4 : x, also x = 6 cm","thema":null}],"zeichen":null,"schulart":"Gymnasium: 9 · Realschule Gruppe I: 9 · Realschule Gruppe II/III: 9 (nur Überschrift „Streckung“) · IB (Planung der App): Jahr 3"},{"id":"G22","name":"Vergrößern mit Faktor k","satz":"Längen mal k, Flächen mal k², Volumen mal k³.","idee":4,"gym":"8–9","rs":"9","ib":"3","sonne":"8","planet":"Geometrie","wirkstelle":"","genau":"","warum":"Eine Fläche hat zwei Richtungen, in denen sie wächst, ein Körper drei.","voraus":"Alle Längen werden mit demselben k > 0 malgenommen.","fehler":"Meinen, doppelte Länge gebe doppelte Fläche.","verwandt":"Potenzen (Rechenregel 8). Flächen- und Raumeinheiten: k = 10.","weg":"G20 Ähnlichkeit, Rechenregel 8 Potenzen","klassen":[{"klasse":5,"art":"Vorwissen","text":"Maßstab 1 : 100: 1 cm im Plan ist 1 m in Wirklichkeit","thema":null},{"klasse":9,"art":"Einführung","text":"k = 3: aus 2 cm werden 6 cm, aus 4 cm² werden 36 cm², aus 8 cm³ werden 216 cm³","thema":null}],"zeichen":null,"schulart":"Gymnasium: 9 · Realschule Gruppe I: 9 · Realschule Gruppe II/III: 9 (nur Überschrift „Streckung“) · IB (Planung der App): Jahr 3"},{"id":"G23","name":"Schwerpunkt","satz":"Die Seitenhalbierenden schneiden sich im Schwerpunkt; er teilt sie im Verhältnis 2 : 1.","idee":4,"gym":"9","rs":"9","ib":"3","sonne":"11","planet":"Geometrie","wirkstelle":"","genau":"","warum":"Die Verbindung zweier Seitenmitten ist parallel zur dritten Seite und halb so lang; daraus folgt mit dem Strahlensatz das Verhältnis 2 : 1.","voraus":"Gilt für jedes Dreieck. Das längere Stück liegt an der Ecke.","fehler":"Seitenhalbierende und Winkelhalbierende verwechseln.","verwandt":"Koordinaten des Schwerpunkts: Mittelwert der drei Ecken.","weg":"G21 Strahlensätze, Rechenregel 11 Verhältnis (Dreisatz)","klassen":[],"zeichen":null,"schulart":"Gymnasium: – · Realschule Gruppe I: 9 (Gruppe I, auch 7) · Realschule Gruppe II/III: – · IB (Planung der App): Jahr 3"},{"id":"G24","name":"Satz des Pythagoras","satz":"Im rechtwinkligen Dreieck mit den Katheten a, b und der Hypotenuse c gilt a² + b² = c² – und nur dort.","idee":5,"gym":"9","rs":"9","ib":"3","sonne":"12","planet":"Geometrie","wirkstelle":"","genau":"","warum":"Vier gleiche rechtwinklige Dreiecke lassen sich auf zwei Arten in ein Quadrat mit der Seite a + b legen: Einmal bleibt c² frei, einmal a² und b².","voraus":"Das Dreieck ist rechtwinklig; c liegt dem rechten Winkel gegenüber. Umkehrung: Gilt a² + b² = c², ist das Dreieck rechtwinklig.","fehler":"a + b = c rechnen. Die Hypotenuse falsch wählen.","verwandt":"Gegenrechnung Wurzel (Rechenregel 12). Abstand zweier Punkte. Kosinussatz.","weg":"Rechenregel 12 Gegenrechnung","klassen":[{"klasse":9,"art":"Einführung","text":"Katheten 3 cm und 4 cm: Hypotenuse 5 cm","thema":null},{"klasse":9,"art":"Einführung","text":"Umkehrung: 5 cm, 12 cm, 13 cm – wegen 25 + 144 = 169 rechtwinklig","thema":null},{"klasse":9,"art":"Anwendung","text":"Diagonale im Quadrat mit Seite 1 cm: √2 cm ≈ 1,41 cm","thema":null}],"zeichen":null,"schulart":"Gymnasium: 9 · Realschule Gruppe I: 9 · Realschule Gruppe II/III: 9 · IB (Planung der App): Jahr 3"},{"id":"G25","name":"Sinus, Kosinus, Tangens","satz":"Sinus = Gegenkathete durch Hypotenuse, Kosinus = Ankathete durch Hypotenuse, Tangens = Gegenkathete durch Ankathete.","idee":5,"gym":"9","rs":"9","ib":"4","sonne":"11","planet":"Geometrie","wirkstelle":"","genau":"","warum":"Alle rechtwinkligen Dreiecke mit demselben spitzen Winkel sind ähnlich; ihre Seitenverhältnisse hängen deshalb nur vom Winkel ab.","voraus":"Rechtwinkliges Dreieck, spitzer Winkel. Gegenkathete und Ankathete richten sich nach dem betrachteten Winkel.","fehler":"Gegenkathete und Ankathete vertauschen. Taschenrechner nicht auf Grad eingestellt.","verwandt":"Ähnlichkeit. Steigung einer Geraden: m = tan α (Planet Funktionen).","weg":"G20 Ähnlichkeit, Rechenregel 11 Verhältnis (Dreisatz)","klassen":[{"klasse":9,"art":"Einführung","text":"Dreieck 3 cm, 4 cm, 5 cm, Winkel gegenüber der 3-cm-Seite: sin = 3/5, cos = 4/5, tan = 3/4","thema":null},{"klasse":9,"art":"Anwendung","text":"Leiter 5 m lang, 60° zum Boden: Sie reicht 5 m · sin 60° ≈ 4,33 m hoch","thema":null}],"zeichen":null,"schulart":"Gymnasium: 9 · Realschule Gruppe I: 9 · Realschule Gruppe II/III: 9 · IB (Planung der App): Jahr 4"},{"id":"G26","name":"Zusammenhänge der Winkelfunktionen","satz":"sin² α + cos² α = 1. Für cos α ≠ 0 gilt tan α = sin α : cos α.","idee":5,"gym":"9","rs":"9","ib":"4","sonne":"–","planet":"Geometrie","wirkstelle":"","genau":"","warum":"Im rechtwinkligen Dreieck mit Hypotenuse 1 sind die Katheten sin α und cos α; der Satz des Pythagoras liefert sin² α + cos² α = 1.","voraus":"tan α ist nur erklärt, wenn cos α nicht null ist.","fehler":"sin² α als sin(α²) lesen.","verwandt":"Satz des Pythagoras. Einheitskreis.","weg":"G25 Sinus, Kosinus, Tangens, G24 Satz des Pythagoras","klassen":[{"klasse":9,"art":"Einführung","text":"(3/5)² + (4/5)² = 1","thema":null},{"klasse":9,"art":"Einführung","text":"(3/5) : (4/5) = 3/4","thema":null}],"zeichen":null,"schulart":"Gymnasium: 9 · Realschule Gruppe I: 10 (Gruppe I) · Realschule Gruppe II/III: nicht genannt · IB (Planung der App): Jahr 4"},{"id":"G27","name":"Einheitskreis","satz":"Am Kreis mit Radius 1 sind Kosinus und Sinus die Koordinaten des Punktes – für jeden Winkel.","idee":5,"gym":"9","rs":"10","ib":"4","sonne":"–","planet":"Geometrie","wirkstelle":"","genau":"","warum":"Dreht man den Radius 1 um den Winkel α, hat seine Spitze die Koordinaten (cos α | sin α). So bekommen auch Winkel über 90° einen Sinus und Kosinus.","voraus":"Radius 1; der Winkel wird von der positiven x-Achse aus gegen den Uhrzeigersinn gemessen.","fehler":"Das Vorzeichen im zweiten bis vierten Viertel übersehen.","verwandt":"Sinus- und Kosinusfunktion (Planet Funktionen).","weg":"G25 Sinus, Kosinus, Tangens","klassen":[{"klasse":9,"art":"Einführung","text":"sin 150° = sin 30° = 0,5","thema":null},{"klasse":9,"art":"Einführung","text":"cos 150° = −cos 30° ≈ −0,87","thema":null}],"zeichen":null,"schulart":"Gymnasium: 9 · Realschule Gruppe I: 10 (Gruppe I) · Realschule Gruppe II/III: nicht genannt · IB (Planung der App): Jahr 4"},{"id":"G28","name":"Sinussatz und Kosinussatz","satz":"In jedem Dreieck: Seite durch Sinus des Gegenwinkels ist für alle drei gleich. Der Kosinussatz ist Pythagoras mit Korrektur.","idee":5,"gym":"9","rs":"10","ib":"4","sonne":"–","planet":"Geometrie","wirkstelle":"","genau":"","warum":"Eine Höhe teilt jedes Dreieck in zwei rechtwinklige; dort gelten Sinus, Kosinus und Pythagoras.","voraus":"Jedes Dreieck. Kosinussatz: c² = a² + b² − 2 · a · b · cos γ, mit γ zwischen a und b.","fehler":"Beim Sinussatz übersehen, dass zu einem Sinuswert zwei Winkel gehören können.","verwandt":"Für γ = 90° wird der Kosinussatz zum Satz des Pythagoras. Kongruenzsätze sagen, wann die Angaben reichen.","weg":"G24 Satz des Pythagoras, G25 Sinus, Kosinus, Tangens","klassen":[{"klasse":9,"art":"Einführung","text":"a = 5 cm, b = 7 cm, γ = 60°: c² = 25 + 49 − 2 · 5 · 7 · 0,5 = 39, also c ≈ 6,24 cm","thema":null},{"klasse":9,"art":"Einführung","text":"γ = 90°: Wegen cos 90° = 0 bleibt c² = a² + b²","thema":null}],"zeichen":null,"schulart":"Gymnasium: 9 · Realschule Gruppe I: 10 · Realschule Gruppe II/III: 10 · IB (Planung der App): Jahr 4"},{"id":"G29","name":"Additionstheoreme","satz":"Der Sinus einer Summe ist nicht die Summe der Sinus: sin(α + β) = sin α · cos β + cos α · sin β.","idee":5,"gym":"9","rs":"10","ib":"4","sonne":"–","planet":"Geometrie","wirkstelle":"","genau":"","warum":"Zerlegt man die Drehung um α + β in zwei Drehungen nacheinander, ergeben sich die Formeln aus rechtwinkligen Dreiecken.","voraus":"Gilt für alle Winkel.","fehler":"sin(α + β) = sin α + sin β rechnen.","verwandt":"Einheitskreis.","weg":"G27 Einheitskreis","klassen":[],"zeichen":null,"schulart":"Gymnasium: – · Realschule Gruppe I: 10 (nur Gruppe I) · Realschule Gruppe II/III: – · IB (Planung der App): Jahr 4"},{"id":"G30","name":"Winkel aus Sinus oder Kosinus","satz":"Zu einem Wert gehören in einer vollen Drehung meist zwei Winkel.","idee":5,"gym":"9","rs":"10","ib":"5","sonne":"12","planet":"Geometrie","wirkstelle":"","genau":"","warum":"Am Einheitskreis liegen zu einer Höhe (Sinus) zwei Punkte, links und rechts; zu einer x-Koordinate (Kosinus) zwei Punkte, oben und unten.","voraus":"Der Wert liegt zwischen −1 und 1. Bei genau 1 oder −1 gibt es in einer vollen Drehung nur einen Winkel.","fehler":"Nur den Winkel nennen, den der Taschenrechner anzeigt.","verwandt":"Gegenrechnung (Rechenregel 12). Einheitskreis.","weg":"G27 Einheitskreis, Rechenregel 12 Gegenrechnung","klassen":[{"klasse":9,"art":"Einführung","text":"sin α = 0,5 zwischen 0° und 360°: α = 30° oder α = 150°","thema":null}],"zeichen":null,"schulart":"Gymnasium: 9, 10 · Realschule Gruppe I: 10 (Gruppe I) · Realschule Gruppe II/III: nicht genannt · IB (Planung der App): Jahr 5"},{"id":"F1","name":"Fläche messen","satz":"Flächeninhalt heißt: Wie viele Einheitsquadrate passen hinein? Wird die Längeneinheit zehnmal kleiner, braucht man 100-mal so viele.","idee":1,"gym":"5","rs":"5","ib":"1","sonne":"1","planet":"Fläche und Raum","wirkstelle":"","genau":"","warum":"Ein Quadratdezimeter ist 10 cm lang und 10 cm breit. Es passen also 10 Reihen zu je 10 Quadratzentimetern hinein: 100.","voraus":"Gilt zwischen benachbarten Einheiten mm², cm², dm², m² und weiter m², a, ha, km².","fehler":"Mit 10 umrechnen wie bei Längen: 3 m² = 30 dm².","verwandt":"Längen: Umrechnungszahl 10. Volumen: 1 000. Stellenwert (Rechenregel 1).","weg":"Rechenregel 1 Stellenwert","klassen":[{"klasse":5,"art":"Einführung","text":"3 m² = 300 dm²","thema":null},{"klasse":5,"art":"Einführung","text":"1 m² = 10 000 cm²","thema":null},{"klasse":8,"art":"Anwendung","text":"5 000 cm² = 0,5 m²","thema":null}],"zeichen":null,"schulart":"Gymnasium: 5 · Realschule Gruppe I: 5 · Realschule Gruppe II/III: 5 · IB (Planung der App): Jahr 1"},{"id":"F2","name":"Rechteck","satz":"Fläche = Länge mal Breite. Umfang = einmal außen herum.","idee":1,"gym":"5","rs":"5","ib":"1","sonne":"–","planet":"Fläche und Raum","wirkstelle":"","genau":"","warum":"In ein Rechteck mit 6 cm Länge und 4 cm Breite passen 4 Reihen zu je 6 Einheitsquadraten.","voraus":"Beide Seiten in derselben Einheit.","fehler":"Fläche und Umfang verwechseln; cm statt cm² schreiben.","verwandt":"Quadrat: Seite mal Seite. Ausmultiplizieren am Rechteck (Rechenregel 6).","weg":"F1 Fläche messen","klassen":[{"klasse":5,"art":"Einführung","text":"6 cm lang, 4 cm breit: A = 6 cm · 4 cm = 24 cm²","thema":null},{"klasse":5,"art":"Einführung","text":"Dasselbe Rechteck: u = 2 · (6 cm + 4 cm) = 20 cm","thema":null},{"klasse":7,"art":"Anwendung","text":"Seiten x und x + 4: A = x · (x + 4) = x² + 4x","thema":null}],"zeichen":null,"schulart":"Gymnasium: 5 · Realschule Gruppe I: 5 · Realschule Gruppe II/III: 5 · IB (Planung der App): Jahr 1"},{"id":"F3","name":"Fläche ist nicht Umfang","satz":"Derselbe Rand kann verschieden viel Fläche einschließen.","idee":1,"gym":"5","rs":"5–8","ib":"1","sonne":"–","planet":"Fläche und Raum","wirkstelle":"","genau":"","warum":"Der Umfang misst den Rand (eine Länge), die Fläche das Innere. Ein langes, schmales Rechteck hat viel Rand und wenig Inneres.","voraus":"Gilt für alle Figuren.","fehler":"Aus „gleicher Umfang“ auf „gleiche Fläche“ schließen – oder umgekehrt.","verwandt":"Größter Flächeninhalt bei festem Umfang: das Quadrat (Kleinster und größter Wert, Planet Algebra).","weg":"F2 Rechteck","klassen":[{"klasse":5,"art":"Einführung","text":"Rechteck 6 cm mal 4 cm: u = 20 cm, A = 24 cm²","thema":null},{"klasse":5,"art":"Einführung","text":"Rechteck 9 cm mal 1 cm: u = 20 cm, A = 9 cm²","thema":null},{"klasse":9,"art":"Anwendung","text":"Umfang 20 cm: Die größte Fläche hat das Quadrat mit 25 cm²","thema":null}],"zeichen":null,"schulart":"Gymnasium: 5 · Realschule Gruppe I: 5 · Realschule Gruppe II/III: 5 · IB (Planung der App): Jahr 1"},{"id":"F4","name":"Zerlegen und Ergänzen","satz":"Lückenlos und ohne Überlappung neu legen: Der Flächeninhalt bleibt, der Umfang kann sich ändern.","idee":2,"gym":"5–6","rs":"5–6","ib":"1","sonne":"–","planet":"Fläche und Raum","wirkstelle":"","genau":"","warum":"Beim Zerschneiden und Umlegen geht kein Stück verloren und keines kommt dazu.","voraus":"Die Teile müssen lückenlos und ohne Überlappung liegen.","fehler":"Glauben, dass beim Umlegen auch der Umfang gleich bleibt.","verwandt":"Alle Flächenformeln dieses Planeten entstehen so.","weg":"F2 Rechteck","klassen":[{"klasse":5,"art":"Einführung","text":"L-Form, zerlegt: 6 cm · 2 cm + 2 cm · 3 cm = 18 cm²","thema":null},{"klasse":5,"art":"Einführung","text":"Dieselbe L-Form, ergänzt: 6 cm · 5 cm − 4 cm · 3 cm = 18 cm²","thema":null}],"zeichen":null,"schulart":"Gymnasium: 5 · Realschule Gruppe I: 5 · Realschule Gruppe II/III: 5 · IB (Planung der App): Jahr 1"},{"id":"F5","name":"Parallelogramm","satz":"Fläche = Grundseite mal zugehörige Höhe. Zu jeder gewählten Grundseite gehört ihre senkrechte Höhe.","idee":2,"gym":"6","rs":"6","ib":"–","sonne":"–","planet":"Fläche und Raum","wirkstelle":"","genau":"","warum":"Schneidet man an einer Seite ein Dreieck ab und setzt es an der anderen an, entsteht ein Rechteck mit derselben Grundseite und derselben Höhe.","voraus":"Die Höhe steht senkrecht auf der gewählten Grundseite.","fehler":"Die schräge Seite statt der Höhe nehmen.","verwandt":"Rechteck als Sonderfall. Fläche mit Determinante (Planet Geometrie, Realschule).","weg":"F4 Zerlegen und Ergänzen","klassen":[{"klasse":6,"art":"Einführung","text":"g = 7 cm, h = 4 cm: A = 28 cm²","thema":null},{"klasse":6,"art":"Einführung","text":"Dasselbe Parallelogramm, Grundseite 5 cm: zugehörige Höhe 28 cm² : 5 cm = 5,6 cm","thema":null}],"zeichen":null,"schulart":"Gymnasium: 6 · Realschule Gruppe I: 6 · Realschule Gruppe II/III: 6 · IB (Planung der App): –"},{"id":"F6","name":"Dreieck","satz":"Fläche = Grundseite mal zugehörige Höhe, geteilt durch 2.","idee":2,"gym":"6–8","rs":"6","ib":"4","sonne":"–","planet":"Fläche und Raum","wirkstelle":"","genau":"","warum":"Zwei gleiche Dreiecke lassen sich zu einem Parallelogramm zusammenlegen. Das Dreieck ist die Hälfte.","voraus":"Die Höhe gehört zur gewählten Grundseite und steht senkrecht auf ihr. Im stumpfwinkligen Dreieck liegen zwei der drei Höhen außerhalb.","fehler":"Das „geteilt durch 2“ vergessen. Eine Seite als Höhe nehmen, die nicht senkrecht steht.","verwandt":"Rechtwinkliges Dreieck: halbes Rechteck aus den beiden Katheten. Formeln umstellen (Planet Algebra).","weg":"F5 Parallelogramm","klassen":[{"klasse":6,"art":"Einführung","text":"g = 8 cm, h = 5 cm: A = 8 cm · 5 cm : 2 = 20 cm²","thema":null},{"klasse":8,"art":"Anwendung","text":"A = 20 cm², g = 8 cm: h = 2 · 20 cm² : 8 cm = 5 cm","thema":null}],"zeichen":null,"schulart":"Gymnasium: 6 · Realschule Gruppe I: 6 · Realschule Gruppe II/III: 6 · IB (Planung der App): Jahr 4"},{"id":"F7","name":"Trapez","satz":"Fläche = Mittelwert der beiden parallelen Seiten mal Höhe.","idee":2,"gym":"6–8","rs":"6","ib":"4","sonne":"–","planet":"Fläche und Raum","wirkstelle":"","genau":"","warum":"Zwei gleiche Trapeze ergeben ein Parallelogramm mit der Grundseite a + c. Das Trapez ist die Hälfte.","voraus":"a und c sind die beiden parallelen Seiten; h ist ihr Abstand.","fehler":"Die Schenkel statt der parallelen Seiten mitteln.","verwandt":"Parallelogramm (a = c) und Dreieck (c = 0) sind Sonderfälle.","weg":"F5 Parallelogramm","klassen":[{"klasse":6,"art":"Einführung","text":"a = 9 cm, c = 5 cm, h = 4 cm: A = (9 cm + 5 cm) : 2 · 4 cm = 28 cm²","thema":null}],"zeichen":null,"schulart":"Gymnasium: 6 · Realschule Gruppe I: 6 · Realschule Gruppe II/III: 6 · IB (Planung der App): Jahr 4"},{"id":"F8","name":"Drachenviereck und Raute","satz":"Bei senkrechten Diagonalen ist die Fläche ihr halbes Produkt.","idee":2,"gym":"6","rs":"6","ib":"–","sonne":"–","planet":"Fläche und Raum","wirkstelle":"","genau":"","warum":"Das Rechteck, das man um die beiden Diagonalen legt, ist genau doppelt so groß wie das Viereck.","voraus":"Die Diagonalen stehen senkrecht aufeinander – das ist bei Drachenviereck, Raute und Quadrat so.","fehler":"Die Formel auf Vierecke anwenden, deren Diagonalen nicht senkrecht stehen.","verwandt":"Quadrat: halbes Diagonalenquadrat.","weg":"F4 Zerlegen und Ergänzen","klassen":[{"klasse":6,"art":"Einführung","text":"e = 8 cm, f = 5 cm: A = 8 cm · 5 cm : 2 = 20 cm²","thema":null}],"zeichen":null,"schulart":"Gymnasium: 6 (in der Lehrplan-Kopie nicht eigens genannt) · Realschule Gruppe I: 6 · Realschule Gruppe II/III: 6 · IB (Planung der App): –"},{"id":"F9","name":"Kreis","satz":"Der Umfang misst π Durchmesser: u = 2 · π · r. Die Fläche ist π mal Radius zum Quadrat: A = π · r².","idee":2,"gym":"8","rs":"9","ib":"3","sonne":"–","planet":"Fläche und Raum","wirkstelle":"","genau":"","warum":"Der Umfang ist bei jedem Kreis dasselbe Vielfache des Durchmessers: π, etwas mehr als 3. Schneidet man den Kreis in Tortenstücke und legt sie abwechselnd um, entsteht fast ein Rechteck: halber Umfang breit, r hoch.","voraus":"r ist der Radius, nicht der Durchmesser.","fehler":"Durchmesser statt Radius einsetzen. Meinen, doppelter Radius gebe doppelte Fläche.","verwandt":"π ist irrational (Planet Zahlen). Vergrößern mit Faktor k (Planet Geometrie).","weg":"F4 Zerlegen und Ergänzen","klassen":[{"klasse":8,"art":"Einführung","text":"r = 5 cm: u = 2 · π · 5 cm ≈ 31,4 cm","thema":null},{"klasse":8,"art":"Einführung","text":"r = 5 cm: A = π · 25 cm² ≈ 78,5 cm²","thema":null},{"klasse":8,"art":"Anwendung","text":"r = 10 cm statt 5 cm: Umfang doppelt, Fläche vierfach","thema":null}],"zeichen":null,"schulart":"Gymnasium: 8 · Realschule Gruppe I: 9 · Realschule Gruppe II/III: 9 · IB (Planung der App): Jahr 3"},{"id":"F10","name":"Kreisausschnitt","satz":"Der Winkelanteil bestimmt den Anteil am Kreisbogen und an der Kreisfläche.","idee":2,"gym":"8","rs":"9","ib":"3","sonne":"11","planet":"Fläche und Raum","wirkstelle":"","genau":"","warum":"Ein Ausschnitt mit 60° ist ein Sechstel des vollen Kreises – also auch ein Sechstel des Umfangs und ein Sechstel der Fläche.","voraus":"Der Winkel ist der Mittelpunktswinkel.","fehler":"Den Winkel nicht durch 360° teilen.","verwandt":"Verhältnis (Rechenregel 11). Kegelmantel: ein Kreisausschnitt.","weg":"F9 Kreis, Rechenregel 11 Verhältnis (Dreisatz)","klassen":[{"klasse":8,"art":"Einführung","text":"r = 6 cm, 60°: Bogen = 1/6 · 2 · π · 6 cm = 2π cm ≈ 6,3 cm","thema":null},{"klasse":8,"art":"Einführung","text":"r = 6 cm, 60°: A = 1/6 · π · 36 cm² = 6π cm² ≈ 18,8 cm²","thema":null}],"zeichen":null,"schulart":"Gymnasium: 8 (in der Lehrplan-Kopie nicht eigens genannt) · Realschule Gruppe I: 9 · Realschule Gruppe II/III: 9 (nur Überschrift „Kreise“) · IB (Planung der App): Jahr 3"},{"id":"F11","name":"Volumen messen","satz":"Volumen heißt: Wie viele Einheitswürfel passen hinein? Wird die Längeneinheit zehnmal kleiner, braucht man 1 000-mal so viele. 1 Liter = 1 dm³.","idee":1,"gym":"6","rs":"6","ib":"–","sonne":"1","planet":"Fläche und Raum","wirkstelle":"","genau":"","warum":"Ein Kubikdezimeter ist 10 cm lang, breit und hoch: 10 Schichten zu je 10 mal 10 Würfeln, also 1 000 Kubikzentimeter.","voraus":"Gilt zwischen benachbarten Einheiten mm³, cm³, dm³, m³. 1 l = 1 dm³, 1 ml = 1 cm³.","fehler":"Mit 10 oder 100 umrechnen.","verwandt":"Flächen: Umrechnungszahl 100. Stellenwert (Rechenregel 1).","weg":"Rechenregel 1 Stellenwert","klassen":[{"klasse":6,"art":"Einführung","text":"2 dm³ = 2 000 cm³","thema":null},{"klasse":6,"art":"Einführung","text":"1,5 l = 1,5 dm³ = 1 500 cm³","thema":null},{"klasse":6,"art":"Einführung","text":"1 m³ = 1 000 dm³ = 1 000 l","thema":null}],"zeichen":null,"schulart":"Gymnasium: 6 · Realschule Gruppe I: 6 · Realschule Gruppe II/III: 6 · IB (Planung der App): –"},{"id":"F12","name":"Quader","satz":"Volumen = Länge mal Breite mal Höhe.","idee":1,"gym":"6","rs":"6","ib":"–","sonne":"–","planet":"Fläche und Raum","wirkstelle":"","genau":"","warum":"Die unterste Schicht hat Länge mal Breite Würfel; die Höhe sagt, wie viele Schichten es sind.","voraus":"Alle drei Kanten in derselben Einheit.","fehler":"Die drei Kantenlängen addieren statt malnehmen.","verwandt":"Würfel: Kante hoch 3. Prisma: Grundfläche mal Höhe.","weg":"F11 Volumen messen","klassen":[{"klasse":5,"art":"Vorwissen","text":"Schachtel mit 3 Schichten zu je 5 mal 4 Würfeln: 60 Würfel","thema":null},{"klasse":6,"art":"Einführung","text":"5 cm · 4 cm · 3 cm = 60 cm³","thema":null},{"klasse":6,"art":"Einführung","text":"Würfel mit Kante 4 cm: 64 cm³","thema":null}],"zeichen":null,"schulart":"Gymnasium: 6 · Realschule Gruppe I: 6 · Realschule Gruppe II/III: 6 · IB (Planung der App): –"},{"id":"F13","name":"Oberfläche","satz":"Die Oberfläche misst die gesamte Außenfläche. Beim Quader addierst du die sechs Rechtecksflächen.","idee":4,"gym":"5–6","rs":"6","ib":"1","sonne":"–","planet":"Fläche und Raum","wirkstelle":"","genau":"","warum":"Die Oberfläche ist das, was man anmalen müsste. Beim Quader liegen sich je zwei gleiche Rechtecke gegenüber.","voraus":"Jede Fläche genau einmal zählen.","fehler":"Nur drei statt sechs Flächen nehmen. Oberfläche (cm²) und Volumen (cm³) verwechseln.","verwandt":"Netz. Mantel von Prisma, Zylinder, Pyramide, Kegel.","weg":"F2 Rechteck","klassen":[{"klasse":5,"art":"Einführung","text":"Quader 5 cm, 4 cm, 3 cm: O = 2 · (20 + 15 + 12) cm² = 94 cm²","thema":null},{"klasse":5,"art":"Einführung","text":"Würfel mit Kante 3 cm: O = 6 · 9 cm² = 54 cm²","thema":null}],"zeichen":null,"schulart":"Gymnasium: 5 (Quader), 6 (einfache Körper) · Realschule Gruppe I: 6 · Realschule Gruppe II/III: 6 · IB (Planung der App): Jahr 1"},{"id":"F14","name":"Netz und Schrägbild","satz":"Das Netz zeigt die aufgefaltete Oberfläche; das Schrägbild zeigt den Körper räumlich.","idee":4,"gym":"8–10","rs":"5–7","ib":"3–4","sonne":"–","planet":"Fläche und Raum","wirkstelle":"","genau":"","warum":"Das Netz entsteht durch Aufschneiden und Aufklappen. Im Schrägbild bleibt die Vorderseite unverzerrt; Kanten nach hinten werden schräg und verkürzt gezeichnet.","voraus":"Im Netz sind Kanten, die zusammengehören, gleich lang. Im Schrägbild kann man nur an unverzerrten Flächen messen.","fehler":"Ein Netz zeichnen, das sich nicht falten lässt. Im Schrägbild schräge Kanten in voller Länge zeichnen.","verwandt":"Oberfläche. Lage im Raum.","weg":"F13 Oberfläche","klassen":[{"klasse":5,"art":"Vorwissen","text":"Ein Würfelnetz hat 6 Quadrate","thema":null},{"klasse":8,"art":"Einführung","text":"Dreiecksprisma (3 cm, 4 cm, 5 cm; Höhe 6 cm): Das Netz hat 2 Dreiecke und 3 Rechtecke; die Rechtecke sind zusammen 12 cm breit","thema":null},{"klasse":8,"art":"Einführung","text":"Zylinder mit r = 3 cm: Das Mantel-Rechteck ist 2 · π · 3 cm ≈ 18,8 cm breit","thema":null}],"zeichen":null,"schulart":"Gymnasium: 8 (Prisma, Zylinder), 10 (Pyramide, Kegel) · Realschule Gruppe I: 5 (Würfel, Quader), 7 (Prisma, Pyramide) · Realschule Gruppe II/III: 5 (Würfel, Quader), 8 (Prisma, Pyramide) · IB (Planung der App): Jahr 3–4"},{"id":"F15","name":"Prisma und Zylinder","satz":"Bei Prisma und Zylinder gilt V = G · h mit senkrechter Höhe. Beim geraden Körper ist der Mantel: Umfang der Grundfläche mal Höhe.","idee":3,"gym":"8","rs":"9","ib":"–","sonne":"–","planet":"Fläche und Raum","wirkstelle":"","genau":"","warum":"Der Körper ist ein Stapel gleicher Schichten mit der Form der Grundfläche. Der Mantel, abgerollt, ist ein Rechteck: so breit wie der Umfang der Grundfläche, so hoch wie der Körper.","voraus":"V = G · h gilt mit der senkrechten Höhe, auch beim schiefen Körper. Die Mantelformel gilt nur beim geraden Körper.","fehler":"Beim Zylinder den Durchmesser statt des Radius einsetzen. Bei der Oberfläche die zweite Grundfläche vergessen.","verwandt":"Quader ist ein Prisma. Satz von Cavalieri für schiefe Körper.","weg":"F12 Quader, F9 Kreis","klassen":[{"klasse":8,"art":"Einführung","text":"Dreiecksprisma mit G = 6 cm², h = 10 cm: V = 60 cm³","thema":null},{"klasse":8,"art":"Einführung","text":"Zylinder mit r = 3 cm, h = 10 cm: V = π · 9 cm² · 10 cm = 90π cm³ ≈ 282,7 cm³","thema":null},{"klasse":8,"art":"Einführung","text":"Derselbe Zylinder: Mantel = 2 · π · 3 cm · 10 cm = 60π cm² ≈ 188,5 cm²","thema":null}],"zeichen":null,"schulart":"Gymnasium: 8 · Realschule Gruppe I: 9 · Realschule Gruppe II/III: 10 · IB (Planung der App): –"},{"id":"F16","name":"Satz von Cavalieri","satz":"Haben zwei Körper gleiche Höhe und in jeder Höhe gleich große parallele Schnittflächen, haben sie gleiches Volumen.","idee":3,"gym":"8","rs":"9","ib":"–","sonne":"–","planet":"Fläche und Raum","wirkstelle":"","genau":"","warum":"Ein Stapel Münzen hat dasselbe Volumen, ob er gerade steht oder schief geschoben ist: Jede Schicht ist gleich geblieben.","voraus":"Die Schnitte liegen parallel zur Grundfläche und werden auf gleicher Höhe verglichen.","fehler":"Daraus auch gleiche Oberfläche folgern – darüber sagt der Satz nichts.","verwandt":"Schiefes Prisma. Begründung der Formeln für Pyramide und Kugel.","weg":"F15 Prisma und Zylinder","klassen":[{"klasse":10,"art":"Einführung","text":"Schiefes Prisma mit G = 12 cm² und senkrechter Höhe 5 cm: V = 60 cm³ – wie das gerade","thema":null}],"zeichen":null,"schulart":"Gymnasium: 10 · Realschule Gruppe I: 9 · Realschule Gruppe II/III: 10 · IB (Planung der App): –"},{"id":"F17","name":"Pyramide und Kegel","satz":"Volumen = ein Drittel von Grundfläche mal Höhe. Mantel des geraden Kreiskegels: π · r · s (s = Mantellinie). Mantel der Pyramide: Summe der Seitendreiecke.","idee":3,"gym":"10","rs":"9","ib":"3","sonne":"–","planet":"Fläche und Raum","wirkstelle":"","genau":"","warum":"Die Schnittfläche schrumpft zur Spitze hin mit dem Quadrat des Abstands von der Spitze; zusammengezählt bleibt genau ein Drittel des Prismas. Zum Anfassen: Ein Würfel zerfällt in drei gleiche Pyramiden.","voraus":"h ist die senkrechte Höhe, nicht die Seitenkante. Die Mantelformel π · r · s gilt nur für den geraden Kreiskegel.","fehler":"Das Drittel vergessen. Die Mantellinie s als Höhe einsetzen.","verwandt":"Mantellinie und Seitenhöhe berechnet man mit dem Satz des Pythagoras (Planet Geometrie). Kegelmantel: ein Kreisausschnitt.","weg":"F15 Prisma und Zylinder, F16 Satz von Cavalieri","klassen":[{"klasse":10,"art":"Einführung","text":"Pyramide, Grundfläche 6 cm mal 6 cm, h = 4 cm: V = 36 cm² · 4 cm : 3 = 48 cm³","thema":null},{"klasse":10,"art":"Einführung","text":"Dieselbe Pyramide: Seitenhöhe 5 cm, Mantel = 4 · (6 cm · 5 cm : 2) = 60 cm²","thema":null},{"klasse":10,"art":"Einführung","text":"Kegel mit r = 3 cm, h = 4 cm: V = π · 9 cm² · 4 cm : 3 = 12π cm³ ≈ 37,7 cm³","thema":null},{"klasse":10,"art":"Einführung","text":"Derselbe Kegel: s = 5 cm, Mantel = π · 3 cm · 5 cm = 15π cm² ≈ 47,1 cm²","thema":null}],"zeichen":null,"schulart":"Gymnasium: 10 · Realschule Gruppe I: 9 · Realschule Gruppe II/III: 10 · IB (Planung der App): Jahr 3"},{"id":"F18","name":"Kugel","satz":"Die Kugelhaut hat die Fläche von vier Großkreisen: O = 4 · π · r². Volumen: V = 4/3 · π · r³.","idee":3,"gym":"10","rs":"9","ib":"3","sonne":"–","planet":"Fläche und Raum","wirkstelle":"","genau":"","warum":"Die Kugel füllt genau zwei Drittel des Zylinders, in den sie gerade hineinpasst. Ihre Oberfläche ist so groß wie der Mantel dieses Zylinders.","voraus":"r ist der Radius.","fehler":"Die beiden Formeln verwechseln: r² gehört zur Fläche, r³ zum Volumen.","verwandt":"Kreis. Halbkugel: die Hälfte – bei der Oberfläche kommt die Schnittfläche dazu.","weg":"F15 Prisma und Zylinder, F16 Satz von Cavalieri","klassen":[{"klasse":10,"art":"Einführung","text":"r = 2 cm: O = 4 · π · 4 cm² = 16π cm² ≈ 50,3 cm²","thema":null},{"klasse":10,"art":"Einführung","text":"r = 2 cm: V = 4/3 · π · 8 cm³ = 32π/3 cm³ ≈ 33,5 cm³","thema":null},{"klasse":10,"art":"Anwendung","text":"Die Kugel mit r = 2 cm füllt ⅔ des Zylinders mit r = 2 cm, h = 4 cm","thema":null}],"zeichen":null,"schulart":"Gymnasium: 10 · Realschule Gruppe I: 9 · Realschule Gruppe II/III: 10 · IB (Planung der App): Jahr 3"},{"id":"F19","name":"Lage im Raum","satz":"Zwei verschiedene Geraden im Raum sind parallel, schneiden sich oder sind windschief.","idee":4,"gym":"10","rs":"7","ib":"4","sonne":"–","planet":"Fläche und Raum","wirkstelle":"","genau":"","warum":"In der Ebene sind zwei verschiedene Geraden parallel oder schneiden sich. Im Raum gibt es eine dritte Möglichkeit: Sie laufen aneinander vorbei, ohne parallel zu sein.","voraus":"Gilt für zwei verschiedene Geraden.","fehler":"Im Schrägbild zwei Kanten für schneidend halten, weil sich ihre Bilder kreuzen.","verwandt":"Parallel und senkrecht (Planet Geometrie). Schrägbild.","weg":"F14 Netz und Schrägbild","klassen":[],"zeichen":null,"schulart":"Gymnasium: – (in der Lehrplan-Kopie nicht genannt) · Realschule Gruppe I: 7 · Realschule Gruppe II/III: – (nicht genannt) · IB (Planung der App): Jahr 4"},{"id":"U1","name":"Funktion","satz":"Zu jedem x gehört genau ein y.","idee":1,"gym":"8","rs":"8","ib":"3","sonne":"–","planet":"Funktionen"},{"id":"U2","name":"Punktprobe","satz":"Ein Punkt liegt auf dem Graphen, wenn seine Koordinaten die Gleichung erfüllen. Die Probe als Vorgehen: siehe Arbeitsweisen.","idee":1,"gym":"8–9","rs":"8–9","ib":"3–4","sonne":"–","planet":"Funktionen"},{"id":"U3","name":"Nullstelle und Achsenabschnitt","satz":"Eine Nullstelle ist ein x-Wert mit f(x) = 0. Den Schnitt mit der y-Achse liefert x = 0.","idee":1,"gym":"8","rs":"8","ib":"3–4","sonne":"13","planet":"Funktionen"},{"id":"U4","name":"Schnittpunkt","satz":"Im Schnittpunkt haben beide Funktionen denselben Wert: gleichsetzen.","idee":1,"gym":"8–9","rs":"8–9","ib":"3–4","sonne":"13","planet":"Funktionen"},{"id":"U5","name":"Graphen verschieben und strecken","satz":"Plus e schiebt nach oben, (x − d) schiebt nach rechts, mal a streckt, ein Minus davor spiegelt.","idee":3,"gym":"8–10","rs":"9–10","ib":"4–5","sonne":"–","planet":"Funktionen"},{"id":"U6","name":"Umkehrfunktion","satz":"x und y tauschen; der Graph wird an der Geraden y = x gespiegelt. Geht nur, wenn zu jedem y genau ein x gehört.","idee":1,"gym":"9","rs":"10","ib":"4","sonne":"12","planet":"Funktionen"},{"id":"U7","name":"Lineare Funktion","satz":"y = m · x + t: m ist die Steigung (Höhenunterschied durch Längenunterschied), t der Abschnitt auf der y-Achse.","idee":2,"gym":"8","rs":"8","ib":"3","sonne":"11","planet":"Funktionen"},{"id":"U8","name":"Ursprungsgerade","satz":"Proportional heißt: Gerade durch den Ursprung.","idee":2,"gym":"8","rs":"8","ib":"3","sonne":"11","planet":"Funktionen"},{"id":"U9","name":"Parallel und senkrecht","satz":"Parallele Geraden haben dieselbe Steigung. Geraden mit den Steigungen m₁ und m₂ stehen senkrecht, wenn m₁ · m₂ = −1; eine waagerechte und eine senkrechte Gerade stehen ebenfalls senkrecht.","idee":2,"gym":"8","rs":"8","ib":"3","sonne":"–","planet":"Funktionen"},{"id":"U10","name":"Geradenscharen","satz":"Ein Parameter in m dreht die Gerade, ein Parameter in t verschiebt sie.","idee":2,"gym":"8","rs":"8","ib":"3","sonne":"–","planet":"Funktionen"},{"id":"U11","name":"Hyperbel","satz":"y = a : x: doppeltes x, halbes y. Der Graph kommt den Asymptoten beliebig nahe, erreicht sie aber nie.","idee":3,"gym":"8","rs":"7","ib":"4","sonne":"11","planet":"Funktionen"},{"id":"U12","name":"Parabel","satz":"y = a · (x − d)² + e hat den Scheitel (d &#124; e). a entscheidet über Öffnung und Breite.","idee":3,"gym":"9","rs":"9","ib":"4","sonne":"6","planet":"Funktionen"},{"id":"U13","name":"Potenzfunktionen","satz":"Gerade Hochzahl: symmetrisch zur y-Achse. Ungerade Hochzahl: symmetrisch zum Ursprung.","idee":3,"gym":"9","rs":"10","ib":"4","sonne":"8","planet":"Funktionen"},{"id":"U14","name":"Exponentialfunktion","satz":"Exponentiell: In gleichen Schritten wird mit derselben Zahl malgenommen. Linear: Es kommt dieselbe Zahl dazu.","idee":2,"gym":"10","rs":"10","ib":"5","sonne":"8","planet":"Funktionen"},{"id":"U15","name":"Logarithmusfunktion","satz":"Sie ist die Umkehrung der Exponentialfunktion.","idee":2,"gym":"10","rs":"10","ib":"5","sonne":"12","planet":"Funktionen"},{"id":"U16","name":"Sinus- und Kosinusfunktion","satz":"Sie wiederholen sich nach 360° (im Bogenmaß 2π). Die Amplitude ist die größte Auslenkung. 180° entsprechen π.","idee":3,"gym":"10","rs":"10","ib":"5","sonne":"–","planet":"Funktionen"},{"id":"U17","name":"Ganzrationale Funktionen","satz":"Grad und Vorzeichen der höchsten Potenz bestimmen, wohin der Graph außen läuft. Die Produktform zeigt die Nullstellen.","idee":3,"gym":"10","rs":"–","ib":"5","sonne":"14","planet":"Funktionen"},{"id":"U18","name":"Betragsfunktion","satz":"Der Graph von &#124;x&#124; hat einen Knick. &#124;x&#124; = a hat für a > 0 die Lösungen a und −a, für a = 0 nur die Lösung 0, für a < 0 keine.","idee":3,"gym":"–","rs":"–","ib":"5","sonne":"2","planet":"Funktionen"},{"id":"U19","name":"Folgen","satz":"Arithmetisch: immer dieselbe Zahl dazu. Geometrisch: immer mit derselben Zahl mal.","idee":2,"gym":"–","rs":"–","ib":"5","sonne":"–","planet":"Funktionen"},{"id":"U20","name":"Reihen","satz":"Arithmetische Reihe: Anzahl mal Mittelwert aus erstem und letztem Glied. Für die geometrische gibt es eine eigene Summenformel.","idee":2,"gym":"–","rs":"–","ib":"5","sonne":"–","planet":"Funktionen"},{"id":"D1","name":"Häufigkeit","satz":"Absolute Häufigkeit: wie oft. Relative Häufigkeit: Anzahl durch Gesamtzahl.","idee":1,"gym":"6–8","rs":"5–9","ib":"1–2","sonne":"11","planet":"Daten und Zufall"},{"id":"D2","name":"Diagramme lesen","satz":"Im Kreisdiagramm gehört zu jedem Anteil derselbe Anteil von 360°. Eine Achse, die nicht bei 0 beginnt, übertreibt Unterschiede.","idee":1,"gym":"6","rs":"5","ib":"1","sonne":"11","planet":"Daten und Zufall"},{"id":"D3","name":"Mittelwert","satz":"Alle Werte addieren, durch die Anzahl teilen.","idee":1,"gym":"6","rs":"7","ib":"2","sonne":"–","planet":"Daten und Zufall"},{"id":"D4","name":"Median, Modalwert, Spannweite","satz":"Median: der mittlere Wert der geordneten Liste – bei gerader Anzahl der Mittelwert der beiden mittleren. Modalwert: der häufigste. Spannweite: größter minus kleinster.","idee":1,"gym":"7","rs":"7","ib":"4","sonne":"–","planet":"Daten und Zufall"},{"id":"D5","name":"Mittelwert oder Median","satz":"Ein Ausreißer zieht den Mittelwert stark mit; der Median ist robuster.","idee":1,"gym":"7","rs":"7","ib":"4","sonne":"–","planet":"Daten und Zufall"},{"id":"D6","name":"Quartile und Boxplot","satz":"Die Box enthält die mittlere Hälfte der Werte.","idee":1,"gym":"7","rs":"7","ib":"4","sonne":"–","planet":"Daten und Zufall"},{"id":"D7","name":"Stichprobe","satz":"Von einer Stichprobe darf man nur aufs Ganze schließen, wenn sie zufällig gezogen ist; je größer sie ist, desto genauer.","idee":2,"gym":"–","rs":"7","ib":"2","sonne":"11","planet":"Daten und Zufall"},{"id":"D8","name":"Zusammenhang ist nicht Ursache","satz":"Zwei Größen können zusammen steigen, ohne dass die eine die andere bewirkt.","idee":2,"gym":"–","rs":"–","ib":"5","sonne":"–","planet":"Daten und Zufall"},{"id":"D9","name":"Streuung","satz":"Die Standardabweichung ist die Wurzel aus dem Mittelwert der quadrierten Abweichungen vom Mittelwert – ein Maß für die typische Abweichung.","idee":1,"gym":"–","rs":"–","ib":"5","sonne":"12","planet":"Daten und Zufall"},{"id":"D10","name":"Normalverteilung","satz":"Etwa 68 % der Werte liegen höchstens eine Standardabweichung vom Mittelwert entfernt, 95 % höchstens zwei.","idee":1,"gym":"–","rs":"–","ib":"5","sonne":"–","planet":"Daten und Zufall"},{"id":"D11","name":"Zählprinzip","satz":"Die Möglichkeiten der einzelnen Stufen werden malgenommen.","idee":3,"gym":"5","rs":"5","ib":"2","sonne":"–","planet":"Daten und Zufall"},{"id":"D12","name":"Ergebnis und Ereignis","satz":"Ein Ereignis ist eine Menge von Ergebnissen.","idee":3,"gym":"8","rs":"9","ib":"2","sonne":"–","planet":"Daten und Zufall"},{"id":"D13","name":"Laplace-Wahrscheinlichkeit","satz":"Günstige durch mögliche Ergebnisse – nur wenn alle gleich wahrscheinlich sind.","idee":3,"gym":"8","rs":"9","ib":"2","sonne":"11","planet":"Daten und Zufall"},{"id":"D14","name":"Gegenereignis","satz":"Jede Wahrscheinlichkeit liegt zwischen 0 und 1. Gegenereignis: 1 minus die Wahrscheinlichkeit.","idee":3,"gym":"8–10","rs":"9–10","ib":"2–4","sonne":"–","planet":"Daten und Zufall"},{"id":"D15","name":"Gesetz der großen Zahlen","satz":"Bei vielen unabhängigen Wiederholungen desselben Versuchs liegt die relative Häufigkeit meist nahe bei der Wahrscheinlichkeit.","idee":2,"gym":"8–10","rs":"9","ib":"2","sonne":"–","planet":"Daten und Zufall"},{"id":"D16","name":"Additionssatz","satz":"A oder B, einschließlich beider: P(A) + P(B) − P(A und B).","idee":3,"gym":"9","rs":"9","ib":"4","sonne":"–","planet":"Daten und Zufall"},{"id":"D17","name":"Vierfeldertafel","satz":"Zeilen und Spalten ergeben die Randsummen; ein Feld folgt aus den anderen.","idee":4,"gym":"9","rs":"9","ib":"4","sonne":"–","planet":"Daten und Zufall"},{"id":"D18","name":"Bedingte Wahrscheinlichkeit","satz":"Für P(B) > 0: Unter der Bedingung B zählt nur noch, was in B liegt – P(A unter B) = P(A und B) : P(B). Unabhängig heißt: Die Bedingung ändert nichts.","idee":4,"gym":"9","rs":"9","ib":"4","sonne":"11","planet":"Daten und Zufall"},{"id":"D19","name":"Pfadregeln","satz":"Entlang eines Pfades malnehmen, mehrere Pfade addieren.","idee":4,"gym":"10","rs":"10","ib":"4","sonne":"10","planet":"Daten und Zufall"},{"id":"D20","name":"Simulation","satz":"Ein Zufallsversuch lässt sich mit Zufallszahlen nachspielen; viele Durchgänge ergeben einen Schätz
