<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Stil-Entwurf Lernreise (Prüfrunde App)</title>
<!-- Stil-Entwurf, kein App-Code. Aufruf: index.html?ansicht=heute|ueben|richtig|falsch&look=ozean|nacht
     Zeigt die Vorschläge S1–S8 aus ../stil.md an zwei Bildschirmen. Daten sind Beispiele. -->
<style>
@font-face { font-family: "Nunito"; src: url("nunito.woff2") format("woff2"); font-weight: 200 1000; font-display: swap; }
:root { --font: "Nunito", ui-rounded, system-ui, sans-serif; }
/* Themen wie bisher (Farben aus style.css übernommen), ergänzt um Erdteilfarbe und Erfolgsfarbe */
.ozean { --bg:#E8F7F9; --flaeche:#fff; --text:#0B3B52; --leise:#3F6B7D; --linie:#CBE6EB; --akzent:#D9482A; --akzent-tief:#A93A1D; --auf-akzent:#fff; --ok:#1E8A5A; --ok-bg:#E3F5EC; --falsch:#B4472C; --falsch-bg:#FDEDE7; }
.nacht { --bg:#0D1226; --flaeche:#161D3A; --text:#E8ECF8; --leise:#A9B3D1; --linie:#2A3360; --akzent:#C9F26B; --akzent-tief:#8FB33A; --auf-akzent:#0D1226; --ok:#7BE0A8; --ok-bg:#16352B; --falsch:#FFB49C; --falsch-bg:#3A2124; }
/* S4: jede Weltgegend hat ihre Farbe – dieselbe wie auf der Weltkarte */
.europa { --erdteil:#F6C85F; --erdteil-text:#4A3500; }
* { box-sizing: border-box; }
html, body { margin: 0; }
body { font-family: var(--font); background: var(--bg); color: var(--text); font-size: 18px; line-height: 1.4; font-variant-numeric: tabular-nums; -webkit-font-smoothing: antialiased; }
button { font: inherit; color: inherit; }
.seite { max-width: 560px; margin: 0 auto; padding: 0 20px 110px; }
/* S1: Kopfzeile im Look des Kindes, kein beiger Streifen, kein Fremd-Symbol */
.kopf { display: flex; align-items: center; gap: 12px; padding: 14px 20px; position: sticky; top: 0; background: var(--bg); z-index: 5; }
.kopf .zurueck { width: 44px; height: 44px; border-radius: 14px; border: 0; background: var(--flaeche); display: grid; place-items: center; font-size: 22px; font-weight: 800; }
.kopf .ort { font-weight: 800; font-size: 18px; flex: 1; }
.chip { display: inline-flex; align-items: center; gap: 6px; padding: 6px 12px; border-radius: 99px; background: var(--flaeche); font-weight: 800; font-size: 15px; text-decoration: none; color: var(--text); min-height: 36px; }
.chip svg { width: 18px; height: 18px; }
/* S2: eine Hauptkarte pro Seite, Rest ohne Rahmen */
.hallo { display: flex; align-items: center; gap: 14px; margin: 8px 0 18px; }
.hallo h1 { margin: 0; font-size: 30px; line-height: 1.1; font-weight: 900; letter-spacing: -.02em; }
.hallo p { margin: 2px 0 0; color: var(--leise); font-weight: 700; font-size: 16px; }
.figur { width: 64px; height: 64px; flex: none; }
.haupt { background: var(--flaeche); border-radius: 26px; overflow: hidden; box-shadow: 0 8px 24px rgb(11 59 82 / 10%); }
.nacht .haupt { box-shadow: none; border: 1px solid var(--linie); }
.band { background: var(--erdteil); color: var(--erdteil-text); padding: 12px 20px; font-weight: 900; font-size: 13px; letter-spacing: .08em; display: flex; justify-content: space-between; }
.haupt-inhalt { padding: 18px 20px 22px; }
.haupt h2 { margin: 0 0 4px; font-size: 28px; line-height: 1.15; font-weight: 900; }
.haupt .thema { margin: 0 0 18px; color: var(--leise); font-weight: 700; }
/* S4: Fortschritt als Reiseroute – jede Lernkarte ist eine Station */
.route { display: flex; align-items: center; margin: 4px 0 22px; }
.station { width: 34px; height: 34px; border-radius: 50%; display: grid; place-items: center; font-weight: 900; font-size: 15px; border: 3px solid var(--erdteil); background: var(--flaeche); flex: none; }
.station.fertig { background: var(--erdteil); color: var(--erdteil-text); }
.station.jetzt { border-color: var(--akzent); box-shadow: 0 0 0 5px color-mix(in srgb, var(--akzent) 22%, transparent); }
.strecke { flex: 1; height: 0; border-top: 4px dotted var(--linie); margin: 0 4px; }
.strecke.fertig { border-top: 4px solid var(--erdteil); }
.ziel { font-size: 22px; flex: none; margin-left: 6px; }
.route-text { margin: -12px 0 20px; font-size: 15px; font-weight: 700; color: var(--leise); }
.los { display: flex; flex-direction: column; align-items: center; justify-content: center; width: 100%; min-height: 68px; border: 0; border-radius: 18px; background: var(--akzent); color: var(--auf-akzent); font-weight: 900; font-size: 22px; box-shadow: 0 5px 0 var(--akzent-tief); cursor: pointer; text-decoration: none; }
.los small { font-weight: 700; font-size: 14px; opacity: .9; }
.los:hover { filter: brightness(1.05); } /* S5/B4: Hover hellt auf statt beige */
.los:active { transform: translateY(3px); box-shadow: 0 2px 0 var(--akzent-tief); }
.leise-liste { margin: 26px 4px 0; }
.leise-liste h3 { font-size: 14px; letter-spacing: .08em; color: var(--leise); margin: 0 0 6px; font-weight: 900; }
.zeile { display: flex; align-items: center; gap: 12px; padding: 12px 0; border-bottom: 1px solid var(--linie); font-weight: 700; }
.zeile span:last-child { margin-left: auto; color: var(--leise); font-size: 15px; }
.punkt { width: 12px; height: 12px; border-radius: 50%; background: var(--erdteil); }
/* Leiste unten, mit Reisepass */
.leiste { position: fixed; left: 0; right: 0; bottom: 0; display: flex; justify-content: center; gap: 4px; background: var(--flaeche); border-top: 1px solid var(--linie); padding: 6px 8px calc(6px + env(safe-area-inset-bottom)); z-index: 6; }
.leiste a { flex: 1; max-width: 120px; min-height: 56px; display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 6px 0; text-decoration: none; color: var(--leise); font-weight: 800; font-size: 12.5px; border-radius: 12px; }
.leiste a.an { color: var(--akzent); background: color-mix(in srgb, var(--akzent) 10%, transparent); }
.leiste svg { width: 24px; height: 24px; }
/* Üben (S2, S6, B1): Aufgabe groß, Prüfen direkt darunter */
.oben-mini { display: flex; align-items: center; gap: 8px; margin: 4px 0 14px; font-weight: 800; color: var(--leise); font-size: 15px; }
.mini-stationen { display: flex; gap: 6px; margin-left: auto; }
.mini-stationen i { width: 12px; height: 12px; border-radius: 50%; border: 2.5px solid var(--erdteil); display: block; }
.mini-stationen i.fertig { background: var(--erdteil); }
.mini-stationen i.jetzt { border-color: var(--akzent); background: var(--akzent); }
.aufgabe { background: var(--flaeche); border-radius: 26px; padding: 22px 20px; box-shadow: 0 8px 24px rgb(11 59 82 / 10%); }
.nacht .aufgabe { box-shadow: none; border: 1px solid var(--linie); }
.aufgabe .kl { font-size: 13px; letter-spacing: .08em; font-weight: 900; color: var(--leise); margin: 0 0 8px; display: flex; justify-content: space-between; }
.punkte { display: inline-flex; gap: 4px; } .punkte i { width: 12px; height: 12px; border-radius: 50%; border: 2.5px solid var(--ok); } .punkte i.voll { background: var(--ok); }
.frage { font-size: 26px; line-height: 1.25; font-weight: 900; margin: 0 0 18px; }
.eingabe { width: 100%; font: inherit; font-size: 30px; font-weight: 900; text-align: center; padding: 12px; border-radius: 16px; border: 3px solid var(--linie); background: var(--bg); color: var(--text); letter-spacing: .04em; }
.eingabe:focus { outline: none; border-color: var(--akzent); }
.aufgabe .los { margin-top: 14px; min-height: 60px; font-size: 21px; }
.hilfen { display: flex; justify-content: center; gap: 22px; margin-top: 14px; }
.hilfen button { background: none; border: 0; font-weight: 800; color: var(--leise); text-decoration: underline; text-underline-offset: 4px; min-height: 44px; cursor: pointer; font-size: 16px; }
/* S5: Rückmeldung mit kurzer Bewegung */
.rueck { margin-top: 14px; border-radius: 18px; padding: 14px 16px; font-weight: 800; display: flex; gap: 12px; align-items: center; }
.rueck.ok { background: var(--ok-bg); color: var(--ok); animation: auf .35s cubic-bezier(.3,1.6,.5,1); }
.rueck.falsch { background: var(--falsch-bg); color: var(--falsch); }
.rueck .haken { width: 44px; height: 44px; border-radius: 50%; background: var(--ok); color: var(--flaeche); display: grid; place-items: center; font-size: 26px; flex: none; animation: pop .45s cubic-bezier(.3,1.8,.5,1); }
.rueck .stern svg { width: 20px; height: 20px; }
.rueck .stern { margin-left: auto; font-size: 17px; display: inline-flex; gap: 4px; align-items: center; animation: flieg .9s ease-out; color: var(--text); }
.wackel { animation: wackel .35s ease-in-out; border-color: var(--falsch) !important; }
.erkl { margin-top: 12px; border-radius: 18px; background: color-mix(in srgb, var(--erdteil) 22%, var(--flaeche)); padding: 14px 16px; font-size: 17px; font-weight: 700; }
.erkl b { display: block; font-size: 13px; letter-spacing: .08em; margin-bottom: 4px; }
@keyframes pop { 0% { transform: scale(.3); } 100% { transform: scale(1); } }
@keyframes auf { 0% { transform: translateY(8px); opacity: 0; } 100% { transform: none; opacity: 1; } }
@keyframes flieg { 0% { transform: translate(-60px, 10px) scale(1.6); opacity: 0; } 60% { opacity: 1; } 100% { transform: none; } }
@keyframes wackel { 20%, 60% { transform: translateX(-6px); } 40%, 80% { transform: translateX(6px); } }
@media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
/* S7: Tablet/Rechner – Erklärung links, Aufgabe rechts, Leiste als Seitenleiste */
.zwei { display: block; }
.erkl-spalte { display: none; }
@media (min-width: 820px) {
  .ansicht-ueben .leiste a, .ansicht-richtig .leiste a, .ansicht-falsch .leiste a { flex: none; max-width: none; }
  .zwei { display: grid; grid-template-columns: 1fr 1.1fr; gap: 24px; max-width: 1040px; margin: 0 auto; }
  .ansicht-ueben .seite, .ansicht-richtig .seite, .ansicht-falsch .seite { max-width: 1100px; padding-left: 112px; }
  .erkl-spalte { display: block; background: var(--flaeche); border-radius: 26px; padding: 22px 20px; border: 1px solid var(--linie); align-self: start; position: sticky; top: 80px; }
  .erkl-spalte h3 { margin: 0 0 12px; font-size: 22px; font-weight: 900; }
  .ansicht-ueben .leiste, .ansicht-richtig .leiste, .ansicht-falsch .leiste { top: 0; right: auto; width: 96px; flex-direction: column; justify-content: flex-start; padding-top: 84px; gap: 10px; border-top: 0; border-right: 1px solid var(--linie); }
  .ansicht-ueben .kopf, .ansicht-richtig .kopf, .ansicht-falsch .kopf { padding-left: 112px; }
}
.tafel { display: grid; grid-template-columns: repeat(6, 1fr); border: 2px solid var(--linie); border-radius: 14px; overflow: hidden; text-align: center; font-weight: 900; margin: 6px 0 14px; }
.tafel div { padding: 8px 0; border-right: 2px solid var(--linie); } .tafel div:nth-child(4n) { border-right: 0; }
.tafel .k { background: var(--bg); color: var(--leise); font-size: 14px; border-bottom: 2px solid var(--linie); }
.tafel .m { background: var(--erdteil); color: var(--erdteil-text); }
</style>
</head>
<body>
<script>
const q = new URLSearchParams(location.search);
const ansicht = q.get('ansicht') || 'heute', look = q.get('look') || 'ozean';
document.body.className = `${look} europa ansicht-${ansicht}`;
const I = {
  heute: 'M3 11l9-7 9 7v9H5z', weg: 'M5 19c4 0 3-6 7-6s3-6 7-6|M3 19a2 2 0 1 0 4 0a2 2 0 1 0-4 0|M17 7a2 2 0 1 0 4 0a2 2 0 1 0-4 0',
  heft: 'M6 3h11a1 1 0 0 1 1 1v16H7a2 2 0 0 1-2-2V4a1 1 0 0 1 1-1z|M9 8h6|M9 12h6', karte: 'M3 6l6-2 6 2 6-2v14l-6 2-6-2-6 2z|M9 4v14|M15 6v14',
  pass: 'M6 3h12a1 1 0 0 1 1 1v16a1 1 0 0 1-1 1H6a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1z|M9 11a3 3 0 1 0 6 0a3 3 0 1 0-6 0|M9 17h6',
  stern: 'M12 3l2.6 5.6 6 .7-4.5 4.1 1.2 6L12 16.4 6.7 19.4l1.2-6L3.4 9.3l6-.7z', stempel: 'M12 3a9 9 0 1 0 0 18a9 9 0 1 0 0-18z|M12 8a4 4 0 1 0 0 8a4 4 0 1 0 0-8z' };
const ic = (d, f = 'none') => `<svg viewBox="0 0 24 24" fill="${f}" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${d.split('|').map((p) => `<path d="${p}"/>`).join('')}</svg>`;
// S6: eigene Reisefigur „Koffi“ (ein kleiner Reisekoffer) – Entwurf, frei erfunden
const koffi = (laune = 'froh') => `<svg class="figur" viewBox="0 0 64 64" aria-hidden="true">
  <rect x="24" y="6" width="16" height="10" rx="4" fill="none" stroke="var(--text)" stroke-width="3.5"/>
  <rect x="8" y="14" width="48" height="42" rx="12" fill="var(--erdteil)" stroke="var(--text)" stroke-width="3.5"/>
  <rect x="8" y="30" width="48" height="6" fill="var(--akzent)" opacity=".85"/>
  <circle cx="24" cy="25" r="3.6" fill="var(--text)"/><circle cx="40" cy="25" r="3.6" fill="var(--text)"/>
  ${laune === 'froh' ? '<path d="M24 43q8 8 16 0" fill="none" stroke="var(--text)" stroke-width="3.5" stroke-linecap="round"/>' : '<path d="M25 45h14" stroke="var(--text)" stroke-width="3.5" stroke-linecap="round"/>'}
  <circle cx="18" cy="58" r="3" fill="var(--text)"/><circle cx="46" cy="58" r="3" fill="var(--text)"/></svg>`;
const leiste = (an) => `<nav class="leiste" aria-label="Lernreise">${[['heute', 'Heute'], ['weg', 'Mein Weg'], ['heft', 'Merkheft'], ['karte', 'Karte'], ['pass', 'Reisepass']]
  .map(([k, t]) => `<a href="#" class="${k === an ? 'an' : ''}">${ic(I[k])}<span>${t}</span></a>`).join('')}</nav>`;
const sterneChip = `<a class="chip" href="#" aria-label="340 Sterne, 1 Stempel – zum Reisepass">${ic(I.stern)} 340 &nbsp;${ic(I.stempel)} 1</a>`;

if (ansicht === 'heute') {
  document.body.innerHTML = `
  <header class="kopf"><span class="ort">Lernreise</span>${sterneChip}</header>
  <main class="seite">
    <div class="hallo">${koffi()}<div><h1>Hallo Kind A!</h1><p>Heute: 10 Minuten in Rom</p></div></div>
    <section class="haupt" aria-labelledby="ort">
      <div class="band"><span>EUROPA · ZAHLEN</span><span>ORT 1 VON 5</span></div>
      <div class="haupt-inhalt">
        <h2 id="ort">Rom</h2>
        <p class="thema">Große Zahlen lesen und ordnen</p>
        <div class="route" role="img" aria-label="Lernkarte 1 ist dran, 2 und 3 kommen danach">
          <span class="station jetzt">1</span><span class="strecke"></span>
          <span class="station">2</span><span class="strecke"></span>
          <span class="station">3</span><span class="strecke"></span><span class="ziel" aria-hidden="true" style="width:30px;height:30px;color:var(--akzent)">${ic(I.stempel)}</span>
        </div>
        <p class="route-text">3 Lernkarten bis zum Stempel von Rom</p>
        <a class="los" href="?ansicht=ueben&look=${look}">Los geht’s<small>erst 2 Wiederholungen, dann Lernkarte 1</small></a>
      </div>
    </section>
    <div class="leise-liste">
      <h3>DANACH</h3>
      <div class="zeile"><span class="punkt"></span><span>Athen · Teilbarkeit</span><span>bald</span></div>
      <div class="zeile"><span class="punkt"></span><span>Pisa · Brüche</span><span>Klasse 6</span></div>
    </div>
  </main>${leiste('heute')}`;
} else {
  const zustand = ansicht; // ueben | richtig | falsch
  document.body.innerHTML = `
  <header class="kopf"><button class="zurueck" aria-label="Zurück zu Heute">‹</button><span class="ort">Rom</span>${sterneChip}</header>
  <main class="seite"><div class="zwei">
    <aside class="erkl-spalte" aria-label="Erklärung">
      <h3>Welchen Wert hat eine Ziffer?</h3>
      <div class="tafel" style="grid-template-columns:repeat(4,1fr)"><div class="k">T</div><div class="k">H</div><div class="k">Z</div><div class="k">E</div>
        <div class="m">4</div><div>0</div><div>5</div><div>2</div></div>
      <p style="margin:0;font-weight:700">Jeder Platz ist <b>10-mal</b> so viel wert wie der rechts daneben. In 4 052 steht die 4 bei den Tausendern: <b>4 000</b>.</p>
    </aside>
    <div>
      <div class="oben-mini">Lernkarte 1 · Welchen Wert hat eine Ziffer?<span class="mini-stationen" aria-label="Lernkarte 1 von 3"><i class="jetzt"></i><i></i><i></i></span></div>
      <section class="aufgabe">
        <p class="kl"><span>AUFGABE 2 · MITTEL</span><span class="punkte" aria-label="${zustand === 'richtig' ? '2' : '1'} von 2 richtig hintereinander"><i class="voll"></i><i class="${zustand === 'richtig' ? 'voll' : ''}"></i></span></p>
        <p class="frage">Welchen Wert hat die Ziffer 2 in 182 887?</p>
        <form id="f"><input class="eingabe ${zustand === 'falsch' ? 'wackel' : ''}" inputmode="numeric" aria-label="Antwort" value="${zustand === 'richtig' ? '2 000' : zustand === 'falsch' ? '200' : ''}" placeholder="?">
        ${zustand === 'ueben' ? '<button class="los" type="submit">Prüfen</button>' : ''}</form>
        ${zustand === 'richtig' ? `<div class="rueck ok" role="status"><span class="haken">✓</span><span>Richtig! Lernkarte sitzt.</span><span class="stern">${ic(I.stern)} +10</span></div><button class="los" style="margin-top:14px">Weiter</button>` : ''}
        ${zustand === 'falsch' ? `<div class="rueck falsch" role="status">Fast! Richtig ist 2 000.</div><div class="erkl"><b>SO GEHT’S</b>Zähl von rechts: E, Z, H, <u>T</u>. Die 2 steht bei den Tausendern, nicht bei den Hundertern.</div><button class="los" style="margin-top:14px">Nächste Aufgabe</button>` : ''}
        ${zustand === 'ueben' ? '<div class="hilfen"><button type="button">Tipp</button><button type="button">Erklärung</button></div>' : ''}
      </section>
    </div></div>
  </main>${leiste('weg')}`;
  const f = document.getElementById('f');
  f?.addEventListener('submit', (e) => { e.preventDefault(); const v = f.querySelector('input').value.replace(/\s/g, ''); location.search = `?ansicht=${v === '2000' ? 'richtig' : 'falsch'}&look=${look}`; });
}
</script>
</body>
</html>
