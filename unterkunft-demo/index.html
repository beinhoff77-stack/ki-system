function field(label,id,value,type='text',extra=''){return `<div class="field"><label for="${id}">${label}</label><input id="${id}" type="${type}" value="${esc(value)}" onchange="formVal('${id}',this)" ${extra}></div>`}

function startDemo(){S.tab='B';S.screen='results';S.view='list';S.onlySaved=false;persist();render();window.scrollTo(0,0)}
function calcScore(h){const w=WEIGHTS[S.profile];let top=0,bot=0;h.parts.forEach((n,i)=>{if(Number.isFinite(n)){top+=n*w[i];bot+=w[i]}});return bot===0?null:Math.round(top/bot*10)}
function scoreLabel(h){let n=calcScore(h);return n==null?'–':n+' %'}
function excluded(h){return S.excluded.includes(h.id)}
function liked(h){return S.saved.includes(h.id)}
function allVisible(){let a=DEMO.filter(h=>S.tab==='X'?excluded(h):!excluded(h));if(S.tab==='A')a=[]; // Erstlauf: Es gibt KEINE vollständig geprüften Treffer.
 if(S.accom!=='Alle')a=a.filter(h=>h.type===S.accom);
 if(!S.suite)a=a.filter(h=>!h.suite);
 if(S.budget!==''&&Number(S.budget)>0)a=a.filter(h=>h.price==null||h.price<=Number(S.budget));
 if(S.bedrooms!==''&&Number(S.bedrooms)>0)a=a.filter(h=>h.room==null||h.room>=Number(S.bedrooms));
 if(S.beds!==''&&Number(S.beds)>0)a=a.filter(h=>h.beds==null||h.beds>=Number(S.beds));
 if(S.onlySaved)a=a.filter(h=>liked(h));
 // Qualitätsfilter aus S1 – unbekannte Werte bleiben sichtbar, nicht als Null behandelt.
 if(S.tab==='B'){
   const qs=S.quality;
   if(qs.rating.mode==='muss') a=a.filter(h=>h.rating==null||h.reviews==null||h.reviews<30||h.rating>=Number(qs.rating.value));
   if(qs.reviews.mode==='muss') a=a.filter(h=>h.reviews==null||h.reviews<30||h.reviews>=Number(qs.reviews.value));
   if(qs.stars.mode==='muss'&&qs.stars.value!=='egal') a=a.filter(h=>h.type!=='Hotel'||h.stars==null||h.stars>=Number(qs.stars.value));
 }
 if(S.filters.type!=='Alle')a=a.filter(h=>h.type===S.filters.type);
 let f=S.filters;if(f.maxPrice!==''){a=a.filter(h=>h.price==null?f.unknown:h.price<=Number(f.maxPrice))}
 if(f.minRating!==''){a=a.filter(h=>h.rating==null?f.unknown:h.rating>=Number(f.minRating))}
 if(f.maxWalk!==''){a=a.filter(h=>h.walk==null?f.unknown:h.walk<=Number(f.maxWalk))}
 if(f.amenity!=='Alle')a=a.filter(h=>h.amen.includes(f.amenity));
 if(f.minScore!==''){a=a.filter(h=>calcScore(h)==null?f.unknown:calcScore(h)>=Number(f.minScore))}
 if(f.minCoverage!==''){a=a.filter(h=>h.evidence>=Number(f.minCoverage))}
 if(f.stars!==''){a=a.filter(h=>h.type!=='Hotel'||(h.stars==null?f.unknown:h.stars>=Number(f.stars)))}
 // Diese Filter beeinflussen die Kandidaten in Liste, Tabelle UND Karte identisch.
 const prop={score:h=>calcScore(h),price:h=>h.price,walk:h=>h.walk,rating:h=>h.rating,reviews:h=>h.reviews,area:h=>h.area,evidence:h=>h.evidence,name:h=>h.name};const fn=prop[S.sort]||prop.score;a.sort((x,y)=>{const A=fn(x),B=fn(y);if(A==null&&B==null)return x.id-y.id;if(A==null)return 1;if(B==null)return -1;if(typeof A==='string')return S.sortDir==='asc'?A.localeCompare(B):B.localeCompare(A);return S.sortDir==='asc'?A-B:B-A});return a}

function applyFilter(k,v){S.filters[k]=v;persist();render()}
function toggleSaved(id){S.saved=S.saved.includes(id)?S.saved.filter(v=>v!==id):[...S.saved,id];persist();render();toast(S.saved.includes(id)?'Unterkunft gemerkt':'Aus Merkliste entfernt','Rückgängig',()=>toggleSaved(id))}
function toggleExcluded(id){const was=S.excluded.includes(id);S.excluded=was?S.excluded.filter(v=>v!==id):[...S.excluded,id];persist();render();toast(was?'Unterkunft wiederhergestellt':'Unterkunft ausgeschlossen','Rückgängig',()=>toggleExcluded(id))}
function toast(text,label,callback){let root=document.getElementById('toastRoot');root.innerHTML=`<div class="toast"><span>${esc(text)}</span>${callback?`<button id="toastAction">${label}</button>`:''}</div>`;if(callback)document.getElementById('toastAction').onclick=callback;clearTimeout(toastTimer);toastTimer=setTimeout(()=>root.innerHTML='',5000)}
function filterBox(){if(!S.filterOpen)return'';let f=S.filters;return `<div class="filter-drawer" id="filterPanel"><div class="simple-line" style="margin-bottom:10px"><strong>Treffer sofort filtern</strong><button class="ghost" onclick="resetFilters()">Zurücksetzen</button></div><div class="filters-grid"><div class="field"><label>Gesamtpreis höchstens (€)</label><input type="number" min="0" placeholder="Beliebig" data-filter="maxPrice" value="${esc(f.maxPrice)}" oninput="filterDebounce('maxPrice',this.value)"></div><div class="field"><label>Unterkunftsform</label><select onchange="applyFilter('type',this.value)">${['Alle','Hotel','Apartment','Haus'].map(x=>`<option ${f.type===x?'selected':''}>${x}</option>`).join('')}</select></div><div class="field"><label>Passung mindestens (%)</label><input type="number" min="0" max="100" placeholder="Beliebig" data-filter="minScore" value="${esc(f.minScore)}" oninput="filterDebounce('minScore',this.value)"></div><div class="field"><label>Datenlage mindestens (%)</label><input type="number" min="0" max="100" placeholder="Beliebig" data-filter="minCoverage" value="${esc(f.minCoverage)}" oninput="filterDebounce('minCoverage',this.value)"></div><div class="field"><label>Gästenote mindestens</label><input type="number" step="0.1" min="0" max="10" placeholder="Beliebig" data-filter="minRating" value="${esc(f.minRating)}" oninput="filterDebounce('minRating',this.value)"></div><div class="field"><label>Gehzeit höchstens (Min.)</label><input type="number" min="0" max="180" placeholder="Beliebig" data-filter="maxWalk" value="${esc(f.maxWalk)}" oninput="filterDebounce('maxWalk',this.value)"></div><div class="field"><label>Ausstattung</label><select onchange="applyFilter('amenity',this.value)">${['Alle','Küche','Waschmaschine','Balkon','Parkplatz','Lift'].map(x=>`<option ${f.amenity===x?'selected':''}>${x}</option>`).join('')}</select></div><div class="field"><label>Hotelsterne mindestens</label><select onchange="applyFilter('stars',this.value)">${[['','Egal'],['3','3 Sterne'],['4','4 Sterne'],['5','5 Sterne']].map(([v,t])=>`<option value="${v}" ${f.stars===v?'selected':''}>${t}</option>`).join('')}</select></div><label class="checkrow" style="align-self:end"><input type="checkbox" ${f.unknown?'checked':''} onchange="applyFilter('unknown',this.checked)"> Unbekannte Werte mit anzeigen</label></div><div class="hint">Filter und Sortierung arbeiten ausschließlich mit den geladenen Demodaten. Fehlende Angaben gelten nicht automatisch als „schlecht“.</div></div>`}
let filterDebounceTimer;
function filterDebounce(k,v){S.filters[k]=v;persist();clearTimeout(filterDebounceTimer);filterDebounceTimer=setTimeout(()=>{const active=document.activeElement;const wasFocused=active&&active.getAttribute('data-filter')===k;const pos=wasFocused&&typeof active.selectionStart==='number'?active.selectionStart:null;render();if(wasFocused){const replacement=document.querySelector('[data-filter="'+k+'"]');if(replacement){replacement.focus({preventScroll:true});if(pos!=null){try{replacement.setSelectionRange(pos,pos)}catch(e){}}}}},220)}
function resetFilters(){S.filters=defaultState().filters;persist();render()}
function tableView(a){const labels=[['name','Unterkunft'],['price','Gesamt 2+2'],['score','Endscore'],['evidence','Datenlage'],['area','Fläche'],['walk','Gehzeit'],['rating','Note'],['reviews','Bewertungen']];return `<div class="table-wrap"><table class="results-table"><thead><tr>${labels.map(([k,t])=>`<th scope="col"><button onclick="setSort('${k}')">${t} ${S.sort===k?(S.sortDir==='asc'?'↑':'↓'):'↕'}</button></th>`).join('')}<th>Zimmer · Betten</th><th>Form / Sterne</th><th>Aktionen</th></tr></thead><tbody>${a.map(h=>`<tr><td><button class="ghost" style="padding:0;font-size:12px;text-align:left" onclick="details(${h.id})"><b>${esc(h.name)}</b></button><div class="muted" style="font-size:10px">${esc(h.zone)}</div></td><td>${h.price==null?'–':EUR(h.price)}</td><td><b>${scoreLabel(h)}</b><div class="muted" style="font-size:10px">vorläufig</div>${S.statuses[h.id]?`<small style="display:block">Lücken: ${esc(S.statuses[h.id])}</small>`:''}</td><td>${h.evidence}%</td><td>${h.area==null?'?':h.area+' m²'}</td><td>${h.walk==null?'?':h.walk+' Min.'}</td><td>${h.rating==null?'?':h.rating.toFixed(1).replace('.',',')}</td><td>${h.reviews??'?'}</td><td>${h.room??'?'} SZ · ${h.beds??'?'} Betten</td><td>${h.type}${h.stars?' · '+h.stars+' ★':''}</td><td style="white-space:nowrap"><button class="mini" title="Merken" onclick="toggleSaved(${h.id})">${liked(h)?'♥':'♡'}</button> <button class="mini" title="Ausschließen" onclick="toggleExcluded(${h.id})">${excluded(h)?'↩':'✕'}</button> <button class="mini" title="Details" onclick="details(${h.id})">↗</button></td></tr>`).join('')}</tbody></table></div>`}
function mapMarkup(a){let selected=a.find(h=>h.id===S.selected)||a[0];return `<div class="panel map-panel"><div class="map-head"><b>Dieselben ${a.length} Treffer auf der Karte</b><span class="sample-only">SCHEMATISCH</span></div><div class="demo-map" role="group" aria-label="Fiktive Beispielkarte von Kyoto"><svg viewBox="0 0 500 400" preserveAspectRatio="xMidYMid slice" aria-hidden="true"><rect width="500" height="400" fill="#e3eadb"/><path d="M0 30Q180 65 500 10v80Q215 180 0 145z" fill="#d1dec7"/><path d="M0 283q160-80 310-30t190 10v137H0z" fill="#d3e1c7"/><path d="M400 0C300 110 433 250 350 400" stroke="#a5c8bd" stroke-width="49" fill="none" opacity=".93"/><path d="M400 0C300 110 433 250 350 400" stroke="#8fb8ab" stroke-width="15" fill="none" opacity=".9"/><g stroke="#f9f9ef" stroke-width="18" fill="none"><path d="M-30 110L540 305"/><path d="M25 -20L490 420"/><path d="M-20 350L520 100"/><path d="M230 -20L240 420"/></g><g stroke="#fefef9" stroke-width="6"><path d="M-10 60L320 410"/><path d="M40 410L480 10"/></g><g font-family="sans-serif" font-size="14" fill="#8b9d8e"><text x="20" y="32">Nijō</text><text x="318" y="164">Kamogawa</text><text x="18" y="375">Kyoto</text><text x="382" y="345">Higashiyama</text></g></svg>${a.map(h=>`<button class="map-pin ${liked(h)?'saved':''} ${S.selected===h.id?'selected':''} ${h.price==null?'unknown':''}" style="left:${h.x}%;top:${h.y}%" onclick="selectMap(${h.id})" aria-label="${esc(h.name)} auswählen">${h.price==null?'?':priceChip(h)}</button>`).join('')}</div><div class="map-foot">Alle Kartenpunkte und Distanzen sind erfunden. Keine Navigation, keine echte Lageprüfung.</div>${selected?`<div class="map-selected"><b>${esc(selected.name)}</b><span>${EUR(selected.price)} · vorläufige Passung ${scoreLabel(selected)} · Datenlage ${selected.evidence}%</span><div><button class="outline" onclick="details(${selected.id})">Details ansehen</button></div></div>`:''}</div>`}
function selectMap(id){S.selected=id;persist();render()}
function emptyForTab(){const all=S.tab==='A';return `<div class="empty-state"><div class="empty-icon">${all?'⌂':'☷'}</div><h3>${all?'Noch keine geprüften Unterkünfte':'Keine Treffer für diese Auswahl'}</h3><p>${all?'Im realistischen Erstlauf fehlen bei allen Kandidaten belastbare Angaben zur passenden Zimmerkategorie, zu echten Betten und/oder zum Familien-Endpreis. Wir füllen Liste A bewusst nicht künstlich auf.':'Passe deine Filter an, oder stelle ausgeschlossene Unterkünfte wieder her.'}</p>${all?'<button class="button" onclick="setTab(\'B\')">Ungeprüfte Kandidaten ansehen →</button>':'<button class="outline" onclick="resetFilters()">Filter zurücksetzen</button>'}</div>`}
function resultsPage(){const a=allVisible(),isMap=S.view==='map',isTable=S.view==='table';let remaining=S.excluded.length;return `<div class="page-title"><div><div class="eyebrow">DEIN PERSÖNLICHER VERGLEICH</div><h1>Kyoto. <span style="font:400 17px -apple-system;color:var(--muted)">8 Demo-Unterkünfte</span></h1><p>13.–27. November 2026 · 14 Nächte · Beispielprofil 2+2 · ${PROFILE_NAMES[S.profile]}</p>${S.city!=='Kyoto'?`<p class="hint" style="margin-top:5px">Du hast ${esc(S.city)} gewählt. Für diesen Prototyp sind dennoch nur Kyoto-Beispieltreffer hinterlegt.</p>`:''}</div><button class="outline" onclick="go('search')">Suche ändern</button></div>
<div class="notice"><span>ⓘ</span><div><strong>Keine echte Unterkunftssuche</strong>Alle Namen, Illustrationen, Preise, Bewertungen und Wegzeiten sind Musterwerte. Unsere echte Such- und Bewertungsmaschine ist noch nicht angeschlossen.</div></div>
${!S.source.google||!S.source.trivago||!S.source.rakuten?`<div class="notice green"><span>◌</span><div><b>Quellenabdeckung – Demo</b><br>Abgewählte oder noch nicht angebundene Quellen können Ergebnisse fehlen lassen. Quellenwahl: ${Object.entries(S.source).filter(([_,v])=>v).map(([k])=>({google:'Google',trivago:'Trivago',rakuten:'Rakuten'}[k])).join(', ')||'keine'}.</div></div>`:''}
${S.cost>=S.limit&&S.showBudgetNotice?`<div class="notice rose"><span>!</span><div><strong>Budgetstopp (nur simuliert)</strong>Limit ${USD(S.limit)} erreicht. Bereits gefundene Kandidaten bleiben in Liste B. <div style="margin-top:8px"><button class="outline" onclick="bumpBudget()">Weiter mit +0,50 USD</button> <button class="ghost" onclick="S.showBudgetNotice=false;render()">So lassen</button></div></div></div>`:''}
<div class="result-summary"><span><b>0 geprüft</b> · ${DEMO.length-remaining} noch prüfen · ${remaining} ausgeschlossen · ${S.saved.length} gemerkt</span><span>Suchkosten <b>${USD(S.cost)}</b> / ${USD(S.limit)} <small>(Demo)</small></span></div>
<div class="section-controls"><div class="tabs"><button class="pill ${S.tab==='A'?'active':''}" onclick="setTab('A')">Geprüft (0)</button><button class="pill ${S.tab==='B'?'active':''}" onclick="setTab('B')">Noch prüfen (${DEMO.length-remaining})</button><button class="pill ${S.tab==='X'?'active':''}" onclick="setTab('X')">Ausgeschlossen (${remaining})</button></div><div class="right-controls"><button class="pill ${S.onlySaved?'active':''}" onclick="set('onlySaved',!S.onlySaved)">♡ Nur Gemerkte</button><button class="pill ${S.filterOpen?'active':''}" onclick="set('filterOpen',!S.filterOpen)">☷ Filter</button></div></div>
${filterBox()}
<div class="section-controls"><div class="tabs"><button class="pill ${S.view==='list'?'active':''}" onclick="setView('list')">☰ Liste</button><button class="pill ${S.view==='table'?'active':''}" onclick="setView('table')">▤ Tabelle</button><button class="pill ${S.view==='map'?'active':''}" onclick="setView('map')">♧ Karte</button></div><div class="field" style="min-width:170px"><label for="sort">Sortierung</label><select id="sort" onchange="setSort(this.value)"><option value="score" ${S.sort==='score'?'selected':''}>Endscore</option><option value="price" ${S.sort==='price'?'selected':''}>Gesamtpreis</option><option value="evidence" ${S.sort==='evidence'?'selected':''}>Datenlage</option><option value="walk" ${S.sort==='walk'?'selected':''}>Gehzeit</option><option value="area" ${S.sort==='area'?'selected':''}>Wohnfläche</option><option value="rating" ${S.sort==='rating'?'selected':''}>Gästenote</option><option value="name" ${S.sort==='name'?'selected':''}>Name</option></select></div><button class="pill" onclick="S.sortDir=S.sortDir==='desc'?'asc':'desc';persist();render()" title="Richtung ändern">${S.sortDir==='desc'?'↓ Absteigend':'↑ Aufsteigend'}</button></div>
<p class="hint" style="margin:-5px 0 14px">${a.length} Treffer nach deinen lokalen Filtern (einschließlich S1-Qualitätskriterien). Endscore aus belegten Beispiel-Teilnoten, kein Verfügbarkeitsnachweis. Liste, Tabelle und Karte nutzen identische Auswahl.</p>
${isTable?(a.length?tableView(a):emptyForTab()):`<div class="results-layout ${isMap?'mobile-map-only':''}"><div class="result-list">${!isMap?(a.length?a.map(hotelCard).join(''):emptyForTab()):`<div class="empty-state"><h3>Schematische Karte</h3><p>Die Karte rechts zeigt dieselben gefilterten Treffer. Auf schmalen Bildschirmen folgt sie direkt.</p></div>`}</div><aside class="map-side ${isMap?'mobile-show':''}">${a.length?mapMarkup(a):''}</aside></div>`}
${isTable?`<div style="margin-top:13px" class="notice green"><span>✓</span><div><strong>Sortierbare Ergebnistabelle</strong>Spaltenüberschriften anklicken: auf- und absteigend. Die Tabelle zeigt ausschließlich dieselbe gefilterte Arbeitsmenge wie Liste und Karte.</div></div>`:''}
<section class="panel" style="margin-top:18px"><div class="simple-line"><div><h3>Fehlende Angaben ergänzen</h3><p class="hint">Zimmer/Betten, konkrete Kategorie und 2+2-Endpreis fehlen. Kein Kandidat wird deshalb voreilig als geprüft bezeichnet.</p></div><button class="button" onclick="makeGapTask()">Lücken füllen (${DEMO.length-remaining})</button></div>${S.request?`<div class="notice green" style="margin:12px 0 0"><span>✓</span><div><b>${esc(S.request.id)} · Status: ${esc(S.request.status)} (nur Demo)</b><br>Es wurde kein Council-Auftrag gesendet. <button class="ghost" onclick="gapModal()">Demo-Auftrag öffnen →</button></div></div>`:''}</section>`}
function savedPage(){const a=DEMO.filter(liked);return `<div class="page-title"><div><div class="eyebrow">DEINE AUSWAHL</div><h1>Gemerkte Unterkünfte.</h1><p>Favoriten sind keine Bewertung und keine Buchung.</p></div></div><div class="notice"><span>ⓘ</span><div>Die Merkliste liegt in dieser Testdatei nur im aktuellen Browser. Eine echte Synchronisierung zwischen iPhone und Rechner gibt es noch nicht.</div></div>${a.length?`<div class="saved-list">${a.map(h=>`<div class="saved-entry"><div><b>${esc(h.name)}</b><small>Beispielpreis: ${EUR(h.price)} · Passung ${scoreLabel(h)} · Datenlage ${h.evidence}%</small></div><div style="display:flex;gap:5px;flex-wrap:wrap"><button class="outline" onclick="details(${h.id})">Details</button><button class="outline" onclick="toggleSaved(${h.id})">Entfernen</button></div></div>`).join('')}</div>`:`<div class="empty-state"><div class="empty-icon">♡</div><h3>Noch keine Unterkünfte gemerkt</h3><p>Markiere eine Unterkunft mit dem Herz. Du kannst anschließend nur die gemerkten Treffer anzeigen.</p><button class="button" onclick="go('results')">Zu den Ergebnissen</button></div>`}`}
function budgetClass(){return S.cost>=S.limit?'stop':S.cost+S.reserved>=S.limit*.8?'warn':''}
function bumpBudget(){S.limit=Math.round((S.limit+.5)*100)/100;S.showBudgetNotice=true;persist();render();toast('Budgetlimit (Demo) um 0,50 USD erhöht')}
function costPage(){return `<div class="page-title"><div><div class="eyebrow">TRANSPARENT BIS ZUM LETZTEN AUFRUF</div><h1>Kosten & Fortschritt.</h1><p>Hier testen wir die Darstellung von Kosten, Reservierungen und Budgetstopp.</p></div></div><div class="notice"><span>ⓘ</span><div><strong>Alle Kosten sind simuliert</strong>Es erfolgen keine echten API-Aufrufe und es entstehen keine Kosten durch diese Demo. Die echten Monatskontingente hängen vom Anbieter-Tarif ab.</div></div><div class="search-layout"><div><div class="panel"><div class="simple-line"><div class="eyebrow">KOSTEN DIESER SUCHDEMO</div><span class="pill orange">Beispielrechnung</span></div><h2 style="margin:12px 0 6px">${USD(S.cost)} <span class="muted" style="font-size:15px">von ${USD(S.limit)}</span></h2><div class="budget-bar ${budgetClass()}"><span style="width:${Math.min(100,100*(S.cost+S.reserved)/S.limit)}%"></span></div><div class="budget-stats"><span>Zusätzlich reserviert: <b>${USD(S.reserved)}</b></span><span>${Math.round(100*(S.cost+S.reserved)/S.limit)} % Budget gebunden</span></div>${S.cost+S.reserved>=S.limit*.8?`<div class="notice ${S.cost>=S.limit?'rose':''}" style="margin-top:13px"><span>!</span><div><b>${S.cost>=S.limit?'Budgetlimit erreicht':'Über 80 % des Budgets erreicht'}</b><br>Dies ist lediglich ein simulierter Kostenstand.</div></div>`:''}<hr class="divide"><div class="budget-lines"><div><span>Künstlich angenommene KI-Kosten</span><strong>${USD(S.cost*.35)}</strong></div><div><span>Sonstige angenommene Laufkosten</span><strong>${USD(S.cost*.65)}</strong></div><div><span>Reservierte zukünftige Aufrufe</span><strong>${USD(S.reserved)}</strong></div></div><p class="hint">Google/SerpApi-Suchkontingente zählen getrennt von US-Dollar-Ausgaben. Ein pauschaler Stückpreis ist kein tatsächlicher Rechnungsbetrag.</p></div><div class="panel"><h3>Budgetstopp simulieren</h3><p class="hint">Verschiebe den Regler: Die Ergebnissuche bleibt bedienbar, auch wenn das Budgetlimit erreicht ist.</p><input class="cost-slider" type="range" min="0" max="2" step="0.05" value="${S.cost}" oninput="setDemoCost(this.value)" aria-label="Simulierte Suchkosten in US-Dollar"><div class="simple-line"><small>0,00 USD</small><b>${USD(S.cost)}</b><small>2,00 USD</small></div><div style="display:flex;gap:8px;margin-top:15px;flex-wrap:wrap"><button class="outline" onclick="bumpBudget()">Limit +0,50 USD</button><button class="outline" onclick="resetBudget()">Zurücksetzen</button><button class="button" onclick="go('results')">Ergebnis ansehen</button></div></div></div><div><div class="panel"><h3>Quellen-Kontingente</h3><p class="hint">Nur Beispielwerte, kein Live-Abruf</p><div class="budget-lines"><div><span>Google/SerpApi im Monat</span><strong>136 von 250</strong></div><div><span>Monatsrest</span><strong>114 Suchabfragen</strong></div><div><span>Geplant für diesen Suchlauf</span><strong>bis zu 25 Einheiten</strong></div><div><span>Trivago</span><strong>Kosten ungeklärt</strong></div><div><span>Rakuten</span><strong>Rechte ungeklärt</strong></div></div><div class="notice green" style="margin:8px 0"><span>✓</span><div>Filter, Tabellen-Sortierung, Merken und Ausschließen verursachen im fertigen System keine weiteren Suchabfragen, solange nur bereits geladene Treffer benutzt werden.</div></div></div></div></div>`}
function setDemoCost(v){S.cost=Number(v);S.showBudgetNotice=true;persist();render()}
function resetBudget(){S.cost=.42;S.reserved=.08;S.limit=1.5;S.showBudgetNotice=true;persist();render()}
function makeGapTask(){const candidates=DEMO.filter(h=>!excluded(h));S.request={id:'DEMO-'+String(Date.now()).slice(-6),status:'angelegt',count:candidates.length};S.statuses=Object.fromEntries(candidates.map(h=>[h.id,'angelegt']));persist();render();gapModal()}
function gapText(){return `DEMONSTRATION – KEIN ECHTER COUNCIL-AUFTRAG\nLückenfüller ${S.request?.id||'DEMO'} für ${S.city}.\n${S.start} bis ${S.end}; ${S.adults} Erwachsene, ${S.children} Kinder (${S.age1}/${S.age2} Jahre).\nBitte für jeden Kandidaten folgende Felder prüfen: passende konkrete Zimmerkategorie, echte Betten (Zahl/Art), getrennte Schlafzimmer, maximal zulässige Belegung, Gesamtpreis 2+2 inklusive Gebühren und Stornobedingungen sowie Balkon.\nBeispiel-Kandidaten: ${DEMO.filter(h=>!excluded(h)).map(h=>h.name).join('; ')}.\nHINWEIS: Namen und Preise sind ERFUNDEN. Für einen echten Auftrag müssen reale Treffer-IDs aus dem späteren Suchlauf eingesetzt werden.`}
function copyTask(){const t=gapText();if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(t).then(()=>toast('Demotext kopiert – kein Auftrag übertragen')).catch(()=>fallbackCopy(t))}else fallbackCopy(t)}
function fallbackCopy(t){const el=document.createElement('textarea');el.value=t;document.body.appendChild(el);el.select();try{document.execCommand('copy');toast('Demotext kopiert')}catch(e){toast('Kopieren in diesem Browser nicht möglich')}finally{el.remove()}}
function changeTaskStatus(v){if(!S.request)return;S.request.status=v;for(const id of Object.keys(S.statuses||{}))S.statuses[id]=v;persist();gapModal()}
function changeCandidateStatus(id,v){if(!S.request)return;S.statuses[id]=v;const vals=Object.values(S.statuses);S.request.status=vals.every(x=>x==='erledigt')?'erledigt':vals.some(x=>x==='in Arbeit')?'in Arbeit':vals.every(x=>x==='nicht möglich')?'nicht möglich':'teilweise bearbeitet';persist();gapModal()}
function openClaudeDemo(){copyTask();window.open('https://claude.ai/new','_blank','noopener,noreferrer')}
function gapModal(){const status=S.request?.status||'angelegt';document.getElementById('modalRoot').innerHTML=`<div class="modal-backdrop" onclick="closeModal(event)"><div class="modal" role="dialog" aria-modal="true" aria-label="Lückenfüller Demo"><button class="modal-close" onclick="closeModal()" aria-label="Schließen">✕</button><div class="eyebrow">LÜCKENFÜLLER · STUFE 2</div><h2 style="margin:10px 0">Datenlücken gezielt prüfen.</h2><p class="muted">Auftrag ${esc(S.request?.id||'DEMO')} · ${esc(status)} · ${S.request?.count||0} Kandidaten</p><div class="notice" style="margin-top:16px"><span>!</span><div><strong>Nur eine Simulation</strong>Es wurde kein echter Auftrag in Council oder Supabase angelegt. Eine automatische Übergabe an Claude und ein vorgefüllter Link sind noch nicht nachgewiesen.</div></div><div class="panel"><b>Geplante Prüfung</b><p class="hint">Zimmerkategorie · echte Betten · Schlafzimmer · Belegung · Gesamtpreis mit Gebühren · Storno · Balkon</p><textarea readonly style="width:100%;height:190px;resize:vertical;margin-top:12px;border:1px solid var(--line);border-radius:10px;padding:12px;font-size:12px;background:#f9faf5">${esc(gapText())}</textarea><div style="display:flex;gap:9px;flex-wrap:wrap;margin-top:12px"><button class="button" onclick="copyTask()">Demotext kopieren</button><button class="outline" onclick="openClaudeDemo()">Text kopieren & Claude-Chat öffnen ↗</button><button class="outline" onclick="changeTaskStatus('in Arbeit')">Status: in Arbeit</button><button class="outline" onclick="changeTaskStatus('erledigt')">Status: erledigt</button><button class="outline" onclick="changeTaskStatus('nicht möglich')">Nicht möglich</button></div></div><p class="hint">Der Claude-Link öffnet nur einen neuen Chat. Vorbefüllen und automatisches Senden funktionieren hier nicht; bitte den Demotext nicht als echten Suchauftrag absenden.</p><div class="panel" style="margin-top:13px"><b>Status je Kandidat – nur Demo</b><div class="candidate-status-grid">${Object.entries(S.statuses||{}).map(([id,v])=>`<label><span>${esc(DEMO.find(h=>h.id===Number(id))?.name||id)}</span><select aria-label="Status von ${esc(DEMO.find(h=>h.id===Number(id))?.name||id)}" onchange="changeCandidateStatus(${Number(id)},this.value)">${['angelegt','in Arbeit','erledigt','nicht möglich'].map(k=>`<option value="${k}" ${v===k?'selected':''}>${k}</option>`).join('')}</select></label>`).join('')}</div></div></div></div>`}
function details(id){let h=DEMO.find(x=>x.id===id);if(!h)return;let weights=WEIGHTS[S.profile];document.getElementById('modalRoot').innerHTML=`<div class="modal-backdrop" onclick="closeModal(event)"><div class="modal" role="dialog" aria-modal="true" aria-label="Details ${esc(h.name)}"><button class="modal-close" onclick="closeModal()" aria-label="Schließen">✕</button><div class="eyebrow">NOCH PRÜFEN · BEISPIELUNTERKUNFT</div><h2 style="margin:8px 0 5px">${esc(h.name)}</h2><p class="muted" style="font-size:12px">${esc(h.zone)} · ${esc(h.type)} · Keine echte Unterkunftsbuchung</p><div class="modal-art">${artSvg(h)}</div><div class="notice"><span>ⓘ</span><div><strong>Nur fiktive Werte</strong>Keine 2+2-Rate mit gesicherter Kategorie und Bettenzuordnung. Deshalb ausschließlich Liste B.</div></div><div class="simple-line"><div><span class="eyebrow">VORLÄUFIGER ENDSCORE</span><h2>${scoreLabel(h)}</h2></div><div style="text-align:right"><span class="eyebrow">DATENABDECKUNG</span><h2>${h.evidence} %</h2></div></div><p class="hint">Gesamtbewertung ist gewichteter Mittelwert nur vorhandener Beispielnoten. Datenlage zeigt gesondert die unvollständig belegten Kriterien.</p>${S.statuses[h.id]?`<p class="hint"><b>Lückenfüller-Demostatus:</b> ${esc(S.statuses[h.id])}</p>`:''}<div class="score-grid">${LABELS.map((l,i)=>`<div class="score-row"><span>${l}<br><small class="muted">Gewicht ${weights[i]} %</small></span><div class="score-track"><span style="width:${(h.parts[i]||0)*10}%"></span></div><strong>${h.parts[i]!=null?(h.parts[i]).toFixed(1).replace('.',',')+'/10':'ungeprüft'}</strong></div>`).join('')}</div><div class="modal-note"><b>Was fehlt noch?</b><p style="margin-top:5px">${esc(h.details)}</p></div><ul class="modal-list"><li>Schlafzimmer (Katalog): ${h.room??'unbekannt'}</li><li>Echte Betten (Katalog): ${h.beds??'unbekannt'}</li><li>Wohnfläche: ${h.area??'unbekannt'}${h.area!=null?' m²':''}</li><li>Familien-Endpreis: ${EUR(h.price)} (nur Demo)</li><li>Favorit ≠ Urteil / gebucht. Buchungslink ohne echte Quelle nicht verfügbar.</li></ul><div class="simple-line"><button class="button" onclick="toggleSaved(${h.id});details(${h.id})">${liked(h)?'♥ Gemerkt':'♡ Merken'}</button><button class="outline" onclick="toggleExcluded(${h.id});closeModal()">${excluded(h)?'Zurückholen':'Ausschließen'}</button><button class="outline" disabled title="Keine echte Angebots-URL">Buchungslink fehlt</button></div></div></div>`}
function closeModal(e){if(e&&e.target!==e.currentTarget)return;document.getElementById('modalRoot').innerHTML=''}
function attachSwipe(){document.querySelectorAll('[data-swipe]').forEach(el=>{let x,y,time;el.addEventListener('touchstart',e=>{if(e.touches.length!==1)return;x=e.touches[0].clientX;y=e.touches[0].clientY;time=Date.now()},{passive:true});el.addEventListener('touchend',e=>{if(x===undefined)return;let dx=e.changedTouches[0].clientX-x,dy=e.changedTouches[0].clientY-y;let id=Number(el.getAttribute('data-swipe'));x=undefined;if(Math.abs(dx)>95&&Math.abs(dx)>Math.abs(dy)*1.8&&Date.now()-time<1000){if(dx>0)toggleSaved(id);else toggleExcluded(id)}},{passive:true})})}
function render(){nav();document.getElementById('app').innerHTML=S.screen==='search'?searchPage():S.screen==='results'?resultsPage():S.screen==='saved'?savedPage():costPage();document.getElementById('modalRoot').innerHTML='';attachSwipe()}
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal()});render();

</script></body></html>
