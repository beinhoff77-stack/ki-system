/* Gesetzbuch der Mathematik – Entwurf des Designers. Grundfarben = Gestaltung „Abflug hell / dunkel“ der App. */
*, *::before, *::after { box-sizing: border-box; }
html { scroll-behavior: smooth; } html, body { margin: 0; }
:root { --mono: "JetBrains Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace; --grotesk: "Space Grotesk", system-ui, -apple-system, "Segoe UI", sans-serif;
  --s1: #F59E00; --s2: #FFB81F; --s3: #FFD23F; --s4: #FFE68C; --auf-sonne: #11161D; }
body { font-family: var(--grotesk); font-size: 17px; font-weight: 500; line-height: 1.4; background: var(--bg); color: var(--text); -webkit-text-size-adjust: 100%; }
body[data-g="nacht"] { color-scheme: dark; --bg: #0B0F14; --flaeche: #151B24; --flaeche2: #1D2530; --text: #F2F4F7; --leise: #A9B3C1; --linie: #2E3947; --akzent: #FFD23F; --akzent-tief: #C79E1C;
  --z-papier: #10161E; --z-karo: #243140; --z-tinte: #F2F4F7; --z-leise: #9AA6B5; --z-gelb: #FFD23F; --z-gelb-fl: #6B5714; --z-blau: #7CB7FF; --z-blau-fl: #1B3A5F; --z-rot: #FF8A8A;
  --marke: #FFD23F; --fehler-bg: #2A1A1C; --fehler-rand: #FF8A8A; --fehler-text: #FFC9C9; --schatten: 0 14px 40px rgba(0, 0, 0, .5); }
body[data-g="hell"] { color-scheme: light; --bg: #F3F1EA; --flaeche: #FFFFFF; --flaeche2: #F6F4EE; --text: #11161D; --leise: #4A5563; --linie: #C9C4B6; --akzent: #FFD23F; --akzent-tief: #C79E1C;
  --z-papier: #FFFEFA; --z-karo: #C7D8E8; --z-tinte: #11161D; --z-leise: #5B6675; --z-gelb: #FFD23F; --z-gelb-fl: #FFE88A; --z-blau: #1F5FBF; --z-blau-fl: #D9E8FB; --z-rot: #B3261E;
  --marke: #FFD23F; --fehler-bg: #FFF0EE; --fehler-rand: #B3261E; --fehler-text: #7A1712; --schatten: 0 12px 34px rgba(17, 22, 29, .16); }
button, input { font: inherit; color: inherit; } button { cursor: pointer; -webkit-tap-highlight-color: transparent; }
a { color: inherit; }
:focus-visible { outline: 3px solid var(--text); outline-offset: 2px; border-radius: 6px; }
.leise { color: var(--leise); }
.ueber { font-family: var(--mono); font-size: 13px; letter-spacing: .1em; text-transform: uppercase; color: var(--leise); font-weight: 600; margin: 0; }
h1, h2, h3, p { margin: 0; }
.breite { max-width: 1240px; margin: 0 auto; padding-left: 16px; padding-right: 16px; }
@media (min-width: 700px) { .breite { padding-left: 28px; padding-right: 28px; } }

/* Kopf mit Suche: auf jeder Seite gleich */
.kopf { position: sticky; top: 0; z-index: 10; background: var(--bg); border-bottom: 1px solid var(--linie); }
.kopf .breite { display: flex; align-items: center; gap: 10px; min-height: 60px; }
.kopf-marke { display: inline-flex; align-items: center; gap: 10px; text-decoration: none; font-weight: 700; font-size: 17px; min-height: 44px; white-space: nowrap; }
.kopf-marke i { width: 26px; height: 26px; border-radius: 50%; background: var(--s3); box-shadow: 0 0 0 4px rgba(255, 210, 63, .28); flex: none; }
.kopf-marke span.lang { display: none; } @media (min-width: 700px) { .kopf-marke span.lang { display: inline; } .kopf-marke span.kurz { display: none; } }
.suche { flex: 1; display: flex; justify-content: flex-end; }
.suche label { position: relative; display: block; width: 100%; max-width: 420px; }
.suche input { width: 100%; height: 44px; border-radius: 12px; border: 1.5px solid var(--linie); background: var(--flaeche); padding: 0 14px 0 40px; font-size: 16px; }
.suche input::placeholder { color: var(--leise); opacity: 1; }
.suche svg { position: absolute; left: 12px; top: 12px; width: 20px; height: 20px; color: var(--leise); pointer-events: none; }

/* Rechnungen und Wirkstelle */
.rechnung, .z-gl { font-family: var(--mono); font-weight: 600; }
b.w { background: var(--marke); color: #11161D; border-radius: 5px; padding: 1px 5px; font-weight: 700; }
.br { display: inline-flex; flex-direction: column; align-items: center; vertical-align: middle; font-size: .78em; line-height: 1.05; margin: 0 1px; }
.br i { font-style: normal; padding: 0 2px; } .br i:first-child { border-bottom: 2px solid currentColor; }

/* Zeichnungen */
.zeichnung { margin: 0; }
.z-reihe { display: flex; flex-wrap: wrap; align-items: stretch; gap: 10px 0; }
.z-teil { flex: 1 1 250px; min-width: 0; max-width: 420px; background: var(--z-papier); border: 1.5px solid var(--linie); border-radius: 16px; padding: 10px 10px 12px; }
.zeichnung[data-felder="1"] .z-teil { max-width: 460px; }
.z-feld { display: block; width: 100%; height: auto; }
.z-kopf { font-family: var(--mono); font-size: 13px; letter-spacing: .1em; text-transform: uppercase; color: var(--leise); font-weight: 600; padding: 0 4px 2px; }
.z-gl { font-size: 17px; text-align: center; padding: 6px 2px 2px; line-height: 1.8; }
.z-satz { font-size: 16px; color: var(--leise); text-align: center; padding: 0 6px; }
.z-pfeil { flex: 0 0 26px; align-self: center; height: 2px; background: var(--text); position: relative; margin: 0 5px 0 3px; }
.z-pfeil::after { content: ""; position: absolute; right: -4px; top: -5px; border: 6px solid transparent; border-left: 9px solid var(--text); border-right: 0; }
.z-pfeil.leer { flex-basis: 10px; background: none; margin: 0; } .z-pfeil.leer::after { display: none; }
.z-schritt { display: inline-block; font-size: 16px; font-weight: 700; background: var(--text); color: var(--bg); border-radius: 999px; padding: 3px 11px; margin: 0 0 6px 2px; }
@media (max-width: 899px) { .z-reihe { flex-direction: column; align-items: center; gap: 0; } .z-teil { flex: none; width: 100%; max-width: 420px; }
  .z-pfeil { flex: 0 0 22px; width: 2px; height: 22px; margin: 3px 0 5px; } .z-pfeil::after { right: -5px; top: auto; bottom: -4px; border: 6px solid transparent; border-top: 9px solid var(--text); border-bottom: 0; } .z-pfeil.leer { flex-basis: 10px; } }
.z-mini { background: var(--z-papier); border: 1.5px solid var(--linie); border-radius: 12px; padding: 4px; }
.z-folgt { border: 1.5px dashed var(--linie); border-radius: 16px; padding: 14px 16px; background: var(--flaeche2); }
.z-folgt p { font-size: 16px; } .z-folgt .ueber { margin-bottom: 4px; }

/* Karten und Listen */
.karte { background: var(--flaeche); border: 1.5px solid var(--linie); border-radius: 18px; }
a.karte, button.karte { display: block; text-decoration: none; text-align: left; width: 100%; }
a.karte:hover, button.karte:hover { border-color: var(--text); }
.nr { font-family: var(--mono); font-size: 13px; font-weight: 700; letter-spacing: .06em; color: var(--leise); }
.kl { font-family: var(--mono); font-size: 13px; font-weight: 600; color: var(--leise); white-space: nowrap; }
.pfad { display: flex; flex-wrap: wrap; gap: 0 6px; align-items: center; font-size: 16px; color: var(--leise); padding: 14px 0 4px; }
.pfad a { text-decoration: underline; text-underline-offset: 3px; min-height: 44px; display: inline-flex; align-items: center; }
.pfad span.t { opacity: .7; }

/* Entwurfs-Schalter: gehört nicht zur App */
.entwurf { position: fixed; left: 10px; bottom: 10px; z-index: 50; font-family: system-ui, sans-serif; font-size: 13px; }
.entwurf > button { border: 1px solid #8884; background: #1f2937; color: #fff; border-radius: 999px; padding: 7px 12px; font: inherit; opacity: .9; }
.entwurf-feld { position: absolute; left: 0; bottom: 40px; width: 250px; background: #1f2937; color: #fff; border-radius: 14px; padding: 12px; box-shadow: 0 10px 30px #0008; display: none; line-height: 1.5; }
.entwurf.offen .entwurf-feld { display: block; }
.entwurf-feld a { color: #FFD23F; display: block; padding: 3px 0; }
.entwurf-feld button { font: inherit; margin-top: 8px; border-radius: 8px; border: 1px solid #fff5; background: transparent; color: #fff; padding: 6px 10px; }
body.bild .entwurf { display: none; }
/* Zweite Fassung: Hervorhebung trägt auch ohne Farbe (Rahmen), weitere Farbpaare, eigener Ast, „Genau gesagt“ */
b.w { box-shadow: inset 0 0 0 1.5px #11161D, 0 0 0 1px var(--text); white-space: nowrap; }
b.bl, b.sf { color: var(--text); border-radius: 5px; padding: 1px 5px; font-weight: 700; box-shadow: inset 0 0 0 1.5px var(--z-blau); white-space: nowrap; }
b.bl { background: var(--z-blau-fl); } b.sf { background: repeating-linear-gradient(45deg, transparent 0 4px, var(--linie) 4px 6px); box-shadow: inset 0 0 0 1.5px var(--leise); }
.z-ast { font-size: 17px; font-weight: 700; margin: 18px 0 8px; padding-top: 14px; border-top: 1.5px dashed var(--linie); }
.zeichnung[data-felder="1"] .z-satz { padding-top: 6px; }
.genau { display: block; font-size: 16px; font-weight: 500; line-height: 1.4; color: var(--leise); margin-top: 6px; } .genau i { font-style: normal; font-weight: 700; }
.z-folgt p + p { margin-top: 4px; }
.nb { display: inline-block; max-width: 100%; }
@media (min-width: 900px) { .z-reihe[data-n="4"] .z-teil { flex: 1 1 40%; max-width: 520px; } .z-reihe[data-n="4"] .z-pfeil { display: none; } .z-reihe[data-n="4"] { gap: 12px; } }

/* Seiten: Übersicht A und B, Gesetz, Idee, Suche, Zeichenblatt */
.schmal { max-width: 860px; }
.einstieg { padding-top: 26px; padding-bottom: 26px; display: grid; gap: 22px; }
.einstieg h1 { font-size: 30px; line-height: 1.1; font-weight: 700; }

<script>
const INHALT = {"stand":"c8e2cc3","etagen":[{"nr":1,"name":"Grundrechnen"},{"nr":2,"name":"Klammern und Potenzen"},{"nr":3,"name":"Brüche und Verhältnis"},{"nr":4,"name":"Gleichungen"}],"regeln":[{"id":"R1","nr":1,"name":"Stellenwert","etage":1,"satz":"Mal zehn: Jede Ziffer rückt eins nach links.","wirkstelle":"Die Ziffern, die rücken (in der Zeichnung jede Ziffer mit ihrem Pfeil); in der Rechenzeile „· 10“ oder „: 10“.","genau":"Mal 10 rückt jede Ziffer in die nächsthöhere Stelle, geteilt durch 10 in die nächstniedrigere.","warum":"Unser Zahlensystem bündelt in Zehnern: Jede Stelle ist zehnmal so viel wert wie die Stelle rechts von ihr. Beim Malnehmen mit 10 wird deshalb aus jedem Einer ein Zehner, aus jedem Zehntel ein Einer. Die Ziffern bleiben, nur ihre Plätze ändern sich. Das Komma markiert die Grenze zwischen Einern und Zehnteln.","voraus":"Gilt für jede Zahl im Zehnersystem, auch hinter dem Komma.","fehler":"„Eine Null anhängen“: 2,5 · 10 ist 25, nicht 2,50.","verwandt":"Runden ist eine eigene Vereinbarung (Planet Zahlen). Prozent heißt Hundertstel (Planet Geld und Verhältnisse). Flächen- und Raumeinheiten: Umrechnungszahl 100 und 1 000 (Planet Fläche und Raum).","weg":"– (zum Erklären hilfreich, keine Lernvoraussetzung)","klassen":[{"klasse":5,"art":"Einführung","text":"340 · 10 = 3 400","thema":"zahlen.natuerlich"},{"klasse":5,"art":"Anwendung","text":"3 400 m = 3,4 km","thema":"groessen.einheiten"},{"klasse":6,"art":"Einführung","text":"2,5 · 10 = 25","thema":"bruch.dezimal"},{"klasse":6,"art":"Anwendung","text":"15 % = 15 Hundertstel = 0,15","thema":"bruch.prozent"},{"klasse":8,"art":"Anwendung","text":"3 · 10⁻⁴ = 0,0003","thema":"terme.potenzgesetze_ganzzahlig"}],"zeichen":{"Zu sehen":"Eine Stellenwerttafel mit den Spalten H, Z, E, Komma-Strich, z, h. Zwei Zeilen: oben die Zahl 2,5 (2 in E, 5 in z), unten 25 (2 in Z, 5 in E). Von jeder Ziffer der oberen Zeile führt ein schräger Pfeil zu derselben Ziffer eine Spalte weiter links.","Maße":"Fünf gleich breite Spalten; der Komma-Strich steht fest zwischen E und z und ist in beiden Zeilen an derselben Stelle.","Beschriftung":"Spaltenköpfe H, Z, E, z, h; rechts neben den Zeilen „2,5“ und „· 10 = 25“.","Hervorgehoben":"Die beiden Pfeile (gleiche Farbe, gleiche Länge, gleiche Richtung).","Darf nicht falsch aussehen":"Das Komma darf nicht wandern. Es darf keine Null erscheinen. Beide Ziffern müssen gleich weit rücken.","Gleiche Zeichnung, andere Beschriftung":"Dieselbe Tafel für 3 400 m = 3,4 km (geteilt durch 1 000: drei Spalten nach rechts) und für 0,0003 = 3 · 10⁻⁴."},"stufen":{"5":"E","6":"E","8":"A"}},{"id":"R2","nr":2,"name":"Plus und Minus mit negativen Zahlen","etage":1,"satz":"Minus heißt umdrehen – zweimal umdrehen ist wieder geradeaus.","wirkstelle":"Jedes Minuszeichen – Rechenzeichen wie Vorzeichen. Ein Plus wird nicht markiert.","genau":"Beim Addieren zeigt das Vorzeichen der zweiten Zahl die Richtung. Beim Subtrahieren gehst du genau andersherum.","warum":"Auf der Zahlengeraden heißt „plus eine positive Zahl“ nach rechts gehen und „plus eine negative Zahl“ nach links. Subtrahieren ist das Gegenteil des Addierens, also läuft man jeweils in die andere Richtung. Deshalb ist 3 − (−2) dasselbe wie 3 + 2.","voraus":"Gilt für alle Zahlen: ganze Zahlen, Brüche, Dezimalzahlen und später Terme.","fehler":"3 − (−2) = 1 statt 5: das zweite Minus übersehen. Und: −30 für größer halten als −10.","verwandt":"Betrag und Gegenzahl (Planet Zahlen). Bei Mal und Geteilt gilt eine andere Regel: die Vorzeichenregel.","weg":"– (zum Erklären hilfreich, keine Lernvoraussetzung)","klassen":[{"klasse":5,"art":"Einführung","text":"3 + (−2) = 1","thema":"zahlen.ganz"},{"klasse":5,"art":"Einführung","text":"3 − (−2) = 5","thema":"zahlen.ganz"},{"klasse":6,"art":"Anwendung","text":"−½ − ¾ = −1¼","thema":"bruch.rechnen"},{"klasse":7,"art":"Anwendung","text":"3x − 5x = −2x","thema":"terme.umformen"},{"klasse":8,"art":"Anwendung","text":"x + 5 < 2, also x < −3","thema":"gleichungen.ungleichungen"}],"zeichen":{"Zu sehen":"Zwei Zahlengeraden untereinander von −1 bis 6. Oben: Startpunkt bei 3, ein Bogenpfeil zwei Einheiten nach links, Landung bei 1. Unten: Startpunkt bei 3, ein Bogenpfeil zwei Einheiten nach rechts, Landung bei 5.","Maße":"Gleicher Maßstab auf beiden Geraden, Teilstriche an jeder ganzen Zahl; beide Starts genau übereinander bei 3.","Beschriftung":"Über der oberen Geraden „3 + (−2) = 1“ und „einmal umdrehen“, über der unteren „3 − (−2) = 5“ und „zweimal umdrehen“. Start mit vollem Punkt, Ziel mit Ring. Am Start steht eine kleine Figur mit Blick nach rechts; je Minuszeichen zeigt ein kleiner Bogenpfeil eine Kehrtwende.","Hervorgehoben":"Jedes Minuszeichen und die zugehörige Kehrtwende in derselben Farbe: oben eine, unten zwei.","Darf nicht falsch aussehen":"Beide Pfeile müssen genau zwei Einheiten lang sein. Der Start darf nicht bei 0 liegen. Die Null muss sichtbar sein.","Gleiche Zeichnung, andere Beschriftung":"Dieselben zwei Geraden für −½ − ¾ (Teilstriche in Vierteln) und für 3x − 5x (Einheit „x“)."},"stufen":{"5":"E","6":"A","7":"A","8":"A"}},{"id":"R3","nr":3,"name":"Vorzeichen bei Mal und Geteilt","etage":1,"satz":"Minus mal Minus gibt Plus, Minus mal Plus gibt Minus.","wirkstelle":"Die Vorzeichen der beiden Zahlen und das Vorzeichen des Ergebnisses.","genau":"Bei Mal und Geteilt mit zwei Zahlen ungleich null: Gleiche Vorzeichen ergeben Plus, verschiedene Minus.","warum":"In der Reihe 3 · (−2) = −6, 2 · (−2) = −4, 1 · (−2) = −2, 0 · (−2) = 0 wird das Ergebnis jedes Mal um 2 größer. Setzt man sie fort, muss (−1) · (−2) = 2 sein. Nur so bleiben die übrigen Rechengesetze gültig. Für Geteilt gilt dasselbe, weil Teilen die Gegenrechnung zum Malnehmen ist.","voraus":"Gilt für zwei Zahlen, die beide nicht null sind. Ist ein Faktor null, ist das Produkt null und hat kein Vorzeichen.","fehler":"Die Regel auf Plus übertragen: (−3) + (−4) ist −7, nicht +7.","verwandt":"Ungleichungen: Mal oder geteilt durch eine negative Zahl dreht das Ungleichheitszeichen um (Planet Algebra). Potenzen mit negativer Basis (Planet Zahlen).","weg":"Plus und Minus mit negativen Zahlen (zum Erklären hilfreich, keine Lernvoraussetzung)","klassen":[{"klasse":5,"art":"Einführung","text":"(−3) · (−4) = 12","thema":"zahlen.rechengesetze"},{"klasse":5,"art":"Einführung","text":"(−12) : 4 = −3","thema":"zahlen.rechengesetze"},{"klasse":6,"art":"Anwendung","text":"(−⅔) · ¾ = −½","thema":"bruch.rechnen"},{"klasse":7,"art":"Anwendung","text":"(−2x) · (−3) = 6x","thema":"terme.umformen"},{"klasse":8,"art":"Anwendung","text":"−2x < 6, also x > −3","thema":"gleichungen.ungleichungen"},{"klasse":9,"art":"Anwendung","text":"x² = 25 hat die Lösungen 5 und −5","thema":"gleichungen.quadratisch"}],"zeichen":{"Zu sehen":"Eine Treppe aus fünf Stufen, die von links nach rechts ansteigt. Auf den Stufen stehen die Ergebnisse −6, −4, −2, 0, +2; unter jeder Stufe die Rechnung 3 · (−2), 2 · (−2), 1 · (−2), 0 · (−2), (−1) · (−2).","Maße":"Alle Stufen gleich hoch (eine Stufe = 2). Die Stufe mit 0 liegt auf einer durchgezogenen Null-Linie.","Beschriftung":"Zwischen den Stufen jeweils „+ 2“. Der erste Faktor zählt sichtbar herunter: 3, 2, 1, 0, −1.","Hervorgehoben":"Die letzte Stufe (−1) · (−2) = +2, über der Null-Linie.","Darf nicht falsch aussehen":"Die Treppe muss steigen, nicht fallen. Die Stufen müssen gleich hoch sein. Die +2 muss oberhalb der Null-Linie liegen.","Gleiche Zeichnung, andere Beschriftung":"Keine – diese Zeichnung bleibt bei Zahlen. Für (−2x) · (−3) = 6x wird nur das Ergebnis darunter geschrieben."},"stufen":{"5":"E","6":"A","7":"A","8":"A","9":"A"}},{"id":"R4","nr":4,"name":"Reihenfolge beim Rechnen","etage":1,"satz":"Klammer zuerst, dann Hoch, dann Punkt vor Strich.","wirkstelle":"Der Teil, der zuerst gerechnet wird (Rahmen).","genau":"Klammer zuerst, dann Hoch, dann Punkt, dann Strich – Gleichrangiges von links nach rechts.","warum":"Die Reihenfolge ist eine Vereinbarung, damit jeder dieselbe Rechnung gleich liest. Sie folgt dem Aufbau der Rechenarten: Hoch ist wiederholtes Malnehmen, Mal ist wiederholtes Addieren – die „stärkere“ Rechnung bindet enger. Klammern sind das Mittel, die Reihenfolge zu ändern.","voraus":"Gilt für jeden Term. Mal und Geteilt sind gleichrangig, ebenso Plus und Minus: Dann wird von links nach rechts gerechnet, zum Beispiel 12 : 3 · 2 = 8.","fehler":"Von links nach rechts durchrechnen: 2 + 3 · 4 = 20. Und: 2 + 3x zu 5x zusammenziehen.","verwandt":"Die zuletzt ausgeführte Rechnung gibt dem Term seinen Namen: 2 + 3x ist eine Summe (Planet Algebra).","weg":"– (zum Erklären hilfreich, keine Lernvoraussetzung)","klassen":[{"klasse":5,"art":"Einführung","text":"2 + 3 · 4 = 14","thema":"zahlen.rechengesetze"},{"klasse":5,"art":"Einführung","text":"12 : 3 · 2 = 8","thema":"zahlen.rechengesetze"},{"klasse":6,"art":"Anwendung","text":"½ + ½ · ½ = ¾","thema":"bruch.rechnen"},{"klasse":7,"art":"Anwendung","text":"2 + 3x bleibt 2 + 3x","thema":"terme.umformen"},{"klasse":8,"art":"Anwendung","text":"3 · 2⁻² = ¾","thema":"terme.potenzgesetze_ganzzahlig"},{"klasse":9,"art":"Anwendung","text":"−3² = −9","thema":"gleichungen.quadratisch"},{"klasse":10,"art":"Anwendung","text":"2 · 3ˣ = 18: erst durch 2, dann 3ˣ = 9, also x = 2","thema":"gleichungen.exponential"}],"zeichen":{"Zu sehen":"Vier Treppenstufen von oben nach unten, beschriftet „Klammer“, „Hoch“, „Punkt · :“, „Strich + −“. Rechts daneben die Rechnung 2 + 3 · 4 in drei Zeilen: erst mit einem Rahmen um 3 · 4, dann 2 + 12, dann 14.","Maße":"Stufen gleich breit und gleich hoch. Der Rahmen umschließt genau „3 · 4“.","Beschriftung":"Auf der dritten Stufe die Zeichen · und :, auf der vierten + und −. Kleiner Zusatz an Stufe 3 und 4: „von links nach rechts“.","Hervorgehoben":"Der Rahmen um 3 · 4 in der Farbe der Stufe „Punkt“.","Darf nicht falsch aussehen":"Die oberste Stufe muss die erste sein (Klammer). Punkt und Strich dürfen nicht auf einer Höhe stehen. · und : stehen zusammen auf einer Stufe.","Gleiche Zeichnung, andere Beschriftung":"Dieselbe Treppe mit ½ + ½ · ½, mit 2 + 3x und mit 2 · 3² – immer wird der Teil eingerahmt, der zuerst kommt."},"stufen":{"5":"E","6":"A","7":"A","8":"A","9":"A","10":"A"}},{"id":"R5","nr":5,"name":"Tauschen, Klammern, Zusammenfassen","etage":2,"satz":"Tauschen bei Plus und Mal. Zusammenfassen: nur Gleiches zu Gleichem.","wirkstelle":"Beim Tauschen: das Rechenzeichen zusammen mit seiner Zahl. Beim Zusammenfassen: der gleiche Buchstabenteil.","genau":"In einer Summe darfst du die Summanden tauschen und neu klammern, in einem Produkt die Faktoren. Zusammenfassen: gleicher Buchstabenteil – Vorzahlen addieren.","warum":"Bei einer Summe und bei einem Produkt kommt es nicht auf die Reihenfolge und nicht auf die Klammerung an (Vertauschungs- und Verbindungsgesetz). Zusammenfassen heißt zählen: 3 Stück a und 4 Stück a sind 7 Stück a.","voraus":"Gilt für reine Summen und reine Produkte. Eine Differenz schreibt man vorher als Summe (5 − 3 = 5 + (−3)), dann wandert das Minus mit seiner Zahl mit.","fehler":"Bei Minus oder Geteilt einfach tauschen: 5 − 3 ist nicht 3 − 5. Und: 3a + 4b zu 7ab zusammenfassen.","verwandt":"Vertauschungsgesetz (Kommutativgesetz) und Verbindungsgesetz (Assoziativgesetz) sind die Fachnamen. 0 ändert beim Addieren nichts, 1 ändert beim Malnehmen nichts.","weg":"– (zum Erklären hilfreich, keine Lernvoraussetzung)","klassen":[{"klasse":5,"art":"Einführung","text":"25 · 37 · 4 = 25 · 4 · 37 = 3 700","thema":"zahlen.rechengesetze"},{"klasse":5,"art":"Einführung","text":"12 − 30 + 18 = 12 + 18 − 30 = 0","thema":"zahlen.ganz"},{"klasse":6,"art":"Anwendung","text":"0,5 · 7 · 2 = 0,5 · 2 · 7 = 7","thema":"bruch.rechnen"},{"klasse":7,"art":"Einführung","text":"3a + 2b + 4a = 7a + 2b","thema":"terme.umformen"},{"klasse":9,"art":"Anwendung","text":"3 · √2 + 2 · √2 = 5 · √2","thema":"zahlen.reell"}],"zeichen":{"Zu sehen":"Oben: drei Kärtchen in einer Reihe „25“, „· 37“, „· 4“; darunter dieselben Kärtchen umgestellt „25“, „· 4“, „· 37“, die ersten beiden mit einer Klammer zusammengefasst und „100“ darunter. Unten: zwei Körbe; in den linken fallen die Kärtchen „+3a“ und „+4a“ (darunter „7a“), in den rechten „+2b“.","Maße":"Jedes Kärtchen trägt sein Rechenzeichen fest vorn. Kärtchen gleich groß.","Beschriftung":"Oben „25 · 37 · 4 = 25 · 4 · 37 = 3 700“. Unten „3a + 2b + 4a = 7a + 2b“.","Hervorgehoben":"Das Zeichen auf jedem Kärtchen (es wandert mit).","Darf nicht falsch aussehen":"Kein Kärtchen ohne Zeichen außer dem ersten. Im linken Korb dürfen nur a-Kärtchen liegen. a und b dürfen nicht in einem Korb landen.","Gleiche Zeichnung, andere Beschriftung":"Dieselben Kärtchen für 12 − 30 + 18 − 5 (Kärtchen „+12“, „−30“, „+18“, „−5“)."},"stufen":{"5":"E","6":"A","7":"E","9":"A"}},{"id":"R6","nr":6,"name":"Ausmultiplizieren und Ausklammern","etage":2,"satz":"Was vor der Klammer steht, nimmt jeden in der Klammer mal.","wirkstelle":"Der Faktor vor der Klammer – an jeder Stelle, an der er auftritt.","genau":"Der Faktor vor der Klammer multipliziert jeden Summanden – vorwärts ausmultiplizieren, rückwärts ausklammern.","warum":"Ein Rechteck mit den Seiten a und (b + c) hat dieselbe Fläche wie die zwei Teilrechtecke a · b und a · c zusammen. Rückwärts gelesen ist es das Ausklammern: Steckt in jedem Summanden derselbe Faktor, darf man ihn vor eine Klammer ziehen.","voraus":"Gilt für einen Faktor vor einer Summe oder Differenz – für Zahlen, Brüche und Terme.","fehler":"Nur den ersten Summanden malnehmen: 3 · (x + 2) = 3x + 2. Und: die Regel auf Hoch übertragen – (a + b)² ist nicht a² + b².","verwandt":"Summe mal Summe und binomische Formeln (Planet Algebra). Kürzen von Bruchtermen braucht vorher das Ausklammern.","weg":"Reihenfolge beim Rechnen (zum Erklären hilfreich, keine Lernvoraussetzung)","klassen":[{"klasse":5,"art":"Einführung","text":"6 · 98 = 6 · 100 − 6 · 2 = 588","thema":"zahlen.rechengesetze"},{"klasse":6,"art":"Anwendung","text":"4 · 2,5 = 4 · 2 + 4 · 0,5 = 10","thema":"bruch.rechnen"},{"klasse":7,"art":"Einführung","text":"3 · (x + 2) = 3x + 6","thema":"terme.umformen"},{"klasse":7,"art":"Einführung","text":"3x + 6 = 3 · (x + 2)","thema":"terme.umformen"},{"klasse":8,"art":"Anwendung","text":"(3x + 6) : (x + 2) = 3 für x ≠ −2","thema":"terme.bruchterme"},{"klasse":9,"art":"Anwendung","text":"x² + 5x = x · (x + 5)","thema":"gleichungen.quadratisch"},{"klasse":10,"art":"Anwendung","text":"x³ − 4x = x · (x² − 4)","thema":"gleichungen.polynom"}],"zeichen":{"Zu sehen":"Ein Rechteck, durch einen senkrechten Strich in zwei Teilrechtecke geteilt. Linke Seite: Höhe 6. Obere Seite: zwei Abschnitte 20 und 2 (zusammen 22 – für das Minus-Beispiel siehe Varianten). In jedem Teilrechteck steht seine Fläche: 120 und 12.","Maße":"Maßstäblich: Höhe 6 Einheiten, Breite 20 + 2 Einheiten; der Trennstrich steht bei 20. Für die Buchstaben-Fassung dasselbe Rechteck mit den Abschnitten x und 2 (x deutlich länger als 2, ohne Kästchen).","Beschriftung":"Links außen der Faktor, oben über jedem Abschnitt der Summand, in jedem Feld das Teilprodukt. Darunter die Zeile „6 · (20 + 2) = 6 · 20 + 6 · 2“.","Hervorgehoben":"Der Faktor links und die zwei Teilflächen – der Faktor in derselben Farbe wie die beiden Malzeichen in der Zeile darunter.","Darf nicht falsch aussehen":"Beide Teilrechtecke müssen dieselbe Höhe haben. Es dürfen nicht zwei getrennte Rechtecke sein. Der Trennstrich darf nicht in der Mitte stehen, wenn die Summanden verschieden sind.","Gleiche Zeichnung, andere Beschriftung":"**Dieselbe Zeichnung, vier Beschriftungen:** (1) 6 · (20 + 2), (2) 6 · (20 − 2): großes Rechteck Breite 20, rechts ein gestrichelt abgetrenntes Stück Breite 2, (3) 3 · (x + 2), (4) 3/2 · (4 + ½) = 6 + ¾ – Höhe 1,5 und Breite 4,5, damit das Rechteck maßstäblich bleibt und trotzdem dieselbe Gestalt hat wie die anderen drei. Reihenfolge der Felder: Zahlen mit Plus, mit x, mit Brüchen, zuletzt Zahlen mit Minus. Im Minus-Feld stehen in den Flächen die Werte „108“ und „12“. Rückwärts gelesen (Ausklammern): 3x + 6 = 3 · (x + 2). Zusatzbild für den häufigen Fehler: Quadrat mit Seite a + b, in vier Felder a², ab, ab, b² geteilt."},"stufen":{"5":"E","6":"A","7":"E","8":"A","9":"A","10":"A"}},{"id":"R7","nr":7,"name":"Minus vor der Klammer","etage":2,"satz":"Minus vor der Klammer dreht alle Zeichen um.","wirkstelle":"Das Minus vor der Klammer und jedes Vorzeichen, das wechselt (vorher und nachher als Paar).","genau":"Löst du eine Minusklammer auf, wechselt jeder Summand in der Klammer sein Vorzeichen.","warum":"Ein Minus vor der Klammer heißt „mal (−1)“. Der Faktor −1 multipliziert jeden Summanden, also wechselt jedes Vorzeichen. Im Alltag: Wer 20 € hat und einen Einkauf von 8 € mit 3 € Rabatt bezahlt, behält 20 − 8 + 3 €.","voraus":"Gilt für jede Klammer, vor der ein Minus steht. Malzeichen in der Klammer bleiben: −(2 · x − 3) = −2 · x + 3.","fehler":"Nur das erste Vorzeichen wechseln: 5x − (3x − 2) = 5x − 3x − 2.","verwandt":"Folgt aus dem Ausmultiplizieren und der Vorzeichenregel; steht eigens da, weil hier besonders viele Fehler entstehen. Ein Plus vor der Klammer ändert nichts.","weg":"Ausmultiplizieren und Ausklammern, Vorzeichen bei Mal und Geteilt (zum Erklären hilfreich, keine Lernvoraussetzung)","klassen":[{"klasse":5,"art":"Vorwissen","text":"20 − (8 − 3) = 20 − 8 + 3 = 15","thema":"zahlen.rechengesetze"},{"klasse":7,"art":"Einführung","text":"5x − (3x − 2) = 5x − 3x + 2","thema":"terme.umformen"},{"klasse":8,"art":"Anwendung","text":"7 − 2 · (x − 3) = 7 − 2x + 6","thema":"gleichungen.bruch"},{"klasse":9,"art":"Anwendung","text":"(x + 1)² − (x² − 3) = 2x + 4","thema":"gleichungen.quadratisch"}],"zeichen":{"Zu sehen":"Ein Kassenzettel mit drei Zeilen: „Guthaben 20 €“, darunter eingerückt und mit einer Klammer zusammengefasst „Einkauf 8 €“ und „Rabatt −3 €“, darunter „bleibt 15 €“. Rechts daneben die Rechnung in zwei Zeilen: 20 − (8 − 3) und 20 − 8 + 3.","Maße":"Die Klammer am Zettel umfasst genau die zwei mittleren Zeilen.","Beschriftung":"In der zweiten Rechenzeile stehen „− 8“ und „+ 3“ genau unter „8“ und „− 3“ der ersten Zeile.","Hervorgehoben":"Die beiden Summanden in der Klammer und ihre neuen Vorzeichen, paarweise in derselben Farbe; das „20“ bleibt neutral.","Darf nicht falsch aussehen":"Beide Vorzeichen müssen als gewechselt erkennbar sein (aus „8“ wird „− 8“, aus „− 3“ wird „+ 3“). Das Ergebnis 15 muss stimmen.","Gleiche Zeichnung, andere Beschriftung":"Dieselbe Paar-Markierung für 5x − (3x − 2) = 5x − 3x + 2 (ohne Zettel, nur die zwei Rechenzeilen)."},"stufen":{"5":"V","7":"E","8":"A","9":"A"}},{"id":"R8","nr":8,"name":"Potenzen","etage":2,"satz":"Hoch drei heißt: die Zahl dreimal hinschreiben und malnehmen.","wirkstelle":"Die Hochzahl und die gleich vielen Faktoren.","genau":"Hoch n heißt: n gleiche Faktoren. Bei gleicher Basis gilt: Mal – Hochzahlen addieren.","warum":"2³ · 2² ist (2 · 2 · 2) · (2 · 2) – zusammen fünf Zweien, also 2⁵. Teilt man, fallen Faktoren weg; deshalb werden die Hochzahlen abgezogen. Setzt man die Reihe 8, 4, 2 fort, ergibt sich 2⁰ = 1 und 2⁻¹ = ½: Eine negative Hochzahl heißt Kehrwert.","voraus":"„n gleiche Faktoren“ gilt für n = 1, 2, 3 … Hoch 0 und negative Hochzahlen sind eigens festgelegt und verlangen eine Basis, die nicht null ist. Das Additionsgesetz verlangt dieselbe Basis.","fehler":"Basis mal Hochzahl rechnen: 2³ = 6. Und: 2³ + 2² zu 2⁵ machen – das Gesetz gilt nur bei Mal.","verwandt":"Die weiteren Potenzgesetze, Wurzeln und Logarithmen (Planet Zahlen). a · a ist a², aber a + a ist 2a.","weg":"Reihenfolge beim Rechnen (zum Erklären hilfreich, keine Lernvoraussetzung)","klassen":[{"klasse":5,"art":"Einführung","text":"2⁵ = 2 · 2 · 2 · 2 · 2 = 32","thema":"zahlen.potenzen_basis"},{"klasse":6,"art":"Anwendung","text":"10³ · 10² = 10⁵","thema":"zahlen.potenzen_zehner"},{"klasse":7,"art":"Einführung","text":"x² · x³ = x⁵","thema":"terme.potenzgesetze_natuerlich"},{"klasse":8,"art":"Einführung","text":"a⁻² = 1 : a² für a ≠ 0","thema":"terme.potenzgesetze_ganzzahlig"},{"klasse":10,"art":"Anwendung","text":"2ˣ · 2³ = 2 hoch (x + 3)","thema":"funktionen.exponential_log"}],"zeichen":{"Zu sehen":"Eine Zeile mit drei Zweien in einer Klammer und zwei Zweien in einer zweiten Klammer, dazwischen ein Malpunkt: (2 · 2 · 2) · (2 · 2). Unter der ersten Klammer „2³“, unter der zweiten „2²“, unter allen fünf zusammen eine lange Klammer mit „2⁵“. Darunter eine Zahlenreihe 8, 4, 2, 1, ½, ¼ mit den Hochzahlen 3, 2, 1, 0, −1, −2 darüber und „: 2“ zwischen den Gliedern.","Maße":"Die fünf Zweien stehen in gleichen Abständen; die untere Reihe hat sechs gleich breite Felder.","Beschriftung":"„2³ · 2² = 2⁵“ und „3 + 2 = 5“. In der Reihe: Hochzahl über jedem Wert.","Hervorgehoben":"Die erste Klammer: drei Zweien, hingeschrieben und malgenommen – dazu die Hochzahl 3 in derselben Farbe. Zweitrangig: die Hochzahlen 2 und 5; in der Reihe das Feld 2⁰ = 1.","Darf nicht falsch aussehen":"Es müssen genau fünf Zweien sein. In der Reihe darf 2⁰ nicht 0 sein und 2⁻¹ nicht negativ.","Gleiche Zeichnung, andere Beschriftung":"Dieselbe Zeile mit x statt 2: (x · x · x) · (x · x) = x⁵. Dieselbe Reihe mit 10: 1 000, 100, 10, 1, 0,1, 0,01."},"stufen":{"5":"E","6":"A","7":"E","8":"E","10":"A"}},{"id":"R9","nr":9,"name":"Erweitern und Kürzen","etage":3,"satz":"Oben und unten dasselbe mal oder geteilt – der Bruch bleibt gleich.","wirkstelle":"Der gemeinsame Faktor in Zähler und Nenner.","genau":"Ein gemeinsamer Faktor ungleich null darf in Zähler und Nenner dazukommen oder wegfallen – der Wert des Bruchs bleibt.","warum":"Der Nenner sagt, in wie viele gleiche Teile das Ganze geteilt ist, der Zähler, wie viele davon gemeint sind. Teilt man jedes Teil noch einmal, gibt es doppelt so viele Teile und man nimmt doppelt so viele: Die Menge bleibt gleich, nur die Einteilung wird feiner.","voraus":"Der Faktor darf nicht null sein. Er muss den ganzen Zähler und den ganzen Nenner betreffen.","fehler":"Aus Summen kürzen: (x + 6) : (x + 2) zu 3 machen. Erst ausklammern, dann kürzen.","verwandt":"ggT zum vollständigen Kürzen, kgV als Hauptnenner (Planet Zahlen). Dasselbe bei Verhältnissen und Bruchtermen.","weg":"– (zum Erklären hilfreich, keine Lernvoraussetzung)","klassen":[{"klasse":6,"art":"Einführung","text":"½ = 2/4","thema":"bruch.brueche"},{"klasse":6,"art":"Einführung","text":"12/18 = 2/3","thema":"bruch.brueche"},{"klasse":7,"art":"Anwendung","text":"6x : 9 = 2x : 3","thema":"terme.umformen"},{"klasse":8,"art":"Anwendung","text":"(3x + 6) : (x + 2) = 3 · (x + 2) : (x + 2) = 3 für x ≠ −2","thema":"terme.bruchterme"},{"klasse":9,"art":"Anwendung","text":"Das Seitenverhältnis 6 : 9 ist dasselbe wie 2 : 3","thema":"abbildungen.aehnlichkeit"}],"zeichen":{"Zu sehen":"Zwei gleich lange Streifen genau untereinander. Der obere ist in 2 gleiche Teile geteilt, 1 Teil gefärbt. Der untere ist in 4 gleiche Teile geteilt, 2 Teile gefärbt. Die gefärbten Flächen enden an derselben senkrechten Linie.","Maße":"Beide Streifen exakt gleich lang und gleich hoch; die Teilung des unteren halbiert jedes Teil des oberen.","Beschriftung":"Links neben den Streifen „½“ und „2/4“; dazwischen ein Pfeil „Zähler und Nenner · 2“ (abwärts) und „: 2“ (aufwärts).","Hervorgehoben":"Die gemeinsame Endlinie der gefärbten Flächen.","Darf nicht falsch aussehen":"Die gefärbten Längen müssen genau gleich sein. Die Teile eines Streifens müssen gleich groß sein.","Gleiche Zeichnung, andere Beschriftung":"Dieselben zwei Streifen für 12/18 = 2/3 (18 und 3 Teile) und – ohne Streifen, nur als Rechenzeile mit gleich gefärbtem Faktor – für (3 · (x + 2)) : (1 · (x + 2)) = 3."},"stufen":{"6":"E","7":"A","8":"A","9":"A"}},{"id":"R10","nr":10,"name":"Rechnen mit Brüchen","etage":3,"satz":"Plus und Minus: erst gleiche Nenner.<br>Mal: oben mal oben, unten mal unten.<br>Geteilt: mit dem Kehrwert malnehmen.","wirkstelle":"Bei Plus und Minus: der gemeinsame Nenner. Bei Mal: Zähler mit Zähler. Bei Geteilt: der Kehrwert.","genau":"Gleichnamige Brüche: Zähler addieren oder subtrahieren, Nenner behalten. Mal: Zähler mal Zähler, Nenner mal Nenner. Geteilt: mit dem Kehrwert malnehmen.","warum":"Addieren kann man nur gleich große Teile – Halbe und Drittel müssen erst in Sechstel umgerechnet werden. „Mal ½“ heißt „die Hälfte von“; deshalb werden beim Malnehmen die Teile feiner. Teilen fragt „wie oft passt es hinein“: In 6 passt ½ zwölfmal – das ist dasselbe wie 6 mal 2.","voraus":"Nenner sind nie null; beim Teilen darf auch der Bruch, durch den geteilt wird, nicht null sein. Ungleichnamige Brüche erst gleichnamig machen.","fehler":"Zähler plus Zähler und Nenner plus Nenner: ½ + ⅓ = 2/5.","verwandt":"Bruchterme und Bruchgleichungen (Planet Algebra). Pfadregeln bei Wahrscheinlichkeiten (Planet Daten und Zufall).","weg":"Erweitern und Kürzen (zum Erklären hilfreich, keine Lernvoraussetzung)","klassen":[{"klasse":6,"art":"Einführung","text":"½ + ⅓ = 3/6 + 2/6 = 5/6","thema":"bruch.rechnen"},{"klasse":6,"art":"Einführung","text":"⅔ · ¾ = 6/12 = ½","thema":"bruch.rechnen"},{"klasse":6,"art":"Einführung","text":"6 : ½ = 6 · 2 = 12","thema":"bruch.rechnen"},{"klasse":7,"art":"Anwendung","text":"x/2 + x/3 = 5x/6","thema":"gleichungen.linear"},{"klasse":8,"art":"Anwendung","text":"2/x + 3/(x + 1) = (5x + 2) : (x · (x + 1)) für x ≠ 0 und x ≠ −1","thema":"terme.bruchterme"},{"klasse":10,"art":"Anwendung","text":"Zwei unabhängige Würfe einer fairen Münze, zweimal Kopf: ½ · ½ = ¼","thema":"stochastik.mehrstufig"}],"zeichen":{"Zu sehen":"Drei gleich lange Streifen untereinander. Der erste ist halbiert, eine Hälfte gefärbt. Der zweite ist gedrittelt, ein Drittel gefärbt (andere Farbe). Der dritte ist in sechs Teile geteilt: drei Teile in der ersten Farbe, direkt daneben zwei Teile in der zweiten Farbe.","Maße":"Alle Streifen exakt gleich lang; die Sechstel-Teilung passt zu beiden oberen Teilungen (Hilfslinien dünn nach unten gezogen).","Beschriftung":"Neben den Streifen „½“, „⅓“ und „3/6 + 2/6 = 5/6“.","Hervorgehoben":"Die fünf gefärbten Sechstel im dritten Streifen.","Darf nicht falsch aussehen":"Im dritten Streifen dürfen nicht 2 von 5 Feldern gefärbt sein. Die Farbfelder müssen lückenlos aneinanderliegen. Das sechste Feld bleibt leer.","Gleiche Zeichnung, andere Beschriftung":"Dieselben Streifen für x/2 + x/3 = 5x/6 (ganzer Streifen = x). **Zwei Nebenfelder für die Sprüche zwei und drei:** Mal – ein Einheitsquadrat, waagerecht in Viertel und senkrecht in Drittel geteilt (12 Felder); drei Viertel sind hell gefärbt, davon zwei Drittel kräftig: 6 von 12 Feldern, „⅔ · ¾ = 6/12 = ½“. Geteilt – sechs ganze Streifen, jeder halbiert: 12 Hälften, „6 : ½ = 6 · 2 = 12“."},"stufen":{"6":"E","7":"A","8":"A","10":"A"}},{"id":"R11","nr":11,"name":"Verhältnis (Dreisatz)","etage":3,"satz":"Erst auf eins, dann auf viele.","wirkstelle":"Der Wert für eins.","genau":"Bei gleichem Preis je Einheit: erst auf eins, dann auf die gewünschte Menge.","warum":"Wenn zwei Größen im selben Verhältnis wachsen, gehört zu jeder Einheit derselbe Wert. Wer den Wert für eine Einheit kennt, kennt jeden anderen: 3 kg kosten 7,50 €, also 1 kg 2,50 €, also 5 kg 12,50 €. Allgemein: y = k · x, und k ist der Wert für eine Einheit.","voraus":"Gilt nur bei direkter Proportionalität: doppelte Menge, doppelter Wert; zur Menge null gehört der Wert null.","fehler":"Den Dreisatz anwenden, obwohl ein fester Betrag dazukommt (Grundgebühr) oder obwohl mehr von dem einen weniger von dem anderen bedeutet.","verwandt":"Umgekehrte Proportionalität: Das Produkt bleibt gleich (x · y = k). Prozent, Maßstab, Steigung einer Geraden, Strahlensatz und Sinus sind dieselbe Idee.","weg":"Erweitern und Kürzen (zum Erklären hilfreich, keine Lernvoraussetzung)","klassen":[{"klasse":5,"art":"Einführung","text":"3 kg kosten 7,50 €, also kostet 1 kg 2,50 € und 5 kg kosten 12,50 €","thema":"groessen.proportional"},{"klasse":6,"art":"Anwendung","text":"15 von 60 sind 25 %","thema":"bruch.prozent"},{"klasse":7,"art":"Anwendung","text":"80 % sind 48 €, also ist 1 % 0,60 € und 100 % sind 60 €","thema":"bruch.prozent_grundwert"},{"klasse":8,"art":"Anwendung","text":"Steigung 1,5: je 2 nach rechts geht es 3 nach oben","thema":"funktionen.linear"},{"klasse":9,"art":"Anwendung","text":"Strahlensatz: 2 : 3 = 4 : x, also x = 6","thema":"abbildungen.aehnlichkeit"}],"zeichen":{"Zu sehen":"Eine Tabelle mit zwei Spalten („kg“ und „€“) und drei Zeilen: 3 | 7,50, dann 1 | 2,50, dann 5 | 12,50. Links und rechts der Tabelle Bogenpfeile von Zeile 1 zu Zeile 2 mit „: 3“ und von Zeile 2 zu Zeile 3 mit „· 5“.","Maße":"Die Pfeile links und rechts stehen auf gleicher Höhe und tragen dieselbe Beschriftung.","Beschriftung":"Spaltenköpfe mit Einheit. Die mittlere Zeile ist mit „für eins“ gekennzeichnet.","Hervorgehoben":"Die mittlere Zeile (1 kg – 2,50 €) und die vier Pfeilbeschriftungen, links und rechts gleichfarbig.","Darf nicht falsch aussehen":"Links und rechts muss dieselbe Rechnung stehen. Die mittlere Zeile muss die Einheit 1 zeigen. Kein Kreuz-Schema.","Gleiche Zeichnung, andere Beschriftung":"Dieselbe Tabelle für Prozent (80 % | 48 €, 1 % | 0,60 €, 100 % | 60 €) und für die Steigung (2 nach rechts | 3 nach oben, 1 nach rechts | 1,5 nach oben) – dort zusätzlich ein Steigungsdreieck."},"stufen":{"5":"E","6":"A","7":"A","8":"A","9":"A"}},{"id":"R12","nr":12,"name":"Gegenrechnung","etage":4,"satz":"Rückwärts rechnen: Was zuletzt kam, geht zuerst.","wirkstelle":"Jede Rechnung zusammen mit ihrer Gegenrechnung (als Paar).","genau":"Rechne den Weg rückwärts: Was zuletzt gerechnet wurde, machst du zuerst rückgängig.","warum":"Zu jeder umkehrbaren Rechnung gibt es eine Gegenrechnung: Plus und Minus, Mal und Geteilt, Quadrat und Wurzel, später Hoch und Logarithmus. Wer weiß, was mit einer Zahl nacheinander gemacht wurde, findet sie, indem er den Weg rückwärts geht – wie beim Anziehen und Ausziehen: Der Schuh kam zuletzt, also kommt er zuerst weg.","voraus":"Die Rechnung muss umkehrbar sein. „Mal null“ löscht die Zahl, das lässt sich nicht rückgängig machen; durch null kann man nicht teilen.","fehler":"In derselben Reihenfolge zurückrechnen statt in umgekehrter. Und beim Quadrat nur eine Lösung nennen: x² = 49 hat die Lösungen 7 und −7.","verwandt":"Die Wurzel aus x² ist der Betrag von x. Formeln umstellen (Planet Algebra). Umkehrfunktion (Planet Funktionen).","weg":"Reihenfolge beim Rechnen (zum Erklären hilfreich, keine Lernvoraussetzung)","klassen":[{"klasse":5,"art":"Einführung","text":"4 · (□ − 12) = −20: erst : 4, dann + 12, also □ = 7","thema":"gleichungen.einfach"},{"klasse":6,"art":"Anwendung","text":"¾ von einer Zahl sind 12, also ist die Zahl 12 : ¾ = 16","thema":"bruch.rechnen"},{"klasse":7,"art":"Anwendung","text":"Nach 20 % Aufschlag kostet es 60 €, vorher also 60 : 1,2 = 50 €","thema":"bruch.prozent_grundwert"},{"klasse":8,"art":"Anwendung","text":"A = g · h : 2 nach h: erst mal 2, dann durch g","thema":"gleichungen.formeln"},{"klasse":9,"art":"Einführung","text":"x² = 49, also x = 7 oder x = −7","thema":"gleichungen.quadratisch"},{"klasse":10,"art":"Einführung","text":"2ˣ = 8, also x = 3","thema":"gleichungen.exponential"}],"zeichen":{"Zu sehen":"Zwei Reihen untereinander. Oben von links nach rechts: ein leeres Kästchen □, ein Pfeil mit „− 12“, ein Zwischenkästchen, ein Pfeil mit „· 4“, das Kästchen −20. Unten von rechts nach links: −20, ein Pfeil mit „: 4“, das Zwischenkästchen −5, ein Pfeil mit „+ 12“, das Kästchen 7.","Maße":"Die Kästchen der beiden Reihen stehen genau untereinander; die unteren Pfeile zeigen nach links.","Beschriftung":"Über der oberen Reihe „4 · (□ − 12) = −20“. Unter der unteren Reihe „□ = 7“.","Hervorgehoben":"Die Pfeilpaare: „· 4“ und „: 4“ in einer Farbe, „− 12“ und „+ 12“ in einer zweiten.","Darf nicht falsch aussehen":"Die untere Reihe muss rechts beginnen. „: 4“ muss unter „· 4“ stehen, nicht unter „− 12“. Zwischenwert −5 muss stimmen.","Gleiche Zeichnung, andere Beschriftung":"Dieselben zwei Reihen für das Formel-Umstellen (h → „· g“ → „: 2“ → A und zurück) und für x → „hoch 2“ → 49 (zurück: zwei Pfeile zu 7 und −7)."},"stufen":{"5":"E","6":"A","7":"A","8":"A","9":"E","10":"E"}},{"id":"R13","nr":13,"name":"Gleichung als Waage","etage":4,"satz":"Eine Gleichung ist eine Waage: Was du links tust, musst du auch rechts tun.","wirkstelle":"Was auf beiden Seiten getan wird.","genau":"Dieselbe umkehrbare Rechnung auf beiden Seiten ändert die Lösungen nicht.","warum":"Das Gleichheitszeichen sagt: Links und rechts steht gleich viel. Nimmt man auf beiden Seiten einer Waage dasselbe weg oder halbiert beide Seiten, bleibt sie im Gleichgewicht. Weil man jede solche Rechnung zurücknehmen kann, geht keine Lösung verloren und keine kommt dazu.","voraus":"Erlaubt: auf beiden Seiten dieselbe Zahl addieren oder subtrahieren; mit derselben Zahl ungleich null malnehmen oder durch sie teilen. Beim Malnehmen oder Teilen mit einem Term vorher klären, wo dieser Term null wird.","fehler":"Nur einen Summanden malnehmen statt der ganzen Seite. Und: quadrieren und die neu entstandene Lösung nicht prüfen (aus x = 2 wird x² = 4 mit der zusätzlichen Lösung −2).","verwandt":"Äquivalenzumformung ist der Fachname (Planet Algebra). Bei Ungleichungen dreht mal oder geteilt durch eine negative Zahl das Zeichen um.","weg":"Gegenrechnung (zum Erklären hilfreich, keine Lernvoraussetzung)","klassen":[{"klasse":5,"art":"Einführung","text":"□ + 7 = 3: auf beiden Seiten 7 abziehen, also □ = −4","thema":"gleichungen.einfach"},{"klasse":7,"art":"Einführung","text":"2x + 2 = 12, also 2x = 10, also x = 5","thema":"gleichungen.linear"},{"klasse":8,"art":"Anwendung","text":"3/x + ½ = 5/x mit x ≠ 0: beide Seiten mal 2x, dann 6 + x = 10, also x = 4","thema":"gleichungen.bruch"},{"klasse":9,"art":"Anwendung","text":"2x² = 18, also x² = 9","thema":"gleichungen.quadratisch"},{"klasse":10,"art":"Anwendung","text":"3 · 2ˣ = 24, also 2ˣ = 8","thema":"gleichungen.exponential"}],"zeichen":{"Zu sehen":"Eine Balkenwaage im Gleichgewicht, dreimal nebeneinander. Bild 1: links zwei Säckchen (jedes mit „x“) und zwei Kugeln, rechts zwölf Kugeln. Bild 2: links zwei Säckchen, rechts zehn Kugeln (auf beiden Seiten sind zwei Kugeln durchgestrichen oder entfernt). Bild 3: links ein Säckchen, rechts fünf Kugeln.","Maße":"Der Balken ist in allen drei Bildern waagerecht. Kugeln gleich groß und zählbar angeordnet (Zweierreihen).","Beschriftung":"Unter den Bildern: „2x + 2 = 12“, „2x = 10“, „x = 5“. Zwischen den Bildern: „− 2 auf beiden Seiten“, „: 2 auf beiden Seiten“.","Hervorgehoben":"Was auf beiden Seiten weggenommen wird (in Bild 1 die je zwei Kugeln, gleich markiert).","Darf nicht falsch aussehen":"Der Balken darf nie schief stehen. Die Kugelzahlen müssen stimmen (12, 10, 5). Links und rechts muss sichtbar dasselbe geschehen.","Gleiche Zeichnung, andere Beschriftung":"Dieselbe Waage mit Zahlen statt Säckchen für Klasse 5 (□ + 7 = 3 geht mit Kugeln nicht – dort nur die Rechenzeilen mit gleicher Markierung)."},"stufen":{"5":"E","7":"E","8":"A","9":"A","10":"A"}},{"id":"R14","nr":14,"name":"Nullprodukt","etage":4,"satz":"Mal ergibt nur null, wenn eine der Zahlen null ist.","wirkstelle":"Die Null und der Faktor, der null wird.","genau":"Ein Produkt ist genau dann null, wenn mindestens ein Faktor null ist.","warum":"Null mal irgendetwas ist null. Umgekehrt kann aus zwei Zahlen, die beide nicht null sind, beim Malnehmen nie null werden. Deshalb darf man eine Gleichung „Produkt = 0“ in mehrere einfache Gleichungen zerlegen: Jeder Faktor für sich kann null sein.","voraus":"Auf der einen Seite muss ein Produkt stehen, auf der anderen genau null.","fehler":"Die Regel bei einer anderen Zahl anwenden: Aus (x − 2) · (x + 3) = 6 folgt nicht x − 2 = 6.","verwandt":"Faktorisieren – durch Ausklammern oder mit einer binomischen Formel – bringt eine Gleichung in diese Form (Planet Algebra). Ein Nenner darf nicht null sein (Definitionsmenge).","weg":"– (zum Erklären hilfreich, keine Lernvoraussetzung)","klassen":[{"klasse":5,"art":"Vorwissen","text":"0 · 7 = 0","thema":"zahlen.rechengesetze"},{"klasse":5,"art":"Vorwissen","text":"□ · 7 = 0, also □ = 0","thema":"gleichungen.einfach"},{"klasse":8,"art":"Anwendung","text":"Der Nenner x · (x − 4) ist null für x = 0 oder x = 4","thema":"terme.bruchterme"},{"klasse":9,"art":"Einführung","text":"(x − 2) · (x + 3) = 0, also x = 2 oder x = −3","thema":"gleichungen.quadratisch"},{"klasse":10,"art":"Anwendung","text":"x · (x − 2) · (x + 2) = 0, also x = 0, x = 2 oder x = −2","thema":"gleichungen.polynom"}],"zeichen":{"Zu sehen":"Zwei Kästen nebeneinander, dazwischen ein Malpunkt, rechts „= 0“. Im ersten Kasten „x − 2“, im zweiten „x + 3“. Von jedem Kasten führt ein Pfeil nach unten zu einer eigenen kleinen Gleichung: „x − 2 = 0“ und „x + 3 = 0“, darunter „x = 2“ und „x = −3“. Zwischen den beiden unteren Spalten das Wort „oder“.","Maße":"Beide Kästen gleich groß, die zwei Spalten darunter genau unter den Kästen.","Beschriftung":"Oben „(x − 2) · (x + 3) = 0“. Unten „x = 2 oder x = −3“.","Hervorgehoben":"Die Null rechts und die beiden Kästen.","Darf nicht falsch aussehen":"Rechts muss 0 stehen, keine andere Zahl. Zwischen den Lösungen muss „oder“ stehen, nicht „und“.","Gleiche Zeichnung, andere Beschriftung":"Dieselben Kästen mit „□“ und „7“ für Klasse 5 (□ · 7 = 0, also □ = 0) und mit drei Kästen x, x − 2, x + 2 für Klasse 10."},"stufen":{"5":"V","8":"A","9":"E","10":"A"}}],"planeten":[{"name":"Zahlen","zahl":24,"ideen":[{"nr":1,"satz":"Links ist kleiner, rechts ist größer – auch unter null.","genau":"Jede Zahl hat genau einen Platz auf der Zahlengeraden – links ist kleiner.","kurz":"Zahlengerade","gesetze":["Z4","Z5","Z11","Z22"],"warum":"Auf der Zahlengeraden hat jede Zahl genau einen Platz – ganze Zahlen, Brüche, Kommazahlen, negative Zahlen und später Wurzeln. Größer und kleiner heißt dann einfach: weiter rechts oder weiter links.","zeichen":{"Zu sehen":"Eine Zahlengerade von −3 bis 3. Vier Zahlen sind als Punkte eingetragen: −2,5 und −1 links der Null, ½ und 2 rechts. Unter der Geraden ein langer Pfeil nach rechts.","Maße":"Gleiche Abstände, Teilstriche an jeder ganzen und jeder halben Zahl. Die Null ist kräftiger gezeichnet.","Beschriftung":"An den Punkten „−2,5“, „−1“, „½“, „2“. Am Pfeil: „nach rechts wird es größer“. Darunter: „−2,5 < −1 < ½ < 2“.","Hervorgehoben":"Die Punkte −2,5 und −1: Die −2,5 liegt weiter links, ist also kleiner – obwohl 2,5 mehr ist als 1.","Darf nicht falsch aussehen":"−2,5 muss genau in der Mitte zwischen −3 und −2 liegen, ½ genau zwischen 0 und 1. Die Null muss sichtbar sein. Der Pfeil zeigt nach rechts.","Gleiche Zeichnung, andere Beschriftung":"Dieselbe Gerade mit zwei gleich langen Bögen von 0 nach −2 und von 0 nach 2: Betrag und Gegenzahl. Dieselbe Gerade mit √2 ≈ 1,41 zwischen 1 und 2: irrationale Zahlen. Mit Teilstrichen in Sechsteln: ½ = 3/6 und ⅔ = 4/6 vergleichen."}},{"nr":2,"satz":"Zehn Einer sind ein Zehner, zehn Zehntel sind ein Einer.","genau":"Zehn von einer Sorte ergeben eins von der nächstgrößeren.","kurz":"Bündeln in Zehnern","gesetze":["Z1","Z2","Z3","Z14","Z18"],"warum":"Unser Zahlensystem tauscht immer zehn gleiche Teile gegen ein größeres. Das gilt in beide Richtungen: nach links zu Zehnern und Hundertern, nach rechts zu Zehnteln und Hundertsteln. Jedes Rechnen mit Übertrag, jedes Runden und jedes Komma-Verschieben beruht darauf.","zeichen":{"Zu sehen":"Zwei Felder. Feld 1: zehn einzelne Einerwürfel, ein Pfeil, eine Zehnerstange aus zehn Würfeln. Feld 2: ein Einerwürfel als Streifen gezeichnet, ein Pfeil, derselbe Streifen in zehn gleiche Zehntel geschnitten.","Maße":"Genau zehn Würfel, genau zehn Zehntel; Stange und Würfelreihe gleich lang.","Beschriftung":"Feld 1: „10 Einer = 1 Zehner“. Feld 2: „1 Einer = 10 Zehntel“.","Hervorgehoben":"Die beiden Tausch-Pfeile mit der Zahl 10.","Darf nicht falsch aussehen":"Es müssen genau zehn sein und man muss sie zählen können. Die Zehntel sind gleich groß.","Gleiche Zeichnung, andere Beschriftung":"Die Stellenwerttafel von Rechenregel 1 ist dieselbe Idee als Tabelle. Zweiersystem: je zwei Würfel werden gebündelt (1, 2, 4, 8). Runden: Zahlengerade von 340 bis 350 mit 347 – näher an 350."}},{"nr":3,"satz":"Primzahlen sind die Bausteine: Jede Zahl ab zwei ist aus ihnen malgenommen.","genau":"Jede natürliche Zahl ab 2 ist aus Primzahlen gebaut.","kurz":"Bausteine","gesetze":["Z6","Z7","Z8","Z9"],"warum":"Jede natürliche Zahl ab 2 lässt sich so lange in Faktoren zerlegen, bis nur noch Primzahlen übrig sind – und es kommen immer dieselben heraus, gleich wie man anfängt. Teiler, Vielfache, ggT, kgV und das Kürzen lassen sich an diesen Bausteinen ablesen.","zeichen":{"Zu sehen":"Zwei Zerlegungsbäume nebeneinander für die Zahl 60. Links: 60 → 6 und 10 → 2, 3 und 2, 5. Rechts: 60 → 4 und 15 → 2, 2 und 3, 5. Die Primzahlen am Ende stehen in Kreisen.","Maße":"Beide Bäume gleich hoch; die Endkreise gleich groß.","Beschriftung":"Unter beiden Bäumen dieselbe Zeile: „60 = 2 · 2 · 3 · 5“.","Hervorgehoben":"Die Primzahlen in den Kreisen – in beiden Bäumen dieselben vier.","Darf nicht falsch aussehen":"In den Kreisen stehen nur Primzahlen. Jedes Paar von Ästen ergibt malgenommen die Zahl darüber. Beide Bäume enden mit denselben Bausteinen.","Gleiche Zeichnung, andere Beschriftung":"Zwei Reihen von Bausteinen untereinander: 12 = 2 · 2 · 3 und 18 = 2 · 3 · 3; die gemeinsamen Bausteine 2 und 3 sind umrahmt (ggT 6), alle zusammen ergeben das kgV 36."}},{"nr":4,"satz":"Ein Halb, null Komma fünf, fünfzig Prozent: dreimal dieselbe Zahl.","genau":"Bruch, Dezimalzahl und Prozent sind drei Schreibweisen derselben Zahl.","kurz":"Schreibweisen","gesetze":["Z10","Z12","Z13"],"warum":"Ein Bruch, eine Kommazahl und eine Prozentangabe können genau dieselbe Zahl meinen. Wer zwischen den drei Schreibweisen wechseln kann, wählt jeweils die, mit der sich am leichtesten rechnet.","zeichen":{"Zu sehen":"Drei Felder für dieselbe Zahl. Feld 1: ein Streifen, in zwei Teile geteilt, eines gefärbt. Feld 2: eine Zahlengerade von 0 bis 1 in Zehnteln, ein Punkt bei 0,5. Feld 3: ein Hunderterfeld (10 mal 10), 50 Felder gefärbt.","Maße":"Streifen und Zahlengerade gleich lang und genau untereinander; die Färbung des Streifens endet über dem Punkt 0,5. Im Hunderterfeld fünf volle Spalten.","Beschriftung":"Feld 1: „½“. Feld 2: „0,5“. Feld 3: „50 %“. Darunter: „½ = 0,5 = 50 %“.","Hervorgehoben":"Die gemeinsame Stelle: das Ende der Färbung und der Punkt auf der Geraden.","Darf nicht falsch aussehen":"Die drei Darstellungen müssen sichtbar gleich viel zeigen: genau die Hälfte. Im Hunderterfeld genau 50 Felder.","Gleiche Zeichnung, andere Beschriftung":"Dieselben drei Felder für ¼ = 0,25 = 25 %. Für ⅓ = 0,333… ≈ 33,3 %: Hier geht die Kommazahl nie zu Ende (Periode)."}},{"nr":5,"satz":"Hoch rechnet hin, die Wurzel rechnet zurück.","genau":"Potenz, Wurzel und Logarithmus gehören zusammen: Die eine rechnet hoch, die beiden anderen fragen zurück.","kurz":"Hoch und zurück","gesetze":["Z15","Z16","Z17","Z19","Z20","Z21","Z23","Z24"],"warum":"Potenzieren fragt: Was kommt heraus? Die Wurzel fragt zurück: Welche Zahl wurde potenziert? Der Logarithmus fragt: Mit welcher Hochzahl? Alle drei gehören zu einer einzigen Gleichung.","zeichen":{"Zu sehen":"Ein Quadrat aus Einheitsquadraten. An der Seite steht die Seitenlänge, im Quadrat die Fläche. Ein Pfeil führt von der Seite zur Fläche, ein zweiter zurück.","Maße":"Quadrat 3 mal 3 Karos, 9 Einheitsquadrate.","Beschriftung":"An der Seite „3“, in der Fläche „9“. Am Hin-Pfeil „hoch 2“, am Rück-Pfeil „Wurzel“. Darunter zwei Zeilen: „3² = 9“ und „√9 = 3“.","Hervorgehoben":"Die beiden Pfeile als Paar.","Darf nicht falsch aussehen":"Genau 9 abzählbare Quadrate. Die Pfeile zeigen in entgegengesetzte Richtungen.","Gleiche Zeichnung, andere Beschriftung":"Würfel aus 2 mal 2 mal 2 Einheitswürfeln: „2³ = 8“ und „dritte Wurzel aus 8 ist 2“. Klasse 10, ohne Bild als drei Zeilen zu einer Gleichung: 2³ = 8 (Potenz: Was kommt heraus?), ∛8 = 2 (Wurzel: welche Basis?), log₂ 8 = 3 (Logarithmus: welche Hochzahl?)."}}]},{"name":"Algebra","zahl":23,"ideen":[{"nr":1,"satz":"Ein Term ist ein Rechenrezept: Zahl hinein, Ergebnis heraus.","genau":"Ein Term ist eine Rechenvorschrift; gleichwertige Terme liefern für jede erlaubte Zahl dasselbe.","kurz":"Term","gesetze":["A1","A2","A3","A4","A7"],"warum":"Ein Term schreibt eine Rechnung auf, bevor man die Zahl kennt. Zwei Terme, die ganz verschieden aussehen, können für jede Zahl dasselbe liefern – dann darf man den einen durch den anderen ersetzen. Das ist der Sinn jeder Termumformung.","zeichen":{"Zu sehen":"Zwei Rechenketten untereinander, jede von links nach rechts: Eingabe-Kästchen, Pfeile mit Rechenschritten, Ausgabe-Kästchen. Kette 1: x → „· 2“ → „+ 3“. Kette 2: x → „+ 1“ → „· 2“ → „+ 1“. Rechts daneben eine Tabelle mit drei Eingaben und den Ausgaben beider Ketten.","Maße":"Tabelle: x = 1, 2, 5. Ausgaben beider Ketten: 5, 7, 13.","Beschriftung":"Über Kette 1 „2 · x + 3“, über Kette 2 „2 · (x + 1) + 1“. Tabellenköpfe: „x“, „2 · x + 3“, „2 · (x + 1) + 1“.","Hervorgehoben":"Die zwei Ausgabe-Spalten der Tabelle: Zeile für Zeile dieselbe Zahl.","Darf nicht falsch aussehen":"Die Ausgaben müssen stimmen. Die Ketten laufen in Leserichtung. Die Reihenfolge der Schritte entspricht dem Term (Klammer zuerst).","Gleiche Zeichnung, andere Beschriftung":"Das Rechteck von Rechenregel 6 als Quadrat mit der Seite a + b, in vier Felder a², a · b, a · b, b² geteilt: binomische Formel. Parabel mit tiefstem Punkt für „Kleinster und größter Wert“."}},{"nr":2,"satz":"Durch null teilen geht nie – prüfe das zuerst.","genau":"Kläre zuerst, welche Zahlen du einsetzen darfst: Kein Nenner wird null, unter keiner Wurzel steht etwas Negatives.","kurz":"Erlaubte Zahlen","gesetze":["A5","A6","A12","A20"],"warum":"Nicht jede Zahl darf in jeden Term: Durch null kann man nicht teilen, und aus einer negativen Zahl gibt es keine Quadratwurzel. Wer das vor dem Rechnen klärt, erkennt Scheinlösungen.","zeichen":{"Zu sehen":"Eine Zahlengerade von −1 bis 5, durchgehend kräftig gezeichnet – nur bei 2 sitzt ein offener Ring (ein Loch). Darüber der Term. Darunter eine kleine Tabelle mit drei Einsetzungen.","Maße":"Ring genau bei 2. Tabelle: x = 1 ergibt −1; x = 2 „geht nicht“; x = 3 ergibt 1.","Beschriftung":"Über der Geraden: „1 : (x − 2)“. Am Ring: „x = 2 ist nicht erlaubt: Der Nenner wäre 0“.","Hervorgehoben":"Der offene Ring bei 2.","Darf nicht falsch aussehen":"Der Ring ist offen, nicht gefüllt. Überall sonst ist die Gerade durchgezogen. In der Tabelle steht bei x = 2 kein Zahlenwert.","Gleiche Zeichnung, andere Beschriftung":"Dieselbe Gerade für √(x − 2): kräftig erst ab 2 nach rechts, bei 2 ein gefüllter Punkt, links davon dünn und grau („nicht erlaubt“)."}},{"nr":3,"satz":"Lösen heißt: alle Zahlen finden, für die die Gleichung stimmt.","genau":"Eine Gleichung lösen heißt: alle Zahlen finden, die sie wahr machen.","kurz":"Gleichung lösen","gesetze":["A8","A9","A10","A11","A13","A14","A15"],"warum":"Eine Gleichung ist eine Frage: Für welche Zahlen stimmt sie? Die Antwort kann eine Zahl sein, mehrere, keine oder ein ganzer Bereich. Umformen ist nur der schnelle Weg dorthin; Einsetzen zeigt, ob die Antwort stimmt.","zeichen":{"Zu sehen":"Eine Zahlengerade von 2 bis 7. Unter den Zahlen 3, 4, 5 und 6 steht jeweils, was beim Einsetzen links herauskommt, und ein Haken oder ein Kreuz.","Maße":"Eingesetzt in 2 · x + 2: bei 3 ergibt sich 8, bei 4 ergibt sich 10, bei 5 ergibt sich 12, bei 6 ergibt sich 14.","Beschriftung":"Oben: „2 · x + 2 = 12“. Unter 3: „8 ✗“. Unter 4: „10 ✗“. Unter 5: „12 ✓“. Unter 6: „14 ✗“. Darunter: „Lösung: x = 5“.","Hervorgehoben":"Der Haken bei 5 und der Punkt 5 auf der Geraden.","Darf nicht falsch aussehen":"Die eingesetzten Werte müssen stimmen. Genau ein Haken.","Gleiche Zeichnung, andere Beschriftung":"Dieselbe Gerade von −4 bis 4 für x² = 9: Haken bei −3 und bei 3. Für die Ungleichung x + 5 < 2: offener Ring bei −3 und ein kräftiger Strahl nach links (alle Zahlen kleiner als −3)."}},{"nr":4,"satz":"Steht x im Quadrat: erst null auf eine Seite, dann zerlegen.","genau":"Bei höherem Grad: alles auf eine Seite bringen und in Faktoren zerlegen – oder die Gegenrechnung nutzen.","kurz":"Höherer Grad","gesetze":["A16","A17","A18","A19","A21","A22","A23"],"warum":"Bei Gleichungen mit x² hilft das Hin- und Herschieben einzelner Summanden nicht weiter. Bringt man alles auf eine Seite und zerlegt in Faktoren, greift das Nullprodukt: Jeder Faktor liefert eine Lösung. Wo die Gegenrechnung reicht (x² = 49), ist sie der kürzere Weg.","zeichen":{"Zu sehen":"Zwei Felder. Feld 1: drei Rechenzeilen untereinander mit Pfeilen dazwischen, darunter die zwei Kästen von Rechenregel 14. Feld 2: eine Parabel im Koordinatensystem, die die x-Achse an zwei Stellen schneidet.","Maße":"Feld 2: Parabel durch (−3 | 0), (2 | 0) und (0 | −6), tiefster Punkt bei (−0,5 | −6,25). Achsen von −4 bis 3 und von −7 bis 4.","Beschriftung":"Feld 1: „x² + x = 6“, Pfeil „− 6 auf beiden Seiten“, „x² + x − 6 = 0“, Pfeil „zerlegen“, „(x − 2) · (x + 3) = 0“, darunter „x = 2 oder x = −3“. Feld 2: „y = x² + x − 6“, an den Schnittpunkten „−3“ und „2“.","Hervorgehoben":"Die Null auf der rechten Seite – und in Feld 2 die beiden Schnittpunkte mit der x-Achse.","Darf nicht falsch aussehen":"Rechts muss genau 0 stehen. Die Parabel schneidet die x-Achse genau bei −3 und 2. Zwischen den Lösungen steht „oder“.","Gleiche Zeichnung, andere Beschriftung":"Feld 1 für x² = 49 mit dem Rückweg von Rechenregel 12: zwei Pfeile zu 7 und −7. Feld 2 mit einer Parabel, die die Achse nur berührt (eine Lösung) oder gar nicht trifft (keine)."}}]},{"name":"Geld und Verhältnisse","zahl":11,"ideen":[{"nr":1,"satz":"Kleinere Einheit, größere Zahl – größere Einheit, kleinere Zahl.","genau":"Eine Größe ist Zahl mal Einheit – wechselt die Einheit, wechselt die Zahl.","kurz":"Größe","gesetze":["V1","V2"],"warum":"Eine Größe besteht aus Zahl und Einheit. Dieselbe Länge kann 3 m oder 300 cm heißen: Je kleiner die Einheit, desto mehr davon braucht man. Wer das im Kopf hat, weiß bei jeder Umrechnung, ob die Zahl größer oder kleiner werden muss.","zeichen":{"Zu sehen":"Ein Balken, darüber und darunter je ein Maßband. Das obere Maßband ist in Meter geteilt, das untere in Dezimeter.","Maße":"Balken 3 m lang. Oben 3 Abschnitte, unten 30 Abschnitte; je 10 untere Abschnitte passen genau unter einen oberen.","Beschriftung":"Oben „3 m“, unten „30 dm“. Darunter: „3 m = 30 dm = 300 cm“.","Hervorgehoben":"Die beiden Zahlen 3 und 30 an derselben Länge.","Darf nicht falsch aussehen":"Beide Maßbänder beginnen und enden genau am Balken. Die Dezimeter sind gleich lang.","Gleiche Zeichnung, andere Beschriftung":"Dieselbe Zeichnung für 2 h = 120 min (Umrechnungszahl 60) und 1,5 kg = 1 500 g. Maßstab 1 : 100: ein Plan-Balken von 3 cm über dem „echten“ von 3 m."}},{"nr":2,"satz":"Doppelt so viel kostet doppelt so viel.","genau":"Proportional heißt: Der Wert für eine Einheit bleibt immer gleich.","kurz":"Wert für eins","gesetze":["V3","V4","V5","V6","V7"],"warum":"Bei proportionalen Größen gehört zu jeder Einheit derselbe Wert. Darum gilt: doppelte Menge, doppelter Preis – und die Hälfte kostet die Hälfte. Dreisatz, Maßstab und Steigung sind Anwendungen davon.","zeichen":{"Zu sehen":"Eine doppelte Zahlengerade: oben die Menge, unten der Preis, beide beginnen bei 0 genau übereinander. Senkrechte dünne Linien verbinden zusammengehörige Werte.","Maße":"Oben 0, 1, 2, 3, 4, 5, 6 kg in gleichen Abständen. Unten 0 €; 2,50 €; 5 €; 7,50 €; 10 €; 12,50 €; 15 €.","Beschriftung":"Oben „kg“, unten „€“. Ein Bogenpfeil oben von 3 nach 6 mit „· 2“, ein Bogenpfeil unten von 7,50 nach 15 mit „· 2“.","Hervorgehoben":"Das Paar 1 kg und 2,50 € (der Wert für eins) und die beiden gleichen Bogenpfeile.","Darf nicht falsch aussehen":"Beide Geraden beginnen bei 0 an derselben Stelle. Gleiche Abstände. Die beiden Bogenpfeile sind gleich lang und tragen dieselbe Beschriftung.","Gleiche Zeichnung, andere Beschriftung":"Dieselben Zahlen als Dreisatz-Tabelle (Rechenregel 11) und als Gerade durch den Ursprung und (1 | 2,5). Gegenstück, eigenes Feld: drei Rechtecke mit gleicher Fläche 12 (2 mal 6, 3 mal 4, 4 mal 3) für die indirekte Proportionalität."}},{"nr":3,"satz":"Prozent heißt: von hundert.","genau":"Prozent heißt Hundertstel; um p Prozent verändern heißt mit einem Faktor malnehmen.","kurz":"Prozent als Faktor","gesetze":["V8","V9","V10","V11"],"warum":"Prozent ist nur ein anderes Wort für Hundertstel. Ein Anteil in Prozent sagt, wie viele von hundert gleichen Teilen gemeint sind. Wächst etwas um 20 %, hat man danach 120 Hundertstel – also das 1,2-fache.","zeichen":{"Zu sehen":"Zwei Felder. Feld 1: ein Hunderterfeld (10 mal 10), 25 Felder gefärbt. Feld 2: ein Streifen mit zwei Skalen – oben Prozent, unten Euro.","Maße":"Feld 1: zweieinhalb Spalten, also 25 von 100 Feldern. Feld 2: oben 0 % bis 100 % in Zehnerschritten, unten 0 € bis 60 €; markiert sind 1 % mit 0,60 € und 80 % mit 48 €.","Beschriftung":"Feld 1: „25 von 100 = 25 %“. Feld 2: „80 % von 60 € sind 48 €“.","Hervorgehoben":"Feld 1: die 25 gefärbten Felder. Feld 2: die Markierung bei 80 % und 48 €.","Darf nicht falsch aussehen":"Genau 100 Felder, genau 25 gefärbt. In Feld 2 beginnen beide Skalen bei 0, und 100 % steht genau über 60 €.","Gleiche Zeichnung, andere Beschriftung":"Feld 2 verlängert: Streifen bis 120 %, das Stück von 100 % bis 120 % anders markiert – „plus 20 % heißt mal 1,2: aus 50 € werden 60 €“. Zinseszins als Treppe: 1 000 €, mal 1,05 gleich 1 050 €, mal 1,05 gleich 1 102,50 €."}}]},{"name":"Geometrie","zahl":30,"ideen":[{"nr":1,"satz":"Gleiche Winkel an Parallelen – darum im Dreieck immer 180 Grad.","genau":"An parallelen Geraden kehren dieselben Winkel wieder – deshalb ergeben die Winkel im Dreieck zusammen 180°.","kurz":"Winkel an Geraden","gesetze":["G3","G4","G5","G6"],"warum":"Schneidet eine Gerade zwei Parallelen, entstehen an beiden Kreuzungen dieselben Winkel. Zieht man durch die Spitze eines Dreiecks die Parallele zur gegenüberliegenden Seite, liegen dort alle drei Winkel des Dreiecks nebeneinander und füllen genau eine gerade Linie: 180°.","zeichen":{"Zu sehen":"Ein Dreieck ABC mit waagerechter Seite AB unten. Durch C läuft eine Gerade parallel zu AB. Bei C liegen drei Winkel nebeneinander: links der Winkel α (gleich dem bei A), in der Mitte γ, rechts der Winkel β (gleich dem bei B).","Maße":"α = 50°, β = 60°, γ = 70°, maßstäblich gezeichnet.","Beschriftung":"α, β, γ im Dreieck; α und β noch einmal oben bei C. Die beiden Parallelen tragen das Parallel-Zeichen. Darunter: „α + β + γ = 180°“.","Hervorgehoben":"α bei A und bei C in derselben Farbe, β bei B und bei C in einer zweiten, γ in einer dritten.","Darf nicht falsch aussehen":"Die Gerade durch C muss parallel aussehen. Die drei Winkel bei C müssen die gerade Linie lückenlos füllen. Die Winkelgrößen müssen stimmen (kein gleichseitiges Dreieck zeichnen).","Gleiche Zeichnung, andere Beschriftung":"Nur die zwei Parallelen mit der schneidenden Geraden: Stufen- und Wechselwinkel (70°). Nur eine Kreuzung: Scheitel- und Nebenwinkel (65° und 115°). Viereck, durch eine Diagonale in zwei Dreiecke geteilt: 360°."}},{"nr":2,"satz":"Der Kreis: alle Punkte gleich weit von der Mitte.","genau":"Alle Punkte mit gleichem Abstand bilden eine Linie: Kreis, Mittelsenkrechte, Winkelhalbierende.","kurz":"Gleicher Abstand","gesetze":["G1","G2","G8","G12","G13","G14"],"warum":"Viele Linien der Geometrie sind „alle Punkte mit einer Abstandseigenschaft“: gleich weit von einem Punkt (Kreis), von zwei Punkten (Mittelsenkrechte), von zwei Geraden (Winkelhalbierende). Darum findet man den Umkreismittelpunkt mit Mittelsenkrechten und den Inkreismittelpunkt mit Winkelhalbierenden.","zeichen":{"Zu sehen":"Eine Hauptzeichnung und zwei kleinere Nebenzeichnungen. Hauptzeichnung (Feld 1, passt zum Merksatz): Kreis um M mit vier Punkten auf der Linie und ihren Radien. Nebenzeichnung Feld 2: Strecke AB mit ihrer Mittelsenkrechten; ein Punkt P darauf ist mit A und B verbunden. Nebenzeichnung Feld 3: ein Winkel mit seiner Winkelhalbierenden; von einem Punkt P darauf gehen zwei Lote zu den Schenkeln.","Maße":"Radius 3 cm. Strecke AB 4 cm, P liegt 3 cm über der Mitte. Winkel 60°.","Beschriftung":"Feld 1: „gleich weit von M“. Feld 2: „gleich weit von A und B“. Feld 3: „gleich weit von beiden Schenkeln“.","Hervorgehoben":"Die gleich langen Strecken: in jedem Feld mit demselben Strich-Zeichen und derselben Farbe.","Darf nicht falsch aussehen":"In Feld 2 muss die Mittelsenkrechte genau durch die Mitte gehen und senkrecht stehen. In Feld 3 müssen die Abstände Lote sein (Zeichen für den rechten Winkel), nicht irgendwelche Verbindungen.","Gleiche Zeichnung, andere Beschriftung":"Feld 1 mit Durchmesser AB und einem Punkt C auf dem Kreis: Satz des Thales (die Radien MA, MB, MC sind gleich lang). Feld 1 mit Tangente: Radius und Tangente bilden 90°. Feld 2 dreimal an einem Dreieck: Umkreis."}},{"nr":3,"satz":"Spiegeln, schieben, drehen – Form und Größe bleiben gleich.","genau":"Spiegeln, Schieben und Drehen ändern weder Längen noch Winkel; drei passende Angaben legen ein Dreieck fest.","kurz":"Deckungsgleich","gesetze":["G7","G9","G10","G11","G15","G16","G17","G18","G19"],"warum":"Zwei Figuren sind deckungsgleich, wenn man die eine so auf die andere legen kann, dass sie genau passt. Spiegeln, Schieben und Drehen sind genau die Bewegungen, die dabei erlaubt sind. Bei Dreiecken genügen drei passende Angaben, damit nur noch eine Form möglich ist.","zeichen":{"Zu sehen":"Ein Dreieck und drei Bilder davon: gespiegelt an einer Achse, verschoben längs eines Pfeils, gedreht um einen Punkt. In allen vier Dreiecken tragen gleiche Seiten gleiche Strich-Zeichen und gleiche Winkel gleiche Bögen.","Maße":"Dreieck mit den Seiten 3 cm, 4 cm, 5 cm – nicht gleichschenklig, damit man die Lage erkennt. Drehung um 90°.","Beschriftung":"Ecken A, B, C und A', B', C'. Spiegelachse, Verschiebungspfeil und Drehpunkt mit Drehwinkel beschriftet.","Hervorgehoben":"Die gleichen Seitenlängen (Strich-Zeichen) – sie bleiben bei allen drei Bewegungen.","Darf nicht falsch aussehen":"Alle vier Dreiecke müssen exakt gleich groß sein. Das gespiegelte Dreieck hat den umgekehrten Umlaufsinn, das verschobene und das gedrehte nicht.","Gleiche Zeichnung, andere Beschriftung":"Nur das gespiegelte Paar mit Achse: Symmetrie. Nur das verschobene Paar: Vektor. Für die Kongruenzsätze: drei Stäbe 3 cm, 4 cm, 5 cm, die sich nur zu einem Dreieck fügen lassen – daneben vier Stäbe, die ein verschiebbares Viereck bilden."}},{"nr":4,"satz":"Gleiche Form, andere Größe: alle Längen mal dieselbe Zahl.","genau":"Ähnliche Figuren haben gleiche Winkel und alle Längen im selben Verhältnis.","kurz":"Ähnlich","gesetze":["G20","G21","G22","G23"],"warum":"Vergrößert man eine Figur wie mit einem Kopierer, bleiben alle Winkel, und jede Länge wird mit demselben Faktor malgenommen. Deshalb sind in ähnlichen Figuren alle Längenverhältnisse gleich – das ist der Dreisatz der Geometrie.","zeichen":{"Zu sehen":"Zwei Strahlen von einem Punkt S. Zwei parallele Geraden schneiden beide Strahlen; so entstehen ein kleines Dreieck und ein großes, das das kleine enthält.","Maße":"Auf dem ersten Strahl 2 cm und 4 cm von S; auf dem zweiten 3 cm und 6 cm. Die Parallelen sind 2,5 cm und 5 cm lang (maßstäblich, Faktor 2).","Beschriftung":"Die Längen an den Abschnitten. Parallel-Zeichen an den beiden Geraden. Daneben: „alles mal 2“.","Hervorgehoben":"Die gleichen Winkel in beiden Dreiecken (gleiche Bögen) und der Faktor 2.","Darf nicht falsch aussehen":"Die beiden Geraden müssen parallel sein. Das große Dreieck muss in jeder Länge genau doppelt so groß sein. Alle Längen werden von S aus gemessen.","Gleiche Zeichnung, andere Beschriftung":"Dieselbe Figur mit x an einer Stelle: 2 : 3 = 4 : x. Für „Vergrößern mit Faktor k“: ein Einheitsquadrat und ein Quadrat mit doppelter Seite, in 4 Einheitsquadrate geteilt; ein Würfel mit doppelter Kante aus 8 Würfeln."}},{"nr":5,"satz":"Rechter Winkel im Dreieck: a² plus b² ist c².","genau":"Im rechtwinkligen Dreieck legen zwei Angaben alles fest: Pythagoras verbindet die Seiten, Sinus, Kosinus und Tangens verbinden Seiten und Winkel.","kurz":"Rechtwinkliges Dreieck","gesetze":["G24","G25","G26","G27","G28","G29","G30"],"warum":"Der rechte Winkel macht das Dreieck berechenbar. Kennt man zwei Seiten, liefert der Satz des Pythagoras die dritte. Kennt man eine Seite und einen spitzen Winkel, sind alle rechtwinkligen Dreiecke mit diesem Winkel ähnlich – ihre Seitenverhältnisse sind fest und heißen Sinus, Kosinus und Tangens.","zeichen":{"Zu sehen":"Ein rechtwinkliges Dreieck mit einem Quadrat über jeder Seite; jedes Quadrat ist in Einheitsquadrate geteilt.","Maße":"Katheten 3 cm und 4 cm, Hypotenuse 5 cm. Quadrate mit 9, 16 und 25 Feldern.","Beschriftung":"Seiten a, b, c; rechter Winkel markiert. In den Quadraten „9“, „16“, „25“. Darunter: „9 + 16 = 25“.","Hervorgehoben":"Der rechte Winkel und die Hypotenuse ihm gegenüber.","Darf nicht falsch aussehen":"Der rechte Winkel muss markiert und wirklich 90° sein. Die Hypotenuse liegt ihm gegenüber und ist die längste Seite. Die Felder müssen abzählbar sein.","Gleiche Zeichnung, andere Beschriftung":"Dasselbe Dreieck ohne Quadrate: ein spitzer Winkel α markiert, die Seiten heißen „Gegenkathete“ (gegenüber von α), „Ankathete“ (an α) und „Hypotenuse“; daneben sin α = 3/5, cos α = 4/5, tan α = 3/4. Dasselbe Dreieck im Einheitskreis: Hypotenuse = 1, Katheten = cos α und sin α."}}]},{"name":"Fläche und Raum","zahl":19,"ideen":[{"nr":1,"satz":"Messen heißt auslegen und zählen.","genau":"Messen heißt auslegen und zählen: Flächen mit Einheitsquadraten, Körper mit Einheitswürfeln.","kurz":"Auslegen und zählen","gesetze":["F1","F2","F3","F11","F12"],"warum":"Eine Fläche misst man, indem man sie lückenlos mit gleich großen Quadraten auslegt und zählt; einen Körper füllt man mit gleich großen Würfeln. Jede Formel dieses Planeten ist eine Abkürzung für dieses Zählen: 4 Reihen zu je 6 Quadraten sind 6 · 4.","zeichen":{"Zu sehen":"Links ein Rechteck, vollständig mit Einheitsquadraten ausgelegt; die unterste Reihe ist gefärbt. Rechts ein Quader aus Einheitswürfeln im Schrägbild; die unterste Schicht ist gefärbt.","Maße":"Rechteck 6 cm mal 4 cm in Originalgröße (24 Quadrate zu 1 cm²). Quader 5 mal 4 mal 3 Würfel.","Beschriftung":"Am Rechteck: „6 cm“, „4 cm“, „4 Reihen zu je 6 = 24 cm²“. Am Quader: „3 Schichten zu je 5 · 4 = 60 cm³“. Ein einzelnes Quadrat trägt „1 cm²“, ein einzelner Würfel „1 cm³“.","Hervorgehoben":"Die eine Reihe und die eine Schicht – das, was beim Zählen wiederholt wird.","Darf nicht falsch aussehen":"Die Quadrate müssen wirklich quadratisch und gleich groß sein und genau aufgehen. Am Quader müssen die Würfel an allen sichtbaren Seiten abzählbar sein (5, 4, 3).","Gleiche Zeichnung, andere Beschriftung":"Seiten „x“ und „x + 4“ ohne Gitter (Klasse 7); ein Quadratdezimeter mit 10 mal 10 Gitter für die Umrechnungszahl 100. Für „Fläche ist nicht Umfang“: daneben ein Rechteck 9 cm mal 1 cm mit gleich langem Rand."}},{"nr":2,"satz":"Aus dem Rechteck entsteht jede Fläche.","genau":"Aus dem Rechteck entsteht jede Fläche: zerschneiden, neu legen, halbieren.","kurz":"Aus dem Rechteck","gesetze":["F4","F5","F6","F7","F8","F9","F10"],"warum":"Vom Rechteck weiß man die Fläche durch Zählen. Jede andere Figur wird so zerschnitten und neu gelegt, dass ein Rechteck entsteht – oder sie ist die Hälfte einer Figur, deren Fläche man schon kennt. Deshalb muss man die Formeln nicht einzeln lernen: Man kann sie herleiten.","zeichen":{"Zu sehen":"Ein Stammbaum von links nach rechts. Rechteck → Parallelogramm (links ein Dreieck abgeschnitten, rechts angesetzt) → Dreieck (das Parallelogramm entlang einer Diagonale halbiert) → Trapez (zwei gleiche Trapeze ergeben ein Parallelogramm). Eigener Ast: Rechteck → Drachenviereck (im umschriebenen Rechteck, das doppelt so groß ist). Eigener Ast: Kreis in 12 Tortenstücke geschnitten und abwechselnd umgelegt zu einem „Fast-Rechteck“.","Maße":"Rechteck, Parallelogramm und Dreieck mit derselben Grundseite 6 cm und derselben Höhe 4 cm. Kreis: Radius 3 cm; das Fast-Rechteck ist π · r breit und r hoch.","Beschriftung":"An jedem Pfeil, was getan wurde: „abschneiden und ansetzen“, „halbieren“, „verdoppeln“. In jeder Figur die Fläche: 24 cm², 24 cm², 12 cm².","Hervorgehoben":"Die Höhe h: in jeder Figur dieselbe Farbe, gestrichelt, mit Zeichen für den rechten Winkel – und dieselbe Farbe für h in der Formel daneben.","Darf nicht falsch aussehen":"Die Höhe darf nie auf der schrägen Seite liegen. Das abgeschnittene und das angesetzte Dreieck müssen gleich aussehen. Beim Dreieck muss erkennbar sein, dass es genau die Hälfte ist.","Gleiche Zeichnung, andere Beschriftung":"Dieselben Figuren mit Buchstaben g und h statt Zahlen (ab Klasse 7). Beim Dreieck eine zweite Fassung mit stumpfem Winkel: Die Höhe liegt außerhalb, an der verlängerten Grundseite."}},{"nr":3,"satz":"Grundfläche mal Höhe – bei Spitzen nur ein Drittel.","genau":"Aus dem Quader entsteht jeder Körper: Grundfläche mal Höhe – bei spitzen Körpern ein Drittel davon.","kurz":"Aus dem Quader","gesetze":["F15","F16","F17","F18"],"warum":"Ein Quader ist ein Stapel gleicher Schichten: Grundfläche mal Höhe. Das bleibt richtig, wenn die Grundfläche ein Dreieck oder ein Kreis ist (Prisma, Zylinder) und sogar, wenn der Stapel schief steht. Läuft der Körper spitz zu, bleibt genau ein Drittel übrig.","zeichen":{"Zu sehen":"Ein Stammbaum. Quader → Prisma mit dreieckiger Grundfläche → Zylinder (alle drei als Stapel dünner Schichten angedeutet). Darunter: Pyramide, eingezeichnet in den Quader mit derselben Grundfläche und Höhe, daneben Kegel im Zylinder. Abseits: Kugel im genau passenden Zylinder.","Maße":"Alle Körper gleich hoch. Pyramide und Kegel füllen sichtbar denselben Umriss wie ihr umgebender Körper.","Beschriftung":"An den oberen drei: „V = G · h“. An Pyramide und Kegel: „⅓ · G · h“. An der Kugel: „⅔ des Zylinders“.","Hervorgehoben":"Die Grundfläche G (gefärbt) und die Höhe h (gestrichelt, senkrecht, mit Zeichen für den rechten Winkel) – in jedem Körper dieselben zwei Farben.","Darf nicht falsch aussehen":"Die Höhe muss senkrecht auf der Grundfläche stehen, auch beim schiefen Körper – nie entlang einer schrägen Kante. Pyramide und umgebender Körper müssen dieselbe Grundfläche haben.","Gleiche Zeichnung, andere Beschriftung":"Dieselben Körper mit Maßen: Zylinder r = 3 cm, h = 10 cm; Pyramide 6 cm mal 6 cm, h = 4 cm. Für den Satz von Cavalieri: ein gerader und ein schiefer Münzstapel gleicher Höhe."}},{"nr":4,"satz":"Aufklappen zeigt die ganze Haut des Körpers.","genau":"Die Oberfläche ist die Haut des Körpers: Das Netz zeigt sie ausgebreitet, das Schrägbild zeigt den Körper im Raum.","kurz":"Haut des Körpers","gesetze":["F13","F14","F19"],"warum":"Schneidet man einen Körper an seinen Kanten auf und klappt ihn flach, sieht man seine ganze Außenfläche auf einmal: das Netz. Die Oberfläche ist die Summe dieser Flächen. Das Schrägbild ist der umgekehrte Weg: ein flaches Bild, das den Körper räumlich zeigt.","zeichen":{"Zu sehen":"Drei Bilder von links nach rechts: der Quader im Schrägbild; derselbe Quader halb aufgeklappt (Deckel und Seitenwände stehen schräg ab); sein Netz flach: sechs Rechtecke in Kreuzform. Je zwei gleiche Rechtecke haben in allen drei Bildern dieselbe Farbe.","Maße":"Quader 5 cm mal 4 cm mal 3 cm. Im Schrägbild: Tiefenkanten unter 45° und halb so lang; verdeckte Kanten gestrichelt. Im Netz: alle Rechtecke maßstäblich.","Beschriftung":"Im Netz in jedem Rechteck seine Fläche: 20 cm², 15 cm², 12 cm², jeweils zweimal. Darunter: „O = 2 · (20 + 15 + 12) cm² = 94 cm²“.","Hervorgehoben":"Das mittlere Bild – das Aufklappen – und die drei Farbpaare.","Darf nicht falsch aussehen":"Das Netz muss sich wirklich falten lassen: Kanten, die zusammenstoßen, sind gleich lang. Es müssen genau sechs Flächen sein.","Gleiche Zeichnung, andere Beschriftung":"Dieselbe Darstellung für das Dreiecksprisma (Dreieck 3 cm, 4 cm, 5 cm, Höhe 6 cm): drei Rechtecke nebeneinander, zusammen 12 cm breit – so breit wie der Umfang des Dreiecks; zusammenstoßende Kanten gleich markiert. Für den Zylinder: Rechteck mit Breite 2 · π · r und zwei Kreise."}}]},{"name":"Funktionen","zahl":20,"ideen":[{"nr":1,"satz":"Zu jedem x gehört genau ein y.","genau":"Eine Funktion ordnet jedem x genau ein y zu; Tabelle, Graph und Gleichung zeigen dasselbe.","kurz":"Zuordnung","gesetze":["U1","U2","U3","U4","U6"],"warum":"Eine Funktion ist eine Zuordnung, bei der zu jedem x genau ein y gehört. Man kann sie als Tabelle, als Graph oder als Gleichung zeigen; jede Darstellung lässt sich in die anderen übersetzen.","zeichen":{"Zu sehen":"Drei Felder für dieselbe Funktion. Feld 1: Tabelle mit vier Wertepaaren. Feld 2: Koordinatensystem mit den vier Punkten und der Geraden durch sie. Feld 3: die Gleichung.","Maße":"Wertepaare: (0 | 1), (1 | 3), (2 | 5), (3 | 7). Achsen von −1 bis 4 und von −1 bis 8, gleiche Einheiten.","Beschriftung":"Feld 1: Köpfe „x“ und „y“. Feld 3: „y = 2 · x + 1“. In Feld 2 eine gestrichelte senkrechte Linie bei x = 2, die den Graphen genau einmal trifft.","Hervorgehoben":"Das Wertepaar (2 | 5): in der Tabelle umrahmt, im Graphen als kräftiger Punkt, in der Gleichung als Zeile „2 · 2 + 1 = 5“.","Darf nicht falsch aussehen":"Alle vier Punkte liegen genau auf der Geraden. Die senkrechte Linie trifft den Graphen nur einmal.","Gleiche Zeichnung, andere Beschriftung":"Feld 2 mit einem Kreis statt der Geraden: Die senkrechte Linie trifft zweimal – keine Funktion. Feld 2 mit markierten Punkten (0 | 1) und (−0,5 | 0): Achsenabschnitt und Nullstelle."}},{"nr":2,"satz":"Plus gleich viel gibt eine Gerade, mal gleich viel eine steile Kurve.","genau":"Linear wächst in gleichen Schritten um gleich viel, exponentiell um den gleichen Faktor.","kurz":"Wachstum","gesetze":["U7","U8","U9","U10","U14","U15","U19","U20"],"warum":"Es gibt zwei Grundarten zu wachsen. Kommt in jedem Schritt gleich viel dazu, liegen die Punkte auf einer Geraden. Wird in jedem Schritt mit derselben Zahl malgenommen, wird die Kurve immer steiler und überholt jede Gerade.","zeichen":{"Z
