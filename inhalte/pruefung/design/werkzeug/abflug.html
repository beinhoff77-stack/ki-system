<!doctype html>
<html lang="de" class="dunkel">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Entwurf „Abflug“ – Mathe-Lernreise</title>
<!-- Gestaltungsentwurf (Prüfrunde Gestaltung), kein App-Code. Eine Datei, keine fremden Abhängigkeiten.
     Schriften: Space Grotesk und JetBrains Mono (SIL OFL 1.1), eingebettet. Karte: Natural Earth (gemeinfrei). -->
<style>
@font-face { font-family: "Grotesk"; src: url(/*SCHRIFT:space-grotesk*/) format("woff2"); font-weight: 300 700; }
@font-face { font-family: "Mono"; src: url(/*SCHRIFT:jetbrains-mono*/) format("woff2"); font-weight: 100 800; }
:root { /* Tag */
  --bg: #F3F1EA; --flaeche: #FFFFFF; --flaeche2: #E7E4DA; --linie: #C9C4B6; --text: #11161D; --leise: #4A5563;
  --gelb: #FFD23F; --auf-gelb: #11161D; --tafel: #11161D; --tafel-text: #FFD23F; --tafel-kachel: #1E2630;
  --gut: #0B7A4B; --gut-bg: #DDF3E8; --kurs: #A8410F; --kurs-bg: #FFE9DC; --info: #0B5F8A;
  --ui: "Grotesk", system-ui, sans-serif; --mono: "Mono", ui-monospace, monospace; color-scheme: light;
}
html.dunkel { /* Nacht */
  --bg: #0B0F14; --flaeche: #151B24; --flaeche2: #1D2530; --linie: #2E3947; --text: #F2F4F7; --leise: #A9B3C1;
  --gelb: #FFD23F; --auf-gelb: #11161D; --tafel: #05080C; --tafel-text: #FFD23F; --tafel-kachel: #161D27;
  --gut: #45E0A0; --gut-bg: #0F2E22; --kurs: #FFAD7A; --kurs-bg: #33201A; --info: #7CCBFF; color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { margin: 0; }
body { background: var(--bg); color: var(--text); font: 500 18px/1.4 var(--ui); -webkit-font-smoothing: antialiased; font-variant-numeric: tabular-nums; }
button { font: inherit; color: inherit; cursor: pointer; }
:focus-visible { outline: 3px solid var(--gelb); outline-offset: 3px; }
#app { min-height: 100dvh; }
.mono { font-family: var(--mono); }
.ueber { font: 700 16px var(--mono); letter-spacing: .08em; text-transform: uppercase; color: var(--leise); margin: 0; }
/* Abflugtafel */
.tafel-seite { padding: 18px 14px 120px; max-width: 1100px; margin: 0 auto; }
.tafel-kopf { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; margin: 4px 4px 14px; }
.tafel-kopf h1 { margin: 0; font: 700 30px var(--ui); letter-spacing: -.02em; }
.tafel { background: var(--tafel); border-radius: 16px; padding: 10px; color: var(--tafel-text); font-family: var(--mono); }
.tzeile { display: grid; grid-template-columns: 1.3fr 1fr; gap: 6px 12px; align-items: center; padding: 12px 8px; border-bottom: 1px solid #ffffff1a; width: 100%; text-align: left; background: none; border-left: 0; border-right: 0; border-top: 0; color: inherit; font-family: var(--mono); min-height: 64px; }
.tzeile:last-child { border-bottom: 0; }
.tzeile .ziel { font-size: 20px; font-weight: 800; letter-spacing: .04em; text-transform: uppercase; }
.tzeile .thema { grid-column: 1; font-size: 16px; color: #E9EDF2; font-weight: 500; letter-spacing: 0; }
.tzeile .status { grid-row: 1 / span 2; grid-column: 2; justify-self: end; text-align: right; font-size: 16px; font-weight: 800; letter-spacing: .06em; }
.tzeile .status small { display: block; color: #C3CCD8; font-weight: 500; letter-spacing: 0; font-size: 16px; }
.tzeile .status.st-jetzt small { color: #11161D; }
.st-jetzt { color: #11161D; background: var(--gelb); padding: 6px 10px; border-radius: 6px; }
.st-geschafft { color: #45E0A0; } .st-offen { color: #E9EDF2; } .st-spaeter { color: #9AA6B5; }
.tzeile.erste { padding: 16px 8px 18px; }
.klappen { display: flex; gap: 3px; margin: 2px 0 6px; flex-wrap: wrap; }
.klappen span { display: grid; place-items: center; width: 30px; height: 42px; background: var(--tafel-kachel); border-radius: 4px; font: 800 26px var(--mono); position: relative; color: var(--tafel-text); }
.klappen span::after { content: ""; position: absolute; left: 0; right: 0; top: 50%; height: 1px; background: #00000099; }
.klappen.anim span { animation: klappe .5s steps(3) both; } .klappen.anim span:nth-child(n) { animation-delay: calc(var(--i) * 40ms); }
@keyframes klappe { 0% { transform: scaleY(.1); } 100% { transform: none; } }
.tafel-unter { display: flex; flex-wrap: wrap; gap: 10px; margin: 14px 4px; }
.routevorschau { display: block; width: 100%; max-width: 640px; padding: 0; border: 0; background: none; border-radius: 18px; overflow: hidden; margin-top: 4px; }
.chip { display: inline-flex; align-items: center; gap: 8px; min-height: 44px; padding: 0 14px; border-radius: 99px; background: var(--flaeche); border: 1px solid var(--linie); font: 700 16px var(--mono); color: var(--text); }
/* Großer gelber Knopf im Daumenbereich */
.einsteigen { position: fixed; left: 14px; right: 84px; bottom: calc(14px + env(safe-area-inset-bottom)); min-height: 64px; border: 0; border-radius: 16px; background: var(--gelb); color: var(--auf-gelb); font: 700 22px var(--ui); display: flex; align-items: center; justify-content: space-between; padding: 0 22px; z-index: 20; box-shadow: 0 10px 30px #0006; }
.einsteigen .mono { font-size: 18px; }
.menueknopf { position: fixed; right: 14px; bottom: calc(14px + env(safe-area-inset-bottom)); width: 60px; height: 64px; border-radius: 16px; border: 1px solid var(--linie); background: var(--flaeche); z-index: 20; display: grid; place-items: center; font: 700 16px var(--ui); }
.menueknopf svg { width: 26px; height: 26px; }
.blatt { position: fixed; inset: auto 0 0 0; background: var(--flaeche); border-radius: 22px 22px 0 0; padding: 10px 14px calc(18px + env(safe-area-inset-bottom)); z-index: 40; box-shadow: 0 -10px 40px #0007; animation: hoch .25s ease-out; max-width: 560px; margin: 0 auto; }
.blatt::before { content: ""; display: block; width: 44px; height: 5px; border-radius: 3px; background: var(--linie); margin: 0 auto 12px; }
.blatt button { display: flex; align-items: center; justify-content: space-between; width: 100%; min-height: 56px; padding: 0 12px; border: 0; border-bottom: 1px solid var(--linie); background: none; font: 600 19px var(--ui); text-align: left; }
.blatt button:last-child { border-bottom: 0; } .blatt kbd { font: 600 16px var(--mono); color: var(--leise); }
.schleier { position: fixed; inset: 0; background: #0008; z-index: 39; border: 0; }
@keyframes hoch { from { transform: translateY(40px); opacity: 0; } }
/* Thema: Stapel aus Sicherheitskarte, Bordkarten, Turbulenzen */
.flug { min-height: 100dvh; display: flex; flex-direction: column; max-width: 1180px; margin: 0 auto; }
.flugkopf { display: flex; align-items: center; gap: 10px; padding: 10px 12px 8px; }
.zu { width: 48px; height: 48px; border-radius: 14px; border: 1px solid var(--linie); background: var(--flaeche); font: 700 22px var(--ui); display: grid; place-items: center; flex: none; }
.flugkopf .wo { min-width: 0; flex: 1; }
.flugkopf .wo b { display: block; font: 700 19px/1.2 var(--ui); }
.stapel { display: flex; gap: 4px; padding: 0 12px 8px; }
.stapel button { flex: 1; min-height: 44px; border: 0; background: none; padding: 0; display: flex; flex-direction: column; gap: 4px; align-items: stretch; font: 700 16px var(--mono); color: var(--leise); text-transform: uppercase; letter-spacing: .04em; }
.stapel button i { height: 5px; border-radius: 3px; background: var(--linie); display: block; }
.stapel button.an { color: var(--text); } .stapel button.an i { background: var(--gelb); }
.flugflaeche { flex: 1; display: flex; flex-direction: column; padding: 0 12px 12px; }
.einfahren { animation: einfahren .3s ease-out; }
@keyframes einfahren { from { transform: translateY(30px); opacity: 0; } }
/* Sicherheitskarte: nummerierte Bildfelder, eins nach dem anderen */
.sicherheit { background: var(--flaeche); border-radius: 20px; padding: 14px; flex: 1; display: flex; flex-direction: column; }
.sk-raster { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; flex: 1; }
.sk-feld { position: relative; border-radius: 14px; border: 2px solid var(--linie); background: var(--flaeche2); padding: 34px 8px 10px; display: flex; flex-direction: column; align-items: center; justify-content: space-between; text-align: center; min-height: 160px; overflow: hidden; }
.sk-feld .n { position: absolute; top: 6px; left: 8px; width: 28px; height: 28px; border-radius: 50%; background: var(--gelb); color: #11161D; font: 800 16px var(--mono); display: grid; place-items: center; }
.sk-feld p { margin: 6px 0 0; font: 600 16px/1.3 var(--ui); }
.sk-feld.zu-noch { border-style: dashed; background: transparent; justify-content: center; color: var(--leise); }
.sk-feld.zu-noch .n { background: var(--linie); color: var(--text); }
.sk-feld.an { border-color: var(--gelb); }
.sk-feld .bild { width: 100%; display: grid; place-items: center; }
.sk-feld .k-tafel { font-size: 24px; border-spacing: 2px; } .sk-feld .k-tafel td { width: 32px; height: 44px; } .sk-feld .k-tafel-wert, .sk-feld .k-tafel-notiz { font-size: 20px; }
.sk-feld .k-koord { max-width: 150px; }
.sk-regel { margin: 12px 2px 0; font: 600 18px/1.35 var(--ui); padding-left: 12px; border-left: 4px solid var(--gelb); }
/* Bordkarte */
.bordkarte { position: relative; background: var(--flaeche); border-radius: 20px; display: flex; flex-direction: column; flex: 1; overflow: hidden; }
.bk-oben { padding: 16px 18px 12px; }
.bk-oben .zeile { display: flex; justify-content: space-between; gap: 8px; }
.bk-frage { font: 700 24px/1.25 var(--ui); margin: 10px 0 0; letter-spacing: -.01em; }
html[data-alter="klein"] .bk-frage { font-size: 26px; }
.perfo { height: 0; border-top: 3px dashed var(--linie); margin: 0 14px; position: relative; }
.perfo::before, .perfo::after { content: ""; position: absolute; top: -14px; width: 26px; height: 26px; border-radius: 50%; background: var(--bg); }
.perfo::before { left: -27px; } .perfo::after { right: -27px; }
.bk-anzeige { display: flex; justify-content: center; gap: 4px; padding: 14px 10px 6px; min-height: 92px; align-items: flex-end; }
.bk-anzeige .k { width: 40px; text-align: center; }
.bk-anzeige .k small { display: block; font: 700 16px var(--mono); color: var(--leise); margin-bottom: 4px; }
.bk-anzeige .k span { display: grid; place-items: center; height: 58px; border-radius: 8px; background: var(--tafel); color: var(--tafel-text); font: 800 34px var(--mono); position: relative; }
.bk-anzeige .k span::after { content: ""; position: absolute; left: 0; right: 0; top: 50%; height: 1px; background: #0009; }
.bk-anzeige .leer { color: transparent !important; }
.bk-anzeige.lang { font: 800 40px var(--mono); }
.bk-stubs { display: flex; align-items: center; justify-content: center; gap: 8px; font: 600 16px var(--ui); color: var(--leise); padding: 4px 0 10px; }
.bk-stubs i { width: 30px; height: 20px; border-radius: 4px; border: 2px dashed var(--gut); display: inline-block; } .bk-stubs i.voll { background: var(--gut); border-style: solid; }
.bk-hinweis { text-align: center; font-weight: 700; color: var(--kurs); min-height: 24px; margin: 0; }
.tasten { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 6px; padding: 8px 10px 10px; background: var(--flaeche2); margin-top: auto; }
.tasten button { min-height: 54px; border-radius: 12px; border: 0; background: var(--flaeche); font: 700 26px var(--mono); }
.tasten button:active { background: var(--linie); }
.tasten .textknopf { font: 600 17px var(--ui); background: none; min-height: 44px; }
.tasten .pruef { grid-column: span 2; background: var(--gelb); color: var(--auf-gelb); font: 700 22px var(--ui); }
.unterzeile { display: flex; justify-content: space-between; padding: 0 6px; }
.textknopf { border: 0; background: none; min-height: 44px; padding: 0 10px; font: 600 17px var(--ui); color: var(--text); text-decoration: underline; text-underline-offset: 4px; }
.tippband { margin: 10px 18px 0; padding: 10px 14px; border-radius: 12px; background: var(--flaeche2); font-size: 17px; }
.k-strahl { width: 100%; max-width: 460px; display: block; margin: 0 auto; overflow: visible; }
.k-achse, .k-strich { stroke: var(--text); stroke-width: 3; stroke-linecap: round; } .k-spitze { fill: var(--text); }
.k-wert, .k-zaehl { font: 700 17px var(--mono); fill: var(--text); text-anchor: middle; } .k-zaehl { fill: var(--info); }
.k-marker { fill: var(--gelb); stroke: var(--text); stroke-width: 2; } .k-loesung { fill: none; stroke: var(--gut); stroke-width: 4; }
.k-griff-ring { fill: var(--gelb); stroke: var(--text); stroke-width: 3; } .k-griff-kern { fill: #11161D; } .k-griff-start { opacity: .5; }
.ziehbar { touch-action: none; cursor: grab; }
.k-tafel { border-collapse: separate; border-spacing: 3px; font: 800 30px var(--mono); }
.k-tafel th { font: 700 16px var(--mono); color: var(--leise); }
.k-tafel td { width: 44px; height: 54px; text-align: center; background: var(--tafel); color: var(--tafel-text); border-radius: 6px; }
.k-tafel .an { outline: 3px solid var(--gelb); outline-offset: 1px; } .k-tafel th.an { outline: 0; color: var(--text); }
.k-tafel-notiz, .k-tafel-wert { font: 800 26px var(--mono); margin: 6px 0 0; text-align: center; color: var(--text); }
.k-koord { width: 100%; max-width: 280px; } .k-gitter { stroke: var(--linie); stroke-width: 1.2; } .k-gerade { stroke: var(--gelb); stroke-width: 4; }
.k-dreieck { stroke: var(--info); stroke-width: 4; stroke-linecap: round; }
/* richtig: Abriss fliegt weg; falsch: Kurskorrektur */
.abriss { position: absolute; right: 14px; top: 12px; padding: 10px 14px; border: 2px dashed var(--gut); border-radius: 10px; color: var(--gut); font: 800 18px var(--mono); background: var(--flaeche); animation: abriss .7s cubic-bezier(.3,1.5,.5,1); transform: rotate(6deg); }
@keyframes abriss { 0% { transform: rotate(0) translate(-60px, 40px); opacity: 0; } 100% { transform: rotate(6deg); } }
.ergebnis { margin: 0 14px 12px; border-radius: 16px; padding: 14px 16px; }
.ergebnis.gut { background: var(--gut-bg); color: var(--gut); font: 700 20px var(--ui); display: flex; align-items: center; gap: 12px; }
.ergebnis.kurs { background: var(--kurs-bg); }
.ergebnis.kurs h3 { margin: 0 0 8px; font: 800 18px var(--mono); letter-spacing: .06em; color: var(--kurs); }
.vergleich { display: grid; grid-template-columns: auto 1fr; gap: 6px 10px; align-items: center; margin: 4px 0 8px; }
.vergleich .lbl { font: 700 16px var(--mono); color: var(--leise); }
.vergleich .reihe { display: flex; gap: 3px; justify-content: flex-end; }
.vergleich .reihe span { width: 32px; height: 42px; display: grid; place-items: center; border-radius: 6px; font: 800 24px var(--mono); background: var(--flaeche); }
.vergleich .reihe span.diff { background: var(--gelb); color: #11161D; }
.vergleich .kopf span { background: none; height: 22px; font: 700 16px var(--mono); color: var(--leise); }
.ergebnis.kurs p { margin: 6px 0 0; font-size: 18px; color: var(--text); }
.weiterknopf { margin: auto 14px 14px; min-height: 64px; border: 0; border-radius: 16px; background: var(--gelb); color: var(--auf-gelb); font: 700 22px var(--ui); }
/* Gelandet */
.gelandet { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 20px; background: var(--tafel); color: var(--tafel-text); border-radius: 20px; }
.gelandet h2 { font: 800 34px/1.1 var(--mono); margin: 14px 0 6px; letter-spacing: .04em; }
.gelandet p { color: #E9EDF2; font-size: 19px; margin: 4px 0; }
.landestempel { width: 170px; height: 120px; border: 4px solid #45E0A0; color: #45E0A0; border-radius: 50% / 40%; display: grid; place-items: center; font: 800 20px/1.15 var(--mono); transform: rotate(-9deg); animation: landen .5s cubic-bezier(.2,1.6,.5,1); }
@keyframes landen { from { transform: rotate(-9deg) scale(2); opacity: 0; } }
.gelandet .weiterknopf { margin: 22px 0 0; width: 100%; max-width: 420px; }
.gelandet .zweit { margin-top: 10px; min-height: 52px; border: 1px solid #ffffff55; background: none; color: #fff; border-radius: 14px; width: 100%; max-width: 420px; font: 600 18px var(--ui); }
/* Turbulenzen */
.turb { background: var(--flaeche); border-radius: 20px; padding: 16px; flex: 1; }
.turb h2 { font: 700 24px var(--ui); margin: 6px 0 12px; }
.tz { display: grid; grid-template-columns: 18px 1fr; gap: 12px; align-items: start; background: var(--tafel); color: #E9EDF2; border-radius: 12px; padding: 14px; margin-bottom: 8px; font: 600 18px var(--mono); }
.tz i { width: 16px; height: 16px; border-radius: 50%; margin-top: 4px; } .tz.nein i { background: #FF7A5C; } .tz.ja i { background: #45E0A0; }
.tz small { display: block; font: 700 16px var(--mono); color: #C3CCD8; letter-spacing: .06em; }
/* Weltkarte: Flugbögen */
.welt-seite { padding: 14px 14px 110px; max-width: 1100px; margin: 0 auto; }
.k-welt { width: 100%; display: block; border-radius: 18px; background: var(--tafel); }
.k-meer { fill: var(--tafel); } .k-land { fill: #263244; stroke: #344257; stroke-width: .6; vector-effect: non-scaling-stroke; }
html:not(.dunkel) .k-land { fill: #2A3442; }
.flugbogen { fill: none; stroke: #45E0A0; stroke-width: 2.4; } .flugbogen.naechst { stroke: var(--gelb); stroke-dasharray: 5 6; }
.flugort { fill: #E9EDF2; } .flugort.geschafft { fill: #45E0A0; } .flugort.jetzt { fill: var(--gelb); }
.flugname { font: 700 18px var(--mono); fill: #F2F4F7; }
.ring { fill: none; stroke: var(--gelb); stroke-width: 2; animation: puls 2.4s ease-out infinite; transform-box: fill-box; transform-origin: center; }
@keyframes puls { from { transform: scale(.6); opacity: 1; } to { transform: scale(2.2); opacity: 0; } }
.flugbuch { margin-top: 14px; display: grid; gap: 6px; }
.flugbuch div { display: grid; grid-template-columns: 1fr auto; padding: 12px 14px; border-radius: 12px; background: var(--flaeche); font-size: 17px; }
.flugbuch b { font: 800 18px var(--mono); text-transform: uppercase; letter-spacing: .04em; }
/* Pass */
.pass-seite { padding: 14px 14px 110px; max-width: 900px; margin: 0 auto; }
.passbuch { background: #F6EFDF; color: #1B2230; border-radius: 18px; padding: 18px; background-image: repeating-linear-gradient(45deg, #0000 0 14px, #0000000a 14px 15px); }
.passbuch h2 { font: 800 18px var(--mono); letter-spacing: .1em; margin: 0 0 10px; color: #4A3B1E; }
.visa { display: flex; flex-wrap: wrap; gap: 14px; }
.visum { border: 3px solid #0B6B44; color: #0B6B44; border-radius: 10px; padding: 10px 14px; font: 800 18px/1.2 var(--mono); text-transform: uppercase; transform: rotate(-4deg); }
.visum small { display: block; font: 600 16px var(--mono); text-transform: none; }
.visum:nth-child(2n) { border-color: #7A2E8C; color: #7A2E8C; transform: rotate(5deg); border-radius: 50%; padding: 20px; }
.visum.leer { border-style: dashed; border-color: #8A7F66; color: #5E5440; }
.upgrade { display: flex; align-items: center; gap: 12px; padding: 14px; border-radius: 14px; background: var(--flaeche); margin-top: 10px; }
.upgrade b { font-size: 19px; } .upgrade small { display: block; color: var(--leise); font: 600 16px var(--mono); }
.upgrade button { margin-left: auto; min-height: 48px; padding: 0 16px; border-radius: 12px; border: 0; background: var(--gelb); color: #11161D; font-weight: 700; }
.upgrade button[disabled] { background: var(--flaeche2); color: var(--leise); }
/* Tower (Erwachsene) */
.tower { padding: 18px 16px 40px; max-width: 1100px; margin: 0 auto; }
.tower h1 { font: 700 28px var(--ui); margin: 0; }
.tower .wartet { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; padding: 14px 16px; border-radius: 14px; background: var(--flaeche); border-left: 6px solid var(--gelb); margin: 14px 0; }
.tower .wartet .knoepfe { margin-left: auto; display: flex; gap: 8px; }
.tower .wartet button { min-height: 48px; padding: 0 16px; border-radius: 12px; border: 1px solid var(--linie); background: var(--flaeche2); font-weight: 700; }
.tower .wartet button.ja { background: var(--gelb); color: #11161D; border: 0; }
.tw-kinder { display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: 14px; }
.tw-kind { background: var(--flaeche); border-radius: 16px; padding: 16px; }
.tw-kind h2 { margin: 0; font: 700 22px var(--ui); }
.tw-zahlen { display: flex; gap: 20px; margin: 10px 0; }
.tw-zahlen div { font: 600 16px var(--ui); color: var(--leise); } .tw-zahlen b { display: block; font: 800 28px var(--mono); color: var(--text); }
.tw-band { display: flex; gap: 4px; margin: 12px 0 6px; }
.tw-band i { flex: 1; height: 16px; border-radius: 4px; background: var(--linie); }
.tw-band i.sitzt { background: var(--gut); } .tw-band i.ueben { background: var(--info); } .tw-band i.wackelt { background: var(--kurs); }
.tw-liste { display: grid; gap: 4px; margin-top: 8px; }
.tw-liste div { display: flex; justify-content: space-between; gap: 10px; font-size: 17px; padding: 8px 0; border-bottom: 1px solid var(--linie); }
.tw-liste span:last-child { font: 700 16px var(--mono); }
