<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">

<title>Entwurf 1 · Regelkarte unter dem Fehler</title>
<style>
/* Entwurf, kein App-Code. Farben, Schriften und Knopfarten aus style.css (.lr-abflug-tag / .lr-abflug-nacht, .lr-knopf, .lr-knopf-zweit, .lr-textlink)
   und lernen-regeln.css (.ru-merk, Zeichnungsfarben --z-…). Neue Klassen beginnen mit rk-. */
@font-face { font-family: "Space Grotesk"; src: url("/*SCHRIFT_SG*/") format("woff2"); font-weight: 300 700; }
@font-face { font-family: "JetBrains Mono"; src: url("/*SCHRIFT_JB*/") format("woff2"); font-weight: 100 800; }
* { box-sizing: border-box; }
html, body { margin: 0; }
.lr { --lr-mono: "JetBrains Mono", ui-monospace, Menlo, Consolas, monospace; font-family: "Space Grotesk", system-ui, sans-serif; font-size: 18px; font-weight: 500;
  background: var(--lr-bg); color: var(--lr-text); min-height: 100vh; line-height: 1.4; }
.lr-abflug-tag { color-scheme: light; --lr-bg: #F3F1EA; --lr-flaeche: #FFFFFF; --lr-text: #11161D; --lr-leise: #4A5563; --lr-akzent: #FFD23F; --lr-akzent-tief: #C79E1C; --lr-auf-akzent: #11161D;
  --lr-gut: #0B7A4B; --lr-gut-bg: #DDF3E8; --lr-kurs: #A8410F; --lr-kurs-bg: #FFE9DC; --lr-linie: #C9C4B6; --lr-tafel: #11161D; --lr-tafel-weiss: #E9EDF2; --lr-taste: #FFFFFF;

.lr-abflug-nacht { color-scheme: dark; --lr-bg: #0B0F14; --lr-flaeche: #151B24; --lr-text: #F2F4F7; --lr-leise: #A9B3C1; --lr-akzent: #FFD23F; --lr-akzent-tief: #C79E1C; --lr-auf-akzent: #11161D;
  --lr-gut: #45E0A0; --lr-gut-bg: #12281F; --lr-kurs: #FFAD7A; --lr-kurs-bg: #33201A; --lr-linie: #2E3947; --lr-tafel: #05080C; --lr-tafel-weiss: #E9EDF2; --lr-taste: #1D2530;
  --z-papier: #10161E; --z-karo: #243140; --z-tinte: #F2F4F7; --z-leise: #9AA6B5; --z-gelb: #FFD23F; --z-gelb-fl: #6B5714; --z-blau: #7CB7FF; --z-blau-fl: #1B3A5F; --z-rot: #FF8A8A;
  --rk-merk: color-mix(in srgb, #FFD23F 16%, #151B24); --rk-merk-rand: color-mix(in srgb, #FFD23F 55%, #2E3947); --rk-falsch: #FF8A8A; --rk-falsch-bg: #2A1A1C; }

.lr-x { width: 48px; height: 48px; border-radius: 12px; border: 1px solid var(--lr-linie); background: var(--lr-flaeche); display: grid; place-items: center; font-size: 20px; flex: none; }

.rk-gl { font-family: var(--lr-mono); font-size: 15px; font-weight: 600; margin: 6px 0 0; color: var(--lr-text); }
.rk b.ru-w, .rk-gl b.ru-w { background: #FFD23F; color: #11161D; border-radius: 5px; padding: 1px 4px; font-weight: 700; }
.rk b.ru-bl, .rk-gl b.ru-bl { background: var(--z-blau-fl); border-radius: 5px; padding: 1px 4px; box-shadow: inset 0 0 0 1.5px var(--z-blau); }

.rk-gewand span.t { display: block; min-width: 0; overflow: hidden; text-overflow: ellipsis; }
.rk-gewand code { font-family: var(--lr-mono); font-size: 14px; color: var(--lr-text); }
.rk-zeile { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 14px; margin: 8px 0 4px; }
.rk-zeile .lr-knopf-zweit { min-height: 48px; }
.rk-auch { margin: 6px 0 0; font-size: 15px; color: var(--lr-leise); }
.rk-auch a { color: var(--lr-text); font-weight: 700; }
.rk-weg { margin-top: 10px; font-size: 16px; }
.rk-weg code { font-family: var(--lr-mono); font-size: 15px; }
mark.rk-m { background: #FFD23F; color: #11161D; border-radius: 4px; padding: 0 2px; }
/* kompakt */
.rk-kompakt { margin-top: 10px; border-left: 4px solid var(--lr-akzent); background: var(--lr-flaeche); border-radius: 0 12px 12px 0; padding: 8px 12px 2px; }
.rk-kompakt .rk-merk { font-size: 16px; padding: 0; background: none; border: 0; margin-top: 2px; }
.rk-kompakt .rk-passiert { font-size: 15px; padding-bottom: 6px; margin-bottom: 6px; }
.rk-kompakt .rk-zeile { margin: 2px 0 0; }
/* Breite: Fehler-Teil und Regel nebeneinander */
@media (min-width: 760px) {
  .rk-karte.mit-bild .rk-innen { display: grid; grid-template-columns: minmax(0, 1fr) 300px; gap: 14px; align-items: start; }
  .rk-karte.mit-bild .rk-bild { margin-top: 0; }
}
/* Vergleich „Heute“ daneben (nur Entwurf, ab 1100 px) */
.ew-vergleich { display: block; }
.ew-heute { display: none; }
@media (min-width: 1100px) {

  .ew-vergleich .lr-spalte { margin: 0; }
  .ew-heute { display: flex; flex-direction: column; gap: 12px; opacity: .92; }
  .ew-heute .lr-frage { font-size: 18px; }
}
.ew-heute-kopf { font: 700 13px/1.3 "JetBrains Mono", monospace; letter-spacing: .06em; color: var(--lr-leise); border-bottom: 2px solid var(--lr-linie); padding-bottom: 6px; }

/* Check-in / Mischkarte / Knobel (vereinfacht nach 06m/06l/06k) */
.lr-koffer { display: flex; gap: 4px; } .lr-koffer i { width: 22px; height: 24px; border: 2px solid var(--lr-linie); border-radius: 5px; background: var(--lr-flaeche); }
.lr-koffer i.ok { background: var(--lr-akzent); border-color: var(--lr-akzent-tief); } .lr-koffer i.nein { background: var(--lr-kurs-bg); border-color: var(--lr-kurs); }

.lr-test-knoepfe { display: flex; flex-direction: column; gap: 10px; }
.lr-test-knoepfe .lr-knopf-zweit { min-height: 56px; }
.ts-zusatz { font: 700 13px/1.3 "JetBrains Mono", monospace; letter-spacing: .06em; color: #11161D; background: #FFD23F; border-radius: 6px; padding: 3px 8px; align-self: flex-start; }

.ru-band { position: sticky; top: 0; z-index: 2; background: color-mix(in srgb, var(--lr-akzent) 22%, var(--lr-bg)); border-bottom: 1.5px solid var(--rk-merk-rand); padding: 10px 16px; }
.ru-band-in { max-width: 680px; margin: 0 auto; display: flex; flex-direction: column-reverse; align-items: stretch; gap: 6px; }

.ru-pfad { font-size: 15px; font-weight: 700; color: var(--lr-leise); display: flex; gap: 6px; flex-wrap: wrap; } .ru-pfad a { color: var(--lr-text); }

.ru-acc { border: 1px solid var(--lr-linie); border-radius: 14px; background: var(--lr-flaeche); min-height: 56px; display: flex; justify-content: space-between; align-items: center; padding: 0 16px; font-weight: 700; }

<script>
'use strict';
const D = /*DATEN*/null;
const P = Object.fromEntries(location.hash.slice(1).split('&').filter(Boolean).map((x) => x.split('=')));
const Z = P.z || 'erst', G = P.g === 'nacht' ? 'nacht' : 'tag', KW = P.k === 'beispiel' ? 'beispiel' : 'orte', FOTO = 'foto' in P;
const h = (tag, a, ...kinder) => { const e = document.createElement(tag); for (const [k, v] of Object.entries(a || {})) { if (v === null || v === undefined || v === false) continue; if (k === 'html') e.innerHTML = v; else if (k.startsWith('on')) e.addEventListener(k.slice(2), v); else e.setAttribute(k, v === true ? '' : v); }
  for (const k of kinder.flat(9)) if (k !== null && k !== undefined && k !== false) e.append(k.nodeType ? k : String(k)); return e; };

// ---------- Beispiele (Aufgaben erfunden; Regeln, Merksätze, Zeichnungen, Klassenleiter echt aus daten/regeln-universum.json) ----------
