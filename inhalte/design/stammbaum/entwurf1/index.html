<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Stammbaum der Flächen und Körper – Entwurf 1 (Designer)</title>
<style>
/* Entwurf „Stammbaum“ für die Tafel „Formeln auf einen Blick“ (Regel-Universum, Kinderansicht).
   Farben, Schriften und Bausteine wie lernen-regeln.css (.ru, Präfix ru-; Tafel-Bausteine ru-tafel-…). Neu: Präfix sb- (Stammbaum).
   Schalter per Adresse: #g=nacht · #k=6 · #auf=dreieck (kombinierbar mit &). Läuft ohne Netz; Schriften aus vendor/schriften des Repos. */
@font-face { font-family: "Space Grotesk"; src: url("../../../../vendor/schriften/space-grotesk.woff2") format("woff2"); font-weight: 300 700; font-display: swap; }
@font-face { font-family: "JetBrains Mono"; src: url("../../../../vendor/schriften/jetbrains-mono.woff2") format("woff2"); font-weight: 100 800; font-display: swap; }
html, body { margin: 0; }
.ru *, .ru *::before, .ru *::after { box-sizing: border-box; }
.ru { --mono: "JetBrains Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace; --grotesk: "Space Grotesk", system-ui, -apple-system, "Segoe UI", sans-serif; --s3: #FFD23F;
  font-family: var(--grotesk); font-size: 17px; font-weight: 500; line-height: 1.4; background: var(--ru-bg); color: var(--ru-text); -webkit-text-size-adjust: 100%; min-height: 100vh; }
.ru[data-ru-g="nacht"] { color-scheme: dark; --ru-bg: #0B0F14; --ru-flaeche: #151B24; --ru-flaeche2: #1D2530; --ru-text: #F2F4F7; --ru-leise: #A9B3C1; --ru-linie: #2E3947; --ru-marke: #FFD23F; --z-gelb-fl: #6B5714; }
.ru[data-ru-g="hell"] { color-scheme: light; --ru-bg: #F3F1EA; --ru-flaeche: #FFFFFF; --ru-flaeche2: #F6F4EE; --ru-text: #11161D; --ru-leise: #4A5563; --ru-linie: #C9C4B6; --ru-marke: #FFD23F; --z-gelb-fl: #FFE88A; }
.ru button { font: inherit; color: inherit; cursor: pointer; -webkit-tap-highlight-color: transparent; }
.ru a { color: inherit; }
.ru :focus-visible { outline: 3px solid var(--ru-text); outline-offset: 2px; border-radius: 6px; }
.ru h1, .ru h2, .ru h3, .ru p { margin: 0; }
.ru .ru-leise { color: var(--ru-leise); }
/* Gebiet Fläche und Raum */
.ru [data-gebiet] { --ru-tafel-f: #5AAEFF; --ru-tafel-tint: color-mix(in srgb, var(--ru-tafel-f) 26%, var(--ru-flaeche)); }

/* Entwurfsleiste (nicht Teil der App) */
.ent { font-family: var(--mono); font-size: 12.5px; background: var(--ru-flaeche2); border-bottom: 1px dashed var(--ru-linie); color: var(--ru-leise); }
.ent div { max-width: 1240px; margin: 0 auto; padding: 6px 16px; display: flex; flex-wrap: wrap; gap: 4px 14px; align-items: center; }
.ent a { color: var(--ru-text); text-underline-offset: 3px; }

/* Kopf, Pfad, Titel wie im Universum */
.ru .ru-kopf { position: sticky; top: 0; z-index: 10; background: var(--ru-bg); border-bottom: 1px solid var(--ru-linie); }
.ru .ru-breite { max-width: 1240px; margin: 0 auto; padding-left: 16px; padding-right: 16px; }
@media (min-width: 700px) { .ru .ru-breite { padding-left: 28px; padding-right: 28px; } }
.ru .ru-kopf .ru-breite { display: flex; align-items: center; gap: 10px; min-height: 60px; }
.ru .ru-kopf-marke { display: inline-flex; align-items: center; gap: 10px; text-decoration: none; font-weight: 700; font-size: 17px; min-height: 44px; white-space: nowrap; }
.ru .ru-kopf-marke i { width: 26px; height: 26px; border-radius: 50%; background: var(--s3); box-shadow: 0 0 0 4px rgba(255, 210, 63, .28); flex: none; }
.ru .ru-suche { flex: 1; display: flex; justify-content: flex-end; position: relative; }
.ru .ru-suche input { width: 100%; max-width: 420px; height: 44px; border-radius: 12px; border: 1.5px solid var(--ru-linie); background: var(--ru-flaeche); padding: 0 14px; font: inherit; font-size: 16px; color: var(--ru-text); }
.ru .ru-suche input::placeholder { color: var(--ru-leise); opacity: 1; }
.ru .ru-pfad { display: flex; flex-wrap: wrap; gap: 0 6px; align-items: center; font-size: 16px; color: var(--ru-leise); padding: 14px 0 4px; }
.ru .ru-pfad a { text-decoration: underline; text-underline-offset: 3px; min-height: 40px; display: inline-flex; align-items: center; }
.ru .ru-titel { font-size: 26px; font-weight: 700; line-height: 1.15; margin-top: 4px; }
.ru .ru-lead { font-size: 17px; color: var(--ru-leise); margin-top: 4px; }
.ru .ru-seite { max-width: 760px; margin: 0 auto; padding-bottom: 60px; }
/* Vorschlag: Formel-Tafel mit Stammbaum am Rechner breiter (wie Tafel „Figuren“: 1120 px) */
@media (min-width: 900px) { .ru .ru-seite { max-width: 1120px; } }

/* Werkzeug: Klassenfilter, Drucken (wie App) */
.ru .ru-tafel-kopf { margin-bottom: 10px; }
.ru .ru-tafel-werkzeug { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 6px 12px; margin-top: 10px; }
.ru .ru-tafel-kf { display: flex; align-items: center; gap: 4px; flex-wrap: wrap; }
.ru .ru-tafel-kf > span { font-size: 14px; color: var(--ru-leise); margin-right: 2px; }
.ru .ru-tafel-kf button { min-width: 40px; min-height: 44px; border-radius: 10px; border: 1.5px solid var(--ru-linie); background: var(--ru-flaeche); font-family: var(--mono); font-weight: 700; font-size: 14px; padding: 0 6px; }
.ru .ru-tafel-kf button[aria-pressed="true"] { background: var(--ru-text); color: var(--ru-bg); border-color: var(--ru-text); }
.ru .ru-tafel-drucken { border: 0; background: none; color: var(--ru-leise); text-decoration: underline; text-underline-offset: 3px; font-size: 15px; min-height: 44px; padding: 0 4px; }
@media (max-width: 420px) { .ru .ru-tafel-kf button { min-width: 37px; padding: 0 4px; } .ru .ru-tafel-kf > span { width: 100%; } }

/* Karten (wie App) */
.ru .ru-tafel-karte { background: var(--ru-flaeche); border: 1.5px solid var(--ru-linie); border-radius: 16px; padding: 10px 12px 8px; margin: 0 0 12px; min-width: 0; }
.ru .ru-tafel-karte.ru-tafel-erste { border-top: 6px solid var(--ru-tafel-f); }
.ru .ru-tafel-h2 { font-size: 20px; font-weight: 700; line-height: 1.2; display: flex; align-items: baseline; flex-wrap: wrap; gap: 4px 10px; padding: 4px 0 8px; }
.ru .ru-tafel-h3 { font-size: 15px; font-weight: 700; color: var(--ru-leise); margin: 12px 0 4px; }
.ru .ru-tafel-kl { font-family: var(--mono); font-size: 12.5px; font-weight: 600; color: var(--ru-leise); white-space: nowrap; }
.ru .ru-tafel-hinweis { font-size: 15px; color: var(--ru-leise); margin: 8px 0 4px; }
.ru .ru-tafel-warum-zeile { display: flex; flex-wrap: wrap; gap: 0 16px; margin: 4px 0 0; }
.ru .ru-tafel-warum { font-size: 15px; font-weight: 700; text-underline-offset: 3px; display: inline-flex; align-items: center; min-height: 44px; }
.ru .ru-tafel-liste { margin: 2px 0 6px; padding-left: 20px; font-size: 16px; display: grid; gap: 4px; }
.ru .ru-tafel-f { font-family: var(--grotesk); font-weight: 700; font-size: 17px; line-height: 1.3; font-variant-numeric: tabular-nums; }
.ru .ru-tafel-fz { display: block; padding: 1px 0; }
.ru .ru-tafel-fg { white-space: nowrap; }
.ru sub { font-size: max(12px, .72em); vertical-align: -.25em; line-height: 0; }
.ru .ru-tafel-fz + .ru-tafel-fz { margin-top: 4px; }
.ru .ru-tafel-fz small { display: block; font-weight: 600; font-size: 13px; color: var(--ru-leise); line-height: 1.2; }
.ru .ru-tafel-bez { display: grid; gap: 2px; margin: 0 0 4px; }
.ru .ru-tafel-bez > div { display: grid; grid-template-columns: 3.6em minmax(0, 1fr); gap: 6px; }
.ru .ru-tafel-bez dt { font-family: var(--mono); font-weight: 700; }
.ru .ru-tafel-bez dd { margin: 0; }

/* Matrix mit aufklappbarer Zeile (wie App) */
.ru .ru-tafel-roll { overflow-x: auto; max-width: 100%; container-type: inline-size; margin: 2px 0 4px; border: 1px solid var(--ru-linie); border-radius: 12px; background: var(--ru-flaeche); }
.ru .ru-tafel-matrix { border-collapse: separate; border-spacing: 0; width: 100%; font-size: 16px; }
.ru .ru-tafel-matrix th, .ru .ru-tafel-matrix td { text-align: left; vertical-align: middle; padding: 6px 10px; border-bottom: 1px solid color-mix(in srgb, var(--ru-linie) 70%, transparent); }
.ru .ru-tafel-matrix tbody:last-child tr:last-child > * { border-bottom: 0; }
.ru .ru-tafel-matrix thead th { font-family: var(--mono); font-size: 12.5px; font-weight: 700; color: var(--ru-leise); background: var(--ru-flaeche2); border-bottom: 1.5px solid var(--ru-linie); vertical-align: bottom; }
.ru .ru-tafel-matrix th.ru-tafel-fest { position: sticky; left: 0; z-index: 1; background: var(--ru-flaeche); box-shadow: inset -1.5px 0 0 var(--ru-linie); font-weight: 500; min-width: 6.5em; max-width: 12em; }
.ru .ru-tafel-matrix thead th.ru-tafel-fest { background: var(--ru-flaeche2); z-index: 2; }
.ru .ru-tafel-zk { display: flex; align-items: center; gap: 8px; min-height: 32px; }
.ru .ru-tafel-zk-text { display: flex; flex-direction: column; line-height: 1.2; }
.ru .ru-tafel-zk-text b { font-size: 16px; }
.ru .ru-tafel-auf { display: flex; align-items: center; justify-content: space-between; gap: 6px; width: 100%; min-height: 44px; padding: 0; margin: 0; border: 0; background: none; text-align: left; }
.ru .ru-tafel-auf:hover .ru-tafel-zk-text b { text-decoration: underline; text-underline-offset: 3px; }
.ru .ru-chev { width: 22px; height: 22px; flex: none; color: var(--ru-leise); transition: transform .15s; }
.ru .ru-tafel-auf[aria-expanded="true"] .ru-chev { transform: rotate(180deg); }
.ru .ru-tafel-z:has(.ru-tafel-auf[aria-expanded="true"]) > tr:first-child > * { background: var(--ru-flaeche2); border-bottom-color: transparent; }
.ru .ru-tafel-detail > td { padding: 0; background: var(--ru-flaeche2); }
.ru .ru-tafel-d { position: sticky; left: 0; width: 100cqw; max-width: 100cqw; padding: 4px 12px 12px; white-space: normal; font-size: 16px; }
.ru .ru-tafel-mini { width: 46px; height: auto; flex: none; color: var(--ru-text); }
.ru .ru-tafel-ziel { outline: 3px solid var(--ru-marke); outline-offset: -3px; }

/* ===================== Neu: Zeichnungen ===================== */
.ru svg { display: block; overflow: visible; color: var(--ru-text); }
.ru .f-n { fill: var(--ru-tafel-tint); stroke: currentColor; stroke-width: 2; stroke-linejoin: round; }
.ru .f-m { fill: var(--ru-marke); stroke: currentColor; stroke-width: 2; stroke-linejoin: round; }
.ru .f-o { fill: none; stroke: currentColor; stroke-width: 2; stroke-linejoin: round; }
.ru .f-d { fill: none; stroke: currentColor; stroke-width: 1.5; stroke-dasharray: 4 3; }
.ru .f-g { fill: none; stroke: currentColor; stroke-width: 1; opacity: .35; }
.ru .f-rw { fill: none; stroke: currentColor; stroke-width: 1.3; }
.ru .f-pf { fill: none; stroke: var(--ru-leise); stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.ru .f-t { font-family: var(--mono); font-size: 13px; font-weight: 700; fill: currentColor; }
.ru .f-ts { font-family: var(--grotesk); font-size: 13px; font-weight: 700; fill: currentColor; }
.ru .f-tl { font-family: var(--grotesk); font-size: 12px; font-weight: 600; fill: var(--ru-leise); }
.ru .f-punkt { fill: currentColor; }

/* ===================== Neu: Leitsatz und Stammbaum ===================== */
.ru .sb-leit { display: flex; gap: 10px; align-items: flex-start; margin: 2px 0 12px; padding: 10px 12px; border-radius: 12px; background: var(--ru-flaeche2); border: 1.5px solid var(--ru-linie); }
.ru .sb-leit::before { content: ""; flex: none; width: 6px; align-self: stretch; border-radius: 3px; background: var(--ru-marke); }
.ru .sb-leit b { display: block; font-size: 18px; line-height: 1.25; }
.ru .sb-leit span { display: block; font-size: 15px; color: var(--ru-leise); margin-top: 2px; }
.ru .sb-baum { margin: 0 0 6px; }
.ru .sb-baum ul { list-style: none; margin: 0; padding: 0; }
/* Knoten: antippbar, springt zur Zeile der Matrix und klappt sie auf */
.ru .sb-knoten { display: flex; flex-direction: column; align-items: flex-start; gap: 1px; width: 100%; text-align: left; border: 1.5px solid var(--ru-text); border-radius: 12px; background: var(--ru-flaeche); padding: 7px 34px 7px 11px; min-height: 44px; position: relative; }
.ru .sb-knoten:hover { background: var(--ru-flaeche2); }
.ru .sb-knoten::after { content: "›"; position: absolute; right: 11px; top: 50%; transform: translateY(-52%); font-size: 22px; color: var(--ru-leise); }
.ru .sb-knoten b { font-size: 16px; line-height: 1.2; }
.ru .sb-knoten .ru-tafel-f { font-size: 17px; }
.ru .sb-knoten .ru-tafel-kl { margin-top: 1px; }
.ru .sb-zwei { display: flex; flex-wrap: wrap; gap: 6px; }
.ru .sb-zwei .sb-knoten { flex: 1 1 170px; width: auto; }
.ru .sb-folg-k { border: 0; background: none; padding: 2px 0; text-align: left; display: grid; grid-template-columns: 30px minmax(0, 1fr); align-items: center; gap: 8px; width: 100%; font-size: 14px; min-height: 40px; }
.ru .sb-folg-k:hover span { text-decoration: underline; text-underline-offset: 3px; }
.ru .sb-folg-k svg { flex: none; }
.ru .sb-ziel { position: relative; width: 100%; }
.ru .sb-ast > .sb-kopf > .sb-ziel::before { content: ""; position: absolute; left: -22px; top: 22px; width: 17px; border-top: 2px solid var(--ru-text); }
.ru .sb-ast > .sb-kopf > .sb-ziel::after { content: ""; position: absolute; left: -8px; top: 17px; border: 6px solid transparent; border-left: 8px solid var(--ru-text); border-right: 0; }
.ru .sb-ast.sb-gestr > .sb-kopf > .sb-ziel::before { border-top-style: dashed; }
/* Ursprung */
.ru .sb-wurzel { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 4px 12px; align-items: center; border: 2.5px solid var(--ru-text); border-radius: 14px; background: var(--ru-tafel-tint); padding: 10px 12px; width: 100%; text-align: left; position: relative; }
.ru .sb-wurzel:hover { background: color-mix(in srgb, var(--ru-tafel-f) 36%, var(--ru-flaeche)); }
.ru .sb-wurzel small { display: block; font-family: var(--mono); font-size: 12.5px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--ru-text); }
.ru .sb-wurzel b { display: block; font-size: 19px; line-height: 1.2; }
.ru .sb-wurzel .ru-tafel-f { font-size: 22px; display: block; }
.ru .sb-wurzel .sb-wz-satz { display: block; font-size: 14px; color: var(--ru-text); margin-top: 2px; }
/* Kante: Verb + Bild des Tricks (vorher → nachher) */
.ru .sb-kante { display: flex; flex-direction: column; align-items: flex-start; gap: 4px; padding: 10px 0 8px; }
.ru .sb-verb { display: inline-block; font-family: var(--mono); font-size: 13px; font-weight: 700; border-radius: 999px; padding: 2px 9px; background: var(--ru-text); color: var(--ru-bg); white-space: nowrap; }
.ru .sb-verb.sb-leicht { background: var(--ru-flaeche2); color: var(--ru-text); border: 1.5px dashed var(--ru-leise); }
.ru .sb-trick { display: block; padding: 2px 0; }
.ru .sb-kante small { font-size: 13px; color: var(--ru-leise); line-height: 1.25; max-width: 30ch; }
/* Folgerungen (weitere Wege) am Knoten */
.ru .sb-folg { margin: 6px 0 0 !important; display: grid; gap: 4px; }
.ru .sb-folg li { font-size: 14px; line-height: 1.3; border: 1.5px dashed var(--ru-linie); border-radius: 10px; padding: 4px 9px; background: var(--ru-flaeche); }
.ru .sb-folg li b { font-family: var(--grotesk); font-weight: 700; font-size: 14.5px; white-space: nowrap; }
.ru .sb-folg .ru-tafel-kl { font-size: 12px; margin-left: 4px; }
.ru .sb-folg-t { display: block; font-family: var(--mono); font-size: 12px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: var(--ru-leise); margin: 6px 0 2px; }
.ru .sb-fuss { font-size: 15px; color: var(--ru-leise); margin: 10px 0 4px; display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 10px; align-items: center; border-top: 1px dashed var(--ru-linie); padding-top: 10px; }
.ru .sb-fuss b { color: var(--ru-text); }
.ru .sb-leer { font-size: 15px; color: var(--ru-leise); border: 1.5px dashed var(--ru-linie); border-radius: 12px; padding: 10px 12px; margin: 8px 0; }

/* --- Handy: senkrechter Baum mit Stamm links --- */
.ru .sb-aeste { margin-top: 0 !important; }
.ru .sb-ast { position: relative; padding-left: 22px; }
.ru .sb-ast::before { content: ""; position: absolute; left: 0; top: 0; bottom: 0; border-left: 2px solid var(--ru-text); }
.ru .sb-ast.sb-letzt::before { bottom: auto; height: var(--sb-bis, 60px); }
.ru .sb-ast > .sb-kopf { position: relative; }
.ru .sb-ast.sb-gestr::before { border-left-style: dashed; }
.ru .sb-kinder { margin-left: 14px !important; }
.ru .sb-aeste, .ru .sb-kinder { padding-top: 0; }
.ru .sb-wurzel-wrap { position: relative; }

/* --- Rechner: Stammbaum von oben nach unten, Äste nebeneinander --- */
@media (min-width: 900px) {
  .ru .sb-baum { padding: 4px 0 0; }
  .ru .sb-wurzel-wrap { display: flex; justify-content: center; }
  .ru .sb-wurzel { width: auto; min-width: 340px; max-width: 460px; }
  .ru .sb-aeste, .ru .sb-kinder { display: flex; position: relative; padding-top: 18px !important; margin-left: 0 !important; }
  .ru .sb-aeste::before, .ru .sb-kinder::before { content: ""; position: absolute; top: 0; left: 50%; height: 18px; border-left: 2px solid var(--ru-text); }
  .ru .sb-ast { flex: var(--sb-w, 1) 1 0; min-width: 0; padding: 18px 6px 0; display: flex; flex-direction: column; align-items: center; }
  .ru .sb-ast::before, .ru .sb-ast::after { content: ""; position: absolute; top: 0; height: 18px; width: 50%; border-top: 2px solid var(--ru-text); left: auto; bottom: auto; border-left: 0; }
  .ru .sb-ast::before { right: 50%; }
  .ru .sb-ast::after { left: 50%; border-left: 2px solid var(--ru-text); }
  .ru .sb-ast.sb-letzt::before { height: 18px; }
  .ru .sb-ast.sb-erst::before, .ru .sb-ast.sb-letzt::after { border-top: 0; }
  .ru .sb-ast.sb-letzt::before { border-right: 2px solid var(--ru-text); border-top-right-radius: 8px; }
  .ru .sb-ast.sb-erst::after { border-top-left-radius: 8px; }
  .ru .sb-ast.sb-allein::before { border: 0; }
  .ru .sb-ast.sb-allein::after { border-top: 0; border-radius: 0; }
  .ru .sb-ast > .sb-kopf { width: 100%; max-width: 250px; display: flex; flex-direction: column; align-items: center; }
  .ru .sb-ast > .sb-kopf::before { content: ""; position: absolute; left: 50%; top: 0; bottom: 0; border-left: 2px solid var(--ru-text); z-index: 0; }
  .ru .sb-ast.sb-gestr > .sb-kopf::before { border-left-style: dashed; }
  .ru .sb-ast.sb-gestr::before, .ru .sb-ast.sb-gestr::after { border-left-style: solid; }
  .ru .sb-ast > .sb-kopf > .sb-ziel::before, .ru .sb-ast > .sb-kopf > .sb-ziel::after { display: none; }
  .ru .sb-ast.sb-breit > .sb-kopf { max-width: 440px; }
  .ru .sb-ziel { z-index: 1; }
  .ru .sb-ziel > .sb-knoten { max-width: 250px; margin: 0 auto; display: flex; }
  .ru .sb-breit > .sb-kopf > .sb-folg { max-width: 300px; }
  .ru .sb-kante { align-items: center; text-align: center; position: relative; z-index: 1; padding: 0 0 10px; }
  .ru .sb-kante > * { background: var(--ru-flaeche); }
  .ru .sb-kante .sb-verb { background: var(--ru-text); }
  .ru .sb-kante .sb-verb.sb-leicht { background: var(--ru-flaeche2); }
  .ru .sb-kante .sb-trick { padding: 4px 6px; border-radius: 8px; }
  .ru .sb-kante small { padding: 0 4px; }
  .ru .sb-kopf .sb-knoten, .ru .sb-kopf .sb-zwei { position: relative; z-index: 1; }
  .ru .sb-kopf .sb-folg { position: relative; z-index: 1; width: 100%; }
  .ru .sb-kinder { width: 100%; }
  .ru .sb-fuss { grid-template-columns: auto minmax(0, 1fr); }
}

/* ===================== Neu: aufgeklappte Zeile ===================== */
.ru .sb-herl { display: grid; gap: 8px; margin: 6px 0 4px; }
.ru .sb-schritt { display: grid; grid-template-columns: 26px minmax(0, 1fr); grid-template-rows: auto auto; gap: 4px 8px; align-items: start; background: var(--ru-flaeche); border: 1.5px solid var(--ru-linie); border-radius: 12px; padding: 8px 10px; }
.ru .sb-nr { width: 26px; height: 26px; border-radius: 50%; background: var(--ru-text); color: var(--ru-bg); display: grid; place-items: center; font-family: var(--mono); font-size: 13px; font-weight: 700; }
.ru .sb-schritt p { font-size: 15px; line-height: 1.3; grid-column: 2; grid-row: 1; padding-top: 3px; }
.ru .sb-schritt svg { grid-column: 1 / -1; grid-row: 2; justify-self: center; margin: 2px 0; }
@media (min-width: 640px) { .ru .sb-herl { grid-template-columns: repeat(var(--sb-n, 3), minmax(0, 1fr)); } }
.ru .sb-weil { font-size: 16.5px; line-height: 1.35; margin: 10px 0 6px; padding-left: 10px; border-left: 4px solid var(--ru-tafel-f); }
.ru .sb-weil b { font-weight: 700; }
.ru .sb-formel { display: flex; flex-wrap: wrap; align-items: baseline; gap: 2px 12px; margin: 4px 0 2px; }
.ru .sb-formel .ru-tafel-f { font-size: 22px; background: var(--ru-flaeche); border: 1.5px solid var(--ru-text); border-radius: 10px; padding: 3px 12px; }
.ru .sb-formel small { font-size: 14px; color: var(--ru-leise); }
.ru .sb-wege { list-style: none; margin: 2px 0 4px; padding: 0; display: grid; gap: 6px; }
@media (min-width: 900px) { .ru .sb-wege { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
.ru .sb-weg { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 10px; align-items: center; background: var(--ru-flaeche); border: 1.5px solid var(--ru-linie); border-radius: 12px; padding: 7px 10px; }
.ru .sb-weg.sb-ohne { grid-template-columns: minmax(0, 1fr); }
.ru .sb-weg.sb-zusatz { border-style: dashed; }
.ru .sb-weg b { display: block; font-size: 15px; line-height: 1.25; }
.ru .sb-weg .ru-tafel-f { font-size: 16.5px; display: block; margin: 1px 0; }
.ru .sb-weg span.sb-w-satz { display: block; font-size: 14px; color: var(--ru-leise); line-height: 1.3; }
.ru .sb-weg .ru-tafel-kl { font-size: 12px; }
.ru .sb-teil2 { display: grid; gap: 4px 18px; border-top: 1px dashed var(--ru-linie); margin-top: 10px; }
@media (min-width: 640px) { .ru .sb-teil2 { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); } }
.ru .sb-ehrlich { font-size: 15px; border-left: 4px solid var(--ru-linie); padding: 2px 0 2px 10px; margin: 6px 0; color: var(--ru-leise); }

[data-aus] { display: none !important; }
@media print { .ent, .ru-kopf, .ru-tafel-werkzeug { display: none !important; } }
</style>
</head>
<body>
<div class="ru" id="app" data-ru-g="hell">
  <div class="ent"><div><span>Entwurf 1 · Stammbaum der Flächen und Körper · Designer 28.11.2026</span>
    <a href="#g=hell">hell</a><a href="#g=nacht">dunkel</a><a href="#k=6">bis Klasse 6</a><a href="#auf=dreieck">Dreieck offen</a><a href="#auf=kreis">Kreis offen</a><a href="#auf=pyramide">Pyramide offen</a></div></div>
  <header class="ru-kopf"><div class="ru-breite"><a class="ru-kopf-marke" href="#"><i></i><span>Regel-Universum</span></a>
    <label class="ru-suche"><input type="search" placeholder="Regel oder Formel suchen" aria-label="Suchen"></label></div></header>
  <main class="ru-breite">
    <div class="ru-seite" data-tafel="formeln" data-gebiet="fur">
      <nav class="ru-pfad" aria-label="Pfad"><a href="#">Universum</a><span>›</span><a href="#">Fläche und Raum</a><span>›</span><span aria-current="page">Formeln auf einen Blick</span></nav>
      <header class="ru-tafel-kopf"><h1 class="ru-titel">Formeln auf einen Blick</h1><p class="ru-lead">Flächen, Körper und was man sonst noch braucht</p>
        <div class="ru-tafel-werkzeug"><div class="ru-tafel-kf" role="group" aria-label="Zeigen bis Klasse"><span>bis Klasse</span>
          <button type="button" data-bis="5">5</button><button type="button" data-bis="6">6</button><button type="button" data-bis="7">7</button><button type="button" data-bis="8">8</button><button type="button" data-bis="9">9</button><button type="button" data-bis="10">10</button><button type="button" data-bis="alle" aria-pressed="true">alle</button></div>
          <button type="button" class="ru-tafel-drucken" onclick="window.print()">Drucken</button></div></header>
      <div id="inhalt"></div>
    </div>
  </main>
</div>
<script>
'use strict';
// ===================== Zeichen-Helfer (Inline-SVG, Maße in px = viewBox, damit Schrift 13 px bleibt) =====================
const r1 = (x) => Math.round(x * 10) / 10;
const M = (a) => 'M' + a.map((p) => r1(p[0]) + ' ' + r1(p[1])).join(' L') + ' Z';
const versch = (a, dx, dy) => a.map(([x, y]) => [x + dx, y + dy]);
const P = (a, k = 'n', dx = 0, dy = 0) => `<path d="${M(versch(a, dx, dy))}" class="f-${k}"/>`;
const Lin = (x1, y1, x2, y2, k = 'd') => `<path d="M${r1(x1)} ${r1(y1)} L${r1(x2)} ${r1(y2)}" class="f-${k}"/>`;
const T = (x, y, t, a = 'middle', k = 't') => `<text x="${r1(x)}" y="${r1(y)}" text-anchor="${a}" class="f-${k}">${t}</text>`;
const RW = (x, y, dx = 1, dy = -1) => `<path d="M${x + 7 * dx} ${y} V${y + 7 * dy} H${x}" class="f-rw"/>`;
const PF = (x, y, l = 24) => `<path d="M${x} ${y} H${x + l}" class="f-pf"/><path d="M${x + l - 6} ${y - 5} L${x + l} ${y} L${x + l - 6} ${y + 5}" class="f-pf"/>`;
const SVG = (w, h, inner, label, kl = '') => `<svg width="${w}" height="${h}" viewBox="0 0 ${w} ${h}" role="img" aria-label="${label}"${kl ? ` class="${kl}"` : ''}>${inner}</svg>`;
const rad = (g) => (g * Math.PI) / 180;
// Kreis in n Tortenstücke, obere Hälfte gelb (bewegt), untere neutral
function torte(cx, cy, r, n) {
  let s = '';
  for (let i = 0; i < n; i++) { const a = rad((360 / n) * i), b = rad((360 / n) * (i + 1)), oben = (i + 0.5) * (360 / n) < 180;
    s += `<path d="M${cx} ${cy} L${r1(cx + r * Math.cos(a))} ${r1(cy - r * Math.sin(a))} A${r} ${r} 0 0 0 ${r1(cx + r * Math.cos(b))} ${r1(cy - r * Math.sin(b))} Z" class="f-${oben ? 'm' : 'n'}"/>`; }
  return s;
}
// Tortenstücke abwechselnd umgelegt: untere Hälfte mit Spitze oben (neutral), obere Hälfte mit Spitze unten (gelb). Gibt {svg, breite}
function reihe(ox, oy, r, n) {
  const w = rad(360 / n / 2), c = 2 * r * Math.sin(w), hh = r * Math.cos(w); let s = '';
  for (let i = 0; i < n / 2; i++) { const x = ox + i * c;
    s += `<path d="M${r1(x)} ${oy} L${r1(x - c / 2)} ${r1(oy + hh)} A${r} ${r} 0 0 0 ${r1(x + c / 2)} ${r1(oy + hh)} Z" class="f-n"/>`;
    s += `<path d="M${r1(x + c / 2)} ${r1(oy + hh)} L${r1(x)} ${oy} A${r} ${r} 0 0 1 ${r1(x + c)} ${oy} Z" class="f-m"/>`; }
  return { s, c, hh, links: ox - c / 2, rechts: ox + (n / 2) * c };
}
// Gitter (Kästchen) im Rechteck
const gitter = (x, y, nx, ny, e) => { let s = ''; for (let i = 1; i < nx; i++) s += Lin(x + i * e, y, x + i * e, y + ny * e, 'g'); for (let j = 1; j < ny; j++) s += Lin(x, y + j * e, x + nx * e, y + j * e, 'g'); return s; };
// Schrägbild-Quader: Ecke vorn unten links (x, y), Breite a, Höhe c, Tiefe (dx, dy)
function quader(x, y, a, c, dx, dy, o = {}) {
  const v = [[x, y], [x + a, y], [x + a, y - c], [x, y - c]], h = v.map(([p, q]) => [p + dx, q + dy]);
  let s = P(v, o.vorn || 'n') + P([v[3], v[2], h[2], h[3]], o.oben || 'n') + P([v[1], h[1], h[2], v[2]], o.seite || 'n');
  s += `<path d="M${r1(v[0][0])} ${r1(v[0][1])} L${r1(h[0][0])} ${r1(h[0][1])} L${r1(h[1][0])} ${r1(h[1][1])} M${r1(h[0][0])} ${r1(h[0][1])} L${r1(h[3][0])} ${r1(h[3][1])}" class="f-d"/>`;
  return s;
}
const ellipse = (cx, cy, rx, ry, k = 'n') => `<ellipse cx="${cx}" cy="${cy}" rx="${rx}" ry="${ry}" class="f-${k}"/>`;
function zylinder(cx, yo, rx, ry, h, o = {}) { // yo: Mitte der Deckfläche
  return `<path d="M${cx - rx} ${yo} V${yo + h} A${rx} ${ry} 0 0 0 ${cx + rx} ${yo + h} V${yo} Z" class="f-${o.k || 'n'}"/><path d="M${cx - rx} ${yo + h} A${rx} ${ry} 0 0 1 ${cx + rx} ${yo + h}" class="f-d"/>${ellipse(cx, yo, rx, ry, o.deckel || o.k || 'n')}`;
}
function kegel(cx, yb, rx, ry, h, k = 'n') { // yb: Mitte der Grundfläche
  return `<path d="M${cx - rx} ${yb} L${cx} ${yb - h} L${cx + rx} ${yb} A${rx} ${ry} 0 0 1 ${cx - rx} ${yb} Z" class="f-${k}"/><path d="M${cx - rx} ${yb} A${rx} ${ry} 0 0 1 ${cx + rx} ${yb}" class="f-d"/>`;
}

// ===================== Figuren (Punkte, y nach unten) =====================
const para = (g, h, s) => [[0, h], [g, h], [g + s, 0], [s, 0]];
// Trapez: a unten, c oben, Höhe h, obere Seite beginnt bei x = s
const trapez = (a, c, h, s) => [[0, h], [a, h], [s + c, 0], [s, 0]];
// um 180° gedrehte Kopie (Drehpunkt m)
const dreh = (a, m) => a.map(([x, y]) => [2 * m[0] - x, 2 * m[1] - y]);
const mitte = (p, q) => [(p[0] + q[0]) / 2, (p[1] + q[1]) / 2];

// ---------- Bilder an den Ästen (klein, ohne Maße außer wo nötig) ----------
const AST = {
  quadrat: () => SVG(150, 50, `<rect x="2" y="12" width="52" height="30" class="f-n"/>${T(28, 8, 'a', 'middle', 'tl')}${T(58, 31, 'b', 'start', 'tl')}${PF(70, 27)}<rect x="106" y="6" width="36" height="36" class="f-n"/>${T(124, 4, 'a', 'middle', 'tl')}${T(146, 28, 'a', 'start', 'tl')}`, 'Rechteck mit gleich langen Seiten wird zum Quadrat'),
  parallelogramm: () => { const g = 52, h = 30, s = 16, A = para(g, h, s);
    return SVG(176, 44, `${P([[s, h], [g, h], [g + s, 0], [s, 0]], 'n', 4, 7)}${P([[0, h], [s, h], [s, 0]], 'm', 4, 7)}${PF(80, 22)}${P([[s, h], [g, h], [g + s, 0], [s, 0]], 'n', 96, 7)}${P([[g, h], [g + s, h], [g + s, 0]], 'm', 96, 7)}`, 'Parallelogramm: Dreieck links abschneiden, rechts ansetzen, ergibt ein Rechteck'); },
  dreieck: () => { const D = [[0, 30], [44, 30], [28, 0]], K = dreh(D, mitte(D[1], D[2]));
    return SVG(170, 44, `${P(D, 'n', 4, 7)}${PF(58, 22)}${P(D, 'n', 94, 7)}${P(K, 'm', 94, 7)}`, 'Zwei gleiche Dreiecke ergeben ein Parallelogramm'); },
  trapez: () => { const Z = trapez(48, 24, 30, 8), K = dreh(Z, mitte(Z[1], Z[2]));
    return SVG(180, 44, `${P(Z, 'n', 4, 7)}${PF(62, 22)}${P(Z, 'n', 96, 7)}${P(K, 'm', 96, 7)}`, 'Zwei gleiche Trapeze ergeben ein Parallelogramm'); },
  drachen: () => { const D = [[20, 0], [40, 12], [20, 44], [0, 12]];
    const ecken = [[[0, 0], [20, 0], [0, 12]], [[20, 0], [40, 0], [40, 12]], [[40, 12], [40, 44], [20, 44]], [[0, 12], [20, 44], [0, 44]]];
    return SVG(140, 52, `${P(D, 'n', 4, 4)}${Lin(24, 4, 24, 48)}${Lin(4, 16, 44, 16)}${PF(56, 26)}${ecken.map((e) => P(e, 'm', 94, 4)).join('')}${P(D, 'n', 94, 4)}<rect x="94" y="4" width="40" height="44" class="f-o"/>`, 'Drachenviereck im umschließenden Rechteck: die Ecken sind genauso groß wie das Innere'); },
  kreis: () => { const R = reihe(106, 16, 24, 8);
    return SVG(186, 56, `${torte(28, 28, 24, 8)}${PF(62, 28)}${R.s}`, 'Kreis in Tortenstücke schneiden und abwechselnd umlegen: fast ein Rechteck'); },
  vieleck: () => { const V = [[0, 22], [20, 0], [48, 6], [50, 36], [16, 42]];
    return SVG(150, 46, `${P(V, 'n', 2, 2)}${PF(62, 24)}${P([V[0], V[1], V[2]], 'm', 96, 2)}${P([V[0], V[2], V[3]], 'n', 96, 2)}${P([V[0], V[3], V[4]], 'm', 96, 2)}`, 'Vieleck in Dreiecke zerlegen'); },
  ausschnitt: () => SVG(130, 50, `<circle cx="24" cy="25" r="22" class="f-n"/>${PF(54, 25)}<circle cx="106" cy="25" r="22" class="f-d"/><path d="M106 25 L128 25 A22 22 0 0 0 ${r1(106 + 22 * Math.cos(rad(100)))} ${r1(25 - 22 * Math.sin(rad(100)))} Z" class="f-m"/>`, 'Kreisausschnitt ist ein Anteil vom Kreis'),
  ausschnittMini: () => SVG(30, 30, `<circle cx="15" cy="15" r="13" class="f-d"/><path d="M15 15 L28 15 A13 13 0 0 0 ${r1(15 + 13 * Math.cos(rad(100)))} ${r1(15 - 13 * Math.sin(rad(100)))} Z" class="f-m"/>`, ''),
  ringMini: () => SVG(30, 30, `<path d="M2 15 A13 13 0 1 0 28 15 A13 13 0 1 0 2 15 Z M9 15 A6 6 0 1 1 21 15 A6 6 0 1 1 9 15 Z" fill-rule="evenodd" class="f-m"/>`, ''),
  ring: () => SVG(130, 50, `<circle cx="24" cy="25" r="22" class="f-n"/>${PF(54, 25)}<path d="M84 25 A22 22 0 1 0 128 25 A22 22 0 1 0 84 25 Z M95 25 A11 11 0 1 1 117 25 A11 11 0 1 1 95 25 Z" fill-rule="evenodd" class="f-m"/><circle cx="106" cy="25" r="11" class="f-d"/>`, 'Kreisring: großer Kreis minus kleiner Kreis'),
  // Körper
  wuerfel: () => SVG(150, 56, `${quader(4, 50, 46, 30, 14, -12)}${PF(74, 30)}${quader(108, 50, 30, 30, 10, -8)}`, 'Quader mit gleich langen Kanten wird zum Würfel'),
  prisma: () => SVG(190, 62, `${quader(4, 56, 40, 30, 14, -12, { vorn: 'n', oben: 'n' })}<path d="M4 56 L44 56 L58 44 L18 44 Z" class="f-m"/>${PF(66, 36)}`
    + `<path d="M102 56 L138 56 L120 42 Z" class="f-m"/><path d="M102 56 V26 L120 12 L138 26 V56 M102 26 H138 M120 12 V42" class="f-o"/><path d="M120 42 L102 56 M120 42 L138 56" class="f-d"/>`
    + `<path d="M150 22 V52 A16 5 0 0 0 182 52 V22" class="f-o"/>${ellipse(166, 52, 16, 5, 'm')}${ellipse(166, 22, 16, 5, 'o')}`, 'Statt Rechteck eine andere Grundfläche: Prisma und Zylinder'),
  pyramide: () => SVG(186, 62, `<path d="M4 56 L44 56 L58 44 L18 44 Z" class="f-n"/><path d="M31 16 L18 44" class="f-d"/><path d="M4 56 L31 16 L44 56 Z" class="f-m"/><path d="M44 56 L31 16 L58 44 Z" class="f-m"/>`
    + `${T(84, 38, '· 3 =', 'middle', 'ts')}${quader(116, 56, 40, 34, 14, -12)}`, 'Drei Pyramiden füllen ein Prisma mit gleicher Grundfläche und Höhe'),
  kugel: () => SVG(150, 64, `${zylinder(34, 8, 28, 6, 48, { k: 'o', deckel: 'o' })}<circle cx="34" cy="32" r="24" class="f-m"/>${T(100, 30, '⅔ vom', 'middle', 'ts')}${T(100, 46, 'Zylinder', 'middle', 'ts')}`, 'Kugel im Zylinder: zwei Drittel'),
};

// ---------- Bilder der Herleitung (größer, mit Maßen) ----------
const HER = {
  parallelogramm: () => { const g = 84, h = 48, s = 26, ox = 6, oy = 6, A = para(g, h, s);
    const s1 = SVG(126, 76, `${P(A, 'n', ox, oy)}${Lin(ox + s, oy, ox + s, oy + h)}${RW(ox + s, oy + h)}${T(ox + g / 2, oy + h + 17, 'g')}${T(ox + s + 6, oy + h / 2 + 4, 'h', 'start')}`, 'Parallelogramm mit Grundseite g und Höhe h');
    const s2 = SVG(126, 76, `${P([[s, h], [g, h], [g + s, 0], [s, 0]], 'n', ox, oy)}${P([[0, h], [s, h], [s, 0]], 'm', ox, oy)}${T(ox + g / 2 + 10, oy + h + 17, 'g')}`, 'Dreieck links abschneiden');
    const s3 = SVG(126, 76, `${P([[s, h], [g, h], [g + s, 0], [s, 0]], 'n', ox - s + 4, oy)}${P([[g, h], [g + s, h], [g + s, 0]], 'm', ox - s + 4, oy)}${T(ox + 4 + g / 2, oy + h + 17, 'g')}${T(ox + g + 10, oy + h / 2 + 4, 'h', 'start')}`, 'Rechteck mit g und h');
    return [[s1, 'Parallelogramm mit Grundseite g und Höhe h (senkrecht auf g).'], [s2, 'Das Dreieck links abschneiden …'], [s3, '… und rechts ansetzen: ein Rechteck mit den Seiten g und h.']]; },
  dreieck: () => { const D = [[0, 50], [84, 50], [56, 0]], K = dreh(D, mitte(D[1], D[2])), ox = 6, oy = 6;
    const s1 = SVG(150, 78, `${P(D, 'n', ox, oy)}${Lin(ox + 56, oy, ox + 56, oy + 50)}${RW(ox + 56, oy + 50)}${T(ox + 42, oy + 67, 'g')}${T(ox + 62, oy + 32, 'h', 'start')}`, 'Dreieck mit g und h');
    const s2 = SVG(150, 78, `${P(D, 'n', ox, oy)}${P(K, 'm', ox, oy)}${T(ox + 42, oy + 67, 'g')}`, 'Zweites gleiches Dreieck gedreht anlegen');
    const s3 = SVG(150, 78, `<rect x="${ox + 24}" y="${oy}" width="84" height="50" class="f-n"/>${T(ox + 66, oy + 30, 'g · h', 'middle', 'ts')}${T(ox + 66, oy + 67, 'g')}${T(ox + 114, oy + 29, 'h', 'start')}`, 'Rechteck g mal h');
    return [[s1, 'Dreieck mit Grundseite g und Höhe h.'], [s2, 'Ein zweites, gleiches Dreieck gedreht anlegen: ein Parallelogramm mit g und h.'], [s3, 'Ecke umsetzen: ein Rechteck g · h. Ein Dreieck ist die Hälfte davon.']]; },
  trapez: () => { const Z = trapez(84, 40, 48, 14), K = dreh(Z, mitte(Z[1], Z[2])), ox = 5, oy = 16;
    const s1 = SVG(146, 86, `${P(Z, 'n', ox, oy)}${Lin(ox + 22, oy, ox + 22, oy + 48)}${RW(ox + 22, oy + 48)}${T(ox + 42, oy + 65, 'a')}${T(ox + 34, oy - 5, 'c')}${T(ox + 27, oy + 29, 'h', 'start')}`, 'Trapez mit a, c und h');
    const s2 = SVG(146, 86, `${P(Z, 'n', ox, oy)}${P(K, 'm', ox, oy)}${T(ox + 42, oy + 65, 'a')}${T(ox + 104, oy + 65, 'c')}${T(ox + 96, oy - 5, 'a')}${T(ox + 34, oy - 5, 'c')}`, 'Zweites Trapez gedreht anlegen: Parallelogramm mit a plus c');
    const s3 = SVG(146, 86, `<rect x="${ox + 8}" y="${oy}" width="124" height="48" class="f-n"/>${T(ox + 70, oy + 29, '(a&nbsp;+&nbsp;c) · h', 'middle', 'ts')}${T(ox + 70, oy + 65, 'a&nbsp;+&nbsp;c')}`, 'Rechteck a plus c mal h');
    return [[s1, 'Trapez: a und c sind parallel, h ist ihr Abstand.'], [s2, 'Ein zweites, gleiches Trapez umgedreht anlegen: ein Parallelogramm mit Grundseite a&nbsp;+&nbsp;c.'], [s3, 'Ecke umsetzen: Rechteck (a&nbsp;+&nbsp;c) · h. Ein Trapez ist die Hälfte.']]; },
  kreis: () => { const R8 = reihe(22, 6, 40, 8), R16 = reihe(10, 6, 40, 16);
    const s1 = SVG(150, 88, `${torte(75, 44, 40, 8)}<path d="M75 44 L115 44" class="f-o"/><circle cx="75" cy="44" r="2.5" class="f-punkt"/>${T(124, 48, 'r', 'start')}`, 'Kreis in 8 Stücke');
    const s2 = SVG(150, 50, `${R8.s}`, '8 Stücke abwechselnd umgelegt');
    const s3 = SVG(156, 68, `${R16.s}${T(R16.links + 2 + (R16.rechts - R16.links) / 2, 64, 'π · r')}${Lin(R16.rechts + 6, 6, R16.rechts + 6, 46, 'o')}${T(R16.rechts + 11, 31, 'r', 'start')}`, '16 Stücke: fast ein Rechteck, pi mal r breit und r hoch');
    return [[s1, 'Den Kreis in Tortenstücke schneiden: die obere Hälfte gelb.'], [s2, 'Abwechselnd umlegen. Unten liegt der halbe Umfang, oben auch.'], [s3, 'Feiner geschnitten: fast ein Rechteck – π · r breit, r hoch.']]; },
  rechteck: () => { const e = 14;
    const s1 = SVG(96, 68, `<rect x="4" y="4" width="${4 * e}" height="${3 * e}" class="f-n"/>${gitter(4, 4, 4, 3, e)}${T(4 + 2 * e, 4 + 3 * e + 16, 'a = 4')}${T(4 + 4 * e + 6, 4 + 1.5 * e + 4, 'b = 3', 'start')}`, 'Rechteck 4 mal 3 Kästchen');
    return [[s1, 'Fläche heißt: Wie viele Kästchen passen hinein? Eine Reihe hat a Kästchen, es gibt b Reihen: 4 · 3 = 12.']]; },

function formel(text) {
  const [l, ...r] = String(text).split(' = '); if (!r.length || !/ [·+−:] /.test(r.join(' = '))) return text;
  const gruppen = [], toks = r.join(' = ').split(' '); let g = '', tiefe = 0;
  for (const tk of toks) { const op = /^[·+−:=<>≤≥-]$/.test(tk);
    if (g && op && (g + ' ' + tk).length > (tiefe ? 12 : 8)) { gruppen.push(g); g = tk; } else g = g ? g + ' ' + tk : tk;
    tiefe += (tk.match(/\(/g) || []).length - (tk.match(/\)/g) || []).length; }
  if (g) gruppen.push(g);
  return [l + ' = ' + gruppen[0], ...gruppen.slice(1)].map((x) => `<span class="ru-tafel-fg">${x}</span>`).join(' ');
}
