<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Was wackelt – Entwurf 4 (Designer)</title>
<style>
/* Entwurf 3 im Stil des Lehrerbereichs der App: Farben aus style.css, body[data-area="lernen"] (Zeile 315 ff. und 3583),
   Ampelflächen aus .lern-ampel. Systemschrift wie --font-ui. Dunkel: Werte aus :root (prefers-color-scheme: dark), Akzent grün. */
*, *::before, *::after { box-sizing: border-box; }
html, body { margin: 0; }
html { scroll-behavior: smooth; scroll-padding-top: 16px; }
body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif; font-size: 15px; line-height: 1.5; background: var(--bg); color: var(--text); -webkit-text-size-adjust: 100%; }
body[data-g="hell"] { color-scheme: light; --bg: #f6f4ec; --surface: #fffefa; --surface-muted: #eeeae0; --text: #22372e; --muted: #5c6a61; --accent: #254d3e; --accent-soft: #e5ede4;
  --border: #e4e4d9; --ok: #25663a; --ok-bg: #e7f4eb; --ok-bar: #b9dfc6; --err: #a72e37; --err-bg: #fbe9eb; --err-bar: #d9737b; --info: #275d98; --info-bg: #e8f1fc;
  --warn: #855e41; --warn-bg: #faf0e3; --shadow: 0 12px 40px rgb(30 57 43 / 4.5%); --papier: #fffefa; }
body[data-g="nacht"] { color-scheme: dark; --bg: #101721; --surface: #192330; --surface-muted: #223040; --text: #f1f5f9; --muted: #b3bfcd; --accent: #62d8c4; --accent-soft: #203e3c;
  --border: #354255; --ok: #8ed4a4; --ok-bg: #233b30; --ok-bar: #2f6046; --err: #ffa4ac; --err-bg: #452b32; --err-bar: #c25a63; --info: #9fc8fa; --info-bg: #26384f;
  --warn: #f3cb75; --warn-bg: #3d3220; --shadow: none; --papier: #192330; }
button, input { font: inherit; color: inherit; }
button { cursor: pointer; }
a { color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 6px; }
h1, h2, h3, h4, p { margin: 0; }
.muted { color: var(--muted); }
.num { font-variant-numeric: tabular-nums; }

/* App-Kopf wie im Lehrerbereich */
.app-kopf { border-bottom: 1px solid var(--border); }
.app-kopf div { max-width: 1240px; margin: 0 auto; padding: 18px 24px; display: flex; align-items: center; justify-content: space-between; }
.marke { font-size: 22px; font-weight: 700; color: var(--accent); letter-spacing: -.01em; }
.leise-knopf { border: 1px solid var(--border); background: var(--surface); border-radius: 11px; padding: 6px 12px; font-size: 13px; color: var(--text); }
main { max-width: 1240px; margin: 0 auto; padding: 18px 24px 80px; }

/* Kind-Seite: Umschalter, Reiter, Zeitraum */
.kind-kopf { display: flex; flex-wrap: wrap; align-items: center; gap: 12px 20px; }
.seg { display: inline-flex; background: var(--surface-muted); border-radius: 11px; padding: 3px; gap: 2px; }
.seg button { border: 0; background: none; border-radius: 9px; min-height: 34px; padding: 0 14px; color: var(--muted); font-weight: 600; font-size: 14px; white-space: nowrap; }
.seg button small { font-weight: 500; margin-left: 4px; }
.seg button[aria-pressed="true"] { background: var(--surface); color: var(--text); box-shadow: 0 1px 3px rgb(30 57 43 / 12%); }
.reiter { display: flex; gap: 22px; flex: 1; }
.reiter a { text-decoration: none; color: var(--muted); font-weight: 600; padding: 8px 0; border-bottom: 2px solid transparent; }
.reiter a[aria-current] { color: var(--accent); border-bottom-color: var(--accent); }
.seiten-titel { display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 12px; margin: 26px 0 0; }
.seiten-titel h1 { font-size: 24px; color: var(--accent); }
.link-leise { font-size: 14px; color: var(--muted); background: none; border: 0; text-decoration: underline; text-underline-offset: 3px; padding: 4px 0; }

/* Drei Teile */
.teil { margin-top: 34px; }
.teil + .teil { padding-top: 30px; border-top: 1px solid var(--border); }
.teil-kopf { display: flex; align-items: baseline; gap: 10px; margin-bottom: 14px; }
.teil-kopf h2 { font-size: 18px; color: var(--accent); }
.teil-kopf span { color: var(--muted); font-size: 14px; }
.karte { background: var(--surface); border: 1px solid var(--border); border-radius: 19px; box-shadow: var(--shadow); }

/* 1 Auswertung: Kacheln */
.kacheln { display: grid; grid-template-columns: 1.45fr 1fr 1.15fr .7fr; gap: 14px; }
.kachel { padding: 16px 18px 18px; display: flex; flex-direction: column; gap: 10px; min-width: 0; }
.kachel h3 { font-size: 14px; font-weight: 600; color: var(--muted); }
.balken { display: grid; gap: 7px; }
.balken button { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 2px 10px; align-items: center; border: 0; background: none; padding: 3px 4px; margin: 0 -4px; border-radius: 8px; text-align: left; }
.balken button:hover { background: var(--surface-muted); }
.balken .name { font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.balken .wert { font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums; }
.balken .spur { grid-column: 1 / -1; height: 8px; border-radius: 4px; background: var(--ok-bar); overflow: hidden; display: flex; }
.balken .spur i { display: block; height: 100%; background: var(--err-bar); }
.legende { display: flex; gap: 14px; font-size: 12.5px; color: var(--muted); margin-top: auto; }
.legende i { display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-right: 5px; vertical-align: -1px; }
.tage { display: grid; grid-auto-flow: column; grid-auto-columns: minmax(0, 1fr); gap: 6px; align-items: end; height: 150px; }
.tag { display: flex; flex-direction: column; align-items: center; gap: 4px; height: 100%; justify-content: flex-end; }
.saeule { width: 100%; max-width: 22px; display: flex; flex-direction: column-reverse; border-radius: 5px; overflow: hidden; }
.saeule i { display: block; } .saeule .r { background: var(--ok-bar); } .saeule .f { background: var(--err-bar); }
.tag small { font-size: 11.5px; color: var(--muted); text-align: center; line-height: 1.25; }
.wieder { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; }
.wieder button { width: 100%; border: 0; background: var(--warn-bg); border-radius: 11px; padding: 8px 10px; text-align: left; display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 0 10px; }
.wieder button:hover { filter: brightness(.97); }
.wieder b { font-weight: 600; font-size: 14px; }
.wieder .anz { font-weight: 700; color: var(--warn); font-variant-numeric: tabular-nums; }
.wieder small { grid-column: 1 / -1; font-size: 12.5px; color: var(--muted); }
.gross-zahl { font-size: 34px; font-weight: 700; line-height: 1; color: var(--text); font-variant-numeric: tabular-nums; }
.fazit { margin-top: 14px; font-size: 15px; }
.fazit b { font-weight: 600; }

/* Aufgaben-Baustein (Teil 2 und 3) */
.bausteine { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px; }
.aufg { padding: 16px 18px 14px; display: flex; flex-direction: column; gap: 10px; min-width: 0; }
.a-ort { font-size: 13px; color: var(--muted); display: flex; justify-content: space-between; gap: 10px; }
.a-ort span:last-child { white-space: nowrap; font-variant-numeric: tabular-nums; }
.a-text { font-size: 15.5px; }
.a-zeilen { margin: 0; padding: 8px 12px 8px 30px; background: var(--surface-muted); border-radius: 11px; font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace; font-size: 13.5px; }
.a-zeilen li.gewaehlt { color: var(--err); } .a-zeilen li.richtig { color: var(--ok); font-weight: 600; }
.vgl { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.vgl div { border-radius: 11px; padding: 6px 12px 7px; }
.vgl .ein { background: var(--err-bg); } .vgl .ok { background: var(--ok-bg); }
.vgl small { display: block; font-size: 12.5px; color: var(--muted); }
.vgl b { font-size: 17px; font-weight: 600; font-variant-numeric: tabular-nums; }
.vgl .ein b { color: var(--err); } .vgl .ok b { color: var(--ok); }
.a-art { font-size: 14px; color: var(--muted); }
.a-art b { color: var(--text); font-weight: 600; }
.a-art .gut { color: var(--ok); }
details.weg summary { cursor: pointer; font-size: 14px; color: var(--muted); list-style: none; }
details.weg summary::-webkit-details-marker { display: none; }
details.weg summary::before { content: "▸ "; } details.weg[open] summary::before { content: "▾ "; }
details.weg p { margin-top: 6px; font-size: 14.5px; }
.aktionen { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-top: 2px; }
.knopf { min-height: 36px; border: 1px solid var(--border); background: var(--surface); border-radius: 11px; padding: 0 14px; font-weight: 600; font-size: 14px; color: var(--text); white-space: nowrap; }
.knopf:hover { border-color: var(--muted); }
.knopf.haken::before { content: "✓ "; color: var(--ok); }
.knopf.nach { color: var(--accent); }
.hinweis { font-size: 13.5px; color: var(--info); background: var(--info-bg); border-radius: 11px; padding: 6px 10px; }
.zeichnung { display: block; width: 210px; height: auto; color: var(--text); }
table.tab { border-collapse: collapse; font-size: 13.5px; font-variant-numeric: tabular-nums; }
table.tab th, table.tab td { border-bottom: 1px solid var(--border); padding: 3px 16px 3px 0; text-align: left; }
table.tab th { color: var(--muted); font-weight: 600; }
table.tab td.z { text-align: right; }

/* 3 Nach Themen */
.themen { display: grid; gap: 22px; }
.thema { padding: 0; }
.thema + .thema { padding-top: 22px; border-top: 1px solid var(--border); }
.thema > h3 { font-size: 17px; display: flex; gap: 10px; align-items: baseline; }
.thema > h3 span { font-size: 14px; color: var(--muted); font-weight: 500; }
.lk { margin-top: 16px; }
.lk-kopf { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 14px; padding-bottom: 10px; border-bottom: 1px solid var(--border); margin-bottom: 12px; }
.lk-kopf h4 { font-size: 15px; font-weight: 600; flex: 1; min-width: 180px; }
.lk-kopf h4 span { color: var(--muted); font-weight: 500; }

.leer-satz { font-size: 16px; padding: 18px 20px; }
.leer-satz b { color: var(--ok); }
.erledigt { margin-top: 14px; padding: 12px 18px; }
.erledigt li { display: flex; justify-content: space-between; gap: 10px; padding: 6px 0; border-bottom: 1px solid var(--border); font-size: 14px; }
.erledigt ul { list-style: none; margin: 0; padding: 0; }
.toast { position: fixed; left: 50%; bottom: 22px; transform: translateX(-50%); background: var(--accent); color: var(--surface); border-radius: 12px; padding: 8px 8px 8px 16px; display: flex; gap: 12px; align-items: center; font-size: 14px; z-index: 30; box-shadow: 0 8px 24px rgb(0 0 0 / 18%); }
.toast button { background: none; border: 0; color: inherit; font-weight: 700; text-decoration: underline; padding: 4px 8px; }

@media (max-width: 1100px) { .kacheln { grid-template-columns: 1fr 1fr; } }
@media (max-width: 760px) {
  .app-kopf div, main { padding-left: 14px; padding-right: 14px; }
  .kacheln, .bausteine { grid-template-columns: minmax(0, 1fr); }
  .reiter { order: 3; flex-basis: 100%; }
  .kind-kopf .zeit { order: 4; }
  .aufg { padding: 14px; }
  .seiten-titel h1 { font-size: 21px; }
}

/* Entwurf 4: Fehler als schlanke Tabelle */
.tabelle { padding: 2px 0 4px; overflow: hidden; }
.themen.tabelle { display: block; } .themen .thema + .thema { padding-top: 0; }
.fz { display: grid; grid-template-columns: 52px minmax(0, 1fr) 118px 118px 200px 76px; column-gap: 14px; align-items: center; min-height: 44px; padding: 0 16px; border-top: 1px solid var(--border); }
.fz.mit-ort { grid-template-columns: 52px 300px minmax(0, 1fr) 96px 96px 176px 76px; }
.fz.kopfz { min-height: 34px; border-top: 0; font-size: 12.5px; color: var(--muted); font-weight: 600; }
.thema .fz.kopfz { border-top: 1px solid var(--border); }
.fz:not(.kopfz):hover { background: color-mix(in srgb, var(--surface-muted) 45%, transparent); }
.z-dat { color: var(--muted); font-size: 13.5px; }
.z-ort { color: var(--muted); font-size: 13.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.z-aufg { border: 0; background: none; padding: 0; text-align: left; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; font-size: 14.5px; }
.pf { display: inline-block; width: 14px; color: var(--muted); font-size: 11px; }
.z-ein, .z-ok { font-size: 14.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-variant-numeric: tabular-nums; }
.z-ein { color: var(--err); } .z-ok { color: var(--ok); }
.z-art { font-size: 13.5px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.z-art .gut { color: var(--ok); }
.z-akt, .z-akt-kopf { display: flex; justify-content: flex-end; gap: 6px; align-items: center; }
.sym { width: 32px; height: 32px; border: 1px solid var(--border); background: var(--surface); border-radius: 9px; color: var(--muted); display: grid; place-items: center; padding: 0; }
.sym svg, .nach-hinweis svg { width: 17px; height: 17px; }
.sym:hover { color: var(--accent); border-color: var(--muted); }
.sym[data-haken]:hover { color: var(--ok); }
.nach-hinweis { display: inline-flex; align-items: center; gap: 3px; color: var(--info); font-size: 12.5px; white-space: nowrap; }
.fz-mehr { padding: 2px 16px 14px 82px; display: grid; gap: 6px; font-size: 14.5px; border-top: 0; }
.fz.auf { background: color-mix(in srgb, var(--surface-muted) 45%, transparent); }
.fz.auf + .fz-mehr { background: color-mix(in srgb, var(--surface-muted) 45%, transparent); }
.fz-mehr .a-zeilen { max-width: 360px; }
.thema { border-top: 1px solid var(--border); }
.thema:first-child { border-top: 0; }
.th-kopf { display: flex; align-items: center; gap: 12px; padding: 6px 16px; min-height: 52px; }
.th-titel { flex: 1; min-width: 0; display: flex; align-items: center; gap: 10px; border: 0; background: none; padding: 0; text-align: left; }
.th-titel b { font-size: 15.5px; color: var(--accent); white-space: nowrap; }
.zaehler { font-size: 12.5px; font-weight: 700; background: var(--surface-muted); border-radius: 999px; padding: 1px 8px; color: var(--text); font-variant-numeric: tabular-nums; }
.th-arten { color: var(--muted); font-size: 13.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
.th-akt { display: flex; gap: 6px; flex: none; }
.knopf-klein { border: 1px solid var(--border); background: var(--surface); border-radius: 9px; min-height: 30px; padding: 0 10px; font-size: 13px; font-weight: 600; color: var(--muted); }
.knopf-klein:hover { color: var(--text); border-color: var(--muted); }
.lk-zeile { display: flex; gap: 8px; align-items: center; padding: 10px 16px 6px 82px; font-size: 14px; font-weight: 600; border-top: 1px solid var(--border); }
@media (max-width: 760px) {
  .fz, .fz.mit-ort { grid-template-columns: auto auto minmax(0, 1fr) auto; grid-template-areas: "aufg aufg aufg aufg" "ein ok dat akt"; row-gap: 4px; column-gap: 10px; padding: 9px 12px; min-height: 0; }
  .fz.kopfz, .z-ort, .z-art { display: none; }
  .z-aufg { grid-area: aufg; } .z-ein { grid-area: ein; } .z-ok { grid-area: ok; } .z-dat { grid-area: dat; } .z-akt { grid-area: akt; }
  .z-ok::before { content: "→ "; color: var(--muted); }
  .z-ein, .z-ok { max-width: 110px; }
  .fz-mehr { padding: 0 12px 12px 26px; }
  .lk-zeile { padding-left: 12px; }
  .th-kopf { flex-wrap: wrap; padding: 8px 12px; gap: 6px 10px; }
  .th-arten { display: none; }
  .th-titel { flex: 1 1 100%; } .th-akt { margin-left: 24px; }
  .tage { height: 120px; }
  .nach-hinweis span { display: none; }
}
</style>
</head>

<main id="main"></main>

  else { const teile = []; if (top) teile.push(`Am meisten hakt es bei <b>${esc((FB_NAME[top[0]] || [top[0], top[0]])[1])}</b> (${top[1].n}×)`);
    if (themaTop) teile.push(`${top ? 'dann bei' : 'Am meisten hakt es bei'} <b>${esc(themaTop[0])}</b> (${themaTop[1].f} falsch)`);
    fazit = teile.join(', ') + (ausr.length ? `; ${esc([...new Set(ausr)].join(' und '))} ${ausr.length === 1 ? 'war ein Ausrutscher' : 'waren Ausrutscher'}.` : '.'); }
  const id = (t) => 'thema-' + t.replace(/\W+/g, '-');
  return `<section class="teil" id="auswertung" aria-label="Auswertung"><div class="teil-kopf"><h2>Auswertung</h2><span>${ZEIT[S.zeit][0] === 'Alles' ? 'gesamt' : 'letzte ' + ZEIT[S.zeit][0]}</span></div>
    <div class="kacheln">
      <div class="karte kachel"><h3>Fehler je Thema</h3><div class="balken">${themen.map(([t, v]) => `<button data-ziel="${id(t)}"${v.f ? '' : ' disabled'}><span class="name">${esc(t)}</span><span class="wert">${v.f} von ${v.n} · <b>${Math.round((v.f / v.n) * 100)} %</b></span><span class="spur"><i style="width:${(v.f / v.n) * 100}%"></i></span></button>`).join('')}</div>
        <div class="legende"><span><i style="background:var(--err-bar)"></i>offen falsch</span><span><i style="background:var(--ok-bar)"></i>richtig oder erledigt</span></div></div>
      <div class="karte kachel"><h3>Letzte Lerntage</h3><div class="tage">${tl.map(([d, v]) => `<div class="tag" title="${tag(d)}: ${v.r} richtig, ${v.f} falsch"><div class="saeule" style="height:${((v.r + v.f) / max) * 110}px"><i class="r" style="flex:${v.r}"></i><i class="f" style="flex:${v.f}"></i></div><small>${tag(d).slice(0, 2)}<br>${kurzTag(d)}</small></div>`).join('')}</div>
        <div class="legende"><span><i style="background:var(--ok-bar)"></i>richtig</span><span><i style="background:var(--err-bar)"></i>falsch</span></div></div>
      <div class="karte kachel"><h3>Kommt immer wieder</h3>${wieder.length ? `<ul class="wieder">${wieder.map(([k, v]) => `<li><button data-ziel="${id([...v.th][0])}"><b>${esc((FB_NAME[k] || [k])[0])}</b><span class="anz">${v.n}×</span><small>${esc([...v.th].join(', '))}</small></button></li>`).join('')}</ul>` : '<p class="muted">Kein Fehler kommt wieder.</p>'}</div>
      <div class="karte kachel"><h3>Nur einmal passiert</h3><p class="gross-zahl">${einmal.length}</p><p class="muted" style="font-size:13.5px">${danachRichtig.length ? `davon ${danachRichtig.length} danach richtig gelöst` : 'Fehler, die nur einmal vorkamen'}</p></div>
    </div><p class="fazit">${fazit}</p></section>`;
}

// ---------- Tabellenzeile: eine falsche Aufgabe ----------
const FB_KURZ = { 'fb.minusklammer.nur_erstes_zeichen': 'nur 1. Zeichen gedreht', 'fb.waage.zeichen_nicht_gedreht': 'Zeichen nicht gedreht',
  'fb.stellenwert.eine_stelle_daneben': 'eine Stelle daneben', 'fb.winkel.neben_statt_scheitel': 'Scheitel- statt Nebenwinkel', 'fb.rechtwinklig.ohne_quadrate': 'ohne Quadrate gerechnet',
  'fb.bruchrechnen.falscher_kehrwert': 'falscher Kehrwert', 'fb.potenz.basis_mal_hochzahl': 'Basis mal Hochzahl' };
const A_KURZ = { py2: 'Quadrate addiert statt abgezogen', py3: 'Wurzel vergessen', tb1: 'Fußball nicht abgezogen', tb2: 'addiert statt Unterschied', ah1: 'nur Teilsumme', sb1: 'Übertrag vergessen' };
const G_KURZ = { komma: 'Komma verrutscht', vorzeichen: 'Vorzeichen', gerundet: 'gerundet', vertauscht: 'vertauscht', falsche_einheit: 'Einheit' };
const artKurz = (x) => (x.fb && FB_KURZ[x.fb]) || A_KURZ[x.a] || G_KURZ[x.grund] || 'nicht erkannt';
const HAKEN_SVG = '<svg viewBox="0 0 20 20" aria-hidden="true"><path d="M4.5 10.5l3.5 3.5 7.5-8" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>';
const NACH_SVG = '<svg viewBox="0 0 20 20" aria-hidden="true"><path d="M15.5 8A6 6 0 1 0 16 12" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/><path d="M16 3.5V8h-4.5" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>';
function zeileFehler(x, L, mitOrt) {
  const a = A[x.a]; const fd = a.form === 'fehler_detektiv';
  const ein = fd ? a.optionen[x.ant].replace(/^In /, '') : x.ant; const ok = fd ? a.optionen[a.richtig].replace(/^In /, '') : a.o;
  const nach = NACH.get(x.id); const auf = S.aufRow.has(x.id); const ft = fehlerText(x);
  const spaeter = L.alle.some((y) => y.lk === x.lk && y.r && y.am > x.am);
  const zusatz = [x.anlauf === 2 ? '2. Anlauf' : '', x.tipp ? 'mit Tipp' : '', spaeter ? 'danach richtig' : ''].filter(Boolean).join(' · ');
  return `<div class="fz${mitOrt ? ' mit-ort' : ''}${auf ? ' auf' : ''}" role="row" data-id="${x.id}">
    <span class="z-dat num">${kurzTag(x.am)}</span>
    ${mitOrt ? `<span class="z-ort" title="${esc(LK[x.lk].thema)} › ${esc(LK[x.lk].name)}">${esc(LK[x.lk].thema)} › ${esc(LK[x.lk].name)}</span>` : ''}
    <button class="z-aufg" data-auf="${x.id}" aria-expanded="${auf}" title="${esc(a.text)}"><span class="pf" aria-hidden="true">${auf ? '▾' : '▸'}</span>${fd ? 'Fehler-Detektiv: ' : ''}${esc(a.text)}</button>
    <span class="z-ein num" title="eingegeben">${esc(ein)}</span>
    <span class="z-ok num" title="richtig">${esc(ok)}</span>
    <span class="z-art" title="${esc(ft || '')}${zusatz ? ' · ' + zusatz : ''}">${esc(artKurz(x))}${spaeter ? ' <span class="gut" aria-label="danach richtig">✓</span>' : ''}</span>
    <span class="z-akt">${nach ? `<span class="nach-hinweis" title="Nachüben liegt in der nächsten Übung von ${KINDER[S.kind].name} (seit ${kurzTag(nach)})">${NACH_SVG}<span>liegt bereit</span></span>`
      : `<button class="sym" data-nach="${x.id}" title="Nachüben schicken" aria-label="Nachüben schicken: ${esc(a.text)}">${NACH_SVG}</button>`}
      <button class="sym" data-haken="${x.id}" title="Abhaken" aria-label="Abhaken: ${esc(a.text)}">${HAKEN_SVG}</button></span>
  </div>
  ${auf ? `<div class="fz-mehr"><p>${esc(a.text)}</p>${a.zeilen ? `<ol class="a-zeilen">${a.zeilen.map((z, i) => `<li class="${i === x.ant ? 'gewaehlt' : ''}${i === a.richtig ? ' richtig' : ''}">${esc(z)}</li>`).join('')}</ol>` : ''}${grafik(a.grafik)}
    <p class="muted"><b>Fehler:</b> ${esc(ft || 'nicht erkannt')}${zusatz ? ' · ' + zusatz : ''}${nach ? ` · Nachüben liegt in der nächsten Übung (seit ${kurzTag(nach)})` : ''}</p>
    ${a.w ? `<p><span class="muted">Lösungsweg:</span> ${esc(a.w)}</p>` : ''}</div>` : ''}`;
}
function tabKopf(mitOrt) { return `<div class="fz kopfz${mitOrt ? ' mit-ort' : ''}" role="row"><span class="num">Datum</span>${mitOrt ? '<span>Thema › Lernkarte</span>' : ''}<span>Aufgabe</span><span>Eingegeben</span><span>Richtig</span><span>Fehlerart</span><span class="z-akt-kopf" aria-label="Aktionen"></span></div>`; }


// ---------- Seite ----------
function zeichne() {
  document.body.dataset.g = S.g;
  const k = S.kind; const L = lage(k);
  if (S.aufStart) { const x = L.offen[+S.aufStart - 1]; if (x) S.aufRow.add(x.id); S.aufStart = null; }
  const seg = (name, werte, akt) => `<span class="seg" role="group">${werte.map(([v, t, s]) => `<button data-${name}="${v}" aria-pressed="${akt === v}">${t}${s ? `<small>${s}</small>` : ''}</button>`).join('')}</span>`;
  const kopf = `<div class="kind-kopf">${seg('kind', [['1', 'Kind 1', 'Kl. 5'], ['2', 'Kind 2', 'Kl. 8']], String(k))}
    <nav class="reiter"><a href="#">Überblick</a><a href="#" aria-current="page">Was wackelt</a><a href="#">Lehrplan</a></nav>
    <span class="zeit">${seg('zeit', Object.entries(ZEIT).map(([v, [t]]) => [v, t]), S.zeit)}</span></div>
    <div class="seiten-titel"><h1>Was wackelt bei ${KINDER[k].name}</h1><button class="link-leise" data-erl>${S.erledigtAuf ? 'Erledigtes ausblenden' : 'Erledigtes ansehen'}</button></div>`;
  const erl = S.erledigtAuf ? (() => { const l = L.alle.filter((x) => !x.r && (ABGEHAKT.has(x.id) || nachueberErledigt(x, L.alle))).reverse();
    return `<div class="karte erledigt"><ul>${l.map((x) => `<li><span>${esc(A[x.a].text)} <span class="muted">· ${esc(LK[x.lk].thema)} · ${kurzTag(x.am)}</span></span>${ABGEHAKT.has(x.id) ? `<button class="link-leise" data-zurueck="${x.id}">zurückholen</button>` : '<span class="muted">nachgeübt</span>'}</li>`).join('') || '<li class="muted">Noch nichts erledigt.</li>'}</ul></div>`; })() : '';
  const letzte = L.offen.slice(0, 5);
  const teil2 = L.offen.length ? `<section class="teil" id="letzte" aria-label="Letzte Fehler"><div class="teil-kopf"><h2>Letzte Fehler</h2><span>die ${letzte.length} neuesten von ${L.offen.length} offenen</span></div>
      <div class="karte tabelle" role="table">${tabKopf(true)}${letzte.map((x) => zeileFehler(x, L, true)).join('')}</div></section>` : '';
  // Teil 3: Thema → Lernkarte → Aufgaben (neueste zuerst); Themen nach Zahl offener Fehler; offen nur das größte
  const th = {}; for (const x of L.offen) { const t = LK[x.lk].thema; (th[t] = th[t] || {}); (th[t][x.lk] = th[t][x.lk] || []).push(x); }
  const thSort = Object.entries(th).sort((a, b) => Object.values(b[1]).flat().length - Object.values(a[1]).flat().length);
  const offenThema = (t, i) => (S.themaAuf.has(t) ? S.themaAuf.get(t) : i === 0);
  const teil3 = L.offen.length ? `<section class="teil" id="themen" aria-label="Nach Themen"><div class="teil-kopf"><h2>Nach Themen</h2><span>${L.offen.length} offene Fehler in ${thSort.length} Themen</span></div>
    <div class="karte tabelle themen">${thSort.map(([t, lks], i) => { const alle = Object.values(lks).flat(); const auf = offenThema(t, i);
      const arten = [...new Set(alle.map(artKurz))];
      return `<section class="thema${auf ? ' auf' : ''}" id="thema-${t.replace(/\W+/g, '-')}">
        <div class="th-kopf"><button class="th-titel" data-thema="${esc(t)}" aria-expanded="${auf}"><span class="pf" aria-hidden="true">${auf ? '▾' : '▸'}</span><b>${esc(t)}</b><span class="zaehler">${alle.length}</span>${auf ? '' : `<span class="th-arten">${esc(arten.join(' · '))}</span>`}</button>
          <span class="th-akt"><button class="knopf-klein" data-nach-th="${esc(t)}">alle nachüben</button><button class="knopf-klein" data-haken-th="${esc(t)}">alle abhaken</button></span></div>
        ${auf ? tabKopf(false) + Object.entries(lks).map(([lk, l]) => `<div class="lk-zeile"><span>${esc(LK[lk].name)}</span><span class="zaehler">${l.length}</span></div>${l.map((x) => zeileFehler(x, L, false)).join('')}`).join('') : ''}
      </section>`; }).join('')}</div></section>` : '';
  const leer = !L.offen.length ? `<section class="teil"><p class="karte leer-satz"><b>✓</b> Alles abgearbeitet – ${KINDER[k].name} hat gerade keine offenen Fehler. Weiter so.</p></section>` : '';
  document.getElementById('main').innerHTML = kopf + erl + (L.offen.length ? '' : leer) + auswertung(L) + teil2 + teil3;
  let t = document.querySelector('.toast');
  if (S.toast) { if (!t) { t = document.createElement('div'); t.className = 'toast'; t.setAttribute('role', 'status'); document.body.append(t); } t.innerHTML = `<span>${esc(S.toast.text)}</span>${S.toast.undo ? '<button data-undo>Rückgängig</button>' : ''}`; } else t?.remove();
}
let uhr = null;
function melde(text, undo) { S.toast = { text, undo }; clearTimeout(uhr); uhr = setTimeout(() => { S.toast = null; zeichne(); }, 5000); }
document.addEventListener('click', (e) => {
  const b = e.target.closest('button, a'); if (!b) return; const d = b.dataset; const k = S.kind;
  if (b.tagName === 'A') { e.preventDefault(); return; }
  if (d.kind) S.kind = +d.kind;
  else if (d.zeit) S.zeit = d.zeit;
  else if ('erl' in d) S.erledigtAuf = !S.erledigtAuf;
  else if (d.ziel) { document.getElementById(d.ziel)?.scrollIntoView({ block: 'start' }); return; }
  else if (d.haken) { ABGEHAKT.add(d.haken); melde('Abgehakt', () => ABGEHAKT.delete(d.haken)); }
  else if (d.hakenLk) { const ids = lage(k).offen.filter((x) => x.lk === d.hakenLk).map((x) => x.id); ids.forEach((i) => ABGEHAKT.add(i)); melde(`${ids.length} abgehakt`, () => ids.forEach((i) => ABGEHAKT.delete(i))); }
  else if (d.nach) { NACH.set(d.nach, HEUTE.toISOString().slice(0, 16)); melde('Nachüben geschickt', () => NACH.delete(d.nach)); }
  else if (d.nachLk) { const ids = lage(k).offen.filter((x) => x.lk === d.nachLk && !NACH.has(x.id)).map((x) => x.id); ids.forEach((i) => NACH.set(i, HEUTE.toISOString().slice(0, 16))); melde('Nachüben geschickt', () => ids.forEach((i) => NACH.delete(i))); }
  else if (d.zurueck) ABGEHAKT.delete(d.zurueck);
  else if (d.auf) { S.aufRow.has(d.auf) ? S.aufRow.delete(d.auf) : S.aufRow.add(d.auf); }
  else if (d.thema) S.themaAuf.set(d.thema, b.getAttribute('aria-expanded') !== 'true');
  else if (d.hakenTh) { const ids = lage(k).offen.filter((x) => LK[x.lk].thema === d.hakenTh).map((x) => x.id); ids.forEach((i) => ABGEHAKT.add(i)); melde(`${ids.length} abgehakt`, () => ids.forEach((i) => ABGEHAKT.delete(i))); }
  else if (d.nachTh) { const ids = lage(k).offen.filter((x) => LK[x.lk].thema === d.nachTh && !NACH.has(x.id)).map((x) => x.id); ids.forEach((i) => NACH.set(i, HEUTE.toISOString().slice(0, 16))); melde(`Nachüben geschickt (${ids.length})`, () => ids.forEach((i) => NACH.delete(i))); }
  else if ('undo' in d) { S.toast.undo?.(); S.toast = null; }
  else return;
  zeichne();
});
zeichne();
</script>
</body>
</html>
