* { box-sizing: border-box; }
html, body { margin: 0; }
.lr { --lr-mono: "JetBrains Mono", ui-monospace, Menlo, Consolas, monospace; font-family: "Space Grotesk", system-ui, sans-serif; font-size: 18px; font-weight: 500;
  background: var(--lr-bg); color: var(--lr-text); min-height: 100vh; line-height: 1.4; }
.lr-abflug-tag { color-scheme: light; --lr-bg: #F3F1EA; --lr-flaeche: #FFFFFF; --lr-text: #11161D; --lr-leise: #4A5563; --lr-akzent: #FFD23F; --lr-akzent-tief: #C79E1C; --lr-auf-akzent: #11161D;
  --lr-gut: #0B7A4B; --lr-gut-bg: #DDF3E8; --lr-kurs: #A8410F; --lr-kurs-bg: #FFE9DC; --lr-linie: #C9C4B6; --lr-tafel: #11161D; --lr-tafel-weiss: #E9EDF2; --lr-taste: #FFFFFF;
  --z-papier: #FFFEFA; --z-karo: #C7D8E8; --z-tinte: #11161D; --z-leise: #5B6675; --z-gelb: #FFD23F; --z-gelb-fl: #FFE88A; --z-blau: #1F5FBF; --z-blau-fl: #D9E8FB; --z-rot: #B3261E;
  --rk-merk: color-mix(in srgb, #FFD23F 22%, #fff); --rk-merk-rand: color-mix(in srgb, #FFD23F 70%, #C9C4B6); --rk-falsch: #B3261E; --rk-falsch-bg: #FBE9EB; }
.lr-abflug-nacht { color-scheme: dark; --lr-bg: #0B0F14; --lr-flaeche: #151B24; --lr-text: #F2F4F7; --lr-leise: #A9B3C1; --lr-akzent: #FFD23F; --lr-akzent-tief: #C79E1C; --lr-auf-akzent: #11161D;
  --lr-gut: #45E0A0; --lr-gut-bg: #12281F; --lr-kurs: #FFAD7A; --lr-kurs-bg: #33201A; --lr-linie: #2E3947; --lr-tafel: #05080C; --lr-tafel-weiss: #E9EDF2; --lr-taste: #1D2530;
  --z-papier: #10161E; --z-karo: #243140; --z-tinte: #F2F4F7; --z-leise: #9AA6B5; --z-gelb: #FFD23F; --z-gelb-fl: #6B5714; --z-blau: #7CB7FF; --z-blau-fl: #1B3A5F; --z-rot: #FF8A8A;
  --rk-merk: color-mix(in srgb, #FFD23F 16%, #151B24); --rk-merk-rand: color-mix(in srgb, #FFD23F 55%, #2E3947); --rk-falsch: #FF8A8A; --rk-falsch-bg: #2A1A1C; }

/* Entwurfs-Streifen (nicht Teil der App) */
.ew { font: 13px/1.35 "JetBrains Mono", monospace; background: #2B2F36; color: #E9EDF2; padding: 6px 10px; display: flex; flex-wrap: wrap; gap: 4px 10px; align-items: center; }
.ew b { color: #FFD23F; font-weight: 700; } .ew a { color: #E9EDF2; } .ew a[aria-current] { color: #FFD23F; font-weight: 800; text-decoration: none; }
.ew .ew-gr { display: inline-flex; gap: 6px; flex-wrap: wrap; }
.ew-notiz { font: 13px/1.4 "JetBrains Mono", monospace; color: var(--lr-leise); border: 1.5px dashed var(--lr-linie); border-radius: 12px; padding: 8px 10px; margin: 14px 0 0; }
.ew-notiz b { color: var(--lr-text); }

/* App-Rahmen (vereinfacht nach Bild 06f/06g) */
.lr-top { display: flex; align-items: center; gap: 14px; padding: 14px 16px; border-bottom: 1px solid var(--lr-linie); }
.lr-top .lr-zurueck { width: 48px; height: 48px; border-radius: 12px; border: 1px solid var(--lr-linie); background: var(--lr-flaeche); display: grid; place-items: center; font-weight: 800; font-size: 22px; }
.lr-top b { font-size: 19px; font-weight: 600; }
.lr-seite { max-width: 1040px; margin: 0 auto; padding: 14px 16px 40px; }
.lr-spalte { max-width: 680px; margin: 0 auto; display: flex; flex-direction: column; gap: 12px; }
.lr-titelzeile { display: flex; gap: 12px; align-items: center; }
.lr-x { width: 48px; height: 48px; border-radius: 12px; border: 1px solid var(--lr-linie); background: var(--lr-flaeche); display: grid; place-items: center; font-size: 20px; flex: none; }
.lr-ueber { margin: 0; font-family: var(--lr-mono); font-size: 13px; font-weight: 700; letter-spacing: .08em; color: var(--lr-leise); text-transform: uppercase; }
.lr-tabs { display: grid; grid-template-columns: 1fr 1fr 1fr; border: 1px solid var(--lr-linie); border-radius: 999px; background: var(--lr-flaeche); padding: 4px; font-family: var(--lr-mono); font-size: 14px; font-weight: 800; letter-spacing: .06em; text-align: center; }
.lr-tabs span { padding: 10px 4px; border-radius: 999px; } .lr-tabs .an { background: var(--lr-akzent); color: var(--lr-auf-akzent); }
.lr-erkl { display: inline-flex; align-items: center; gap: 8px; font-weight: 700; text-decoration: underline; min-height: 44px; color: var(--lr-text); }
.lr-erkl i { width: 26px; height: 26px; border-radius: 50%; background: var(--lr-akzent); color: #11161D; font-style: normal; display: grid; place-items: center; font-weight: 800; }
.lr-bordkarte { background: var(--lr-flaeche); border: 1px solid var(--lr-linie); border-radius: 18px; overflow: hidden; }
.lr-bord-kopf { display: flex; justify-content: space-between; padding: 12px 16px; font-family: var(--lr-mono); font-size: 13px; letter-spacing: .08em; color: var(--lr-leise); border-bottom: 1px solid var(--lr-linie); }
.lr-frage { padding: 16px 16px 6px; font-size: 22px; font-weight: 600; line-height: 1.3; margin: 0; }
.lr-eingabe { padding: 6px 16px 16px; display: flex; justify-content: center; align-items: center; gap: 6px; flex-wrap: wrap; font-family: var(--lr-mono); font-size: 22px; font-weight: 700; }
.lr-feld { min-width: 52px; height: 52px; padding: 0 10px; border-radius: 8px; background: var(--lr-tafel); color: var(--lr-akzent); display: inline-grid; place-items: center; font-size: 24px; }
.lr-feld.gesperrt { background: #7A7F87; color: #F6E7A8; }
.lr-abflug-nacht .lr-feld.gesperrt { background: #2A313B; color: #C9B66A; }
.lr-perfo { border-top: 2px dashed var(--lr-linie); margin: 0 0 0; }
.lr-bord-fuss { padding: 12px 16px 0; }
.lr-knopf-zweit { display: inline-flex; align-items: center; justify-content: center; min-height: 48px; padding: 0 16px; border-radius: 14px; border: 2px solid var(--lr-linie); background: transparent; color: var(--lr-text); font: inherit; font-weight: 800; text-decoration: none; cursor: pointer; }
.lr-bord-fuss .lr-knopf-zweit { min-height: 44px; font-size: 16px; }
.lr-knopf { display: flex; align-items: center; justify-content: center; min-height: 60px; border-radius: 14px; background: var(--lr-akzent); color: var(--lr-auf-akzent); font: inherit; font-weight: 700; font-size: 20px; text-decoration: none; border: 0; width: 100%; }
.lr-textlink { color: var(--lr-text); font-size: 15px; font-weight: 700; text-decoration: underline; min-height: 44px; display: inline-flex; align-items: center; background: none; border: 0; padding: 0; font-family: inherit; cursor: pointer; }
.lr-aendern { border: 1.5px dashed var(--lr-leise); border-radius: 14px; padding: 18px 16px; color: var(--lr-gut); font-weight: 700; }
.lr-tasten { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
.lr-tasten span { background: var(--lr-taste); border: 1px solid var(--lr-linie); border-radius: 12px; min-height: 60px; display: grid; place-items: center; font-family: var(--lr-mono); font-size: 22px; font-weight: 700; }
.lr-tasten .pr { grid-column: span 2; background: var(--lr-akzent); color: #11161D; font-family: "Space Grotesk", sans-serif; font-size: 20px; border: 0; }
.lr-tasten .null { grid-column: span 2; }
.lr-menue { align-self: center; border: 1px solid var(--lr-linie); background: var(--lr-flaeche); border-radius: 12px; padding: 10px 16px; font-weight: 700; margin-top: 8px; }

/* Rückmeldung (vorhanden) */
.lr-rueck { border-radius: 14px; padding: 12px 14px; font-size: 16px; line-height: 1.4; }
.lr-rueck p { margin: 6px 0 0; }
.lr-rueck-falsch { background: var(--lr-kurs-bg); }
.lr-rueck-nochmal { border: 2px solid var(--lr-akzent); background: var(--lr-bg); }
.lr-rueck-ok { background: var(--lr-gut-bg); }
.lr-kursbox .lr-ueber { color: var(--lr-kurs); }
.lr-leise { color: var(--lr-leise); }
.lr-kurs { display: flex; flex-direction: column; gap: 4px; align-items: flex-end; margin: 6px 0 4px; }
.lr-kurs-zeile { display: flex; align-items: center; gap: 4px; }
.lr-kurs-name { font-family: var(--lr-mono); font-size: 13px; letter-spacing: .08em; color: var(--lr-leise); width: 46px; }
.lr-kurs-k { width: 30px; height: 40px; border-radius: 6px; background: var(--lr-tafel); color: var(--lr-tafel-weiss); font-family: var(--lr-mono); font-weight: 800; font-size: 21px; display: inline-grid; place-items: center; }
.lr-kurs-k.ab { background: #FFD23F; color: #11161D; } .lr-kurs-k.leer { background: transparent; } .lr-kurs-k.leer.ab { outline: 2px dashed #FFD23F; outline-offset: -3px; background: transparent; }
.lr-kurs-kopf .lr-kurs-k { height: 18px; background: transparent; color: var(--lr-leise); font-size: 13px; }
.lr-detektiv { margin-top: 8px; border-radius: 12px; background: color-mix(in srgb, var(--lr-akzent) 12%, var(--lr-flaeche)); padding: 10px 12px; }

/* ===== Neu: Regelkarte ===== */
.rk-status { display: flex; align-items: flex-start; gap: 10px; font-weight: 700; font-size: 17px; line-height: 1.3; }
.rk-zeichen { flex: none; width: 28px; height: 28px; border-radius: 50%; display: grid; place-items: center; font-size: 16px; font-weight: 800; }
.rk-zeichen.nochmal { border: 2px solid var(--lr-text); }
.rk-zeichen.falsch { background: var(--rk-falsch); color: var(--lr-flaeche); }
.rk-zeichen.ok { background: var(--lr-gut); color: var(--lr-flaeche); }
.rk-karte { background: var(--lr-flaeche); border: 1.5px solid var(--lr-linie); border-radius: 16px; padding: 12px 14px 6px; margin-top: 10px; }
.rk-passiert { margin: 0 0 10px; padding: 0 0 10px; border-bottom: 1.5px dashed var(--lr-linie); font-size: 17px; font-weight: 600; line-height: 1.35; }
.rk-passiert .lr-ueber { margin-bottom: 4px; color: var(--lr-kurs); }
.rk-kopf { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: baseline; gap: 8px; }
.rk-name { margin: 2px 0 0; font-size: 18px; font-weight: 700; line-height: 1.25; }
.rk-merk { margin: 8px 0 0; padding: 10px 12px; border-radius: 12px; background: var(--rk-merk); border: 1.5px solid var(--rk-merk-rand); font-size: 19px; font-weight: 700; line-height: 1.3; }
.rk-bild { margin: 10px 0 0; border: 1px solid var(--lr-linie); border-radius: 12px; background: var(--z-papier); padding: 8px 8px 6px; }
.rk-bild svg { display: block; width: 100%; height: auto; max-width: 360px; margin: 0 auto; }
.rk-bild figcaption { font-size: 14px; color: var(--lr-leise); margin-top: 4px; line-height: 1.35; }
.rk-gl { font-family: var(--lr-mono); font-size: 15px; font-weight: 600; margin: 6px 0 0; color: var(--lr-text); }
.rk b.ru-w, .rk-gl b.ru-w { background: #FFD23F; color: #11161D; border-radius: 5px; padding: 1px 4px; font-weight: 700; }
.rk b.ru-bl, .rk-gl b.ru-bl { background: var(--z-blau-fl); border-radius: 5px; padding: 1px 4px; box-shadow: inset 0 0 0 1.5px var(--z-blau); }
.rk-gewand { display: flex; align-items: center; gap: 6px; margin: 8px 0 0; font-size: 14px; color: var(--lr-leise); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-height: 24px; }
.rk-gewand b { color: var(--lr-text); font-weight: 700; }
.rk-gewand .rk-ring { flex: none; width: 16px; height: 16px; border-radius: 50%; border: 2px solid var(--lr-leise); box-shadow: inset 0 0 0 3px var(--lr-flaeche), inset 0 0 0 8px var(--lr-leise); }
.rk-gewand span.t { display: block; min-width: 0; overflow: hidden; text-overflow: ellipsis; }
.rk-gewand code { font-family: var(--lr-mono); font-size: 14px; color: var(--lr-text); }
.rk-zeile { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 14px; margin: 8px 0 4px; }
.rk-zeile .lr-knopf-zweit { min-height: 48px; }
.rk-auch { margin: 6px 0 0; font-size: 15px; color: var(--lr-leise); }
.rk-auch a { color: var(--lr-text); font-weight: 700; }
.rk-weg { margin-top: 10px; font-size: 16px; }
.rk-weg code { font-family: var(--lr-mono); font-size: 15px; }
mark.rk-m { background: #FFD23F; color: #11161D; border-radius: 4px; padding: 0 2px; }
/* kompakt */
.rk-kompakt { margin-top: 10px; border-left: 4px solid var(--lr-akzent); background: var(--lr-flaeche); border-radius: 0 12px 12px 0; padding: 8px 12px 2px; }
.rk-kompakt .rk-merk { font-size: 16px; padding: 0; background: none; border: 0; margin-top: 2px; }
.rk-kompakt .rk-passiert { font-size: 15px; padding-bottom: 6px; margin-bottom: 6px; }
.rk-kompakt .rk-zeile { margin: 2px 0 0; }

@media (min-width: 760px) {
  .rk-karte.mit-bild .rk-innen { display: grid; grid-template-columns: minmax(0, 1fr) 300px; gap: 14px; align-items: start; }
  .rk-karte.mit-bild .rk-bild { margin-top: 0; }
}
/* Vergleich „Heute“ daneben (nur Entwurf, ab 1100 px) */
.ew-vergleich { display: block; }
.ew-heute { display: none; }
@media (min-width: 1100px) {
  .ew-vergleich { display: grid; grid-template-columns: minmax(0, 640px) 360px; gap: 28px; justify-content: center; }
  .ew-vergleich .lr-spalte { margin: 0; }
  .ew-heute { display: flex; flex-direction: column; gap: 12px; opacity: .92; }
  .ew-heute .lr-frage { font-size: 18px; }
}
.ew-heute-kopf { font: 700 13px/1.3 "JetBrains Mono", monospace; letter-spacing: .06em; color: var(--lr-leise); border-bottom: 2px solid var(--lr-linie); padding-bottom: 6px; }

.lr-koffer { display: flex; gap: 4px; } .lr-koffer i { width: 22px; height: 24px; border: 2px solid var(--lr-linie); border-radius: 5px; background: var(--lr-flaeche); }
.lr-koffer i.ok { background: var(--lr-akzent); border-color: var(--lr-akzent-tief); } .lr-koffer i.nein { background: var(--lr-kurs-bg); border-color: var(--lr-kurs); }
.lr-sterne { border: 1px solid var(--lr-linie); border-radius: 999px; padding: 2px 10px; font-weight: 700; font-size: 15px; }
.lr-misch-kopf { border-radius: 12px; background: color-mix(in srgb, var(--lr-akzent) 18%, var(--lr-flaeche)); padding: 8px 12px; font-size: 15px; font-weight: 700; }

.ts-summe { background: var(--lr-flaeche); border: 1px solid var(--lr-linie); border-radius: 18px; padding: 14px 16px; }
.ts-summe .gross { font-size: 34px; font-weight: 700; } .ts-summe .gross small { font-size: 18px; font-weight: 600; }
.ts-balken { display: flex; gap: 3px; margin: 10px 0 6px; } .ts-balken i { flex: 1; height: 14px; border-radius: 3px; background: var(--lr-gut); }
.ts-balken i.f { background: transparent; border: 2px solid var(--rk-falsch); }
.ts-legende { font-size: 14px; color: var(--lr-leise); }
.ts-gruppe { background: var(--lr-flaeche); border: 1px solid var(--lr-linie); border-left: 6px solid var(--rk-falsch); border-radius: 16px; padding: 12px 14px 8px; }

details.ts-auf > summary::before { content: "▸"; font-size: 14px; } details.ts-auf[open] > summary::before { content: "▾"; }
.ts-einzel { border-top: 1px dashed var(--lr-linie); padding: 10px 0; font-size: 15px; }
.ts-einzel p { margin: 4px 0 0; } .ts-einzel .q { font-weight: 600; font-size: 16px; margin: 0; }
.ts-einzel .w { display: inline-flex; gap: 6px; align-items: baseline; font-family: var(--lr-mono); font-size: 13px; font-weight: 800; letter-spacing: .06em; }
.ts-einzel .w.f { color: var(--rk-falsch); } .ts-einzel .w.ok { color: var(--lr-gut); }
.lr-test-knoepfe { display: flex; flex-direction: column; gap: 10px; }

.ts-zusatz { font: 700 13px/1.3 "JetBrains Mono", monospace; letter-spacing: .06em; color: #11161D; background: #FFD23F; border-radius: 6px; padding: 3px 8px; align-self: flex-start; }

.ru-kopfzeile { display: flex; gap: 10px; align-items: center; padding: 12px 16px; }
.ru-suche { flex: 1; min-height: 48px; border: 1px solid var(--lr-linie); border-radius: 14px; background: var(--lr-flaeche); display: flex; align-items: center; padding: 0 12px; color: var(--lr-leise); }

.ru-klassen li.hier { border: 2px solid var(--lr-text); }
