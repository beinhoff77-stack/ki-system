<!DOCTYPE html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Entwurf: Drei Karten für die Kinderseite</title>
<style>
:root{--f:'Avenir Next','Segoe UI',system-ui,sans-serif;--bg:#F6F3EC;--karte:#fff;--tx:#1E2A26;--leise:#6B726E;--linie:#E2DCCD;--knopf:#FFD23F;--dran:#1F5FA8;--dranbg:#DCEAFB;--plan:#C99600;--planbg:#FFF4CF;--gesch:#3E8E4E;--geschbg:#E3F1DF;--nb:#C8642B;--nbbg:#FFF1E6;--nbR:#F0B48C;--zus:#8A6A3A;--zusbg:#F6EFE2;--stern:#E0A100;--polar:#0A2540;--eis:#7FE3F0}
*{box-sizing:border-box}body{margin:0;font-family:var(--f);background:#E4E0D6;color:var(--tx)}
.steuer{position:sticky;top:0;z-index:9;background:#fff;border-bottom:1px solid #DDD6C6;padding:10px 14px;display:flex;flex-wrap:wrap;gap:10px;align-items:center;font-size:13px}
.seg{display:inline-flex;background:#F1EEE6;border-radius:10px;padding:3px}.seg button{border:0;background:none;padding:6px 10px;border-radius:8px;font:inherit;font-weight:650;color:#4A5550;cursor:pointer}.seg button.an{background:#fff;color:#1E2A26;box-shadow:0 1px 3px #0002}
.steuer b{font-size:11px;letter-spacing:.06em;color:#6B726E}
#buehne{display:flex;justify-content:center;padding:18px}
.geraet{background:var(--bg);width:400px;min-height:860px;border-radius:26px;box-shadow:0 10px 40px #0003;overflow:hidden;position:relative}
.geraet.tab{width:820px;border-radius:18px}
.kopf{display:flex;align-items:center;gap:10px;padding:14px 16px 6px}.kopf h1{margin:0;font-size:19px;font-weight:800}.kopf .st{margin-left:auto;font-weight:800;font-size:14px;background:var(--karte);border:1px solid var(--linie);border-radius:999px;padding:5px 11px;color:var(--stern)}
.inhalt{padding:8px 14px 20px;display:grid;gap:12px}
.tab .inhalt{grid-template-columns:1fr 1fr;align-items:start;padding:10px 20px 24px}.tab .breit{grid-column:1/-1}
.k{background:var(--karte);border:1px solid var(--linie);border-radius:18px;padding:14px 16px;display:grid;gap:8px}
.ober{font-size:11px;font-weight:850;letter-spacing:.09em;color:var(--leise);display:flex;align-items:center;gap:7px}
.titel{font-size:19px;font-weight:850;line-height:1.2}.unter{font-size:13px;color:var(--leise)}
.knopf{border:0;border-radius:14px;background:var(--knopf);color:#1E2A26;font:inherit;font-size:16.5px;font-weight:800;padding:13px 16px;display:flex;justify-content:space-between;align-items:center;cursor:pointer;box-shadow:0 3px 0 #C9A21C;width:100%;text-align:left}
.knopf small{display:block;font-size:11.5px;font-weight:650;opacity:.75}
.knopf.zweit{background:var(--karte);border:1.5px solid var(--linie);box-shadow:none;font-size:15px;padding:10px 14px}
/* Nachbessern */
.nb{background:var(--nbbg);border:2px solid var(--nbR)}.nb .ober{color:var(--nb)}
.punkte{display:flex;gap:8px;align-items:center}.punkte i{width:26px;height:26px;border-radius:50%;border:2.5px solid var(--nbR);display:grid;place-items:center;font-style:normal;font-weight:900;color:#fff;font-size:13px;background:#fff}.punkte i.g{background:var(--gesch);border-color:var(--gesch)}.punkte span{font-size:13px;font-weight:700;color:var(--nb);margin-left:4px}
.ruhig{font-size:12px;color:var(--leise)}
.chip{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:6px 12px;font-size:13px;font-weight:750;background:var(--polar);color:var(--eis);width:max-content}
.jetzt{display:flex;gap:12px;align-items:center}.jetzt .fl{width:42px;height:42px;border-radius:12px;background:var(--dranbg);display:grid;place-items:center;font-size:20px;flex:none}
.balken{display:flex;gap:3px}.balken i{flex:1;height:6px;border-radius:3px;background:var(--linie)}.balken i.g{background:var(--dran)}
/* Zusatz */
.zus{border:1.5px dashed #CDB894;background:var(--zusbg)}.zus .ober{color:var(--zus)}
.marke{display:inline-block;font-size:10.5px;font-weight:850;letter-spacing:.06em;border-radius:6px;padding:2px 7px;background:#EADFC9;color:var(--zus)}
.etp{display:flex;gap:5px}.etp i{flex:1;height:8px;border-radius:4px;background:#E7DCC6}.etp i.g{background:var(--gesch)}
/* Schuljahr */
.sj{display:grid;gap:10px}
.sjh{display:flex;gap:14px;align-items:center}
.ring{width:96px;height:96px;flex:none}.ring text{font-family:var(--f)}
.gross{font-size:30px;font-weight:900;line-height:1}.zahlen{font-size:14px;line-height:1.45}.zahlen b{font-size:17px}
.ziel{background:var(--dranbg);color:#123B6B;border-radius:12px;padding:8px 11px;font-size:13px;font-weight:700}
.nbr{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center;font-size:13px;padding:6px 0;border-top:1px solid var(--linie)}
.nbr .bal{height:8px;border-radius:4px;background:#EAE5D9;overflow:hidden}.nbr .bal i{display:block;height:100%;background:var(--gesch)}
.kb{font-size:11.5px;font-weight:850;border-radius:7px;padding:3px 8px;color:#fff}
/* Overlays */
.voll{position:absolute;inset:0;z-index:5;display:flex;flex-direction:column}
.szene{flex:1;display:grid;place-items:center;text-align:center;padding:30px;gap:8px}
.blatt{background:var(--karte);border-radius:22px 22px 0 0;padding:18px 18px 26px;display:grid;gap:12px;box-shadow:0 -8px 30px #0002}
.stempel{width:120px;height:120px;border-radius:50%;border:5px solid;display:grid;place-items:center;text-align:center;font-weight:900;transform:rotate(-10deg);margin:auto}
/* Lehrer */
.lw{font-size:13px}.lw .fp{border-radius:12px;padding:9px 11px;display:flex;gap:9px;align-items:center;border:1px solid}.lw .nr{width:22px;height:22px;border-radius:50%;display:grid;place-items:center;color:#fff;font-weight:850;font-size:11.5px;flex:none}
.lk{border-radius:12px;padding:9px 10px;border:1.5px solid;display:grid;gap:3px;position:relative;width:170px}.lk .pl{position:absolute;right:-7px;top:-7px;width:22px;height:22px;border-radius:50%;display:grid;place-items:center;color:#fff;font-weight:850;font-size:11px}
.hin{font-size:12px;color:var(--leise);background:#FAF8F3;border:1px dashed var(--linie);border-radius:10px;padding:8px 10px}
table.st{border-collapse:collapse;width:100%;font-size:13px}table.st td{padding:6px 4px;border-top:1px solid var(--linie)}table.st td.r{text-align:right;font-variant-numeric:tabular-nums}
.info{border:1px solid var(--linie);background:#FAF8F3;border-radius:10px;padding:9px 11px;font-size:12px;color:#4A5550}
.unt{font-size:11px;color:var(--leise);text-align:center;padding:6px}
svg.mini{width:100%;height:auto;border-radius:14px;display:block}
</style></head><body>
