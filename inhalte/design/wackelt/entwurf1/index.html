<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Was wackelt – Entwurf 1 (Designer)</title>
<style>
/* Grundfarben = Gestaltung „Abflug hell / dunkel“ (wie inhalte/design/gesetzbuch/entwurf/teile/grund.css). Neu nur: --gruen, --art-*. */
*, *::before, *::after { box-sizing: border-box; }
html, body { margin: 0; }
:root { --mono: "JetBrains Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace; --grotesk: "Space Grotesk", system-ui, -apple-system, "Segoe UI", sans-serif; }
body { font-family: var(--grotesk); font-size: 17px; font-weight: 500; line-height: 1.4; background: var(--bg); color: var(--text); -webkit-text-size-adjust: 100%; }
body[data-g="hell"] { color-scheme: light; --bg: #F3F1EA; --flaeche: #FFFFFF; --flaeche2: #F6F4EE; --text: #11161D; --leise: #4A5563; --linie: #C9C4B6;
  --akzent: #FFD23F; --gelb-fl: #FFF3C4; --gelb-rand: #E3B600; --blau: #1F5FBF; --blau-fl: #D9E8FB; --rot: #B3261E; --rot-fl: #FFF0EE; --rot-text: #7A1712;
  --gruen: #1E7A46; --gruen-fl: #E3F4E9; --schatten: 0 12px 34px rgba(17, 22, 29, .16); --papier: #FFFEFA; --karo: #C7D8E8; }
body[data-g="nacht"] { color-scheme: dark; --bg: #0B0F14; --flaeche: #151B24; --flaeche2: #1D2530; --text: #F2F4F7; --leise: #A9B3C1; --linie: #2E3947;
  --akzent: #FFD23F; --gelb-fl: #3A3212; --gelb-rand: #C79E1C; --blau: #7CB7FF; --blau-fl: #1B3A5F; --rot: #FF8A8A; --rot-fl: #2A1A1C; --rot-text: #FFC9C9;
  --gruen: #7ED6A0; --gruen-fl: #13301F; --schatten: 0 14px 40px rgba(0, 0, 0, .5); --papier: #10161E; --karo: #243140; }
button, input, textarea { font: inherit; color: inherit; } button { cursor: pointer; -webkit-tap-highlight-color: transparent; }
a { color: inherit; }
:focus-visible { outline: 3px solid var(--text); outline-offset: 2px; border-radius: 6px; }
h1, h2, h3, h4, p { margin: 0; }
.ueber { font-family: var(--mono); font-size: 13px; letter-spacing: .08em; text-transform: uppercase; color: var(--leise); font-weight: 600; }
.leise { color: var(--leise); }
.mono, .re { font-family: var(--mono); font-weight: 600; }
.re { white-space: nowrap; }

/* ---------- Kopf der Kind-Seite (wie die App: ‹ · Kinder · ⋯, darunter die Reiter) ---------- */
.kopf { position: sticky; top: 0; z-index: 20; background: var(--bg); border-bottom: 1px solid var(--linie); }
.kopf-zeile { max-width: 1240px; margin: 0 auto; padding: 8px 12px 0; display: flex; align-items: center; gap: 8px; min-height: 56px; }
.k-zurueck, .k-mehr { width: 44px; height: 44px; border-radius: 12px; border: 1.5px solid var(--linie); background: var(--flaeche); font-size: 22px; font-weight: 700; display: grid; place-items: center; flex: none; }
.kinder { flex: 1; display: flex; gap: 4px; padding: 4px; background: var(--flaeche2); border: 1.5px solid var(--linie); border-radius: 14px; min-width: 0; }
.kinder button { flex: 1; min-height: 40px; border: 0; border-radius: 10px; background: none; font-weight: 700; font-size: 16px; color: var(--leise); white-space: nowrap; padding: 0 8px; }
.kinder button small { font-weight: 600; font-size: 13px; margin-left: 4px; }
.kinder button[aria-current] { background: var(--text); color: var(--bg); }
.reiter { max-width: 1240px; margin: 0 auto; padding: 4px 12px 0; display: flex; gap: 2px; }
.reiter a { text-decoration: none; padding: 10px 12px 11px; font-weight: 700; font-size: 16px; color: var(--leise); border-bottom: 3px solid transparent; display: inline-flex; align-items: center; gap: 6px; white-space: nowrap; }
.reiter a[aria-current] { color: var(--text); border-bottom-color: var(--text); }
.zb { min-width: 24px; height: 24px; border-radius: 12px; background: var(--rot); color: var(--bg); font-size: 14px; font-weight: 700; display: inline-grid; place-items: center; padding: 0 7px; font-family: var(--mono); }
.zb.null { background: var(--linie); color: var(--leise); }

/* ---------- Seite ---------- */
main { max-width: 1240px; margin: 0 auto; padding: 12px 12px 110px; }
.steuer { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-bottom: 12px; }
.zeitraum { flex: 1 1 320px; display: grid; grid-template-columns: 1.25fr 1fr 1fr; gap: 4px; padding: 4px; background: var(--flaeche2); border: 1.5px solid var(--linie); border-radius: 14px; }
.zeitraum button { min-height: 44px; border: 0; border-radius: 10px; background: none; font-weight: 700; font-size: 15px; color: var(--leise); line-height: 1.1; padding: 2px 4px; }
.zeitraum button small { display: block; font-size: 12px; font-weight: 600; font-family: var(--mono); }
.zeitraum button[aria-pressed="true"] { background: var(--text); color: var(--bg); }
.knopf { min-height: 44px; border-radius: 12px; border: 1.5px solid var(--text); background: var(--flaeche); font-weight: 700; font-size: 16px; padding: 0 14px; display: inline-flex; align-items: center; gap: 6px; text-decoration: none; }
.knopf.voll { background: var(--text); color: var(--bg); }
.knopf.leise { border-color: var(--linie); }
.knopf.klein { min-height: 36px; font-size: 14px; padding: 0 10px; border-radius: 10px; }
.steuer .knopf { flex: none; }

/* Voranalyse */
.vor { background: var(--flaeche); border: 1.5px solid var(--linie); border-radius: 18px; padding: 14px 14px 12px; }
.vor h1 { font-size: 22px; line-height: 1.25; font-weight: 700; margin: 4px 0 6px; }
.vor .zahlen { display: flex; flex-wrap: wrap; gap: 4px 14px; font-size: 15px; color: var(--leise); }
.vor-knoepfe { margin-top: 10px; display: flex; gap: 8px; flex-wrap: wrap; }
.vor .zahlen b { color: var(--text); font-family: var(--mono); }
.abschnitt { margin-top: 18px; }
.abschnitt > h2 { font-size: 13px; font-family: var(--mono); letter-spacing: .08em; text-transform: uppercase; color: var(--leise); font-weight: 700; margin: 0 2px 8px; display: flex; justify-content: space-between; gap: 8px; }
.abschnitt > h2 span:last-child { letter-spacing: 0; text-transform: none; font-family: var(--grotesk); font-weight: 600; }
.zuerst > h2 { color: var(--text); font-size: 15px; }
.punkte { list-style: none; margin: 0; padding: 0; display: grid; gap: 10px; }

/* Punkt */
.punkt { background: var(--flaeche); border: 1.5px solid var(--linie); border-radius: 16px; overflow: hidden; border-left: 8px solid var(--art); }
.punkt.fv { --art: var(--rot); } .punkt.lu { --art: var(--gelb-rand); } .punkt.fl { --art: var(--blau); }
.punkt.offen-auf { border-color: var(--text); border-left-color: var(--art); }
.p-kopf { width: 100%; text-align: left; background: none; border: 0; display: grid; grid-template-columns: 32px minmax(0, 1fr) 24px; gap: 10px; padding: 12px 12px 12px 10px; align-items: start; }
.p-nr { width: 32px; height: 32px; border-radius: 50%; background: var(--text); color: var(--bg); font-family: var(--mono); font-weight: 700; display: grid; place-items: center; font-size: 16px; }
.p-text { display: flex; flex-direction: column; gap: 3px; min-width: 0; }
.p-marken { display: flex; flex-wrap: wrap; gap: 4px 6px; }
.p-titel { font-size: 19px; font-weight: 700; line-height: 1.2; }
.p-ort { font-size: 14px; color: var(--leise); }
.p-grund { font-size: 16px; line-height: 1.35; }
.p-meta { font-size: 14px; color: var(--leise); font-family: var(--mono); }
.chev { width: 24px; height: 24px; color: var(--leise); transition: transform .15s; margin-top: 4px; }
.offen-auf .chev { transform: rotate(180deg); }
.marke { font-size: 13px; font-weight: 700; border-radius: 7px; padding: 2px 7px; line-height: 1.3; white-space: nowrap; border: 1.5px solid transparent; }
.m-fv { background: var(--rot-fl); color: var(--rot-text); border-color: var(--rot); }
.m-lu { background: var(--gelb-fl); color: var(--text); border-color: var(--gelb-rand); }
.m-fl { background: var(--blau-fl); color: var(--text); border-color: var(--blau); }
.m-be { border: 1.5px dashed var(--linie); color: var(--leise); }
.m-wieder { background: var(--rot); color: var(--bg); }
.m-besp { background: var(--blau-fl); border-color: var(--blau); }
.m-spaeter { border: 1.5px dashed var(--leise); color: var(--leise); }
.m-sitzt { background: var(--gruen-fl); border-color: var(--gruen); }

/* Detail eines Punkts */
.detail { padding: 0 12px 14px; display: grid; gap: 14px; }
.d-block > h3 { font-size: 13px; font-family: var(--mono); letter-spacing: .08em; text-transform: uppercase; color: var(--leise); font-weight: 700; margin: 0 0 6px; }
.einstieg { background: var(--gelb-fl); border: 1.5px solid var(--gelb-rand); border-radius: 14px; padding: 12px 14px; }
.einstieg .frage { font-size: 20px; font-weight: 700; line-height: 1.3; margin: 2px 0 6px; }
.einstieg .tipp { font-size: 15px; color: var(--leise); }
.einstieg .tipp b { color: var(--text); }
.regel { display: grid; grid-template-columns: minmax(0, 1fr); gap: 4px; border: 1.5px solid var(--linie); border-radius: 14px; padding: 10px 12px; background: var(--flaeche2); }
.regel .r-satz { font-size: 17px; font-weight: 700; }
.regel a { font-size: 15px; font-weight: 700; text-underline-offset: 3px; min-height: 32px; display: inline-flex; align-items: center; }
.aufgaben { display: grid; gap: 10px; }
.aufg { border: 1.5px solid var(--linie); border-radius: 14px; padding: 10px 12px 10px; background: var(--flaeche); }
.a-kopf { display: flex; justify-content: space-between; gap: 8px; align-items: baseline; }
.a-text { font-size: 17px; margin: 4px 0 8px; }
.a-zeilen { font-family: var(--mono); font-size: 15px; margin: 6px 0 8px; padding: 0; list-style: none; display: grid; gap: 2px; }
.a-zeilen li { padding: 3px 8px; border-radius: 6px; background: var(--flaeche2); }
.vgl { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; margin: 8px 0 6px; }
.vgl > div { border-radius: 10px; padding: 6px 10px 7px; border: 1.5px solid; min-width: 0; }
.vgl .du { background: var(--rot-fl); border-color: var(--rot); }
.vgl .ziel { background: var(--gruen-fl); border-color: var(--gruen); }
.vgl span { display: block; font-family: var(--mono); font-size: 12px; letter-spacing: .08em; text-transform: uppercase; font-weight: 700; color: var(--leise); }
.vgl b { font-family: var(--mono); font-size: 19px; overflow-wrap: anywhere; }
.optionen { list-style: none; margin: 6px 0; padding: 0; display: grid; gap: 4px; }
.optionen li { display: flex; justify-content: space-between; gap: 8px; border: 1.5px solid var(--linie); border-radius: 10px; padding: 6px 10px; font-size: 16px; }
.optionen li.gewaehlt { border-color: var(--rot); background: var(--rot-fl); }
.optionen li.richtig { border-color: var(--gruen); background: var(--gruen-fl); }
.optionen li em { font-style: normal; font-size: 13px; font-weight: 700; font-family: var(--mono); white-space: nowrap; }
.a-fehler { font-size: 16px; line-height: 1.35; padding: 6px 0 2px; }
.a-fehler b { font-weight: 700; }
.a-meta { font-size: 14px; color: var(--leise); margin-top: 4px; }
.a-meta .ok { color: var(--gruen); font-weight: 700; }
.a-weg { margin-top: 6px; border-top: 1px dashed var(--linie); }
.a-weg summary { min-height: 40px; display: flex; align-items: center; font-weight: 700; font-size: 15px; cursor: pointer; list-style: none; }
.a-weg summary::-webkit-details-marker { display: none; }
.a-weg summary::before { content: "▸"; width: 18px; }
.a-weg[open] summary::before { content: "▾"; }
.a-weg p { font-size: 16px; padding-bottom: 4px; }
table.tab { border-collapse: collapse; font-size: 15px; margin: 4px 0 6px; background: var(--papier); }
table.tab th, table.tab td { border: 1.5px solid var(--linie); padding: 4px 10px; text-align: left; }
table.tab th { background: var(--flaeche2); font-weight: 700; }
table.tab td.z { font-family: var(--mono); text-align: right; }
.zeichnung { display: block; max-width: 300px; width: 100%; height: auto; background: var(--papier); border: 1.5px solid var(--linie); border-radius: 12px; margin: 4px 0 6px; }
.nachueben { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; }
.nachueben li { border: 1.5px dashed var(--linie); border-radius: 12px; padding: 8px 10px; display: flex; flex-wrap: wrap; justify-content: space-between; gap: 4px 10px; align-items: center; }
.nachueben li span.l { font-family: var(--mono); font-weight: 700; }
.nachueben .ganz { font-size: 14px; color: var(--leise); margin-top: 6px; }

/* Zustand */
.zustand { border-top: 1.5px solid var(--linie); padding-top: 12px; display: grid; gap: 8px; }
.zustand.oben { border-top: 0; padding: 10px 12px; background: var(--blau-fl); border-radius: 14px; }
.z-zeile { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.z-text { font-size: 15px; color: var(--leise); }
.notizfeld { width: 100%; min-height: 72px; border-radius: 12px; border: 1.5px solid var(--linie); background: var(--flaeche); padding: 10px 12px; font-size: 16px; resize: vertical; }
.notiz { border-left: 4px solid var(--blau); background: var(--flaeche2); border-radius: 8px; padding: 6px 10px; font-size: 15px; }
.notiz b { font-size: 13px; font-family: var(--mono); letter-spacing: .06em; text-transform: uppercase; color: var(--leise); display: block; }
.punktreihe { display: inline-flex; gap: 4px; vertical-align: middle; }
.punktreihe i { width: 14px; height: 14px; border-radius: 50%; border: 2px solid var(--gruen); display: block; }
.punktreihe i.voll { background: var(--gruen); }
.entwurf-hilfe { font-size: 13px; color: var(--leise); font-style: italic; }

/* Listen unten */
.kurzliste { list-style: none; margin: 0; padding: 0; background: var(--flaeche); border: 1.5px solid var(--linie); border-radius: 16px; overflow: hidden; }
.kurzliste > li + li { border-top: 1px solid var(--linie); }
.kz { width: 100%; text-align: left; background: none; border: 0; padding: 10px 12px; display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 4px 10px; align-items: center; min-height: 52px; }
.kz b { font-size: 16px; } .kz small { display: block; font-size: 14px; color: var(--leise); font-weight: 500; }
.kz-innen { padding: 0 12px 12px; }
details.verlauf, details.info { background: var(--flaeche); border: 1.5px solid var(--linie); border-radius: 16px; }
details.verlauf > summary, details.info > summary { min-height: 52px; display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 6px 12px; font-weight: 700; cursor: pointer; list-style: none; }
details.verlauf > summary::-webkit-details-marker, details.info > summary::-webkit-details-marker { display: none; }
details[open] > summary .chev { transform: rotate(180deg); }
.vl { list-style: none; margin: 0; padding: 0 12px 10px; display: grid; gap: 0; }
.vl li { display: grid; grid-template-columns: 22px minmax(0, 1fr) auto; gap: 8px; padding: 9px 0; border-top: 1px solid var(--linie); align-items: start; }
.vl .h { color: var(--gruen); font-weight: 700; }
.vl b { font-size: 16px; } .vl small { display: block; font-size: 14px; color: var(--leise); }
.info-text { padding: 0 14px 14px; font-size: 15px; display: grid; gap: 8px; }
.info-text ol { margin: 0; padding-left: 20px; display: grid; gap: 4px; }

/* Leerer Zustand */
.leer { background: var(--flaeche); border: 1.5px solid var(--linie); border-radius: 18px; padding: 16px 14px; display: grid; gap: 12px; }
.leer .gross { font-size: 22px; font-weight: 700; display: flex; gap: 10px; align-items: center; }
.leer .haken { width: 40px; height: 40px; border-radius: 50%; background: var(--gruen-fl); border: 2px solid var(--gruen); color: var(--gruen); display: grid; place-items: center; font-size: 22px; flex: none; }
.leer ul { margin: 0; padding-left: 20px; display: grid; gap: 4px; font-size: 16px; }
.lob { background: var(--gelb-fl); border: 1.5px solid var(--gelb-rand); border-radius: 14px; padding: 10px 12px; }
.lob .frage { font-size: 18px; font-weight: 700; }

/* Variante B: Aufgaben zuerst */
.b-band { display: flex; gap: 6px; flex-wrap: wrap; margin: 10px 0 0; }
.b-band button { border: 1.5px solid var(--linie); background: var(--flaeche); border-radius: 999px; min-height: 40px; padding: 0 12px; font-weight: 700; font-size: 15px; display: inline-flex; gap: 6px; align-items: center; }
.b-band button[aria-pressed="true"] { background: var(--text); color: var(--bg); border-color: var(--text); }
.b-gruppe { margin-top: 16px; }
.b-top { margin: 2px 0 0; padding-left: 22px; font-size: 16px; font-weight: 600; display: grid; gap: 2px; }
.b-gruppe > h3 { font-size: 17px; font-weight: 700; margin: 0 2px 6px; display: flex; flex-wrap: wrap; gap: 4px 8px; align-items: center; }
.b-gruppe > h3 small { font-size: 14px; color: var(--leise); font-weight: 500; width: 100%; }
.b-gruppe .aufgaben { gap: 8px; }
.b-status { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }

/* Rechner: zwei Spalten in Variante A */
.spalten { display: block; }
.rechts { display: none; }
@media (min-width: 1000px) {
  main { padding: 18px 28px 80px; }
  .kopf-zeile, .reiter { padding-left: 28px; padding-right: 28px; }
  .kinder { flex: 0 1 460px; }
  body[data-v="A"] .spalten { display: grid; grid-template-columns: minmax(0, 470px) minmax(0, 1fr); gap: 22px; align-items: start; }
  body[data-v="A"] .rechts { display: block; position: sticky; top: 124px; max-height: calc(100vh - 140px); overflow: auto; background: var(--flaeche); border: 1.5px solid var(--text); border-radius: 18px; }
  body[data-v="A"] .rechts .detail { padding: 16px 18px 18px; }
  body[data-v="A"] .punkt .detail { display: none; }
  body[data-v="A"] .punkt .chev { transform: rotate(-90deg); }
  body[data-v="A"] .punkt.offen-auf { box-shadow: 0 0 0 2px var(--text); }
  .rechts .r-kopf { padding: 16px 18px 0; display: grid; gap: 4px; }
  .rechts .r-kopf h2 { font-size: 24px; line-height: 1.2; }
  .rechts .detail .aufgaben { grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); }
  body[data-v="B"] main { max-width: 900px; }
  body[data-v="A"] .zeitraum { flex: 0 1 470px; }
}

/* Toast */
.toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: 64px; z-index: 40; background: var(--text); color: var(--bg); border-radius: 14px; padding: 8px 8px 8px 14px; display: flex; gap: 10px; align-items: center; box-shadow: var(--schatten); font-size: 15px; max-width: calc(100vw - 24px); }
.toast button { background: var(--bg); color: var(--text); border: 0; border-radius: 10px; min-height: 36px; padding: 0 10px; font-weight: 700; white-space: nowrap; }

/* Gesprächszettel */
.zettel { background: var(--papier); color: var(--text); border: 1.5px solid var(--linie); border-radius: 16px; padding: 18px 18px 24px; max-width: 760px; margin: 0 auto; }
.zettel h1 { font-size: 24px; } .zettel h2 { font-size: 19px; margin-top: 18px; padding-top: 12px; border-top: 2px solid var(--text); }
.zettel p, .zettel li { font-size: 16px; }
.zettel .frage { font-size: 19px; font-weight: 700; margin: 6px 0; }
.zettel .linien { height: 84px; background: repeating-linear-gradient(to bottom, transparent 0 27px, var(--linie) 27px 28px); margin-top: 6px; }
.zettel-knoepfe { display: flex; gap: 8px; justify-content: center; margin: 0 0 12px; }
@media print {
  body { background: #fff; --bg: #fff; --papier: #fff; --text: #000; --leise: #333; --linie: #999; }
  .kopf, .entwurf, .zettel-knoepfe, .toast { display: none !important; }
  main { padding: 0; } .zettel { border: 0; padding: 0; }
}

/* Entwurfs-Schalter: gehört nicht zur App */
.entwurf { position: fixed; left: 8px; right: 8px; bottom: 8px; z-index: 30; font-family: system-ui, sans-serif; font-size: 13px; display: flex; justify-content: center; pointer-events: none; }
.entwurf div { pointer-events: auto; display: flex; flex-wrap: wrap; gap: 4px; align-items: center; background: #2b2b2b; color: #fff; border-radius: 12px; padding: 5px 6px; box-shadow: 0 6px 20px rgba(0,0,0,.3); }
.ohne-schalter .entwurf { display: none; }
.entwurf b { padding: 0 4px; font-weight: 600; opacity: .8; }
.entwurf button { background: #444; color: #fff; border: 0; border-radius: 8px; min-height: 30px; padding: 0 9px; font-size: 13px; }
.entwurf button[aria-pressed="true"] { background: #FFD23F; color: #111; font-weight: 700; }
@media (max-width: 999px) { .nur-rechner { display: none !important; } }
</style>
</head>
<body data-g="hell" data-v="A">
<header class="kopf">
  <div class="kopf-zeile">
    <button class="k-zurueck" aria-label="Zurück">‹</button>
    <nav class="kinder" aria-label="Kind wechseln" id="kinder"></nav>
    <button class="k-mehr" aria-label="Mehr">⋯</button>
  </div>
  <nav class="reiter" aria-label="Reiter" id="reiter"></nav>

  const nRichtig = an.imZeitraum.filter((x) => x.r).length;
  const kopf = `<section class="vor" aria-label="Voranalyse"><p class="ueber">Voranalyse · ${S.zeitraum === 'g' ? 'seit dem Gespräch am ' + kurzTag(letztesGespraech(kind)) : NAME_ZEITRAUM[S.zeitraum]}</p>
    <h1>${top.length ? `${top.length === 1 ? 'Ein Punkt lohnt' : (top.length === 2 ? 'Zwei Punkte lohnen' : 'Drei Punkte lohnen')} ein Gespräch${fl.length ? '. ' + (fl.length === 1 ? 'Ein Fehler war nur Flüchtigkeit' : ['', '', 'Zwei', 'Drei'][fl.length] + ' Fehler waren nur Flüchtigkeit') : ''}.` : 'Nichts zu besprechen.'}</h1>
    <p class="zahlen"><span><b>${an.imZeitraum.length}</b> Aufgaben</span><span><b>${nRichtig}</b> richtig</span><span><b>${an.imZeitraum.length - nRichtig}</b> falsch</span><span>dauert etwa <b>${Math.max(5, top.length * 5)}</b> Min.</span></p>
    ${top.length ? `<div class="vor-knoepfe"><button class="knopf klein" data-tun="zettel">Gesprächszettel drucken</button></div>` : ''}</section>`;
  if (!top.length && !wartet.length) return leer(an, kind, fl, verlauf);
  if (S.offen && ![...top, ...weitere, ...wartet, ...spaeter, ...fl, ...be].some((p) => p.key === S.offen)) S.offen = null;
  if (breit() && !S.offen && (top[0] || wartet[0])) S.offen = (top[0] || wartet[0]).key;
  const links = `${kopf}
    ${top.length ? `<section class="abschnitt zuerst"><h2><span>Das zuerst besprechen</span><span>${top.length} von ${offen.length}</span></h2><ol class="punkte">${top.map((p, i) => punktKarte(p, i + 1)).join('')}</ol></section>` : ''}
    ${wartet.length ? `<section class="abschnitt"><h2><span>Besprochen – wird nachgeübt</span><span>${wartet.length}</span></h2><ol class="punkte">${wartet.map((p) => punktKarte(p, '✓')).join('')}</ol></section>` : ''}
    ${weitere.length ? `<section class="abschnitt"><h2><span>Auch noch offen</span><span>${weitere.length}</span></h2><ol class="punkte">${weitere.map((p) => punktKarte(p, '·')).join('')}</ol></section>` : ''}
    ${fl.length || be.length ? `<section class="abschnitt"><h2><span>Nicht besprechen</span><span>${fl.length + be.length}</span></h2><ul class="kurzliste">${[...fl, ...be].map((p) => kurzZeile(p, an)).join('')}</ul></section>` : ''}
    ${spaeter.length ? `<section class="abschnitt"><h2><span>Später</span><span>${spaeter.length}</span></h2><ol class="punkte">${spaeter.map((p) => punktKarte(p, '·')).join('')}</ol></section>` : ''}
    <section class="abschnitt"><details class="verlauf"${S.verlaufAuf ? ' open' : ''}><summary><span>Verlauf · erledigt (${verlauf.length})</span>${CHEV}</summary>${verlaufListe(verlauf)}</details></section>
    <section class="abschnitt">${infoRegeln()}</section>`;
  const gew = [...top, ...wartet, ...weitere, ...spaeter].find((p) => p.key === S.offen) || top[0] || wartet[0];
  const rechts = gew ? `<div class="r-kopf">${marken(gew)}<h2>${esc(titel(gew))}</h2><p class="leise">${esc(ort(gew))}</p><p>${esc(begruendung(gew))}</p></div><div class="detail">${detail(gew)}</div>` : '';
  return `<div class="spalten"><div class="links">${links}</div><aside class="rechts" aria-label="Gewählter Punkt">${rechts}</aside></div>`;
}
function kurzZeile(p, an) {
  const x = p.fehler[0]; const auf = S.offen === p.key;
  const satz = p.art === 'fl' ? `Einmal falsch (${tag(x.am)}), danach ${p.richtigDanach}× richtig.` : `Einmal falsch (${tag(x.am)}), seitdem nicht wieder geübt – kommt in der Wiederholung.`;
  return `<li><button class="kz" data-auf="${esc(p.key)}" aria-expanded="${auf}"><span><b>${esc(LK[p.lks[0]].name)}</b><small>${esc(LK[p.lks[0]].thema)} · ${esc(satz)}</small></span><span class="marke m-${p.art}">${ART[p.art]}</span></button>
    ${auf ? `<div class="kz-innen">${aufgabeKarte(x, an.alle)}</div>` : ''}</li>`;
}
function leer(an, kind, fl, verlauf) {
  const seit = S.zeitraum === 'g' ? 'seit dem Gespräch am ' + kurzTag(letztesGespraech(kind)).slice(0, -1) : NAME_ZEITRAUM[S.zeitraum] === 'Alles' ? 'bisher' : 'in den letzten 7 Tagen';
  const gut = an.imZeitraum.filter((x) => x.r); const jeLk = {}; for (const x of gut) jeLk[x.lk] = (jeLk[x.lk] || 0) + 1;
  const best = Object.entries(jeLk).sort((a, b) => b[1] - a[1])[0];
  return `<section class="leer" aria-label="Nichts wackelt"><p class="gross"><span class="haken">✓</span>Nichts wackelt ${seit}.</p>
    <p>${an.imZeitraum.length} Aufgaben, ${gut.length} richtig.${fl.length ? ` ${fl.length === 1 ? 'Ein Fehler war' : fl.length + ' Fehler waren'} nur Flüchtigkeit – danach richtig.` : ''}</p>
    <div class="lob"><p class="ueber">Statt Fehler: einmal konkret loben</p><p class="frage">„${best && best[1] >= 2 ? `${esc(LK[best[0]].name)}: jetzt ${mal(best[1])} richtig. Erklär mir, wie du das machst.` : 'Was war diese Woche leicht, was schwer?'}“</p></div>
    <ul><li>Wieder sicher: ${verlauf.length ? verlauf.map((p) => esc(titel(p))).join(', ') : '–'}</li><li>Was als Nächstes kommt: <a href="#/kind/lehrplan">im Lehrplan ansehen ›</a></li></ul></section>
    ${fl.length ? `<section class="abschnitt"><h2><span>Nicht besprechen</span><span>${fl.length}</span></h2><ul class="kurzliste">${fl.map((p) => kurzZeile(p, an)).join('')}</ul></section>` : ''}
    <section class="abschnitt"><details class="verlauf"><summary><span>Verlauf · erledigt (${verlauf.length})</span>${CHEV}</summary>${verlaufListe(verlauf)}</details></section>`;
}

// ---------- Variante B: Aufgaben zuerst (nach Thema › Lernkarte, Voranalyse nur als Band) ----------
function seiteB(an, kind) {
  const offen = an.punkte.filter((p) => p.st === 'offen'); const top = offen.slice(0, 3);
  const band = `<section class="vor" aria-label="Voranalyse"><p class="ueber">Voranalyse · ${S.zeitraum === 'g' ? 'seit dem Gespräch am ' + kurzTag(letztesGespraech(kind)) : NAME_ZEITRAUM[S.zeitraum]}</p>
    <h1>${an.falsch.length} falsche Aufgaben in ${new Set(an.falsch.map((x) => x.lk)).size} Lernkarten.</h1>
    <p class="ueber" style="margin-top:6px">Zuerst besprechen</p><ol class="b-top">${top.map((p) => `<li>${esc(titel(p))}</li>`).join('') || '<li>–</li>'}</ol>
    <div class="b-band" role="group" aria-label="Zeigen"><button data-fb="" aria-pressed="${!S.filterB}">Alle</button>${top.map((p, i) => `<button data-fb="${esc(p.key)}" aria-pressed="${S.filterB === p.key}">${i + 1} · ${ART[p.art]}</button>`).join('')}</div></section>`;
  const punktVon = (x) => an.punkte.find((p) => p.fehler.includes(x)) || an.nebenbei.find((p) => p.fehler.includes(x));
  const gruppen = {};
  for (const x of an.falsch.slice().reverse()) { const p = punktVon(x); if (S.filterB && p?.key !== S.filterB) continue; (gruppen[x.lk] = gruppen[x.lk] || []).push(x); }
  const rang = (lk) => { const p = punktVon(gruppen[lk][0]); const i = top.indexOf(p); return i >= 0 ? i : p.art === 'fv' || p.art === 'lu' ? 5 : 9; };
  const html = Object.entries(gruppen).sort((a, b) => rang(a[0]) - rang(b[0])).map(([lk, l]) => { const p = punktVon(l[0]); const nr = top.indexOf(p);
    return `<section class="b-gruppe"><h3>${nr >= 0 ? `<span class="p-nr" style="width:26px;height:26px;font-size:14px">${nr + 1}</span>` : ''}${esc(LK[lk].name)} <span class="marke m-${p.art}">${ART[p.art]}</span>${p.wieder ? '<span class="marke m-wieder">wieder offen</span>' : ''}<small>${esc(LK[lk].thema)} · ${l.length} falsch</small></h3>
      <div class="aufgaben">${l.map((x) => aufgabeKarte(x, an.alle)).join('')}</div>
      ${p.art === 'fv' || p.art === 'lu' ? `<div class="b-status">${p.st === 'offen' ? `<button class="knopf klein voll" data-tun="notiz" data-key="${esc(p.key)}" data-b="1">✓ Besprochen …</button><button class="knopf klein leise" data-tun="spaeter" data-key="${esc(p.key)}">Später</button>` : marken(p)}</div>` : ''}</section>`; }).join('');
  return band + (html || '<p class="leer">Keine falschen Aufgaben in diesem Zeitraum.</p>') + `<section class="abschnitt">${infoRegeln()}</section>`;
}

// ---------- Gesprächszettel (Druck) ----------
function zettel(an, kind) {
  const top = an.punkte.filter((p) => p.st === 'offen').slice(0, 3);
  return `<div class="zettel-knoepfe"><button class="knopf voll" onclick="window.print()">Drucken</button><button class="knopf" data-tun="zettelzu">Schließen</button></div>
  <article class="zettel"><p class="ueber">Gesprächszettel · ${KINDER[kind].name} · ${tag(HEUTE.toISOString())}</p><h1>${top.length} Punkte, etwa ${top.length * 5} Minuten</h1>
  ${top.map((p, i) => { const r = regelVon(p); return `<h2>${i + 1}. ${esc(titel(p))}</h2><p>${esc(begruendung(p))}</p>
    <p class="frage">Fragen: „${esc(einstieg(p))}“</p>
    <p><b>Die Aufgaben:</b></p><ul>${p.fehler.slice().reverse().map((x) => { const a = A[x.a]; return `<li>${esc(a.text)}${a.zeilen ? ' (' + a.zeilen.map((z, j) => 'Z' + (j + 1) + ': ' + z).join(' · ') + ')' : ''} – Kind: <b>${esc(typeof x.ant === 'number' ? a.optionen[x.ant] : x.ant)}</b>, richtig: <b>${esc(a.o || a.optionen[a.richtig])}</b></li>`; }).join('')}</ul>
    ${r ? `<p><b>Wenn es stockt:</b> ${esc(r.satz)}</p>` : ''}
    ${nachueben(p).length ? `<p><b>Danach üben:</b> ${nachueben(p).map(([t, l]) => esc(t) + ' (' + esc(l) + ')').join(' · ')}</p>` : ''}
    <p class="leise">Notiz:</p><div class="linien"></div>`; }).join('')}</article>`;
}

// ====================================================================================================
// ZEICHNEN UND BEDIENEN
// ====================================================================================================
const breit = () => window.matchMedia('(min-width: 1000px)').matches;
function zeichne() {
  document.body.dataset.g = S.g; document.body.dataset.v = S.v;
  const kind = S.kind; const seit = seitWann(kind); const an = analyse(kind, seit);
  document.getElementById('kinder').innerHTML = [1, 2].map((k) => `<button data-kind="${k}" ${k === kind ? 'aria-current="page"' : ''}>${KINDER[k].name}<small>Kl. ${KINDER[k].kl}</small></button>`).join('');
  const zb = zuBesprechen(kind);
  document.getElementById('reiter').innerHTML = `<a href="#">Überblick</a><a href="#" aria-current="page">Was wackelt <span class="zb${zb ? '' : ' null'}" aria-label="${zb} zu besprechen">${zb}</span></a><a href="#">Lehrplan</a>`;
  const steuer = `<div class="steuer"><div class="zeitraum" role="group" aria-label="Zeitraum">${['g', 'w', 'a'].map((z) => `<button data-z="${z}" aria-pressed="${S.zeitraum === z}">${NAME_ZEITRAUM[z]}${z === 'g' ? `<small>${kurzTag(letztesGespraech(kind))}</small>` : ''}</button>`).join('')}</div>
</div>`;
  document.getElementById('main').innerHTML = S.zettel ? zettel(an, kind) : steuer + (S.v === 'A' ? seiteA(an, kind) : seiteB(an, kind));
  document.getElementById('entwurf').innerHTML = `<b>Entwurf</b>${['A', 'B'].map((v) => `<button data-v="${v}" aria-pressed="${S.v === v}">${v === 'A' ? 'A Gesprächsplan' : 'B Aufgaben zuerst'}</button>`).join('')}
    <button data-g="${S.g === 'hell' ? 'nacht' : 'hell'}">${S.g === 'hell' ? '☾ dunkel' : '☀ hell'}</button><button data-leer aria-pressed="${S.leer}">leer</button><button data-reset>↺</button>`;
  if (S.toast) { let t = document.querySelector('.toast'); if (!t) { t = document.createElement('div'); t.className = 'toast'; t.setAttribute('role', 'status'); document.body.append(t); }
    t.innerHTML = `<span>${esc(S.toast.text)}</span>${S.toast.undo ? '<button data-tun="undo">↶ Rückgängig</button>' : ''}`; } else document.querySelector('.toast')?.remove();
}
let uhr = null; let vorher = null;
function setze(kind, key, neu, text, art) {
  vorher = { kind, key, alt: STATUS[kind][key] ? { ...STATUS[kind][key] } : null };
  if (neu === null) delete STATUS[kind][key]; else STATUS[kind][key] = { art, ...STATUS[kind][key], ...neu };
  S.toast = { text, undo: true }; clearTimeout(uhr); uhr = setTimeout(() => { S.toast = null; zeichne(); }, 5000);
}
document.addEventListener('click', (e) => {
  const b = e.target.closest('button, a'); if (!b) return;
  if (b.tagName === 'A' && b.getAttribute('href')?.startsWith('#')) { e.preventDefault(); if (b.closest('.regel')) { S.toast = { text: 'Öffnet in der App: ' + b.getAttribute('href') }; clearTimeout(uhr); uhr = setTimeout(() => { S.toast = null; zeichne(); }, 2500); zeichne(); } return; }
  const d = b.dataset; const kind = S.kind;
  const an = analyse(kind, seitWann(kind)); const alleP = [...an.punkte, ...gespeicherte(kind, an)];
  const p = d.key ? alleP.find((x) => x.key === d.key) : null;
  if (d.kind) { S.kind = Number(d.kind); S.offen = null; S.filterB = null; S.notizAuf = null; }
  else if (d.z) { S.zeitraum = d.z; S.offen = null; }
  else if (d.v) { S.v = d.v; S.offen = null; }
  else if (d.g) S.g = d.g;
  else if ('leer' in d) S.leer = !S.leer;
  else if ('reset' in d) { location.hash = ''; location.reload(); return; }
  else if (d.fb !== undefined) S.filterB = d.fb || null;
  else if (d.auf) { S.offen = S.offen === d.auf && !breit() ? null : d.auf; S.notizAuf = null; }
  else if (d.tun === 'notiz') { S.notizAuf = d.key; S.offen = d.key; if (d.b) S.v = 'A'; }
  else if (d.tun === 'abbrechen') S.notizAuf = null;
  else if (d.tun === 'alle') S.alleAufg = d.key;
  else if (d.tun === 'besprochen') { const n = document.getElementById('notiz')?.value.trim() || '';
    setze(kind, d.key, { st: 'besprochen', am: HEUTE.toISOString().slice(0, 16), notiz: n }, `„${titel(p)}“: besprochen`, p.art); S.notizAuf = null; }
  else if (d.tun === 'spaeter') { setze(kind, d.key, { st: 'spaeter', am: HEUTE.toISOString().slice(0, 16) }, `„${titel(p)}“: später`, p.art); S.offen = null; }
  else if (d.tun === 'offen') { setze(kind, d.key, { st: 'offen', am: HEUTE.toISOString().slice(0, 16) }, `„${titel(p)}“: wieder offen`, p.art); S.offen = d.key; }
  else if (d.tun === 'sim') { // Entwurf: Kind löst eine Aufgabe dieser Lernkarte richtig (Zeit nach dem Gespräch)
    const n = SIM[kind].length; const lk = p.lks[0]; const a = Object.keys(A).find((k) => A[k].lk === lk);
    SIM[kind].push({ id: 'sim' + n, a, lk, r: true, am: new Date(HEUTE.getTime() + (n + 1) * 36e5).toISOString().slice(0, 16) });
    const neu = gespeicherte(kind, analyse(kind, seitWann(kind))).concat(analyse(kind, seitWann(kind)).punkte).find((x) => x.key === d.key);
    if (neu && neu.st === 'sitzt') { S.toast = { text: `„${titel(p)}“ sitzt wieder → Verlauf` }; S.offen = null; S.verlaufAuf = true; clearTimeout(uhr); uhr = setTimeout(() => { S.toast = null; zeichne(); }, 4000); }
  }
  else if (d.tun === 'undo') { if (vorher) { if (vorher.alt) STATUS[vorher.kind][vorher.key] = vorher.alt; else delete STATUS[vorher.kind][vorher.key]; } S.toast = null; }
  else if (d.tun === 'zettel') S.zettel = true;
  else if (d.tun === 'zettelzu') S.zettel = false;
  else return;
  zeichne();
  if (d.auf && S.offen && !breit()) document.querySelector(`[data-key="${CSS.escape(S.offen)}"]`)?.scrollIntoView({ block: 'start' });
});
window.addEventListener('resize', () => zeichne());
// Startzustand für Bildschirmfotos: #…&besp=<n> setzt Punkt n als besprochen (mit Notiz, 1 von 3 nachgeübt)
if (S.besp) { const an = analyse(S.kind, seitWann(S.kind)); const p = an.punkte.filter((x) => x.st === 'offen')[Number(S.besp) - 1];
  if (p) { STATUS[S.kind][p.key] = { st: 'besprochen', am: '2026-11-27T17:00', notiz: 'Hat erklärt: „Das Minus gehört nur zur ersten Zahl.“ Mit Zahlen probiert: 10 − (6 − 2) = 6, nicht 2.', art: p.art };
    const a = Object.keys(A).find((k) => A[k].lk === p.lks[0]); SIM[S.kind].push({ id: 'simb', a, lk: p.lks[0], r: true, am: '2026-11-27T18:00' }); S.offen = p.key; S.pStart = undefined; } }
zeichne();
</script>
</body>
</html>
