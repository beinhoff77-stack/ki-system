<title>Entwurf FX – Spezialeffekte</title>
<style>
:root{--bg:#F4F1EA;--karte:#fff;--text:#14213D;--leise:#5B6B82;--linie:#DCD6C8;--blau:#2563EB;--gelb:#FFD23F}
.nacht{--bg:#0F1424;--karte:#1A2136;--text:#E8EDF7;--leise:#9AA7BD;--linie:#2C3652;--blau:#7AA2FF}
*{box-sizing:border-box}body{margin:0;font:15px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--text)}
.steuer{padding:10px 12px;border-bottom:1px solid var(--linie);background:var(--karte);display:flex;flex-wrap:wrap;gap:6px 8px;align-items:center;font-size:13px}
.steuer b{font-size:12px;color:var(--leise);letter-spacing:.05em}
.steuer button,.steuer label{font:inherit;padding:5px 9px;border-radius:8px;border:1px solid var(--linie);background:var(--bg);color:var(--text);cursor:pointer}
.steuer .an{background:var(--blau);color:#fff;border-color:var(--blau)}
.haupt{display:grid;gap:14px;padding:12px;grid-template-columns:1fr}
@media(min-width:760px){.haupt{grid-template-columns:420px minmax(0,1fr);align-items:start}}
.app{position:relative;overflow:hidden;border-radius:18px;background:var(--karte);box-shadow:0 2px 14px #0002;min-height:560px;isolation:isolate}
.szene{position:relative;padding:18px 18px 70px;color:#fff;min-height:250px}
.s-direkt{background:linear-gradient(160deg,#2A1260,#1B0C3A)}.s-sauber{background:linear-gradient(180deg,#3B82F6,#1E40AF)}.s-sturm{background:linear-gradient(180deg,#221C44,#0E0B22)}
.s-flug{background:linear-gradient(170deg,#1E1B4B,#312E81 60%,#1E1B4B);text-align:center}
.oben{font-size:11px;font-weight:800;letter-spacing:.08em;opacity:.85}.titel{font-size:30px;font-weight:900;margin:6px 0 4px;line-height:1.05}
.riesig{font-size:54px;font-weight:900;line-height:1;font-variant-numeric:tabular-nums}.riesig small{display:block;font-size:12px;letter-spacing:.1em;opacity:.8}

.blatt{padding:16px 18px}.kann{border-left:4px solid var(--blau);padding:3px 10px;margin-bottom:8px}.kann b{display:block;font-size:11px;color:var(--leise)}
.knopf{display:block;width:100%;padding:13px;border-radius:12px;border:0;background:var(--gelb);color:#1B1B1B;font-weight:800;font-size:16px;margin-top:12px}

.rueck{border-radius:12px;padding:12px 14px;margin-top:10px;position:relative}
.ok{background:#DCFCE7;color:#14532D}.nacht .ok{background:#123A26;color:#BBF7D0}

.scan{position:absolute;inset:0;background:repeating-linear-gradient(0deg,#ffffff08 0 2px,transparent 2px 4px);pointer-events:none}

.zeile{font-size:15px;margin-top:10px;opacity:0;animation:ein .3s forwards}

.panel{background:var(--karte);border-radius:16px;padding:14px 16px;box-shadow:0 2px 12px #0001}

.fxk b{display:block}.fxk span{font-size:12px;color:var(--leise)}.fxk.neg{border-style:dashed}

table{border-collapse:collapse;width:100%;font-size:13px;margin-top:8px}td,th{border-bottom:1px solid var(--linie);padding:5px 4px;text-align:left;vertical-align:top}
