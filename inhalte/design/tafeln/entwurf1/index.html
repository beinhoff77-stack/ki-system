<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tafeln zum Nachschlagen – Entwurf 1 (Designer)</title>
<style>
/* Regel-Universum, Kinderansicht: Grundfarben und Schriften wie inhalte/design/gesetzbuch/entwurf/teile/grund.css (Abflug hell/dunkel),
   Gebietsfarben aus daten/regeln-universum.json (planeten[].farbe). Formeln wörtlich aus daten/regeln-universum.json → formeln. */
*, *::before, *::after { box-sizing: border-box; }
html, body { margin: 0; }
:root { --mono: "JetBrains Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace; --grotesk: "Space Grotesk", system-ui, -apple-system, "Segoe UI", sans-serif;
  --s1: #F59E00; --s2: #FFB81F; --s3: #FFD23F; --s4: #FFE68C; --fur: #5AAEFF; --geld: #B4E86A; }
body { font-family: var(--grotesk); font-size: 16px; font-weight: 500; line-height: 1.4; background: var(--bg); color: var(--text); -webkit-text-size-adjust: 100%; }
body[data-g="hell"] { color-scheme: light; --bg: #F3F1EA; --flaeche: #FFFFFF; --flaeche2: #F6F4EE; --text: #11161D; --leise: #4A5563; --linie: #C9C4B6; --papier: #FFFEFA;
  --fur-fl: #DCEBFC; --geld-fl: #E8F6D2; --tint: #EAF3FE; }
body[data-g="nacht"] { color-scheme: dark; --bg: #0B0F14; --flaeche: #151B24; --flaeche2: #1D2530; --text: #F2F4F7; --leise: #A9B3C1; --linie: #2E3947; --papier: #10161E;
  --fur-fl: #16304C; --geld-fl: #24331A; --tint: #142638; }
button, input { font: inherit; color: inherit; }
button { cursor: pointer; -webkit-tap-highlight-color: transparent; }
a { color: inherit; }
:focus-visible { outline: 3px solid var(--text); outline-offset: 2px; border-radius: 6px; }
h1, h2, h3, p { margin: 0; }
.leise { color: var(--leise); }
.ueber { font-family: var(--mono); font-size: 13px; letter-spacing: .08em; text-transform: uppercase; color: var(--leise); font-weight: 600; }

/* Kopf wie im Universum */
.kopf { position: sticky; top: 0; z-index: 10; background: var(--bg); border-bottom: 1px solid var(--linie); }
.kopf .breite { display: flex; align-items: center; gap: 10px; min-height: 60px; }
.breite { max-width: 1240px; margin: 0 auto; padding: 0 16px; }
.marke { display: inline-flex; align-items: center; gap: 10px; text-decoration: none; font-weight: 700; font-size: 17px; white-space: nowrap; }
.marke i { width: 26px; height: 26px; border-radius: 50%; background: var(--s3); box-shadow: 0 0 0 4px rgba(255, 210, 63, .28); flex: none; }
.suche { flex: 1; display: flex; justify-content: flex-end; position: relative; }
.suche input { width: 100%; max-width: 420px; height: 44px; border-radius: 12px; border: 1.5px solid var(--linie); background: var(--flaeche); padding: 0 14px 0 40px; font-size: 16px; }
.suche svg { position: absolute; right: calc(min(100%, 420px) - 32px); top: 12px; width: 20px; height: 20px; color: var(--leise); pointer-events: none; }
main { padding-top: 6px; padding-bottom: 60px; }
.schmal { max-width: 760px; margin: 0 auto; }
.pfad { display: flex; flex-wrap: wrap; gap: 0 6px; align-items: center; font-size: 16px; color: var(--leise); padding: 12px 0 2px; }
.pfad a { text-decoration: underline; text-underline-offset: 3px; min-height: 40px; display: inline-flex; align-items: center; }
.titel { font-size: 26px; font-weight: 700; line-height: 1.15; margin-top: 4px; }
.lead { font-size: 17px; color: var(--leise); margin-top: 4px; }

/* Startebene: Ausschnitt des Universums mit dem neuen Zugang */
.umschalter { display: grid; grid-template-columns: 1fr 1fr; gap: 4px; padding: 4px; margin: 12px 0 10px; background: var(--flaeche2); border: 1.5px solid var(--linie); border-radius: 14px; }
.umschalter a { min-height: 44px; display: flex; align-items: center; justify-content: center; text-decoration: none; font-weight: 700; color: var(--leise); border-radius: 10px; }
.umschalter a[aria-current] { background: var(--text); color: var(--bg); }
.station { display: grid; grid-template-columns: 48px minmax(0, 1fr) 24px; gap: 12px; align-items: center; text-decoration: none; background: var(--flaeche); border: 1.5px solid var(--text); border-radius: 16px; padding: 10px 12px; margin-bottom: 12px; }
.station:hover { background: var(--flaeche2); }
.station b { display: block; font-size: 18px; }
.station small { display: block; font-size: 15px; color: var(--leise); }
.station .pfeil { font-size: 24px; color: var(--leise); }
.chips { display: flex; gap: 6px; margin-top: 6px; flex-wrap: wrap; }
.chips span { font-family: var(--mono); font-size: 13px; font-weight: 700; border-radius: 8px; padding: 2px 7px; border: 1.5px solid var(--linie); background: var(--flaeche2); }
.sonne { height: 120px; border-radius: 0 0 18px 18px; overflow: hidden; position: relative; display: grid; place-items: end center; padding-bottom: 14px; color: #11161D; text-align: center;
  background: radial-gradient(circle at 50% -60%, var(--s1) 0 38%, var(--s2) 38% 52%, var(--s3) 52% 66%, var(--s4) 66% 80%, transparent 80%); }
.sonne small { display: block; font-size: 14px; } .sonne b { font-size: 22px; }
.bahnen { list-style: none; margin: 8px 0 0; padding: 0; color: var(--leise); }
.bahnen li { display: flex; align-items: center; gap: 12px; min-height: 52px; border-top: 1.5px solid var(--linie); padding-left: 6%; font-weight: 700; color: var(--text); }
.bahnen li:nth-child(even) { padding-left: 40%; }
.bahnen i { width: 36px; height: 36px; border-radius: 50%; display: block; flex: none; }
.ausgeblendet { opacity: .45; }

/* Tafel-Übersicht */
.kacheln { display: grid; grid-template-columns: 1fr; gap: 10px; margin-top: 14px; }
.kachel { display: grid; grid-template-columns: 64px minmax(0, 1fr) 20px; gap: 12px; align-items: center; text-decoration: none; background: var(--flaeche); border: 1.5px solid var(--linie); border-left: 8px solid var(--gf); border-radius: 16px; padding: 12px 12px 12px 10px; min-height: 84px; }
a.kachel:hover { border-color: var(--text); border-left-color: var(--gf); }
.kachel b { font-size: 19px; display: block; }
.kachel small { display: block; color: var(--leise); font-size: 15px; }
.kachel svg { width: 64px; height: 52px; color: var(--text); }
.kachel.kommt { border-style: dashed; border-left-width: 1.5px; padding-left: 16px; color: var(--leise); }
.kachel.kommt b { color: var(--leise); }
.kachel .pf { font-size: 22px; color: var(--leise); }
.zw { font-size: 15px; color: var(--leise); margin: 18px 2px 0; }

/* Tafel-Kopf: Klassen-Filter */
.tafel-kopf { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 8px 12px; margin: 10px 0 12px; }
.kf { display: flex; align-items: center; gap: 4px; flex-wrap: wrap; }
.kf span { font-size: 14px; color: var(--leise); margin-right: 2px; }
.kf button { min-width: 36px; height: 36px; border-radius: 9px; border: 1.5px solid var(--linie); background: var(--flaeche); font-family: var(--mono); font-weight: 700; font-size: 14px; padding: 0 6px; }
.kf button[aria-pressed="true"] { background: var(--text); color: var(--bg); border-color: var(--text); }
.drucken { border: 0; background: none; color: var(--leise); text-decoration: underline; text-underline-offset: 3px; font-size: 14px; min-height: 36px; }
.regel-hinweis { font-size: 15px; color: var(--leise); margin-bottom: 10px; }
.regel-hinweis b { color: var(--text); }
.folgt { font-size: 14px; color: var(--leise); border: 1.5px dashed var(--linie); border-radius: 10px; padding: 6px 10px; margin-bottom: 12px; }

/* Tafel Maßeinheiten: Treppen */
.treppen { display: grid; grid-template-columns: 1fr; gap: 10px; }
.treppe { background: var(--flaeche); border: 1.5px solid var(--linie); border-radius: 16px; padding: 12px 14px 10px; break-inside: avoid; }
.tr-kopf { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; }
.tr-kopf h3 { font-size: 19px; }
.kl { font-family: var(--mono); font-size: 13px; font-weight: 600; color: var(--leise); white-space: nowrap; }
.stufen { list-style: none; margin: 10px 0 8px; padding: 0; display: grid; gap: 2px; }
.stufe { display: flex; align-items: center; gap: 8px; min-height: 32px; padding-left: calc(var(--i) * 22px); position: relative; }
.einheit { font-family: var(--mono); font-weight: 700; font-size: 17px; min-width: 58px; text-align: center; border-radius: 8px; padding: 2px 8px; background: var(--gfl); border: 1.5px solid var(--gf); }
.stufe .neben { font-family: var(--mono); font-size: 14px; color: var(--leise); }
.faktor { font-family: var(--mono); font-size: 14px; font-weight: 700; position: absolute; left: calc(var(--i) * 22px + 64px); top: 17px; white-space: nowrap; }
.stufe .neben { margin-left: 100px; }
.faktor .pf-ab { color: var(--leise); font-weight: 400; }
.legende { font-size: 14px; color: var(--leise); display: flex; gap: 14px; flex-wrap: wrap; margin: 0 2px 10px; }
.legende b { font-family: var(--mono); color: var(--text); }
.bsp { font-family: var(--mono); font-size: 15px; font-weight: 600; border-top: 1px dashed var(--linie); padding-top: 8px; }
.mehr summary { list-style: none; cursor: pointer; font-size: 15px; font-weight: 700; color: var(--leise); min-height: 36px; display: flex; align-items: center; }
.mehr summary::-webkit-details-marker { display: none; }
.mehr summary::after { content: " ▸"; margin-left: 4px; } .mehr[open] summary::after { content: " ▾"; }
.warum { font-size: 15px; font-weight: 700; text-underline-offset: 3px; display: inline-flex; min-height: 32px; align-items: center; }

.leitsatz { display: flex; flex-wrap: wrap; align-items: baseline; gap: 2px 12px; margin: 0 2px 12px; font-size: 15px; color: var(--leise); }
.leitsatz b { font-size: 20px; color: var(--text); }
.merk { font-size: 15px; margin: 2px 0 6px; }
.neben-treppe { font-size: 14px; color: var(--leise); font-family: var(--mono); margin: -2px 0 6px; }
.neben-treppe b { color: var(--text); } .neben-treppe b.zus { color: var(--leise); font-weight: 500; } .neben-treppe i { font-style: normal; }
.neben-treppe span { font-family: var(--grotesk); }
.bsp small { display: block; font-family: var(--grotesk); font-weight: 500; font-size: 14px; color: var(--leise); }
.mehr h4 { font-size: 14px; margin: 8px 0 2px; color: var(--leise); }
.mehr ol, .mehr ul { margin: 0 0 4px; padding-left: 20px; font-size: 15px; display: grid; gap: 3px; }
.mehr ul b { font-weight: 600; }
details.dichte { margin-top: 12px; } details.dichte > summary { cursor: pointer; font-weight: 700; color: var(--leise); min-height: 40px; display: flex; align-items: center; list-style: none; }
details.dichte > summary::-webkit-details-marker { display: none; } details.dichte > summary::after { content: " ▸"; margin-left: 4px; } details.dichte[open] > summary::after { content: " ▾"; }
/* Tafeln Flächen und Körper */
.figuren { display: grid; grid-template-columns: 1fr; gap: 10px; }
.figur { display: grid; grid-template-columns: 108px minmax(0, 1fr); gap: 8px 14px; background: var(--flaeche); border: 1.5px solid var(--linie); border-radius: 16px; padding: 12px 14px 8px; align-items: center; break-inside: avoid; }
.figur svg { width: 108px; height: auto; color: var(--text); }
.kt { display: grid; gap: 2px; align-content: center; }
.kt h3 { font-size: 19px; line-height: 1.2; }
.bed { font-size: 14px; color: var(--leise); }
.formeln { grid-column: 1 / -1; display: grid; grid-template-columns: 92px minmax(0, 1fr); column-gap: 10px; row-gap: 4px; align-items: baseline; margin: 0; padding-top: 8px; border-top: 1px solid var(--linie); }
.formeln dt { font-size: 14px; color: var(--leise); }
.formeln dd { margin: 0; font-size: 19px; font-weight: 700; font-variant-numeric: tabular-nums; letter-spacing: .01em; }
.formeln dd.fehlt { font-size: 14px; font-weight: 500; color: var(--leise); font-style: italic; }
.figur .fuss { grid-column: 1 / -1; border-top: 1px dashed var(--linie); padding-top: 2px; }

/* Suche */
.treffer { list-style: none; margin: 10px 0; padding: 0; display: grid; gap: 6px; }
.treffer a { display: block; text-decoration: none; background: var(--flaeche); border: 1.5px solid var(--linie); border-radius: 12px; padding: 10px 12px; }
.treffer b { display: block; } .treffer small { color: var(--leise); font-size: 14px; }
.treffer .art { font-family: var(--mono); font-size: 12px; font-weight: 700; color: var(--leise); text-transform: uppercase; letter-spacing: .06em; }

@media (min-width: 900px) {
  .breite { padding: 0 28px; }
  .kacheln { grid-template-columns: repeat(3, 1fr); }
  .treppen { grid-template-columns: repeat(3, 1fr); }
  .figuren { grid-template-columns: repeat(2, 1fr); }
  .schmal.breit { max-width: 1180px; }
}
@media (min-width: 1200px) { .figuren { grid-template-columns: repeat(3, 1fr); } }
@media (max-width: 380px) { .marke span { display: none; } }
@media (max-width: 440px) { .formeln { grid-template-columns: 84px minmax(0, 1fr); } .formeln dd { font-size: 17.5px; } }
@media print {
  .kopf, .pfad, .tafel-kopf .kf, .drucken, .warum, .mehr summary { display: none !important; }
  body { background: #fff; } .treppe, .figur { border-color: #999; }
  .mehr > *:not(summary) { display: block; }
}
/* Entwurfs-Schalter */
.entwurf { position: fixed; right: 8px; bottom: 8px; z-index: 30; font: 13px system-ui, sans-serif; display: flex; gap: 4px; background: #2b2b2b; border-radius: 10px; padding: 4px; }
.entwurf button { background: #444; color: #fff; border: 0; border-radius: 7px; padding: 5px 9px; }
.ohne .entwurf { display: none; }
@media print { .entwurf { display: none; } }
</style>
</head>
<body data-g="hell">
<header class="kopf"><div class="breite"><a class="marke" href="#universum"><i></i><span>Regel-Universum</span></a>
  <label class="suche"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></svg><input id="suche" type="search" placeholder="Suchen" aria-label="Suchen"></label></div></header>
<main class="breite" id="main"></main>
<div class="entwurf"><button id="g">hell/dunkel</button></div>
<script>
'use strict';
// ================= Inhalte =================
// Formeln wörtlich aus daten/regeln-universum.json → formeln (fuer, formel, bedingung, ziel). Klasse „ab“ = erste Zahl von gesetze[ziel].gym.
const FORMELN = [
 ['Rechteck – Fläche', 'A = a · b', '–', 'F2'], ['Rechteck – Umfang', 'u = 2 · (a + b)', '–', 'F2'], ['Quadrat – Fläche', 'A = a²', '–', 'F2'],
 ['Parallelogramm – Fläche', 'A = g · h', 'h senkrecht auf g', 'F5'], ['Dreieck – Fläche', 'A = g · h : 2', 'h senkrecht auf g', 'F6'],
 ['Trapez – Fläche', 'A = (a + c) : 2 · h', 'a und c parallel, h ihr Abstand', 'F7'], ['Drachenviereck und Raute – Fläche', 'A = e · f : 2', 'Diagonalen e und f senkrecht zueinander', 'F8'],
 ['Kreis – Umfang', 'u = 2 · π · r', '–', 'F9'], ['Kreis – Fläche', 'A = π · r²', '–', 'F9'],
 ['Kreisausschnitt – Bogenlänge', 'b = α : 360° · 2 · π · r', 'α Mittelpunktswinkel', 'F10'], ['Kreisausschnitt – Fläche', 'A = α : 360° · π · r²', 'α Mittelpunktswinkel', 'F10'],
 ['Quader – Volumen', 'V = a · b · c', '–', 'F12'], ['Würfel – Volumen', 'V = a³', '–', 'F12'], ['Quader – Oberfläche', 'O = 2 · (a · b + a · c + b · c)', '–', 'F13'], ['Würfel – Oberfläche', 'O = 6 · a²', '–', 'F13'],
 ['Prisma – Volumen', 'V = G · h', 'h senkrecht auf G', 'F15'], ['Prisma – Mantel', 'M = u · h', 'gerades Prisma; u Umfang der Grundfläche', 'F15'], ['Prisma – Oberfläche', 'O = 2 · G + M', 'gerades Prisma', 'F15'],
 ['Zylinder – Volumen', 'V = π · r² · h', 'h senkrecht auf G', 'F15'], ['Zylinder – Mantel', 'M = 2 · π · r · h', 'gerader Zylinder', 'F15'], ['Zylinder – Oberfläche', 'O = 2 · π · r² + 2 · π · r · h', 'gerader Zylinder', 'F15'],
 ['Pyramide – Volumen', 'V = G · h : 3', 'h senkrecht auf G', 'F17'], ['Pyramide – Mantel (Pyramidenmantel)', 'M = Summe der Seitendreiecke', '–', 'F17'],
 ['Kegel – Volumen', 'V = π · r² · h : 3', 'h senkrecht auf G', 'F17'], ['Kegel – Mantel (Kegelmantel)', 'M = π · r · s', 'gerader Kreiskegel; s Mantellinie, s² = r² + h²', 'F17'], ['Kegel – Oberfläche', 'O = π · r² + π · r · s', 'gerader Kreiskegel'],
 ['Kugel – Volumen', 'V = 4/3 · π · r³', '–', 'F18'], ['Kugel – Oberfläche', 'O = 4 · π · r²', '–', 'F18'],
].map(([fuer, formel, bed, ziel]) => ({ fuer, formel, bed, ziel: ziel || 'F17' }));
const REGEL = { F2: ['Rechteck', 5], F5: ['Parallelogramm', 6], F6: ['Dreieck', 6], F7: ['Trapez', 6], F8: ['Drachenviereck und Raute', 6], F9: ['Kreis', 8], F10: ['Kreisausschnitt', 8],
  F12: ['Quader', 6], F13: ['Oberfläche', 5], F15: ['Prisma und Zylinder', 8], F17: ['Pyramide und Kegel', 10], F18: ['Kugel', 10], V1: ['Größe und Einheit', 5], F1: ['Fläche messen', 5], F11: ['Volumen messen', 6] };
const formel = (fuer) => FORMELN.find((f) => f.fuer === fuer || f.fuer.startsWith(fuer));

  prisma: `<path d="M12 90 H62 L37 48 Z" ${F}/><path d="M62 90 L112 66 L87 24 L37 48 M87 24 H87" ${L}/><path d="M12 90 L62 66 H112 M62 66 L87 24" ${D}/>${T(34, 84, 'G')}${T(92, 88, 'h', 'start')}`,
  zylinder: `<ellipse cx="62" cy="22" rx="38" ry="10" ${F}/><path d="M24 22 V84 M100 22 V84" ${L}/><path d="M24 84 A38 10 0 0 0 100 84" ${L}/><path d="M24 84 A38 10 0 0 1 100 84" ${D}/><path d="M62 22 H100" ${L}/>${T(82, 33, 'r')}${T(106, 56, 'h', 'start')}`,
  pyramide: `<path d="M14 88 H84 L60 14 Z" fill="var(--tint)" stroke="none"/><path d="M14 88 H84 L106 70 M60 14 L14 88 M60 14 L84 88 M60 14 L106 70" ${L}/><path d="M14 88 L36 70 H106 M36 70 L60 14 M60 14 V79" ${D}/>${T(50, 104, 'G')}${T(63, 52, 'h', 'start')}`,
  kegel: `<path d="M22 84 L62 14 L102 84 Z" fill="var(--tint)" stroke="none"/><path d="M22 84 L62 14 L102 84" ${L}/><path d="M22 84 A40 11 0 0 0 102 84" ${L}/><path d="M22 84 A40 11 0 0 1 102 84 M62 14 V84" ${D}/><path d="M62 84 H102" ${L}/>${T(82, 80, 'r')}${T(66, 54, 'h', 'start')}${T(90, 44, 's', 'start')}`,
  kugel: `<circle cx="62" cy="54" r="40" ${F}/><path d="M22 54 A40 11 0 0 0 102 54" ${L}/><path d="M22 54 A40 11 0 0 1 102 54" ${D}/><path d="M62 54 H102" ${L}/><circle cx="62" cy="54" r="2.5" fill="currentColor"/>${T(84, 49, 'r')}`,
};
const zeichnung = (k, vb = '0 0 120 90') => `<svg viewBox="${vb}" role="img" aria-label="${k}">${SVG[k]}</svg>`;
const ICON = {
  einheiten: `<svg viewBox="0 0 64 52"><rect x="4" y="6" width="22" height="12" rx="4" fill="var(--geld-fl)" stroke="var(--geld)" stroke-width="2"/><rect x="20" y="22" width="22" height="12" rx="4" fill="var(--geld-fl)" stroke="var(--geld)" stroke-width="2"/><rect x="36" y="38" width="22" height="12" rx="4" fill="var(--geld-fl)" stroke="var(--geld)" stroke-width="2"/></svg>`,
  flaechen: `<svg viewBox="0 0 64 52"><rect x="4" y="10" width="30" height="22" fill="var(--fur-fl)" stroke="currentColor" stroke-width="2"/><circle cx="46" cy="32" r="14" fill="var(--fur-fl)" stroke="currentColor" stroke-width="2"/></svg>`,
  koerper: `<svg viewBox="0 0 64 52"><path d="M6 20 H34 V48 H6 Z" fill="var(--fur-fl)" stroke="currentColor" stroke-width="2"/><path d="M6 20 L16 10 H44 L34 20 M44 10 V38 L34 48" fill="none" stroke="currentColor" stroke-width="2"/><circle cx="52" cy="34" r="10" fill="var(--fur-fl)" stroke="currentColor" stroke-width="2"/></svg>`,
  leer: `<svg viewBox="0 0 64 52"><rect x="10" y="8" width="44" height="36" rx="8" fill="none" stroke="currentColor" stroke-width="2" stroke-dasharray="5 4"/></svg>`,
};

// ================= Zustand und Zeichnen =================
const S = { g: 'hell', bis: 'alle', q: '' };
const esc = (s) => String(s ?? '').replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const sichtbar = (kl) => S.bis === 'alle' || kl === null || kl <= +S.bis;
const warum = (id) => id ? `<a class="warum" href="#regel-${id.toLowerCase()}">Warum? ${esc(REGEL[id][0])} ›</a>` : '';
const klasse = (kl) => `<span class="kl">${kl ? 'ab Kl. ' + kl : 'Kl. offen'}</span>`;
const pfad = (t) => `<nav class="pfad"><a href="#universum">‹ Universum</a>${t ? ` › <a href="#tafeln">Tafeln</a>` : ''}</nav>`;
const kopfTafel = () => `<div class="tafel-kopf"><div class="kf" role="group" aria-label="Zeigen bis Klasse"><span>bis Klasse</span>${['5', '6', '7', '8', '9', '10', 'alle'].map((k) => `<button data-bis="${k}" aria-pressed="${S.bis === k}">${k}</button>`).join('')}</div><button class="drucken" onclick="window.print()">Drucken</button></div>`;

function universum() {
  const planeten = [['Zahlen', '#FF8A66'], ['Algebra', '#A99BFF'], ['Geld und Verhältnisse', '#B4E86A'], ['Geometrie', '#3AD6C5'], ['Fläche und Raum', '#5AAEFF']];
  return `<div class="schmal"><h1 class="titel" style="margin-top:14px">Regel-Universum</h1><p class="lead">Alle festen Regeln der Mathematik, Klasse 5 bis 10. Tippe auf einen Teil.</p>
    <nav class="umschalter"><a href="#universum" aria-current="page">Aufbau</a><a href="#universum">Durch die Klassen</a></nav>
    <a class="station" href="#tafeln">${ICON.einheiten.replace('viewBox="0 0 64 52"', 'viewBox="0 0 64 52" width="48" height="40"')}<span><b>Tafeln zum Nachschlagen</b><small>Alles auf einen Blick</small>
      <span class="chips"><span>km · m · cm</span><span>A = a · b</span><span>V = a · b · c</span></span></span><span class="pfeil">›</span></a>
    <div class="sonne"><span><small>Die Sonne · die Grundlage</small><b>14 Rechenregeln</b></span></div>
    <p class="leise" style="text-align:center;margin-top:8px">Darum die sieben Gebiete:</p>
    <ul class="bahnen">${planeten.map(([n, f]) => `<li><i style="background:${f}"></i>${n}</li>`).join('')}</ul></div>`;
}
function uebersicht() {
  const k = (id, gf, titel, satz, ziel) => `<a class="kachel" href="#${ziel}" style="--gf:${gf}">${ICON[id]}<span><b>${titel}</b><small>${satz}</small></span><span class="pf">›</span></a>`;
  const kommt = (titel, satz) => `<div class="kachel kommt" style="--gf:var(--linie)">${ICON.leer}<span><b>${titel}</b><small>${satz} · kommt</small></span><span></span></div>`;
  return `<div class="schmal breit">${pfad(false)}<h1 class="titel">Tafeln zum Nachschlagen</h1><p class="lead">Eine Seite je Thema – zum schnellen Nachschauen und zum Ausdrucken.</p>
    <div class="kacheln">${k('einheiten', 'var(--geld)', 'Maßeinheiten', 'Länge, Fläche, Volumen, Masse, Zeit, Geld, Tempo', 'einheiten')}${k('flaechen', 'var(--fur)', 'Flächen und Umfang', '8 Figuren mit Formeln', 'flaechen')}${k('koerper', 'var(--fur)', 'Körper', '7 Körper: Volumen, Oberfläche', 'koerper')}</div>
    <p class="zw">Bald dazu:</p><div class="kacheln">${kommt('Bruch · Dezimal · Prozent', '½ = 0,5 = 50 %')}${kommt('Quadrat- und Primzahlen', 'bis 20² und bis 100')}${kommt('Teilbarkeitsregeln', 'durch 2, 3, 4, 5, 9, 10')}</div></div>`;
}
function treppeHtml(treppe, verbindung) {
  const n = treppe.length;
  return `<ul class="stufen">${treppe.map((t, i) => { const v = (verbindung || []).find((y) => y.rechts === '1 ' + t.einheit);
    return `<li class="stufe${t.zusatz ? ' zusatz' : ''}" style="--i:${i}"><span class="einheit" title="${esc(t.name)}">${esc(t.einheit)}</span>${v ? `<span class="neben">= ${esc(v.links)}</span>` : ''}${i < n - 1 ? `<span class="faktor" title="1 ${esc(t.einheit)} = ${esc(t.zur_naechsten)} ${esc(treppe[i + 1].einheit)}"><span class="pf-ab">↘</span> · ${esc(t.zur_naechsten)}</span>` : ''}</li>`; }).join('')}</ul>`;
}
function artKarte(t) {
  const x = t.x; const b0 = x.beispiele[0]; const fur = /Fläche|Volumen|Dichte/.test(x.art);
  const regel = (x.regeln || []).find((r) => /^[A-Z]\d+$/.test(r.kennung)) || (x.regeln || [])[0];
  return `<section class="treppe" id="t-${t.id}" style="--gf:${fur ? 'var(--fur)' : 'var(--geld)'};--gfl:${fur ? 'var(--fur-fl)' : 'var(--geld-fl)'}">
    <div class="tr-kopf"><h3>${esc(x.art)}</h3>${klasse(t.kl)}</div>${treppeHtml(x.treppe, x.verbindung)}
    ${(x.weitere_treppen || []).map((w) => `<p class="neben-treppe"><span>${esc(w.name)}:</span> ${w.treppe.map((u, i) => `<b class="${u.zusatz ? 'zus' : ''}" title="${esc(u.name)}">${esc(u.einheit)}</b>${u.zur_naechsten ? ` <i>· ${esc(u.zur_naechsten)}</i>` : ''}`).join(' ')}</p>`).join('')}
    <p class="merk">${esc(x.merksatz)}</p>
    <p class="bsp">${esc(b0.von)} = ${esc(b0.nach)}<small>denn ${esc(b0.denn)}</small></p>
    <details class="mehr"${S.offen === t.id ? ' open' : ''}><summary>So geht’s · Beispiele · Stolperstellen</summary>
      <h4>So geht’s</h4><ol>${x.so_gehts.map((z) => `<li>${esc(z)}</li>`).join('')}</ol>
      <h4>Beispiele</h4><ul class="bsp-liste">${x.beispiele.map((y) => `<li>${esc(y.text)}</li>`).join('')}</ul>
      <h4>Stolperstellen</h4><ul>${x.stolperstellen.map((y) => `<li><b>${esc(y.fehler)}</b> ${esc(y.richtig)}</li>`).join('')}</ul>
      ${(x.hinweise || []).length ? `<h4>Gut zu wissen</h4><ul>${x.hinweise.map((h) => `<li>${esc(h)}</li>`).join('')}</ul>` : ''}
      ${(x.herleitung || []).length ? `<h4>Warum?</h4><ul>${x.herleitung.map((h) => `<li>${esc(h.text)}</li>`).join('')}</ul>` : ''}
      ${regel ? `<a class="warum" href="#regel-${esc(regel.kennung.toLowerCase())}">${esc(regel.name)} im Universum ›</a>` : ''}</details></section>`;
}
function einheiten() {
  const haupt = TREPPEN.filter((t) => t.id !== 'dichte' && sichtbar(t.kl)); const dichte = TREPPEN.find((t) => t.id === 'dichte');
  return `<div class="schmal breit">${pfad(true)}<h1 class="titel">Maßeinheiten</h1>${kopfTafel()}
    <p class="leitsatz"><b>abwärts mal, aufwärts geteilt</b><span>${esc(EH.regel_der_richtung.merksatz)}</span></p>
    <div class="treppen">${haupt.map(artKarte).join('')}</div>
    ${dichte && (S.bis === 'alle' || +S.bis >= 8) ? `<details class="dichte"${S.offen === 'dichte' ? ' open' : ''}><summary>ab Klasse 8: Dichte</summary><div class="treppen">${artKarte(dichte)}</div></details>` : ''}</div>`;
}
function formelZeilen(liste) {
  return liste.map(([lab, key, fehltText]) => { const f = key && formel(key);
    return f ? `<dt>${lab}</dt><dd>${esc(f.formel)}</dd>` : `<dt>${lab}</dt><dd class="fehlt">${fehltText || 'Inhalt fehlt'}</dd>`; }).join('');
}
function flaechen() {
  const html = FIGUREN.map((g) => { const fa = formel(g.a[0]); const kl = REGEL[fa.ziel][1]; if (!sichtbar(kl)) return '';
    const bed = [...g.a, ...g.u].map((k) => formel(k)).filter((f) => f && f.bed !== '–').map((f) => f.bed)[0];
    return `<section class="figur" id="f-${g.svg}" style="--tint:var(--fur-fl)">${zeichnung(g.svg)}<div class="kt"><h3>${g.name}</h3>${klasse(kl)}${bed ? `<p class="bed">${esc(bed)}</p>` : ''}</div>
      <dl class="formeln">${formelZeilen([['Fläche', g.a[0]], [g.ulabel || 'Umfang', g.u[0], 'Inhalt fehlt']])}</dl><p class="fuss">${warum(fa.ziel)}</p></section>`; }).join('');
  return `<div class="schmal breit">${pfad(true)}<h1 class="titel">Flächen und Umfang</h1>${kopfTafel()}<div class="figuren">${html}</div></div>`;
}
function koerper() {
  const html = KOERPER.map((g) => { const fv = formel(g.v); const kl = REGEL[fv.ziel][1]; if (!sichtbar(kl)) return '';
    const bed = [g.v, g.m, g.o].filter(Boolean).map((k) => formel(k)).filter((f) => f && f.bed !== '–').map((f) => f.bed)[0];
    return `<section class="figur" id="k-${g.svg}" style="--tint:var(--fur-fl)">${zeichnung(g.svg, '0 0 124 112')}<div class="kt"><h3>${g.name}</h3>${klasse(kl)}${bed ? `<p class="bed">${esc(bed)}</p>` : ''}</div>
      <dl class="formeln">${formelZeilen([['Volumen', g.v], ...(g.m ? [['Mantel', g.m]] : []), ['Oberfläche', g.o, 'Inhalt fehlt']])}</dl><p class="fuss">${warum(fv.ziel)}</p></section>`; }).join('');
  return `<div class="schmal breit">${pfad(true)}<h1 class="titel">Körper</h1>${kopfTafel()}<div class="figuren">${html}</div></div>`;
}
function suche(q) {
  const w = q.toLowerCase(); const t = [];
  for (const x of TREPPEN) if ((x.name + ' ' + x.such + ' ' + x.stufen.map((s) => s[0]).join(' ')).toLowerCase().includes(w)) t.push(['Tafel Maßeinheiten', x.name, x.x.darstellung, 'einheiten', 't-' + x.id]);
  for (const g of FIGUREN) if ((g.name + ' fläche umfang ' + g.a.concat(g.u).join(' ')).toLowerCase().includes(w)) t.push(['Tafel Flächen', g.name, g.a.concat(g.u).map((k) => formel(k).formel).join(' · '), 'flaechen', 'f-' + g.svg]);
  for (const g of KOERPER) if ((g.name + ' volumen oberfläche mantel körper').toLowerCase().includes(w)) t.push(['Tafel Körper', g.name, formel(g.v).formel, 'koerper', 'k-' + g.svg]);
  return `<div class="schmal">${pfad(false)}<h1 class="titel">Suche „${esc(q)}“</h1><ul class="treffer">${t.map(([art, n, s, z, a]) => `<li><a href="#${z}" data-anker="${a}"><span class="art">${art}</span><b>${esc(n)}</b><small>${esc(s)}</small></a></li>`).join('') || '<li class="leise">Nichts gefunden.</li>'}
    <li><a href="#universum"><span class="art">Regeln</span><b>… weitere Treffer im Universum</b><small>wie bisher</small></a></li></ul></div>`;
}
function zeichne() {
  document.body.dataset.g = S.g;
  const h = location.hash.slice(1).split('&')[0] || 'universum';
  const m = document.getElementById('main');
  if (h.startsWith('suche=')) m.innerHTML = suche(decodeURIComponent(h.slice(6)));
  else m.innerHTML = ({ universum, tafeln: uebersicht, einheiten, flaechen, koerper }[h] || universum)();
}
(function () { const q = new URLSearchParams(location.hash.split('&').slice(1).join('&')); if (q.get('g')) S.g = q.get('g'); if (q.get('bis')) S.bis = q.get('bis'); if (q.get('offen')) S.offen = q.get('offen'); if (q.get('ohne')) document.documentElement.classList.add('ohne'); })();
addEventListener('hashchange', () => { zeichne(); scrollTo(0, 0); });
document.addEventListener('click', (e) => { const b = e.target.closest('button, a'); if (!b) return;
  if (b.id === 'g') { S.g = S.g === 'hell' ? 'nacht' : 'hell'; zeichne(); }
  else if (b.dataset.bis) { S.bis = b.dataset.bis; zeichne(); }
  else if (b.dataset.anker) { const a = b.dataset.anker; setTimeout(() => document.getElementById(a)?.scrollIntoView({ block: 'start' }), 30); }
  else if (b.getAttribute('href')?.startsWith('#regel-')) { e.preventDefault(); alert('Öffnet im Universum die Einzelregel ' + b.getAttribute('href').slice(7).toUpperCase()); } });
document.getElementById('suche').addEventListener('keydown', (e) => { if (e.key === 'Enter' && e.target.value.trim()) location.hash = 'suche=' + encodeURIComponent(e.target.value.trim()); });
zeichne();
</script>
</body>
</html>
