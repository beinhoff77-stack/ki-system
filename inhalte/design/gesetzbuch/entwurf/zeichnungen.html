// ---------- 2 Gleichung als Waage ----------
function zWaage() {
  const sack = (x, y, o = {}) => zPfad(`M${x - 9} ${y - 24}q9 5 18 0l-3 6q9 8 5 18h-22q-4 -10 5 -18z`, { fl: o.geist ? 'none' : ZF.blauFl, f: o.geist ? ZF.leise : ZF.tinte, b: 2, strich: o.geist ? '4 4' : null }) + (o.geist ? '' : zT(x, y - 4, 'x', { g: 14, w: 700 }));
  const kugel = (x, y, o = {}) => `<circle cx="${x}" cy="${y}" r="5.5" fill="${o.geist ? 'none' : ZF.tinte}" stroke="${o.geist ? (o.gelb ? ZF.gelb : ZF.leise) : ZF.tinte}" stroke-width="${o.gelb ? 2.5 : 1.75}"${o.geist ? ' stroke-dasharray="3 3"' : ''}/>`;
  const feld = (links, rechts, titel) => { const y = 126, sch = (cx) => zL(cx, 60, cx - 44, y, { b: 1.75, f: ZF.leise }) + zL(cx, 60, cx + 44, y, { b: 1.75, f: ZF.leise }) + zPfad(`M${cx - 50} ${y}H${cx + 50}M${cx - 46} ${y}q46 22 92 0`, { b: 2.5 });
    let l = '', r = ''; let x = 70 - (links.reduce((s, e) => s + (e[0] === 's' ? 24 : 13), 0)) / 2;
    links.forEach((e) => { if (e[0] === 's') { l += sack(x + 12, y - 2, { geist: e[1] === 'g' }); x += 24; } else { l += kugel(x + 6.5, y - 7, { geist: !!e[1], gelb: e[1] === 'y' }); x += 13; } });
    rechts.forEach((e, i) => { const sp = i % 6, ze = Math.floor(i / 6); r += kugel(250 - 32.5 + sp * 13, y - 7 - ze * 13, { geist: !!e[1], gelb: e[1] === 'y' }); });
    return zBlatt(320, 196, `${zL(160, 60, 160, 176, { b: 3 })}${zL(124, 176, 196, 176, { b: 3 })}${zL(70, 60, 250, 60, { b: 3 })}${zP([[160, 48], [152, 62], [168, 62]], { fl: ZF.tinte })}
      ${sch(70)}${sch(250)}${l}${r}${zMarke(160, 112, '=', { breit: 30 })}`, titel); };
  const K = ['k'], Y = ['k', 'y'], G = ['k', 'g'];
  return { name: 'Gleichung als Waage', felder: [
    { svg: feld([['s'], ['s'], K, K], Array(12).fill(K), 'Waage im Gleichgewicht: links zwei Säckchen x und zwei Kugeln, rechts zwölf Kugeln'), gl: '2x + 2 = 12', satz: 'Links und rechts liegt gleich viel.' },
    { svg: feld([['s'], ['s'], Y, Y], [...Array(10).fill(K), Y, Y], 'Auf beiden Seiten werden zwei Kugeln weggenommen'), gl: '2x = 10', satz: 'Auf beiden Seiten 2 Kugeln weg. Die Waage bleibt im Gleichgewicht.', pfeil: 'beide Seiten − 2' },
    { svg: feld([['s'], ['s', 'g']], [...Array(5).fill(K), ...Array(5).fill(G)], 'Beide Seiten werden halbiert: ein Säckchen wiegt so viel wie fünf Kugeln'), gl: 'x = 5', satz: 'Beide Seiten halbiert: Ein Säckchen wiegt so viel wie 5 Kugeln.', pfeil: 'beide Seiten : 2' },
  ] };
}

// ---------- 3 Plus und Minus mit negativen Zahlen ----------
function zZahlenstrahl() {
  const X = (v) => 40 + (v + 1) * 34, ya = 150;
  const feld = (o) => { let s = zL(22, ya, 290, ya, { b: 2 }) + zP([[300, ya], [289, ya - 5], [289, ya + 5]], { fl: ZF.tinte, b: 1 });
    for (let v = -1; v <= 6; v++) s += zL(X(v), ya - 6, X(v), ya + 6, { b: v === 0 ? 2.5 : 1.75 }) + zT(X(v), ya + 24, v < 0 ? '−' + (-v) : v, { g: 14, w: v === 0 ? 800 : 600, f: v === 3 || v === o.ziel ? ZF.tinte : ZF.leise });
    const d = o.blick, x3 = X(3), xz = X(o.ziel), y1 = 56, y2 = 104;
    s += zL(x3, y2 + 10, x3, ya, { f: ZF.leise, b: 1.5, strich: '3 4' }) + zL(xz, y2 + 10, xz, ya, { f: ZF.leise, b: 1.5, strich: '3 4' });
    s += zPfeil(x3, y1, x3 + d * 46, y1, { f: ZF.leise, b: 2.5, strich: '5 4' }) + zT(x3 + d * 20, y1 - 12, o.blickText, { g: 14.5, f: ZF.leise, grotesk: true, w: 600 });
    s += zPfad(`M${x3 + d * 52} ${y1}q${d * 20} ${(y2 - y1) / 2} 0 ${y2 - y1 - 14}`, { f: ZF.tinte, b: 2, strich: '2 4' }) + zT(x3 + d * 70, (y1 + y2) / 2 + 1, 'umdrehen', { g: 14.5, a: d > 0 ? 'start' : 'end', grotesk: true, w: 600 });
    s += zPfeil(x3, y2, xz, y2, { f: ZF.gelb, b: 6, kopf: 14 }) + zT((x3 + xz) / 2, y2 - 11, '2 Schritte', { g: 14.5, grotesk: true });
    s += `<circle cx="${x3}" cy="${ya}" r="5.5" fill="${ZF.tinte}"/><circle cx="${xz}" cy="${ya}" r="8" fill="${ZF.gelb}" stroke="${ZF.tinte}" stroke-width="2"/>`;
    return zBlatt(320, 186, s, o.titel); };
  return { name: 'Plus und Minus mit negativen Zahlen', felder: [
    { svg: feld({ blick: 1, ziel: 1, blickText: 'Plus: Blick nach rechts', titel: 'Zahlenstrahl: Start bei 3. Plus schaut nach rechts, das Minus in der Klammer dreht um, zwei Schritte nach links auf 1' }), gl: '3 + (<b class="w">−</b>2) = 1', satz: 'Plus schaut nach rechts. Das Minus in der Klammer dreht um: 2 Schritte nach links.' },
    { svg: feld({ blick: -1, ziel: 5, blickText: 'Minus: Blick nach links', titel: 'Zahlenstrahl: Start bei 3. Minus schaut nach links, das Minus in der Klammer dreht um, zwei Schritte nach rechts auf 5' }), gl: '3 − (<b class="w">−</b>2) = 5', satz: 'Minus schaut nach links. Das Minus in der Klammer dreht um: 2 Schritte nach rechts.' },
  ] };
}

// ---------- 4 Messen heißt auslegen und zählen ----------
function zAuslegen() {
  const k = 34, x0 = 84, y0 = 52; let s = `<rect x="${x0}" y="${y0}" width="${6 * k}" height="${k}" fill="${ZF.blauFl}"/><rect x="${x0}" y="${y0 + 3 * k}" width="${k}" height="${k}" fill="${ZF.gelb}"/>`;
  for (let i = 1; i < 6; i++) s += zL(x0 + i * k, y0, x0 + i * k, y0 + 4 * k, { b: 1.25, f: ZF.leise });
  for (let j = 1; j < 4; j++) s += zL(x0, y0 + j * k, x0 + 6 * k, y0 + j * k, { b: 1.25, f: ZF.leise });
  s += `<rect x="${x0}" y="${y0}" width="${6 * k}" height="${4 * k}" fill="none" stroke="${ZF.tinte}" stroke-width="2.5" stroke-linejoin="round"/>`;
  s += zT(x0 + 3 * k, y0 - 12, '6 Quadrate in einer Reihe', { g: 16, grotesk: true, f: ZF.blau, w: 700 });
  s += zPfad(`M${x0 - 12} ${y0}h-7V${y0 + 4 * k}h7`, { f: ZF.leise, b: 1.75 }) + zT(x0 - 30, y0 + 2 * k, '4 Reihen', { g: 16, grotesk: true, dreh: -90, w: 700 });
  s += zT(x0 + 3 * k, y0 + 4 * k + 24, '6 cm', { g: 17 }) + zT(x0 + 6 * k + 10, y0 + 2 * k + 5, '4 cm', { g: 17, a: 'start' });
  s += zPfad(`M${x0 + k / 2} ${y0 + 4 * k + 4}q0 22 -22 26`, { f: ZF.tinte, b: 1.5 }) + zT(x0 + k / 2 - 28, y0 + 4 * k + 36, '1 cm²', { g: 16, a: 'end', w: 700 });
  return { name: 'Messen heißt auslegen und zählen', felder: [{ svg: zBlatt(360, 250, s, 'Rechteck 6 cm mal 4 cm, ausgelegt mit 24 Einheitsquadraten in 4 Reihen zu je 6'), gl: '4 · 6 = 24 Quadrate, also 24 cm²', satz: 'Ein Quadrat ist 1 cm². In jeder Reihe liegen 6, es sind 4 Reihen.' }] };
}

// ---------- 5 Aus dem Rechteck entsteht jede Fläche ----------
function zFlaechen() {
  const k = 20, B = 130, X = (c) => 30 + c * k, Y = (r) => B - r * k, bl = (innen, titel) => zBlatt(280, 160, innen, titel, k);
  const rechteck = zP([[X(0), Y(0)], [X(6), Y(0)], [X(6), Y(4)], [X(0), Y(4)]], { fl: ZF.blauFl }) + zT(X(3), B + 21, '6', { g: 16 }) + zT(X(6) + 12, Y(2) + 5, '4', { g: 16, a: 'start' });
  const para = zP([[X(2), Y(0)], [X(6), Y(0)], [X(8), Y(4)], [X(2), Y(4)]], { fl: ZF.blauFl, b: 0.01, f: 'none' }) + zP([[X(6), Y(0)], [X(8), Y(0)], [X(8), Y(4)]], { fl: ZF.blauFl, f: ZF.tinte, b: 2, strich: '5 4' })
    + zP([[X(0), Y(0)], [X(2), Y(0)], [X(2), Y(4)]], { fl: ZF.gelb, b: 2 }) + zP([[X(0), Y(0)], [X(6), Y(0)], [X(8), Y(4)], [X(2), Y(4)]]) + zL(X(2), Y(0), X(2), Y(4), { strich: '5 4', b: 2 })
    + zBogenPfeil(X(1.2), Y(1.2), X(7), Y(1.4), 62, { b: 2.25 }) + zT(X(3), B + 21, '6', { g: 16 }) + zSchild(X(2) + 14, Y(2) + 5, '4', { g: 16 });
  const dreieck = zP([[X(6), Y(0)], [X(8), Y(4)], [X(2), Y(4)]], { f: ZF.leise, b: 2, strich: '5 4' }) + zP([[X(0), Y(0)], [X(6), Y(0)], [X(2), Y(4)]], { fl: ZF.blauFl }) + zL(X(2), Y(0), X(2), Y(4), { strich: '5 4', b: 2, f: ZF.tinte })
    + zT(X(3), B + 21, '6', { g: 16 }) + zSchild(X(2) + 14, Y(1.6) + 5, '4', { g: 16 }) + zT(X(5.7), Y(3) + 5, 'Zwilling', { g: 15, grotesk: true, f: ZF.leise, w: 600 });
  const trapez = zP([[X(6), Y(0)], [X(9), Y(0)], [X(11), Y(4)], [X(5), Y(4)]], { f: ZF.leise, b: 2, strich: '5 4' }) + zP([[X(0), Y(0)], [X(6), Y(0)], [X(5), Y(4)], [X(2), Y(4)]], { fl: ZF.blauFl })
    + zL(X(2), Y(0), X(2), Y(4), { strich: '5 4', b: 2 }) + zT(X(3), B + 21, '6', { g: 16 }) + zT(X(7.5), B + 21, '3', { g: 16, f: ZF.leise }) + zT(X(3.5), Y(4) - 8, '3', { g: 16 }) + zSchild(X(2) + 14, Y(1.6) + 5, '4', { g: 16 }) + zT(X(8), Y(3) + 5, 'Zwilling', { g: 15, grotesk: true, f: ZF.leise, w: 600 });
  return { name: 'Aus dem Rechteck entsteht jede Fläche', felder: [
    { svg: bl(rechteck, 'Rechteck 6 mal 4 auf Karopapier'), kopf: 'Rechteck', gl: '6 · 4 = 24', satz: 'Länge mal Breite.' },
    { svg: bl(para, 'Parallelogramm: Das gelbe Dreieck links wird abgeschnitten und rechts angesetzt, es entsteht ein Rechteck 6 mal 4'), kopf: 'Parallelogramm', gl: '6 · 4 = 24', satz: 'Grundseite mal Höhe.', pfeil: 'abschneiden und ansetzen' },
    { svg: bl(dreieck, 'Dreieck mit Grundseite 6 und Höhe 4; mit seinem gedrehten Zwilling ergibt es ein Parallelogramm'), kopf: 'Dreieck', gl: '6 · 4 : 2 = 12', satz: 'Die Hälfte vom Parallelogramm.', pfeil: 'halbieren' },
    { svg: bl(trapez, 'Trapez mit den parallelen Seiten 6 und 3 und der Höhe 4; mit seinem gedrehten Zwilling ergibt es ein Parallelogramm mit der Grundseite 9'), kopf: 'Trapez', gl: '(6 + 3) · 4 : 2 = 18', satz: 'Zwei gleiche Trapeze ergeben ein Parallelogramm. Eines ist die Hälfte.', pfeil: 'auch halbieren' },
  ] };
}

// ---------- 6 Aus dem Quader entsteht jeder Körper ----------
function zKoerper() {
  const ox = 30, oy = -18; // Schrägbild: nach hinten 30 nach rechts, 18 nach oben
  const quaderKanten = (x, y, w, h, o = {}) => { const f = o.f || ZF.tinte, st = o.strich, v = (a, b, c, d, hinten) => zL(a, b, c, d, { f: hinten ? (o.fHinten || ZF.leise) : f, b: hinten ? 1.75 : (o.b || 2.5), strich: hinten ? '4 4' : st });
    return v(x, y, x + ox, y + oy, true) + v(x + ox, y + oy, x + w + ox, y + oy, true) + v(x + ox, y + oy, x + ox, y - h + oy, true)
      + v(x, y, x + w, y) + v(x + w, y, x + w + ox, y + oy) + v(x, y, x, y - h) + v(x + w, y, x + w, y - h) + v(x + w + ox, y + oy, x + w + ox, y - h + oy)
      + v(x, y - h, x + w, y - h) + v(x + w, y - h, x + w + ox, y - h + oy) + v(x, y - h, x + ox, y - h + oy) + v(x + ox, y - h + oy, x + w + ox, y - h + oy); };
  const boden = (x, y, w) => zP([[x, y], [x + w, y], [x + w + ox, y + oy], [x + ox, y + oy]], { fl: ZF.gelb, f: 'none', b: 0.01, deck: 0.85 });
  const hoehe = (x, y, h, s = 'h') => zL(x, y, x, y - h, { f: ZF.blau, b: 2, strich: '5 4' }) + zT(x - 8, y - h / 2 + 5, s, { g: 15, a: 'end', f: ZF.blau, w: 700 });
  const G = (x, y) => zT(x, y, 'G', { g: 15, f: '#11161D', w: 800 });
  // Quader mit Schichten
  let q = boden(60, 176, 130);
  for (const i of [1, 2]) q += zP([[60, 176 - i * 34], [190, 176 - i * 34], [190 + ox, 176 - i * 34 + oy], [60 + ox, 176 - i * 34 + oy]], { f: ZF.leise, b: 1.5, strich: '2 4' });
  q += quaderKanten(60, 176, 130, 102) + G(140, 172) + hoehe(46, 176, 102) + zT(232, 132, 'Schicht', { g: 14.5, grotesk: true, f: ZF.leise, a: 'start', w: 500 }) + zT(232, 149, 'auf Schicht', { g: 14.5, grotesk: true, f: ZF.leise, a: 'start', w: 500 });
  // Prisma (dreieckige Grundfläche) und Zylinder
  const pA = [24, 178], pB = [112, 178], pC = [86, 150], ph = 100, hoch = (p) => [p[0], p[1] - ph];
  let p = zP([pA, pB, pC], { fl: ZF.gelb, f: 'none', b: 0.01, deck: 0.85 }) + zL(...pA, ...pC, { f: ZF.leise, b: 1.75, strich: '4 4' }) + zL(...pB, ...pC, { f: ZF.leise, b: 1.75, strich: '4 4' }) + zL(...pC, ...hoch(pC), { f: ZF.leise, b: 1.75, strich: '4 4' });
  for (const i of [1, 2]) p += zP([pA, pB, pC].map((e) => [e[0], e[1] - i * ph / 3]), { f: ZF.leise, b: 1.5, strich: '2 4' });
  p += zL(...pA, ...pB) + zL(...pA, ...hoch(pA)) + zL(...pB, ...hoch(pB)) + zP([hoch(pA), hoch(pB), hoch(pC)]) + G(74, 172);
  const cx = 226, rx = 50, ry = 15, cyU = 172, cyO = 72;
  p += `<ellipse cx="${cx}" cy="${cyU}" rx="${rx}" ry="${ry}" fill="${ZF.gelb}" fill-opacity=".85"/>` + zPfad(`M${cx - rx} ${cyU}A${rx} ${ry} 0 0 1 ${cx + rx} ${cyU}`, { f: ZF.leise, b: 1.75, strich: '4 4' }) + zPfad(`M${cx - rx} ${cyU}A${rx} ${ry} 0 0 0 ${cx + rx} ${cyU}`);
  for (const i of [1, 2]) p += `<ellipse cx="${cx}" cy="${cyU - i * 100 / 3}" rx="${rx}" ry="${ry}" fill="none" stroke="${ZF.leise}" stroke-width="1.5" stroke-dasharray="2 4"/>`;
  p += zL(cx - rx, cyU, cx - rx, cyO) + zL(cx + rx, cyU, cx + rx, cyO) + `<ellipse cx="${cx}" cy="${cyO}" rx="${rx}" ry="${ry}" fill="none" stroke="${ZF.tinte}" stroke-width="2.5"/>` + G(cx, cyU + 5) + hoehe(160, 178, 100);
  // Pyramide im Quader, Kegel im Zylinder
  const bx = 22, by = 180, bw = 92, bh = 100, sp = [bx + bw / 2 + ox / 2, by - bh + oy / 2];
  let d = boden(bx, by, bw) + quaderKanten(bx, by, bw, bh, { f: ZF.leise, b: 1.5, strich: '2 4', fHinten: ZF.leise });
  d += zL(bx + ox, by + oy, ...sp, { f: ZF.leise, b: 1.75, strich: '4 4' }) + zL(bx, by, bx + ox, by + oy, { f: ZF.leise, b: 1.75, strich: '4 4' }) + zL(bx + ox, by + oy, bx + bw + ox, by + oy, { f: ZF.leise, b: 1.75, strich: '4 4' });
  d += zL(bx, by, bx + bw, by) + zL(bx + bw, by, bx + bw + ox, by + oy) + zL(bx, by, ...sp) + zL(bx + bw, by, ...sp) + zL(bx + bw + ox, by + oy, ...sp) + G(bx + bw / 2 + 12, by - 4);
  const kx = 236, kr = 46, kry = 14, kU = 172, kO = 72;
  d += `<ellipse cx="${kx}" cy="${kU}" rx="${kr}" ry="${kry}" fill="${ZF.gelb}" fill-opacity=".85"/>` + zPfad(`M${kx - kr} ${kU}A${kr} ${kry} 0 0 1 ${kx + kr} ${kU}`, { f: ZF.leise, b: 1.75, strich: '4 4' }) + zPfad(`M${kx - kr} ${kU}A${kr} ${kry} 0 0 0 ${kx + kr} ${kU}`);
  d += zL(kx - kr, kU, kx - kr, kO, { f: ZF.leise, b: 1.5, strich: '2 4' }) + zL(kx + kr, kU, kx + kr, kO, { f: ZF.leise, b: 1.5, strich: '2 4' }) + `<ellipse cx="${kx}" cy="${kO}" rx="${kr}" ry="${kry}" fill="none" stroke="${ZF.leise}" stroke-width="1.5" stroke-dasharray="2 4"/>`;
  d += zL(kx - kr, kU, kx, kO) + zL(kx + kr, kU, kx, kO) + G(kx - 20, kU + 6) + zL(kx, kU, kx, kO, { f: ZF.blau, b: 2, strich: '5 4' }) + zT(kx + 8, 130, 'h', { g: 15, a: 'start', f: ZF.blau, w: 700 });
  return { name: 'Aus dem Quader entsteht jeder Körper', felder: [
    { svg: zBlatt(320, 206, q, 'Quader im Schrägbild, Grundfläche gelb, darüber Schichten bis zur Höhe h'), kopf: 'Quader', gl: 'Volumen = <b class="w">G</b> · h', satz: 'Auf der Grundfläche liegt eine Schicht. Davon stapelt man so viele, wie der Körper hoch ist.' },
    { svg: zBlatt(320, 206, p, 'Dreiecksprisma und Zylinder im Schrägbild, Grundfläche gelb, gleiche Höhe'), kopf: 'Prisma und Zylinder', gl: 'Volumen = <b class="w">G</b> · h', satz: 'Andere Grundfläche, gleiches Stapeln.', pfeil: 'andere Grundfläche' },
    { svg: zBlatt(320, 206, d, 'Pyramide in ihrem Quader und Kegel in seinem Zylinder, Grundfläche gelb'), kopf: 'Pyramide und Kegel', gl: `Volumen = ${bruch(1, 3)} · <b class="w">G</b> · h`, satz: 'Die Spitze füllt genau ein Drittel des Körpers darum.', pfeil: 'ein Drittel' },
  ] };
}

const ZEICHNUNGEN = { R6: zAusmultiplizieren, R13: zWaage, R2: zZahlenstrahl, 'I-fur-1': zAuslegen, 'I-fur-2': zFlaechen, 'I-fur-3': zKoerper };
// Baut eine Zeichnung als Folge von Feldern mit Rechnung und Satz darunter.
function zeichnung(schluessel, o = {}) {
  const z = ZEICHNUNGEN[schluessel]?.(); if (!z) return '';
  return `<figure class="zeichnung${o.klein ? ' klein' : ''}" data-felder="${z.felder.length}"><div class="z-reihe">${z.felder.map((f, i) => `${i ? `<div class="z-pfeil${f.pfeil ? '' : ' leer'}" aria-hidden="true"></div>` : ''}<div class="z-teil">${f.pfeil ? `<p class="z-schritt">${f.pfeil}</p>` : ''}${f.kopf ? `<p class="z-kopf">${f.kopf}</p>` : ''}${f.svg}${o.klein ? '' : `<p class="z-gl">${f.gl}</p><p class="z-satz">${f.satz}</p>`}</div>`).join('')}</div></figure>`;
}
// Nur das erste Feld, ohne Text: als kleines Bild in der Übersicht.
function zeichnungKlein(schluessel, feld = 0) { const z = ZEICHNUNGEN[schluessel]?.(); return z ? `<div class="z-mini">${z.felder[feld].svg}</div>` : ''; }

// Übersicht A „Schnitt von innen nach außen“: die Sonne in vier Schichten, darum die sieben Planeten.
const VARIANTE = 'a';
function schichtBaut(nr) { // aus den Abhängigkeiten gerechnet, nicht behauptet
  const tiefer = new Set(); INHALT.regeln.filter((r) => r.etage === nr).forEach((r) => r.braucht.forEach((b) => { if (REGEL[b].etage < nr) tiefer.add(REGEL[b].etage); }));
  const l = [...tiefer].sort(); return l.length ? 'baut auf Schicht ' + l.join(' und ') + ' auf' : 'der Kern: Darauf baut alles auf';
}
const regelKarte = (r) => `<a class="regel" href="#/regel/${r.id}">${ZEICHNUNGEN[r.id] ? zeichnungKlein(r.id, r.id === 'R13' ? 0 : 1) : '<span class="z-platz">Zeichnung folgt</span>'}<span class="kopfz"><span class="nr">REGEL ${r.nr}</span><span class="name">${esc(r.name)}</span></span><span class="satz">${r.merksatz}</span><span class="fuss"><span class="kl">${regelSpanne(r)}</span>${r.braucht.length ? `<span class="kl">braucht ${r.braucht.map((b) => b.slice(1)).join(', ')}</span>` : ''}</span></a>`;
const SONNE_BILD = `<svg viewBox="-50 -50 100 100" aria-hidden="true"><circle r="48" fill="var(--s4)" stroke="#11161D" stroke-width="1.5"/><circle r="37" fill="var(--s3)"/><circle r="26" fill="var(--s2)"/><circle r="15" fill="var(--s1)"/><g font-family="var(--mono)" font-weight="800" font-size="10" fill="#11161D" text-anchor="middle"><text y="3.500">1</text><text y="-16.500">2</text><text y="-27.500">3</text><text y="-38.500">4</text></g></svg>`;
const beweis = () => { const r = REGEL.R6, w = WIRKSTELLE.R6; return `<aside class="beweis"><p class="ueber">Ein Beispiel</p><h2>Dieselbe Regel in sechs Klassen</h2><p class="leise">${r.merksatz}</p><ol class="leiter">${r.klassen.map((k) => `<li><span class="stufe">${k.klasse}</span><div><p class="rechnung">${(w[k.klasse] || esc(k.text)).split('<br>')[0]}</p></div></li>`).join('')}</ol></aside>`; };
function einstieg() {
  return `<section class="breite einstieg"><div><h1>Gesetzbuch der Mathematik</h1>
    <p class="lead">Mathe von Klasse 5 bis 10 steht auf <b>14 Rechenregeln</b>. Sie gelten in jeder Klasse und in jedem Gebiet. Darum liegen <b>sieben Gebiete</b>, jedes mit wenigen tragenden Ideen. Alle Formeln dahinter findest du über die Suche.</p>
    <ul class="wegweiser"><li><i style="background:var(--s3);box-shadow:0 0 0 4px rgba(255,210,63,.3)"></i><span><b>Die Sonne:</b> 14 Rechenregeln in vier Schichten, von innen nach außen aufeinander aufgebaut.</span></li>
      <li><i style="background:#5AAEFF"></i><span><b>Sieben Planeten:</b> die Gebiete, von der Sonne aus immer weiter weg vom reinen Rechnen.</span></li>
      <li><i style="border:2px dashed var(--leise)"></i><span><b>Acht Arbeitsweisen:</b> wie man vorgeht. Sie gelten überall.</span></li></ul></div>${beweis()}</section>`;
}
function UEBERSICHT() {
  const schichten = [1, 2, 3, 4].map((nr) => { const rs = INHALT.regeln.filter((r) => r.etage === nr); return `<div class="band s${nr}"><div class="breite">${nr === 1 ? `<div class="sonne-kopf">${SONNE_BILD}<div><h2>Die Sonne: 14 Rechenregeln</h2><p>Ein Schnitt von innen nach außen. Jede Regel gilt von der genannten Klasse an unverändert, nur die Zahlen werden zu Brüchen und Buchstaben.</p></div></div>` : ''}
    <div class="band-titel"><span class="schicht">Schicht ${nr}</span><h3>${ETAGE[nr]}</h3><span class="baut">${schichtBaut(nr)}</span></div><div class="regeln${rs.length === 3 ? ' drei' : ''}">${rs.map(regelKarte).join('')}</div></div></div>`; }).join('');
  return `${einstieg()}<section class="sonne" aria-label="Die Sonne: 14 Rechenregeln">${schichten}</section>
    <section class="raum"><div class="breite"><div class="raum-kopf"><h2>Sieben Planeten: die Gebiete</h2><p>Jedes Gebiet hat wenige tragende Ideen. Aus ihnen folgen die einzelnen Gesetze und Formeln – zusammen ${INHALT.gesetze.length}.</p></div></div><ol class="bahnen">${PLANETEN.map(planetKarte).join('')}</ol></section>
    <section class="station"><div class="breite"><h2>Acht Arbeitsweisen</h2><p>Keine Gesetze, sondern Vorgehen. Sie gelten auf jedem Planeten.</p><ul class="weisen">${INHALT.arbeitsweisen.map((a) => `<li><span>${esc(a.name)}</span><b>${a.satz}</b></li>`).join('')}</ul></div></section>`;
}

// Gesetzbuch – gemeinsame Teile: Daten, Kopf mit Suche, „ein Gesetz aufgeschlagen“, „Idee und ihre Gesetze“, Suche.
const P = new URLSearchParams(location.search);
document.body.dataset.g = P.get('g') === 'hell' ? 'hell' : 'nacht';
if (P.get('bild') === '1') document.body.classList.add('bild');
const bruch = (z, n) => `<span class="br"><i>${z}</i><i>${n}</i></span>`;
const esc = (s) => String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;');
const REGEL = Object.fromEntries(INHALT.regeln.map((r) => [r.id, r]));
const GESETZ = Object.fromEntries(INHALT.gesetze.map((g) => [g.id, g]));
const ETAGE = Object.fromEntries(INHALT.etagen.map((e) => [e.nr, e.name]));
const PLANETEN = INHALT.planeten.filter((p) => PLANET_BILD[p.name]);
const IDEE = {}; for (const [planet, liste] of Object.entries(IDEEN)) liste.forEach((i, n) => { IDEE[i.id] = { ...i, planet, nr: n + 1 }; });
const ideeVon = (gid) => Object.values(IDEE).find((i) => i.gesetze.includes(gid));
const spanne = (zahlen) => { const a = Math.min(...zahlen), b = Math.max(...zahlen); return a === b ? 'Klasse ' + a : `Klasse ${a}–${b}`; };
const regelSpanne = (r) => spanne(r.klassen.map((k) => k.klasse));
const gymZahlen = (g) => (g.gym.match(/\d+/g) || []).map(Number);
const planetSpanne = (name) => { const z = INHALT.gesetze.filter((g) => g.planet === name).flatMap(gymZahlen); return z.length ? spanne(z) : ''; };
const thema = (k) => (INHALT.themen[k] ? `${INHALT.themen[k].ort} · ${INHALT.themen[k].titel}` : '');
const planetScheibe = (name, gr = 44) => `<svg class="scheibe" width="${gr}" height="${gr}" viewBox="-22 -22 44 44" aria-hidden="true"><circle r="21" fill="${PLANET_BILD[name].farbe}"/>${PLANET_BILD[name].zeichen}</svg>`;
const LUPE = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6.5"/><path d="M15.500 15.500L21 21"/></svg>';
const seite = document.getElementById('seite');

// ---------- Kopf ----------
document.getElementById('kopf').innerHTML = `<div class="breite"><a class="kopf-marke" href="#/"><i></i><span class="lang">Gesetzbuch der Mathematik</span><span class="kurz">Gesetzbuch</span></a>
  <form class="suche" role="search"><label><span style="position:absolute;left:-9999px">Im Gesetzbuch suchen</span>${LUPE}<input type="search" name="q" placeholder="Suchen, z. B. Kegelmantel" autocomplete="off" enterkeyhint="search"></label></form></div>`;
const suchfeld = document.querySelector('.suche input');
document.querySelector('.suche').addEventListener('submit', (e) => { e.preventDefault(); if (suchfeld.value.trim()) location.hash = '#/suche/' + encodeURIComponent(suchfeld.value.trim()); });
suchfeld.addEventListener('input', () => { if (suchfeld.value.trim().length >= 3) history.replaceState(null, '', '#/suche/' + encodeURIComponent(suchfeld.value.trim())), zeige(); });

// ---------- Suche ----------
const wort = (s) => s.toLowerCase().replace(/ä/g, 'ae').replace(/ö/g, 'oe').replace(/ü/g, 'ue').replace(/ß/g, 'ss').replace(/<[^>]+>/g, ' ');
const SUCHBAR = [
  ...INHALT.regeln.map((r) => ({ id: r.id, art: 'Rechenregel ' + r.nr, name: r.name, satz: r.merksatz, mehr: r.klassen.map((k) => k.text).join(' ') + ' ' + r.nicht, ort: ['Sonne', ETAGE[r.etage]], kl: regelSpanne(r), ziel: '#/regel/' + r.id })),
  ...INHALT.gesetze.map((g) => { const i = ideeVon(g.id); return { id: g.id, art: 'Gesetz ' + g.id, name: g.name, satz: g.merksatz || g.satz, mehr: (g.klassen || []).map((k) => k.text).join(' ') + ' ' + (g.nicht || '') + ' ' + (g.warum || ''), ort: [g.planet, i ? i.satz : g.abschnitt], kl: g.gym && g.gym !== '–' ? 'Klasse ' + g.gym : 'Realschule oder IB', ziel: '#/gesetz/' + g.id }; }),
  ...INHALT.arbeitsweisen.map((a) => ({ id: a.name, art: 'Arbeitsweise', name: a.name, satz: a.satz, mehr: '', ort: ['Arbeitsweisen'], kl: 'jede Klasse', ziel: '#/' })),
].map((e) => ({ ...e, wn: wort(e.name).split(/[^a-z0-9]+/).filter((w) => w.length > 2), ws: wort(e.satz).split(/[^a-z0-9]+/).filter((w) => w.length > 3), wm: wort(e.mehr).split(/[^a-z0-9]+/).filter((w) => w.length > 3) }));
function suche(q) {
  const teile = wort(q).split(/[^a-z0-9]+/).filter((w) => w.length > 1); if (!teile.length) return [];
  const trifft = (liste, t) => liste.some((w) => w === t || (t.length >= 4 && w.includes(t)) || (w.length >= 5 && t.includes(w))); // „kegelmantel“ findet „kegel“ und „mantel“
  return SUCHBAR.map((e) => { let p = 0; for (const t of teile) { const zerlegt = e.wn.filter((w) => w.length >= 5 && t.includes(w) && w !== t).length; p += (trifft(e.wn, t) ? 6 : 0) + zerlegt * 2 + (trifft(e.ws, t) ? 3 : 0) + (trifft(e.wm, t) ? 1 : 0) + (e.wm.filter((w) => w.length >= 5 && t.includes(w)).length ? 1 : 0); } return { e, p }; })
    .filter((x) => x.p > 0).sort((a, b) => b.p - a.p).slice(0, 12).map((x) => x.e);
}
function sichtSuche(q) {
  const tr = suche(q); if (suchfeld.value !== q && document.activeElement !== suchfeld) suchfeld.value = q;
  return `<div class="breite schmal"><nav class="pfad"><a href="#/">Übersicht</a><span class="t">›</span><span>Suche</span></nav>
    <h1 class="s-titel">${tr.length ? `${tr.length} Treffer für „${esc(q)}“` : `Nichts gefunden für „${esc(q)}“`}</h1>
    ${tr.length ? '' : '<p class="leise" style="margin-top:8px">Versuch ein einzelnes Wort, zum Beispiel „Kegel“, „Prozent“ oder „Klammer“.</p>'}
    <ol class="treffer">${tr.map((e) => `<li><a class="karte" href="${e.ziel}"><span class="t-ort">${e.ort.filter(Boolean).map(esc).join(' › ')}</span><span class="t-name"><span class="nr">${e.art}</span> ${esc(e.name)}</span><span class="t-satz">${e.satz}</span><span class="kl">${e.kl}</span></a></li>`).join('')}</ol></div>`;
}

// ---------- Ein Gesetz aufgeschlagen ----------
function verweise(text) { // „F4 Zerlegen und Ergänzen · Rechenregel 8 Potenzen“ -> Liste von Verweisen
  return text.split(' · ').map((t) => { const f = t.match(/^([A-Z]+\d+) /), r = t.match(/^Rechenregel (\d+) /); const id = f ? f[1] : r ? 'R' + r[1] : null; return id && (GESETZ[id] || REGEL[id]) ? { id, name: (GESETZ[id] || REGEL[id]).name } : null; }).filter(Boolean);
}
const verweisKnopf = (v) => `<a class="verweis" href="#/${v.id[0] === 'R' ? 'regel' : 'gesetz'}/${v.id}"><span class="nr">${v.id[0] === 'R' ? 'Regel ' + v.id.slice(1) : v.id}</span>${esc(v.name)}</a>`;
function sichtGesetz(id) {
  const r = REGEL[id], g = r || GESETZ[id]; if (!g) return sichtSuche(id);
  const idee = r ? null : ideeVon(id), ws = WIRKSTELLE[id] || {};
  const voraus = r ? r.braucht.map((b) => ({ id: b, name: REGEL[b].name })) : verweise(g.baut || '');
  const darauf = r ? INHALT.regeln.filter((x) => x.braucht.includes(id)).map((x) => ({ id: x.id, name: x.name })) : INHALT.gesetze.filter((x) => x.baut && verweise(x.baut).some((v) => v.id === id)).map((x) => ({ id: x.id, name: x.name }));
  const pfad = r ? `<a href="#/">Übersicht</a><span class="t">›</span><span>Sonne</span><span class="t">›</span><span>Schicht ${r.etage}: ${ETAGE[r.etage]}</span>`
    : `<a href="#/">Übersicht</a><span class="t">›</span><span>${g.planet}</span>${idee ? `<span class="t">›</span><a href="#/idee/${idee.id}">${idee.satz}</a>` : `<span class="t">›</span><span>${g.abschnitt}</span>`}`;
  const ausIdee = { F1: 'I-fur-1', F2: 'I-fur-1', F5: 'I-fur-2', F6: 'I-fur-2', F7: 'I-fur-2', F12: 'I-fur-3', F15: 'I-fur-3', F17: 'I-fur-3' }[id];
  const zeich = ZEICHNUNGEN[id] ? zeichnung(id) : ausIdee ? `<p class="klein leise" style="margin-bottom:8px">Zeichnung der tragenden Idee „${IDEE[ausIdee].satz}“</p>` + zeichnung(ausIdee) : `<div class="z-folgt"><p class="ueber">Zeichnung folgt</p><p>${g.bild ? esc(g.bild) : 'Der Mathe-Profi legt fest, was zu sehen sein muss.'}</p></div>`;
  const klassen = (g.klassen || []);
  return `<article class="breite gesetz"><nav class="pfad">${pfad}</nav>
    <header class="g-kopf"><p class="ueber">${r ? 'Rechenregel ' + r.nr + ' von 14 · ' + regelSpanne(r) : 'Gesetz ' + id + (g.gym && g.gym !== '–' ? ' · Gymnasium Klasse ' + g.gym : '')}</p><h1>${esc(g.name)}</h1><p class="merksatz">${g.merksatz || g.satz}</p></header>
    <div class="g-spalten"><div class="g-links">
      <section><h2 class="ueber">Die Zeichnung</h2>${zeich}</section>
      ${g.warum ? `<section><h2 class="ueber">Warum das gilt</h2><p class="fliess">${g.warum}</p></section>` : ''}
    </div><div class="g-rechts">
      ${klassen.length ? `<section><h2 class="ueber">${r ? 'Dieselbe Regel' : 'Dasselbe Gesetz'} in jeder Klasse</h2>${ws.was ? `<p class="leise klein">${ws.was}</p>` : ''}<ol class="leiter">${klassen.map((k) => `<li><span class="stufe">${k.klasse}</span><div><p class="rechnung">${ws[k.klasse] && !klassen.some((x) => x !== k && x.klasse === k.klasse) ? ws[k.klasse] : esc(k.text)}</p>${k.thema && thema(k.thema) ? `<p class="kl">${thema(k.thema)}</p>` : ''}</div></li>`).join('')}</ol></section>` : '<section><div class="z-folgt"><p class="ueber">Ausarbeitung folgt</p><p>Für dieses Gesetz liegen bisher Name, Satz und Klasse vor.</p></div></section>'}
      ${g.nicht ? `<section><div class="fehler"><h2 class="ueber">Wo es nicht gilt · häufiger Fehler</h2><p>${g.nicht}</p></div></section>` : ''}
      <section><h2 class="ueber">Voraussetzung</h2>${voraus.length ? `<p class="klein leise">Das musst du vorher können:</p><div class="verweise">${voraus.map(verweisKnopf).join('')}</div>` : '<p class="fliess">Keine. Dieses Gesetz ist ein Anfang.</p>'}
        ${darauf.length ? `<p class="klein leise" style="margin-top:14px">Darauf bauen auf:</p><div class="verweise">${darauf.map(verweisKnopf).join('')}</div>` : ''}</section>
    </div></div></article>`;
}

// ---------- Eine tragende Idee und die Gesetze dahinter ----------
function sichtIdee(id) {
  const i = IDEE[id]; if (!i) return sichtSuche(id);
  return `<article class="breite gesetz"><nav class="pfad"><a href="#/">Übersicht</a><span class="t">›</span><span>${i.planet}</span></nav>
    <header class="g-kopf"><p class="ueber">${i.planet} · tragende Idee ${i.nr} von ${IDEEN[i.planet].length}</p><h1 class="merksatz gross">${i.satz}</h1>${i.dazu ? `<p class="fliess" style="max-width:46em">${i.dazu}</p>` : ''}</header>
    <section><h2 class="ueber">Die Zeichnung</h2>${ZEICHNUNGEN[id] ? zeichnung(id) : `<div class="z-folgt"><p class="ueber">Zeichnung folgt</p><p>${i.bild ? 'Vorschlag des Designers: ' + i.bild : ''}</p></div>`}</section>
    <section><h2 class="ueber">${i.gesetze.length} Gesetze und Formeln, die daraus folgen</h2><ol class="folge">${i.gesetze.map((gid) => { const g = GESETZ[gid]; return `<li><a class="karte" href="#/gesetz/${gid}"><span class="f-name"><span class="nr">${gid}</span> ${esc(g.name)}</span><span class="f-satz">${g.merksatz || g.satz}</span><span class="kl">${g.gym && g.gym !== '–' ? 'Klasse ' + g.gym : 'Realschule oder IB'}</span></a></li>`; }).join('')}</ol></section></article>`;
}

// ---------- Die sechs Zeichnungen und der Stil ----------
function sichtZeichnungen() {
  const blatt = [['R6', 'Rechenregel 6', 'Ausmultiplizieren und Ausklammern', REGEL.R6.merksatz], ['R13', 'Rechenregel 13', 'Gleichung als Waage', REGEL.R13.merksatz], ['R2', 'Rechenregel 2', 'Plus und Minus mit negativen Zahlen', REGEL.R2.merksatz],
    ['I-fur-1', 'Fläche und Raum · Idee 1', IDEE['I-fur-1'].satz, ''], ['I-fur-2', 'Fläche und Raum · Idee 2', IDEE['I-fur-2'].satz, ''], ['I-fur-3', 'Fläche und Raum · Idee 3', IDEE['I-fur-3'].satz, '']];
  return `<div class="breite gesetz"><nav class="pfad"><a href="#/">Übersicht</a><span class="t">›</span><span>Zeichenstil</span></nav>
    <header class="g-kopf"><p class="ueber">Zeichenstil „Heft und Tafel“</p><h1>Sechs Zeichnungen, ein Stil</h1>
      <ul class="stil"><li><i style="background:var(--z-tinte)"></i>Strich in Tinte, Hilfslinien gestrichelt</li><li><i style="background:var(--z-gelb)"></i>Gelb: hier wirkt das Gesetz</li><li><i style="background:var(--z-blau-fl);border:2px solid var(--z-blau)"></i>Blau: die Fläche oder Größe, um die es geht</li><li><i class="karo"></i>Karos nur, wo gezählt wird</li></ul></header>
    ${blatt.map(([k, ueber, name, satz]) => `<section class="z-blatt"><p class="ueber">${ueber}</p><h2>${name}</h2>${satz ? `<p class="merksatz klein-m">${satz}</p>` : ''}${zeichnung(k)}</section>`).join('')}</div>`;
}

// ---------- Planeten-Karte (Übersicht A und B) ----------
function planetKarte(p, n) {
  const ideen = IDEEN[p.name], sp = planetSpanne(p.name);
  return `<li class="bahn"><div class="breite bahn-innen"><div class="planet-kopf">${planetScheibe(p.name, 52)}<div><h3>${esc(p.name)}</h3><p>${n + 1}. Planet · ${p.zahl} Gesetze${sp ? ' · ' + sp : ''}</p></div></div>
    ${ideen ? `<ul class="ideen n${ideen.length}">${ideen.map((i) => `<li><a class="idee" href="#/idee/${i.id}">${ZEICHNUNGEN[i.id] ? zeichnungKlein(i.id, i.id === 'I-fur-1' ? 0 : 1) : '<span class="z-platz">Zeichnung folgt</span>'}<b>${i.satz}</b><span class="mehr">${i.gesetze.length} Gesetze dahinter</span></a></li>`).join('')}</ul>`
    : `<p class="offen"><b>Tragende Ideen folgen.</b> Abschnitte: ${p.abschnitte.map(esc).join(' · ')}.</p>`}</div></li>`;
}

// ---------- Weiche ----------
function zeige() {
  const h = decodeURIComponent(location.hash.replace(/^#\/?/, '')) || START, [art, ...rest] = h.split('/'), wert = rest.join('/');
  seite.innerHTML = art === 'regel' || art === 'gesetz' ? sichtGesetz(wert) : art === 'idee' ? sichtIdee(wert) : art === 'suche' ? sichtSuche(wert) : art === 'zeichnungen' ? sichtZeichnungen() : UEBERSICHT();
  if (art !== 'suche') { suchfeld.value = ''; scrollTo(0, 0); }
  document.title = 'Entwurf: Gesetzbuch der Mathematik';
}
addEventListener('hashchange', zeige);
const e = document.createElement('div'); e.className = 'entwurf';
e.innerHTML = `<button aria-expanded="false">Entwurf ⚙</button><div class="entwurf-feld"><b>Entwurf, nicht die App.</b><a href="uebersicht-a.html?${P}">Übersicht A „Schnitt“</a><a href="uebersicht-b.html?${P}">Übersicht B „Durch die Klassen“</a><a href="gesetz.html?${P}">Ein Gesetz aufgeschlagen</a><a href="zeichnungen.html?${P}">Sechs Zeichnungen</a><button>hell / dunkel</button></div>`;
e.querySelector('button').addEventListener('click', () => e.classList.toggle('offen'));
e.querySelector('.entwurf-feld button').addEventListener('click', () => { P.set('g', document.body.dataset.g === 'hell' ? 'nacht' : 'hell'); location.search = P.toString(); });
document.body.append(e);

zeige();
</script></body></html>
