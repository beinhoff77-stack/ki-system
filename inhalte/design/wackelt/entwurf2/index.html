<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Was wackelt – Entwurf 2 (Designer)</title>
<style>
/* Entwurf 2: Arbeitswerkzeug. Grautöne + EINE Akzentfarbe (Gelb der App, nur als Markierung, nie als Fläche hinter Text).
   Schrift: 15 px Fließtext, 13 px Nebentext, Stufen darüber nur 17 px (Titel im Detail). Zahlen tabellarisch. */
*, *::before, *::after { box-sizing: border-box; }
html, body { margin: 0; }
:root { --mono: "JetBrains Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace; --grotesk: "Space Grotesk", system-ui, -apple-system, "Segoe UI", sans-serif; --akzent: #FFD23F; }
body { font-family: var(--grotesk); font-size: 15px; line-height: 1.45; font-weight: 450; background: var(--bg); color: var(--text); -webkit-text-size-adjust: 100%; font-variant-numeric: tabular-nums; }
body[data-g="hell"] { color-scheme: light; --bg: #FAFAF8; --fl: #FFFFFF; --text: #14181F; --leise: #5E6672; --blass: #8C939D; --linie: #E4E2DC; --linie2: #EFEEEA; --hover: #F4F3EF; --sel: #F1EFE8; --falsch: #A3392F; --punkt: #14181F; }
body[data-g="nacht"] { color-scheme: dark; --bg: #0E1217; --fl: #12171E; --text: #E9ECF0; --leise: #9AA3AF; --blass: #6B7480; --linie: #262E39; --linie2: #1C232C; --hover: #18202A; --sel: #1B2430; --falsch: #E58A82; --punkt: #E9ECF0; }
button, input { font: inherit; color: inherit; }
button { cursor: pointer; background: none; border: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
a { color: inherit; }
:focus-visible { outline: 2px solid var(--text); outline-offset: 2px; border-radius: 4px; }
h1, h2, h3, p { margin: 0; font-size: inherit; font-weight: inherit; }
small, .klein { font-size: 13px; }
.leise { color: var(--leise); } .blass { color: var(--blass); }
.num { font-variant-numeric: tabular-nums; text-align: right; white-space: nowrap; }

/* Kopf (App) */
.kopf { border-bottom: 1px solid var(--linie); background: var(--fl); }
.kopf-in { max-width: 1440px; margin: 0 auto; padding: 0 32px; display: flex; align-items: center; gap: 20px; height: 52px; }
.zurueck { width: 32px; height: 32px; border-radius: 6px; color: var(--leise); font-size: 20px; }
.reiter { display: flex; gap: 22px; height: 100%; }
.reiter a { display: flex; align-items: center; gap: 6px; text-decoration: none; color: var(--leise); border-bottom: 2px solid transparent; font-weight: 500; }
.reiter a[aria-current] { color: var(--text); border-bottom-color: var(--text); }
.zahl { font-size: 13px; color: var(--leise); }
.reiter a[aria-current] .zahl { color: var(--text); font-weight: 600; }

main { max-width: 1440px; margin: 0 auto; padding: 20px 32px 40px; }
/* Zahlenleiste + Werkzeuge */
.leiste { display: flex; align-items: center; gap: 16px; min-height: 32px; }
.lage { flex: 1; min-width: 0; color: var(--leise); }
.lage b { color: var(--text); font-weight: 600; }
.lage span { white-space: nowrap; display: inline-block; }
.lage span + span::before { content: "·"; margin: 0 8px; color: var(--blass); }
.werk { display: flex; gap: 4px; position: relative; }
.rund { width: 30px; height: 30px; border-radius: 50%; border: 1px solid var(--linie); color: var(--leise); font-size: 14px; font-weight: 600; display: grid; place-items: center; }
.rund[aria-expanded="true"] { border-color: var(--text); color: var(--text); }
.pop { position: absolute; right: 0; top: 36px; z-index: 20; width: 320px; background: var(--fl); border: 1px solid var(--linie); border-radius: 8px; padding: 12px 14px; font-size: 13px; color: var(--leise); box-shadow: 0 8px 24px rgba(0,0,0,.08); }
.pop p + p { margin-top: 6px; } .pop b { color: var(--text); font-weight: 600; }
.pop button { display: block; width: 100%; text-align: left; padding: 6px 4px; border-radius: 4px; color: var(--text); font-size: 15px; } .pop button:hover { background: var(--hover); }

.filter { display: flex; flex-wrap: wrap; gap: 10px 24px; margin: 14px 0 18px; align-items: center; }
.seg { display: inline-flex; border: 1px solid var(--linie); border-radius: 7px; padding: 2px; gap: 2px; background: var(--fl); }
.seg button { height: 28px; padding: 0 11px; border-radius: 5px; color: var(--leise); white-space: nowrap; font-weight: 500; }
.seg button[aria-pressed="true"] { background: var(--sel); color: var(--text); font-weight: 600; }
.seg button .zahl { margin-left: 4px; }
.filter .etikett { color: var(--blass); font-size: 13px; margin-right: 6px; }

/* Arbeitsfläche: Liste | Detail */
.flaeche { display: grid; grid-template-columns: minmax(0, 1fr); gap: 0; align-items: start; }
.flaeche.mit { grid-template-columns: minmax(0, 1fr) 520px; }
.liste { min-width: 0; }
.zeile { display: grid; grid-template-columns: 22px 170px minmax(0, 1fr) 56px 70px 62px 48px 238px; column-gap: 14px; align-items: center; min-height: 48px; padding: 0 12px 0 0; border-bottom: 1px solid var(--linie2); position: relative; cursor: pointer; }
.flaeche.mit .zeile { grid-template-columns: 22px minmax(0, 1fr) 84px 60px 52px 40px 196px; }
.flaeche.mit .c-thema { display: none; }
.zeile.kopfz { min-height: 34px; cursor: default; border-bottom: 1px solid var(--linie); color: var(--blass); font-size: 13px; }
.zeile.kopfz button { color: var(--blass); font-size: 13px; text-align: inherit; } .zeile.kopfz button[aria-pressed="true"] { color: var(--text); }
.zeile:not(.kopfz):hover { background: var(--hover); }
.zeile.gewaehlt { background: var(--sel); }
.zeile::before { content: ""; position: absolute; left: 0; top: 10px; bottom: 10px; width: 3px; border-radius: 2px; background: transparent; }
.zeile.dringend::before { background: var(--akzent); }
.c-rang { font-size: 13px; color: var(--blass); text-align: right; }
.c-thema { color: var(--leise); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.c-punkt { min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.c-punkt .mob { display: none; }
.c-art { font-size: 13px; color: var(--leise); white-space: nowrap; }
.art { display: inline-flex; align-items: center; gap: 5px; }
.art i { width: 8px; height: 8px; border-radius: 50%; border: 1.5px solid var(--punkt); display: inline-block; }
.art.fv i { background: var(--punkt); } .art.lu i { background: linear-gradient(90deg, var(--punkt) 50%, transparent 50%); } .art.fl i, .art.be i { border-color: var(--blass); }
.zeile.neben { color: var(--leise); } .zeile.neben .c-punkt { color: var(--leise); }
.trenn { padding: 18px 0 6px 36px; font-size: 13px; color: var(--blass); border-bottom: 1px solid var(--linie2); }
.marke { font-size: 13px; color: var(--leise); margin-left: 8px; }
.vor { color: var(--text); font-weight: 600; }
/* Status-Umschalter in der Zeile und im Detail */
.st { display: inline-flex; border: 1px solid var(--linie); border-radius: 6px; padding: 1px; gap: 1px; background: var(--fl); }
.st button { height: 26px; padding: 0 9px; border-radius: 4px; color: var(--blass); font-size: 13px; white-space: nowrap; }
.st button:hover { color: var(--text); }
.st button[aria-pressed="true"] { background: var(--sel); color: var(--text); font-weight: 600; box-shadow: inset 0 0 0 1px var(--linie); }
.st-text { font-size: 13px; color: var(--leise); }
.st-kurz { display: none; }

/* Detail */
.detail { border-left: 1px solid var(--linie); margin-left: 24px; padding: 2px 0 0 24px; position: sticky; top: 12px; height: max(480px, calc(100vh - 214px)); display: flex; flex-direction: column; }
.d-kopf { display: flex; gap: 12px; align-items: flex-start; padding-bottom: 12px; border-bottom: 1px solid var(--linie); }
.d-kopf div { flex: 1; min-width: 0; }
.d-kopf h2 { font-size: 17px; font-weight: 600; line-height: 1.3; }
.schliessen { width: 30px; height: 30px; border-radius: 6px; color: var(--leise); font-size: 20px; line-height: 1; }
.schliessen:hover { background: var(--hover); }
.d-inhalt { overflow: auto; flex: 1; padding: 4px 2px 12px 0; }
.abs { padding: 14px 0; border-bottom: 1px solid var(--linie2); }
.abs:last-child { border-bottom: 0; }
.abs > h3 { font-size: 13px; color: var(--blass); font-weight: 500; margin-bottom: 6px; }
.befund-zahlen { margin-top: 4px; font-size: 13px; color: var(--leise); }
.af { display: grid; grid-template-columns: minmax(0, 1fr) 84px 84px 44px; column-gap: 12px; align-items: baseline; padding: 7px 0; border-top: 1px solid var(--linie2); cursor: pointer; }
.af.kopfz { cursor: default; border-top: 0; padding-top: 0; font-size: 13px; color: var(--blass); }
.af:not(.kopfz):hover { background: var(--hover); }
.af .t { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.af .t::before { content: "▸"; color: var(--blass); display: inline-block; width: 14px; font-size: 11px; }
.af[aria-expanded="true"] .t::before { content: "▾"; }
.af .ein { color: var(--falsch); font-family: var(--mono); font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.af .ok { font-family: var(--mono); font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.af-mehr { padding: 4px 0 12px 14px; color: var(--leise); display: grid; gap: 6px; }
.af-mehr .voll { color: var(--text); }
.af-mehr ol { margin: 0; padding-left: 18px; font-family: var(--mono); font-size: 14px; color: var(--text); }
table.tab { border-collapse: collapse; font-size: 14px; color: var(--text); }
table.tab th, table.tab td { border-bottom: 1px solid var(--linie); padding: 3px 14px 3px 0; text-align: left; font-weight: 450; }
table.tab th { color: var(--leise); }
table.tab td.z { text-align: right; }
.zeichnung { display: block; width: 220px; height: auto; color: var(--text); }
.d-link { text-decoration: none; border-bottom: 1px solid var(--linie); }
.d-link:hover { border-bottom-color: var(--text); }
details.einst summary { cursor: pointer; list-style: none; font-size: 13px; color: var(--blass); }
details.einst summary::-webkit-details-marker { display: none; }
details.einst summary::after { content: " ▸"; } details.einst[open] summary::after { content: " ▾"; }
details.einst p { margin-top: 6px; }
.nu { display: grid; grid-template-columns: minmax(0, 1fr) auto; column-gap: 12px; padding: 5px 0; border-top: 1px solid var(--linie2); }
.nu:first-of-type { border-top: 0; }
.nu span:last-child { font-family: var(--mono); font-size: 14px; color: var(--leise); }
/* Bearbeitung: immer unten im Detail, klebt */
.bearb { border-top: 1px solid var(--linie); padding: 12px 0 4px; display: grid; gap: 8px; background: var(--bg); }
.bearb-zeile { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.notiz { flex: 1; min-width: 160px; height: 30px; border: 1px solid var(--linie); border-radius: 6px; background: var(--fl); padding: 0 10px; }
.notiz::placeholder { color: var(--blass); }
.knopf { height: 30px; padding: 0 12px; border: 1px solid var(--linie); border-radius: 6px; color: var(--leise); white-space: nowrap; }
.knopf:hover { color: var(--text); border-color: var(--leise); }
.knopf[aria-pressed="true"] { color: var(--text); border-color: var(--text); }
.bearb .st button { height: 30px; padding: 0 12px; font-size: 15px; }

/* Erledigt-Ansicht */
.zeile.erl { grid-template-columns: 22px 170px minmax(0, 1fr) 56px 88px 88px minmax(0, 1.2fr) 110px; }
.flaeche.mit .zeile.erl { grid-template-columns: 22px minmax(0, 1fr) 48px 70px 70px 110px; }
.flaeche.mit .zeile.erl .c-notiz { display: none; }
.c-notiz { color: var(--leise); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

.leer { padding: 14px 0 14px 36px; color: var(--leise); border-bottom: 1px solid var(--linie2); }
.leer b { color: var(--text); font-weight: 600; }
.toast { position: fixed; left: 50%; bottom: 20px; transform: translateX(-50%); background: var(--text); color: var(--fl); border-radius: 8px; padding: 6px 6px 6px 14px; display: flex; gap: 10px; align-items: center; font-size: 13px; z-index: 50; }
.toast button { color: var(--fl); text-decoration: underline; padding: 4px 8px; font-size: 13px; }

/* Handy: eine Spalte, Detail als eigene Ebene */
@media (max-width: 899px) {
  .kopf-in { padding: 0 12px; gap: 12px; } main { padding: 14px 12px 40px; }
  .reiter { gap: 16px; }
  .flaeche.mit { grid-template-columns: minmax(0, 1fr); }
  .zeile, .flaeche.mit .zeile, .zeile.erl, .flaeche.mit .zeile.erl { grid-template-columns: 18px minmax(0, 1fr) auto; column-gap: 10px; min-height: 58px; padding: 8px 0; }
  .c-thema, .c-art, .zeile > .num, .c-trend, .c-notiz, .zeile.kopfz { display: none; }
  .c-punkt { white-space: normal; }
  .c-punkt .mob { display: block; font-size: 13px; color: var(--leise); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .c-punkt .desk { display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .st-lang { display: none; } .st-kurz { display: inline-flex; }
  .trenn { padding-left: 28px; }
  .marke { display: none; }
  .leer { padding-left: 0; }
  .detail { position: fixed; inset: 0; z-index: 40; margin: 0; padding: 0 14px; border: 0; background: var(--bg); height: auto; }
  .d-kopf { padding-top: 12px; }
  .d-zurueck { display: flex !important; }
  .schliessen { display: none; }
  .af { grid-template-columns: minmax(0, 1fr) 70px 70px; } .af .dat { display: none; }
  .bearb { padding-bottom: 14px; }
  .pop { width: min(320px, calc(100vw - 24px)); }
  .filter { gap: 8px; } .filter .etikett { display: none; }
  .seg button { padding: 0 9px; }
}
.d-zurueck { display: none; height: 30px; align-items: center; color: var(--leise); margin-bottom: 4px; }
@media print { .kopf, .filter, .werk, .detail, .st, .toast { display: none !important; } body { background: #fff; } }
/* Entwurfs-Schalter: nicht Teil der App; nur über die Adresse (#g=nacht, #leer=1) */
</style>
</head>
